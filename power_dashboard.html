function orSetPreset(days) {
  [7,28].forEach(d => {
    const btn = document.getElementById('ortab-' + d);
    if (btn) btn.classList.toggle('active', d === days);
  });
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  const from = new Date(yesterday); from.setDate(yesterday.getDate() - (days - 1));
  const fmt = d => d.toISOString().split('T')[0];
  const startEl = document.getElementById('or-start');
  const endEl   = document.getElementById('or-end');
  if (startEl) startEl.value = fmt(from);
  if (endEl)   endEl.value   = fmt(yesterday);
  orLoad();
}

async function orLoad() {
  const from = document.getElementById('or-start')?.value;
  const to   = document.getElementById('or-end')?.value;
  if (!from || !to) return;
  const el = document.getElementById('or-content');
  if (el) el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading…</div>';
  try {
    const r = await fetch(`${API}/api/admin/outlet-ratings-summary?date_from=${from}&date_to=${to}`,
      { headers: { 'Authorization': `Bearer ${_lsToken}` } });
    if (r.status === 401 || r.status === 403) { lsLogout(); renderRatingsPage(); return; }
    const d = await r.json();
    const outlets = d.outlets || [];
    const statusEl = document.getElementById('or-status');
    if (statusEl) statusEl.textContent = outlets.length ? `${outlets.length} outlets · ${d.date_from} → ${d.date_to}` : '';
    orRenderTable(outlets, el);
  } catch {
    if (el) el.innerHTML = '<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Failed to load</div></div>';
  }
}

function orRenderTable(outlets, el) {
  if (!outlets.length) {
    el.innerHTML = '<div class="no-outages" style="padding:40px">No data for this range.</div>';
    return;
  }
  const thStyle = 'padding:10px 13px;text-align:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);border-bottom:2px solid var(--border-2);white-space:nowrap;font-family:var(--mono)';
  const thL = `style="${thStyle};text-align:left"`;
  const th  = `style="${thStyle}"`;
  const thead = `<thead><tr>
    <th ${thL}>Outlet</th>
    <th ${th}>Swiggy ⭐</th>
    <th ${th}>Swiggy 👎</th>
    <th ${th}>Zomato ⭐</th>
    <th ${th}>Zomato 👎</th>
    <th ${th}>Total Rated</th>
    <th ${th}>Rista Orders</th>
    <th ${th}>High</th>
    <th ${th}>Low</th>
    <th ${th}>IGCC</th>
    <th ${th}>Errors</th>
    <th ${th}>High %</th>
    <th ${th}>Error %</th>
    <th ${th}>Net %</th>
  </tr></thead>`;

  const td  = (val, cls='') => `<td style="padding:10px 13px;text-align:right;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono)"><span class="sc-pct ${cls}">${val}</span></td>`;
  const tdL = (val, bold=false) => `<td style="padding:10px 13px;font-size:12px;font-weight:${bold?800:700};border-bottom:1px solid var(--border);color:var(--ink-1)">${val}</td>`;
  const tdB = (val) => `<td style="padding:10px 13px;text-align:right;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);font-family:var(--mono);color:var(--blue)">${val}</td>`;

  const rows = outlets.map(o => {
    const netCls  = o.net_pct >= 10 ? 'good' : o.net_pct >= 0 ? '' : 'bad';
    const errCls  = o.error_rate_pct < 1 ? 'good' : o.error_rate_pct < 2 ? 'warn' : 'bad';
    const highCls = o.high_rate_pct >= 20 ? 'good' : o.high_rate_pct >= 10 ? 'warn' : 'bad';
    return `<tr>
      ${tdL(o.outlet_code)}
      ${td(o.swiggy_high)} ${td(o.swiggy_low)}
      ${td(o.zomato_high)} ${td(o.zomato_low)}
      ${td(o.total_rated)} ${tdB(o.rista_orders ?? '—')}
      ${td(o.total_high)} ${td(o.total_low)}
      ${td(o.igcc)} ${td(o.total_errors)}
      ${td(o.high_rate_pct + '%', highCls)}
      ${td(o.error_rate_pct + '%', errCls)}
      ${td(o.net_pct + '%', netCls)}
    </tr>`;
  }).join('');

  // Totals row
  const sum = k => outlets.reduce((a, o) => a + (Number(o[k]) || 0), 0);
  const tSwiggyH = sum('swiggy_high'), tSwiggyL = sum('swiggy_low');
  const tZomH    = sum('zomato_high'), tZomL    = sum('zomato_low');
  const tRated   = sum('total_rated'), tRista   = sum('rista_orders');
  const tHigh    = sum('total_high'),  tLow     = sum('total_low');
  const tIgcc    = sum('igcc'),        tErrors  = sum('total_errors');
  const tHighPct  = tRated > 0 ? (tHigh / tRated * 100).toFixed(1) : '—';
  const tErrPct   = tRated > 0 ? (tErrors / tRated * 100).toFixed(1) : '—';
  const tNetPct   = tRated > 0 ? ((tHigh - tErrors) / tRated * 100).toFixed(1) : '—';
  const tNetCls   = tNetPct === '—' ? '' : tNetPct >= 10 ? 'good' : tNetPct >= 0 ? '' : 'bad';
  const tErrCls   = tErrPct === '—' ? '' : tErrPct < 1 ? 'good' : tErrPct < 2 ? 'warn' : 'bad';
  const tHighCls  = tHighPct === '—' ? '' : tHighPct >= 20 ? 'good' : tHighPct >= 10 ? 'warn' : 'bad';
  const tdT  = (val, cls='') => `<td style="padding:11px 13px;text-align:right;font-size:12px;font-weight:800;font-family:var(--mono);background:var(--surface-2,#eef0f5);border-top:2px solid var(--border-2)"><span class="sc-pct ${cls}">${val}</span></td>`;
  const tdTL = (val) => `<td style="padding:11px 13px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--surface-2,#eef0f5);border-top:2px solid var(--border-2);color:var(--ink-2)">${val}</td>`;
  const tdTB = (val) => `<td style="padding:11px 13px;text-align:right;font-size:12px;font-weight:800;font-family:var(--mono);background:var(--surface-2,#eef0f5);border-top:2px solid var(--border-2);color:var(--blue)">${val}</td>`;
  const totalRow = `<tr>
    ${tdTL('Total')}
    ${tdT(tSwiggyH)} ${tdT(tSwiggyL)}
    ${tdT(tZomH)}   ${tdT(tZomL)}
    ${tdT(tRated)}  ${tdTB(tRista || '—')}
    ${tdT(tHigh)}   ${tdT(tLow)}
    ${tdT(tIgcc)}   ${tdT(tErrors)}
    ${tdT(tRista > 0 ? (tHigh / tRista * 100).toFixed(1) + '%' : '—', tRista > 0 ? (tHigh/tRista*100 >= 20 ? 'good' : tHigh/tRista*100 >= 10 ? 'warn' : 'bad') : '')}
    ${tdT(tRista > 0 ? (tErrors / tRista * 100).toFixed(1) + '%' : '—', tRista > 0 ? (tErrors/tRista*100 < 1 ? 'good' : tErrors/tRista*100 < 2 ? 'warn' : 'bad') : '')}
    ${tdT(tRista > 0 ? ((tHigh - tErrors) / tRista * 100).toFixed(1) + '%' : '—', tRista > 0 ? ((tHigh-tErrors)/tRista*100 >= 10 ? 'good' : (tHigh-tErrors)/tRista*100 >= 0 ? '' : 'bad') : '')}
  </tr>`;

  el.innerHTML = `<div style="overflow-x:auto"><table class="sc-table" style="min-width:1000px">${thead}<tbody>${rows}${totalRow}</tbody></table></div>`;
}

function prSetPreset(days) {
  [7,28].forEach(d => {
    const btn = document.getElementById('prtab-' + d);
    if (btn) btn.classList.toggle('active', d === days);
  });
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  const from = new Date(yesterday); from.setDate(yesterday.getDate() - (days - 1));
  const fmt = d => d.toISOString().split('T')[0];
  const startEl = document.getElementById('pr-start');
  const endEl   = document.getElementById('pr-end');
  if (startEl) startEl.value = fmt(from);
  if (endEl)   endEl.value   = fmt(yesterday);
  prLoad();
}

function prSetViewTab(tab) {
  _prViewTab = tab;
  ['online','dinein','combined','kpt'].forEach(t => {
    const btn = document.getElementById('prvtab-' + t);
    if (btn) btn.classList.toggle('active', t === tab);
  });
  // reset sort key to match the new tab's primary column
  if (tab === 'dinein')   _prSort = { key: 'dine_in_orders', dir: -1 };
  else if (tab === 'combined') _prSort = { key: 'rista_orders', dir: -1 };
  else if (tab === 'kpt') _prSort = { key: 'kpt_8_plus', dir: -1 };
  else                    _prSort = { key: 'online_orders', dir: -1 };
  prDrawTable();
}

let _prLoadToken = 0;
let _prLoadAbort = null;

async function prLoad() {
  const from   = document.getElementById('pr-start')?.value;
  const to     = document.getElementById('pr-end')?.value;
  const outlet = document.getElementById('pr-outlet')?.value || '';
  if (!from || !to) return;

  // Cancel any in-flight load for a previous selection and claim a new token.
  // Without this, switching date/outlet mid-load lets whichever response
  // lands last silently overwrite the table — even if it's for a selection
  // the user already moved away from.
  if (_prLoadAbort) _prLoadAbort.abort();
  const abortCtrl = new AbortController();
  _prLoadAbort = abortCtrl;
  const myToken = ++_prLoadToken;
  const isStale = () => myToken !== _prLoadToken;

  const el = document.getElementById('pr-content');
  if (el) el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading… (Rista data may take 30–60s on first load)</div>';
  try {
    let url = `${API}/api/admin/product-rankings?date_from=${from}&date_to=${to}`;
    if (outlet) url += `&outlet=${encodeURIComponent(outlet)}`;
    const r = await fetch(url, { headers: { 'Authorization': `Bearer ${_lsToken}` }, signal: abortCtrl.signal });
    if (isStale()) return;
    if (r.status === 401 || r.status === 403) { lsLogout(); renderProductsPage(); return; }
    const d = await r.json();
    if (isStale()) return;
    const products = d.products || [];
    // Populate outlet dropdown once (keep existing selection)
    const outSel = document.getElementById('pr-outlet');
    if (outSel && d.outlets && outSel.options.length <= 1) {
      d.outlets.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o; opt.textContent = o;
        outSel.appendChild(opt);
      });
      if (outlet) outSel.value = outlet;
    }
    const statusEl = document.getElementById('pr-status');
    if (statusEl) statusEl.textContent = products.length ? `${products.length} products · ${d.date_from} → ${d.date_to}${outlet ? ' · ' + outlet : ''}` : '';
    prRenderTable(products, el);
    // fetch previous equivalent period in background for volume trend cards
    const days = Math.round((new Date(to) - new Date(from)) / 86400000);
    const prevTo   = new Date(from); prevTo.setDate(prevTo.getDate() - 1);
    const prevFrom = new Date(prevTo); prevFrom.setDate(prevTo.getDate() - days);
    const fmt = d => d.toISOString().split('T')[0];
    let prevUrl = `${API}/api/admin/product-rankings?date_from=${fmt(prevFrom)}&date_to=${fmt(prevTo)}`;
    if (outlet) prevUrl += `&outlet=${encodeURIComponent(outlet)}`;
    fetch(prevUrl, { headers: { 'Authorization': `Bearer ${_lsToken}` }, signal: abortCtrl.signal })
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (isStale()) return; _prPrevData = (d && d.products) || []; prDrawTable(); })
      .catch(() => {});
  } catch(e) {
    if (e.name === 'AbortError' || isStale()) return;
    if (el) el.innerHTML = '<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Failed to load</div><div class="state-body">'+e+'</div></div>';
  }
}

let _prData = [];
let _prPrevData = [];
let _prSort = { key: 'online_orders', dir: -1 };

function prRenderTable(products, el) {
  if (!products.length) {
    el.innerHTML = '<div class="no-outages" style="padding:40px">No data for this range.</div>';
    return;
  }
  _prData = products;
  const cats = [...new Set(products.map(p => p.category || '').filter(Boolean))].sort();
  const sel = document.getElementById('pr-category');
  if (sel) {
    const prev = sel.value;
    sel.innerHTML = '<option value="">All</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
    if (cats.includes(prev)) sel.value = prev;
  }
  prDrawTable(el);
}

function prDrawTable(el) {
  if (!el) el = document.getElementById('pr-content');
  const minOrders = parseInt(document.getElementById('pr-min-orders')?.value || '0', 10) || 0;
  const catFilter = document.getElementById('pr-category')?.value || '';
  const searchQ = (document.getElementById('pr-search')?.value || '').trim().toLowerCase();
  const { key, dir } = _prSort;
  const view = _prViewTab; // 'online' | 'dinein' | 'combined'

  // For min-orders filter, use the primary order col for the current view
  const orderKey = view === 'dinein' ? 'dine_in_orders' : view === 'combined' ? 'rista_orders' : 'online_orders';

  const sorted = [..._prData]
    .filter(p => (p[orderKey] || 0) >= minOrders)
    .filter(p => !catFilter || (p.category || '') === catFilter)
    .filter(p => !searchQ || (p.product || '').toLowerCase().includes(searchQ))
    // hide products with 0 orders in current view
    .filter(p => (p[orderKey] || 0) > 0 || view === 'combined')
    .sort((a, b) => {
      const av = a[key] ?? -Infinity, bv = b[key] ?? -Infinity;
      return typeof av === 'string' ? av.localeCompare(bv) * dir : (av - bv) * dir;
    });

  const thBase = 'padding:10px 13px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--border-2);white-space:nowrap;font-family:var(--mono);cursor:pointer;user-select:none;transition:color .14s';
  const thR = `${thBase};text-align:right`;
  const thL = `${thBase};text-align:left`;

  const col = (label, k, align='right') => {
    const active = key === k;
    const arrow  = active ? (dir === 1 ? ' ↑' : ' ↓') : ' ↕';
    const color  = active ? 'color:var(--blue)' : 'color:var(--ink-3)';
    const base   = align === 'left' ? thL : thR;
    return `<th style="${base};${color}" onclick="prSortBy('${k}')">${label}<span style="opacity:.5;font-size:9px">${arrow}</span></th>`;
  };

  let thead, rowsFn;

  const td  = (val, cls='') => `<td style="padding:10px 13px;text-align:right;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono)"><span class="sc-pct ${cls}">${val}</span></td>`;
  const tdL = (val, bold=false) => `<td style="padding:10px 13px;font-size:12px;${bold?'font-weight:700;':''}border-bottom:1px solid var(--border);color:var(--ink)">${val}</td>`;
  const tdB = (val) => `<td style="padding:10px 13px;text-align:right;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);font-family:var(--mono);color:var(--blue)">${val}</td>`;

  if (view === 'online') {
    thead = `<thead><tr>
      <th style="${thL};color:var(--ink-3)">#</th>
      ${col('Product','product','left')}
      ${col('Category','category','left')}
      ${col('Online Orders','online_orders')}
      ${col('Total Rated','total_rated')}
      ${col('High ⭐','high_rated')}
      ${col('Low 👎','low_rated')}
      ${col('IGCC','igcc')}
      ${col('Errors','total_errors')}
      ${col('High %','high_pct')}
      ${col('Error %','error_pct')}
      ${col('Net %','net_pct')}
    </tr></thead>`;
    rowsFn = (p, i) => {
      const netCls  = p.net_pct  >= 10 ? 'good' : p.net_pct  >= 0 ? '' : 'bad';
      const errCls  = p.error_pct < 1  ? 'good' : p.error_pct < 2 ? 'warn' : 'bad';
      const highCls = p.high_pct >= 20 ? 'good' : p.high_pct >= 10 ? 'warn' : 'bad';
      return `<tr>
        ${tdL(i+1)} ${tdL(p.product,true)} ${tdL(p.category||'—')}
        ${tdB(p.online_orders||'—')} ${tdB(p.total_rated)}
        ${td(p.high_rated)} ${td(p.low_rated)} ${td(p.igcc)} ${td(p.total_errors)}
        ${td(p.high_pct+'%',highCls)} ${td(p.error_pct+'%',errCls)} ${td(p.net_pct+'%',netCls)}
      </tr>`;
    };
  } else if (view === 'dinein') {
    thead = `<thead><tr>
      <th style="${thL};color:var(--ink-3)">#</th>
      ${col('Product','product','left')}
      ${col('Category','category','left')}
      ${col('Dine In Orders','dine_in_orders')}
    </tr></thead>`;
    rowsFn = (p, i) => `<tr>
      ${tdL(i+1)} ${tdL(p.product,true)} ${tdL(p.category||'—')}
      ${tdB(p.dine_in_orders||'—')}
    </tr>`;
  } else if (view === 'combined') {
    // combined — sorted by online_orders, shows both + ratings
    thead = `<thead><tr>
      <th style="${thL};color:var(--ink-3)">#</th>
      ${col('Product','product','left')}
      ${col('Category','category','left')}
      ${col('Online','online_orders')}
      ${col('Dine In','dine_in_orders')}
      ${col('Total','rista_orders')}
      ${col('Total Rated','total_rated')}
      ${col('High ⭐','high_rated')}
      ${col('Low 👎','low_rated')}
      ${col('IGCC','igcc')}
      ${col('High %','high_pct')}
      ${col('Error %','error_pct')}
      ${col('Net %','net_pct')}
    </tr></thead>`;
    rowsFn = (p, i) => {
      const netCls  = p.net_pct  >= 10 ? 'good' : p.net_pct  >= 0 ? '' : 'bad';
      const errCls  = p.error_pct < 1  ? 'good' : p.error_pct < 2 ? 'warn' : 'bad';
      const highCls = p.high_pct >= 20 ? 'good' : p.high_pct >= 10 ? 'warn' : 'bad';
      return `<tr>
        ${tdL(i+1)} ${tdL(p.product,true)} ${tdL(p.category||'—')}
        ${tdB(p.online_orders||'—')} ${tdB(p.dine_in_orders||'—')} ${tdB(p.rista_orders||'—')}
        ${tdB(p.total_rated)}
        ${td(p.high_rated)} ${td(p.low_rated)} ${td(p.igcc)}
        ${td(p.high_pct+'%',highCls)} ${td(p.error_pct+'%',errCls)} ${td(p.net_pct+'%',netCls)}
      </tr>`;
    };
  } else if (view === 'kpt') {
    // Each col = (bucket_pct / 100) × bucket_midpoint
    // Midpoints: 0–3→1.5, 3–5→4, 5–8→6.5, 8+→10
    const _kv = (pct, mid) => { const v = Math.round(pct / 100 * mid * 100) / 100; return v; };
    thead = `<thead><tr>
      <th style="${thL};color:var(--ink-3)">#</th>
      ${col('Product','product','left')}
      ${col('Category','category','left')}
      ${col('Orders','kpt_total')}
      ${col('0–3 min','kpt_0_3')}
      ${col('3–5 min','kpt_3_5')}
      ${col('5–8 min','kpt_5_8')}
      ${col('8+ min','kpt_8_plus')}
    </tr></thead>`;
    rowsFn = (p, i) => {
      if (!p.kpt_total) return '';
      const v03 = _kv(p.kpt_0_3,  1.5);
      const v35 = _kv(p.kpt_3_5,  4.0);
      const v58 = _kv(p.kpt_5_8,  6.5);
      const v8p = _kv(p.kpt_8_plus, 10);
      return `<tr>
        ${tdL(i+1)} ${tdL(p.product,true)} ${tdL(p.category||'—')}
        ${tdB(p.kpt_total)}
        ${td(v03,'good')}
        ${td(v35, v35 > 1.2 ? 'warn' : '')}
        ${td(v58, v58 > 1.5 ? 'warn' : '')}
        ${td(v8p, v8p > 2 ? 'bad' : v8p > 1 ? 'warn' : '')}
      </tr>`;
    };
  }

  const kptFiltered = sorted.filter(p => view !== 'kpt' || p.kpt_total > 0);
  const rows = kptFiltered.map(rowsFn).join('');

  // ── KPT total row ──
  let tfoot = '';
  if (view === 'kpt' && kptFiltered.length) {
    const tot  = kptFiltered.reduce((s, p) => s + (p.kpt_total || 0), 0);
    const _r2  = v => Math.round(v * 100) / 100;
    const _wp  = (key, mid) => tot ? _r2(kptFiltered.reduce((s,p) => s + (p[key]||0) * (p.kpt_total||0), 0) / tot / 100 * mid) : 0;
    const t03  = _wp('kpt_0_3',   1.5);
    const t35  = _wp('kpt_3_5',   4.0);
    const t58  = _wp('kpt_5_8',   6.5);
    const t8p  = _wp('kpt_8_plus', 10);
    const ts = 'padding:10px 13px;font-size:12px;font-weight:700;border-top:2px solid var(--border-2);background:var(--bg);font-family:var(--mono)';
    tfoot = `<tfoot><tr>
      <td style="${ts};text-align:left" colspan="3">TOTAL</td>
      <td style="${ts};text-align:right;color:var(--blue)">${tot}</td>
      <td style="${ts};text-align:right;color:#2e7d32">${t03}</td>
      <td style="${ts};text-align:right">${t35}</td>
      <td style="${ts};text-align:right;color:${t58>1.5?'#e65100':''}">${t58}</td>
      <td style="${ts};text-align:right;color:${t8p>2?'#c62828':t8p>1?'#e65100':''}">${t8p}</td>
    </tr></tfoot>`;
  }

  // ── Highlights strip (only on online/combined where ratings exist) ──
  let highlightsHtml = '';
  if (view !== 'dinein' && view !== 'kpt' && sorted.length) {
    const _is28 = document.getElementById('prtab-28')?.classList.contains('active');
    const MIN40 = _is28
      ? (parseInt(document.getElementById('pr-hl-28')?.value) || 300)
      : (parseInt(document.getElementById('pr-hl-7')?.value)  || 75);
    const oKey  = orderKey; // already computed above
    // only products with 40+ orders qualify for all highlight cards
    const qualified = [...sorted].filter(p => (p[oKey] || 0) >= MIN40 && (p.total_rated || 0) > 0);

    const hlCard = (title, icon, items, valFn, cls) => {
      if (!items.length) return '';
      const rows = items.slice(0, 5).map((p, i) => {
        const name = p.product.length > 28 ? p.product.slice(0, 26) + '…' : p.product;
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;${i < items.slice(0,5).length-1?'border-bottom:1px solid var(--border)':''}">
          <span style="font-size:11px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px" title="${p.product}">${name}</span>
          <span style="font-size:11px;font-family:var(--mono);font-weight:700;flex-shrink:0;margin-left:8px;${cls}">${valFn(p)}</span>
        </div>`;
      }).join('');
      return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;min-width:220px;flex:1">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-family:var(--mono);margin-bottom:10px">${icon} ${title}</div>
        ${rows}
      </div>`;
    };

    const bestRated  = [...qualified].sort((a,b) => (b.net_pct||0) - (a.net_pct||0));
    const mostError  = [...qualified].sort((a,b) => (b.error_pct||0) - (a.error_pct||0));

    // build prev period lookup first — used by both rating and volume trend cards
    const prevMap = {};
    _prPrevData.forEach(p => { prevMap[p.product] = p; });

    // rating trend: % growth in high_pct vs previous period
    const withRatingDelta = qualified.map(p => {
      const prev = prevMap[p.product];
      if (!prev || !(prev.high_pct > 0)) return null;
      const growthPct = Math.round(((p.high_pct - prev.high_pct) / prev.high_pct) * 100);
      return { ...p, _ratingGrowth: growthPct, _prevHighPct: prev.high_pct };
    }).filter(Boolean);
    const trendUp   = [...withRatingDelta].sort((a,b) => b._ratingGrowth - a._ratingGrowth);
    const trendDown = [...withRatingDelta].sort((a,b) => a._ratingGrowth - b._ratingGrowth);
    const withVolDelta = qualified.map(p => {
      const prev = prevMap[p.product];
      if (!prev) return null;
      const cur = p[oKey] || 0, prv = prev[oKey] || 0;
      const delta = cur - prv;
      const pct   = prv > 0 ? Math.round((delta / prv) * 100) : null;
      return { ...p, _volDelta: delta, _volPct: pct };
    }).filter(Boolean).filter(p => p._volPct !== null);
    const volUp   = [...withVolDelta].sort((a,b) => b._volPct - a._volPct);
    const volDown = [...withVolDelta].sort((a,b) => a._volPct - b._volPct);

    const c1 = hlCard('Best Rated', '⭐', bestRated,
      p => `${p.net_pct}%`, 'color:var(--green)');
    const c2 = hlCard('Most Errors', '🚨', mostError,
      p => `${p.error_pct}%`, 'color:var(--red)');
    const c3 = hlCard('Rating Trend ↑', '📈', trendUp,
      p => `+${p._ratingGrowth}% (${p._prevHighPct}→${p.high_pct}%)`, 'color:var(--green)');
    const c4 = hlCard('Rating Trend ↓', '📉', trendDown,
      p => `${p._ratingGrowth}% (${p._prevHighPct}→${p.high_pct}%)`, 'color:var(--red)');
    const c5 = hlCard('Volume Up', '🚀', volUp,
      p => `+${p._volPct}% (${p._volDelta>0?'+':''}${p._volDelta})`, 'color:var(--green)');
    const c6 = hlCard('Volume Down', '📦', volDown,
      p => `${p._volPct}% (${p._volDelta})`, 'color:var(--red)');

    const row1 = [c1, c5, c3].filter(Boolean).join('');
    const row2 = [c2, c6, c4].filter(Boolean).join('');
    if (row1 || row2) {
      highlightsHtml = `
        ${row1 ? `<div style="display:flex;gap:12px;margin-bottom:12px">${row1}</div>` : ''}
        ${row2 ? `<div style="display:flex;gap:12px;margin-bottom:18px">${row2}</div>` : ''}`;
    }
  }

  const minW = view === 'dinein' ? '500px' : view === 'kpt' ? '900px' : view === 'combined' ? '1200px' : '1100px';
  if (!sorted.length) {
    el.innerHTML = highlightsHtml + '<div class="no-outages" style="padding:40px">No data for this view.</div>';
  } else {
    el.innerHTML = highlightsHtml + `<div style="overflow-x:auto"><table class="sc-table" style="min-width:${minW}">${thead}<tbody>${rows}</tbody>${tfoot}</table></div>`;
  }
}

function prSortBy(key) {
  if (_prSort.key === key) {
    _prSort.dir *= -1;
  } else {
    _prSort = { key, dir: -1 };
  }
  prDrawTable();
}

/* ── RATING TRENDS ── */
function trSetPreset(days) {
  [7,1].forEach(d => {
    const btn = document.getElementById('trtab-' + d);
    if (btn) btn.classList.toggle('active', d === days);
  });
  const fmt = d => d.toISOString().split('T')[0];
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  const s = id => document.getElementById(id);
  let aStart, aEnd, bStart, bEnd;
  if (days === 1) {
    // 1D: yesterday vs same day last week (7 days before)
    aStart = aEnd = new Date(yesterday);
    bStart = bEnd = new Date(yesterday); bStart.setDate(yesterday.getDate() - 7); bEnd = new Date(bStart);
  } else {
    // 7D: last 7 days vs the 7 days before that
    aEnd   = new Date(yesterday);
    aStart = new Date(yesterday); aStart.setDate(aEnd.getDate() - 6);
    bEnd   = new Date(aStart); bEnd.setDate(aStart.getDate() - 1);
    bStart = new Date(bEnd);   bStart.setDate(bEnd.getDate() - 6);
  }
  if (s('tr-a-start')) s('tr-a-start').value = fmt(aStart);
  if (s('tr-a-end'))   s('tr-a-end').value   = fmt(aEnd);
  if (s('tr-b-start')) s('tr-b-start').value = fmt(bStart);
  if (s('tr-b-end'))   s('tr-b-end').value   = fmt(bEnd);
  trLoad();
}

async function trLoad() {
  const s = id => document.getElementById(id)?.value;
  const aFrom = s('tr-a-start'), aTo = s('tr-a-end');
  const bFrom = s('tr-b-start'), bTo = s('tr-b-end');
  if (!aFrom || !aTo || !bFrom || !bTo) return;
  const el = document.getElementById('tr-content');
  if (el) el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading both periods…</div>';
  const statusEl = document.getElementById('tr-status');
  try {
    const fetchPeriod = async (from, to) => {
      const r = await fetch(`${API}/api/admin/product-rankings?date_from=${from}&date_to=${to}`,
        { headers: { 'Authorization': `Bearer ${_lsToken}` } });
      if (r.status === 401 || r.status === 403) { lsLogout(); renderProductsPage(); throw new Error('auth'); }
      return (await r.json()).products || [];
    };
    const [pA, pB] = await Promise.all([fetchPeriod(aFrom, aTo), fetchPeriod(bFrom, bTo)]);
    // Build lookup by product name
    const mapB = {};
    pB.forEach(p => { mapB[p.product] = p; });
    // Only show products that have ratings in at least one period
    const allNames = [...new Set([...pA.map(p=>p.product), ...pB.map(p=>p.product)])];
    const rows = allNames.map(name => {
      const a = pA.find(p=>p.product===name) || { high_rated:0, low_rated:0, total_rated:0, online_orders:0, category:'' };
      const b = mapB[name]                   || { high_rated:0, low_rated:0, total_rated:0, online_orders:0, category:'' };
      return {
        product:   name,
        category:  a.category || b.category || '',
        aHigh: a.high_rated, aLow: a.low_rated, aTotal: a.total_rated, aOrders: a.online_orders,
        bHigh: b.high_rated, bLow: b.low_rated, bTotal: b.total_rated, bOrders: b.online_orders,
        dHigh: a.high_rated - b.high_rated,
        dLow:  a.low_rated  - b.low_rated,
        dTotal: a.total_rated - b.total_rated,
        dOrders: a.online_orders - b.online_orders,
      };
    }).filter(r => r.aTotal > 0 || r.bTotal > 0)
      .sort((a,b) => b.aOrders - a.aOrders);

    if (statusEl) statusEl.textContent = `${rows.length} products · A: ${aFrom}→${aTo} · B: ${bFrom}→${bTo}`;
    trRenderTable(rows, aFrom, aTo, bFrom, bTo, el);
  } catch(e) {
    if (e.message !== 'auth' && el)
      el.innerHTML = '<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Failed to load</div><div class="state-body">'+e+'</div></div>';
  }
}

function trRenderTable(rows, aFrom, aTo, bFrom, bTo, el) {
  if (!rows.length) { el.innerHTML = '<div class="no-outages" style="padding:40px">No rated data for these ranges.</div>'; return; }
  const thBase = 'padding:9px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--border-2);white-space:nowrap;font-family:var(--mono);color:var(--ink-3)';
  const thC = `${thBase};text-align:center`;
  const thL = `${thBase};text-align:left`;
  const tdL = v => `<td style="padding:9px 12px;font-size:12px;border-bottom:1px solid var(--border);color:var(--ink)">${v}</td>`;
  const tdN = v => `<td style="padding:9px 12px;text-align:center;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);color:var(--ink)">${v}</td>`;
  const tdD = (v, base) => {
    const cls = v > 0 ? 'color:#16a34a;font-weight:700' : v < 0 ? 'color:#dc2626;font-weight:700' : 'color:var(--ink-3)';
    const sym = v > 0 ? '▲' : v < 0 ? '▼' : '—';
    const pct = base > 0 ? Math.round(Math.abs(v) / base * 100) : null;
    const pctStr = pct !== null ? `<span style="font-size:10px;opacity:.8"> ${pct}%</span>` : '';
    const val = v !== 0 ? `${sym} ${Math.abs(v)}${pctStr}` : '—';
    return `<td style="padding:9px 12px;text-align:center;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);${cls}">${val}</td>`;
  };
  const thead = `<thead>
    <tr>
      <th style="${thL}" rowspan="2">#</th>
      <th style="${thL}" rowspan="2">Product</th>
      <th style="${thL}" rowspan="2">Category</th>
      <th style="${thC};background:#eff6ff;border-left:2px solid var(--blue)" colspan="3">Period A · ${aFrom} → ${aTo}</th>
      <th style="${thC};background:#f0fdf4;border-left:2px solid var(--green)" colspan="3">Period B · ${bFrom} → ${bTo}</th>
      <th style="${thC};background:#faf5ff;border-left:2px solid #7c3aed" colspan="3">Δ Change (A − B)</th>
    </tr>
    <tr>
      <th style="${thC};background:#eff6ff;color:var(--blue)">Orders</th>
      <th style="${thC};background:#eff6ff;color:var(--blue)">High ⭐</th>
      <th style="${thC};background:#eff6ff;color:var(--blue)">Low 👎</th>
      <th style="${thC};background:#f0fdf4;color:var(--green);border-left:2px solid var(--green)">Orders</th>
      <th style="${thC};background:#f0fdf4;color:var(--green)">High ⭐</th>
      <th style="${thC};background:#f0fdf4;color:var(--green)">Low 👎</th>
      <th style="${thC};background:#faf5ff;color:#7c3aed;border-left:2px solid #7c3aed">Orders</th>
      <th style="${thC};background:#faf5ff;color:#7c3aed">High</th>
      <th style="${thC};background:#faf5ff;color:#7c3aed">Low</th>
    </tr>
  </thead>`;
  const tbody = rows.map((r,i) => `<tr>
    ${tdL(i+1)} ${tdL(`<strong>${r.product}</strong>`)} ${tdL(r.category||'—')}
    ${tdN(r.aOrders||'—')} ${tdN(r.aHigh||'—')} ${tdN(r.aLow||'—')}
    ${tdN(r.bOrders||'—')} ${tdN(r.bHigh||'—')} ${tdN(r.bLow||'—')}
    ${tdD(r.dOrders, r.bOrders)} ${tdD(r.dHigh, r.bHigh)} ${tdD(r.dLow*-1, r.bLow)}
  </tr>`).join('');
  el.innerHTML = `<div style="overflow-x:auto"><table class="sc-table" style="min-width:900px">${thead}<tbody>${tbody}</tbody></table></div>
    <div style="font-size:11px;color:var(--ink-3);margin-top:10px;font-family:var(--mono)">
      Δ Orders/High ▲ = more in A vs B (good). Δ Low ▲ = fewer low ratings in A vs B (good). Sorted by Period A online orders.
    </div>`;
}

/* ── ORDER GROWTH TAB ── */
let _grChannel = 'online'; // 'online' | 'dinein' | channel name
let _grView = 'product';   // 'product' | 'category'
let _grRange = 7;          // 7 | 28 | 'custom'  — rolling window length in days
let _grWeekOffset = 0;     // period offset (in range-lengths) from the latest period
let _grDataA = [];  // current week products
let _grDataB = [];  // prev week products
let _grOutlets = [];

// Local YYYY-MM-DD (avoid toISOString's UTC shift in IST)
function grFmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Rolling window: current = `days` ending yesterday (shifted by offset periods);
// previous = the `days` immediately before the current window.
function grRangeDates(offset, days) {
  const today = new Date();
  const aTo = new Date(today); aTo.setDate(today.getDate() - 1 + offset * days);
  const aFrom = new Date(aTo); aFrom.setDate(aTo.getDate() - (days - 1));
  const bTo = new Date(aFrom); bTo.setDate(aFrom.getDate() - 1);
  const bFrom = new Date(bTo); bFrom.setDate(bTo.getDate() - (days - 1));
  return { aFrom: grFmtDate(aFrom), aTo: grFmtDate(aTo), bFrom: grFmtDate(bFrom), bTo: grFmtDate(bTo) };
}

function grSetRange(days) {
  _grRange = days;
  _grWeekOffset = 0;
  [7, 28].forEach(d => { const b = document.getElementById('grr-' + d); if (b) b.classList.toggle('active', d === days); });
  const { aFrom, aTo, bFrom, bTo } = grRangeDates(0, days);
  const s = id => document.getElementById(id);
  if (s('gr-a-from')) s('gr-a-from').value = aFrom;
  if (s('gr-a-to'))   s('gr-a-to').value   = aTo;
  if (s('gr-b-from')) s('gr-b-from').value = bFrom;
  if (s('gr-b-to'))   s('gr-b-to').value   = bTo;
  grLoad();
}

// User manually edited a date → switch to custom mode and reload
function grOnCustomDate() {
  _grRange = 'custom';
  [7, 28].forEach(d => { const b = document.getElementById('grr-' + d); if (b) b.classList.remove('active'); });
  grLoad();
}

function grShiftWeek(dir) {
  const s = id => document.getElementById(id);
  const aFrom = s('gr-a-from')?.value, aTo = s('gr-a-to')?.value;
  const bFrom = s('gr-b-from')?.value, bTo = s('gr-b-to')?.value;
  // Shift by the active window length (preset days, or the current custom span)
  let span = (typeof _grRange === 'number') ? _grRange : 7;
  if (_grRange === 'custom' && aFrom && aTo)
    span = Math.round((new Date(aTo) - new Date(aFrom)) / 86400000) + 1;
  const shift = v => { const d = new Date(v); d.setDate(d.getDate() + dir * span); return grFmtDate(d); };
  if (aFrom && s('gr-a-from')) s('gr-a-from').value = shift(aFrom);
  if (aTo   && s('gr-a-to'))   s('gr-a-to').value   = shift(aTo);
  if (bFrom && s('gr-b-from')) s('gr-b-from').value = shift(bFrom);
  if (bTo   && s('gr-b-to'))   s('gr-b-to').value   = shift(bTo);
  grLoad();
}

function grSetChannel(ch) {
  _grChannel = ch;
  ['all','online','dinein','swiggy','zomato','fc','ownly','magicpin'].forEach(id => {
    const btn = document.getElementById('grch-' + id);
    if (btn) btn.classList.remove('active');
  });
  const idMap = {
    'all': 'grch-all', 'online': 'grch-online', 'dinein': 'grch-dinein',
    'AOD Swiggy': 'grch-swiggy', 'AOD Zomato': 'grch-zomato',
    'FC Swiggy': 'grch-fc', 'Ownly': 'grch-ownly', 'Magicpin - AOD': 'grch-magicpin'
  };
  const activeId = idMap[ch];
  if (activeId) { const b = document.getElementById(activeId); if (b) b.classList.add('active'); }
  grDraw();
}

function grSetView(v) {
  _grView = v;
  ['product','category'].forEach(x => {
    const b = document.getElementById('grv-' + x);
    if (b) b.classList.toggle('active', x === v);
  });
  // default sort: descending current orders for both views
  _grSort = { key: 'curr', dir: -1 };
  grDraw();
}

function grGetOrders(p, ch) {
  if (ch === 'all')    return p.rista_orders ?? ((p.online_orders || 0) + (p.dine_in_orders || 0));
  if (ch === 'online') return p.online_orders || 0;
  if (ch === 'dinein') return p.dine_in_orders || 0;
  return (p.channels && p.channels[ch]) || 0;
}

function grInit() {
  _grChannel = 'all';
  _grView = 'product';
  grSetRange(7);  // default: last 7 days (excl. today) vs prior 7 days — also loads
}

async function grLoad() {
  const s = id => document.getElementById(id)?.value || '';
  const aFrom = s('gr-a-from'), aTo = s('gr-a-to');
  const bFrom = s('gr-b-from'), bTo = s('gr-b-to');
  if (!aFrom || !aTo || !bFrom || !bTo) return;
  const outlet = document.getElementById('gr-outlet')?.value || '';
  const el = document.getElementById('gr-content');
  if (el) el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading both weeks…</div>';

  const fetchWeek = async (from, to) => {
    let url = `${API}/api/admin/product-rankings?date_from=${from}&date_to=${to}`;
    if (outlet) url += `&outlet=${encodeURIComponent(outlet)}`;
    const r = await fetch(url, { headers: { 'Authorization': `Bearer ${_lsToken}` } });
    if (r.status === 401 || r.status === 403) { lsLogout(); renderProductsPage(); throw new Error('auth'); }
    return await r.json();
  };

  try {
    const [dA, dB] = await Promise.all([fetchWeek(aFrom, aTo), fetchWeek(bFrom, bTo)]);
    _grDataA = dA.products || [];
    _grDataB = dB.products || [];

    // Populate outlet dropdown once
    const outSel = document.getElementById('gr-outlet');
    if (outSel && dA.outlets && outSel.options.length <= 1) {
      dA.outlets.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o; opt.textContent = o;
        outSel.appendChild(opt);
      });
      if (outlet) outSel.value = outlet;
    }

    const statusEl = document.getElementById('gr-status');
    if (statusEl) statusEl.textContent = `${_grDataA.length} products · ${bFrom}→${bTo} vs ${aFrom}→${aTo}`;
    grDraw();
  } catch(e) {
    if (e.message !== 'auth' && el)
      el.innerHTML = '<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Failed to load</div><div class="state-body">'+e+'</div></div>';
  }
}

let _grSort = { key: 'curr', dir: -1 };

function grSortBy(key) {
  _grSort = _grSort.key === key ? { key, dir: _grSort.dir * -1 } : { key, dir: -1 };
  grDraw();
}

function grDraw() {
  const el = document.getElementById('gr-content');
  if (!el) return;
  if (!_grDataA.length) { el.innerHTML = '<div class="no-outages" style="padding:40px">No data for this range.</div>'; return; }
  try {
  const ch = _grChannel;
  const minOrders = parseInt(document.getElementById('gr-min-orders')?.value || '0') || 0;

  // Build map: product → prev week orders
  const mapB = {};
  _grDataB.forEach(p => { mapB[p.product] = grGetOrders(p, ch); });

  const isCat = _grView === 'category';
  const allNames = [...new Set([..._grDataA.map(p=>p.product), ..._grDataB.map(p=>p.product)])];
  let baseRows = allNames.map(name => {
    const pa = _grDataA.find(p=>p.product===name);
    const curr = pa ? grGetOrders(pa, ch) : 0;
    const prev = mapB[name] || 0;
    const cat  = pa?.category || _grDataB.find(p=>p.product===name)?.category || '';
    return { name, cat, curr, prev };
  });

  // Aggregate by category when in category view
  if (isCat) {
    const agg = {};
    baseRows.forEach(r => {
      const c = r.cat || 'Uncategorised';
      if (!agg[c]) agg[c] = { name: c, cat: c, curr: 0, prev: 0 };
      agg[c].curr += r.curr;
      agg[c].prev += r.prev;
    });
    baseRows = Object.values(agg);
  }

  const q = (document.getElementById('gr-search')?.value || '').trim().toLowerCase();
  let rows = baseRows.map(r => {
    const diff = r.curr - r.prev;
    const pct  = r.prev > 0 ? diff / r.prev * 100 : null;
    return { ...r, diff, pct };
  })
  .filter(r => Math.max(r.curr, r.prev) >= minOrders)
  .filter(r => !q || r.name.toLowerCase().includes(q))
  .sort((a, b) => {
    const av = a[_grSort.key] ?? -Infinity;
    const bv = b[_grSort.key] ?? -Infinity;
    if (typeof av === 'string') return av.localeCompare(bv) * (_grSort.dir === -1 ? 1 : -1);
    const diff = (bv - av);
    return isNaN(diff) ? 0 : diff * (_grSort.dir === -1 ? 1 : -1);
  });

  // Totals
  const totCurr = rows.reduce((s,r) => s+r.curr, 0);
  const totPrev = rows.reduce((s,r) => s+r.prev, 0);
  const totDiff = totCurr - totPrev;
  const totPct  = totPrev > 0 ? totDiff / totPrev * 100 : null;

  const pctBadge = (pct, diff) => {
    if (pct === null) return diff > 0 ? `<span style="background:#dcfce7;color:#16a34a;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700">NEW</span>` : '—';
    const col = pct >= 0 ? '#16a34a' : '#dc2626';
    const bg  = pct >= 0 ? '#dcfce7' : '#fee2e2';
    const arrow = pct >= 0 ? '▲' : '▼';
    return `<span style="background:${bg};color:${col};padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700">${arrow} ${Math.abs(pct).toFixed(1)}%</span>`;
  };
  const diffCell = (diff) => {
    const col = diff > 0 ? '#16a34a' : diff < 0 ? '#dc2626' : 'var(--ink-3)';
    return `<span style="color:${col};font-weight:700">${diff > 0 ? '+' : ''}${diff}</span>`;
  };

  const aFrom = document.getElementById('gr-a-from')?.value || '';
  const aTo   = document.getElementById('gr-a-to')?.value   || '';
  const bFrom = document.getElementById('gr-b-from')?.value || '';
  const bTo   = document.getElementById('gr-b-to')?.value   || '';
  const thBase = 'padding:10px 13px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--border-2);white-space:nowrap;font-family:var(--mono);cursor:pointer;user-select:none';
  const th = (label, key, align='right') => {
    const active = _grSort.key === key;
    const arrow = active ? (_grSort.dir === -1 ? ' ↓' : ' ↑') : ' ↕';
    const col = active ? 'color:var(--blue)' : 'color:var(--ink-3)';
    return `<th style="${thBase};text-align:${align};${col}" onclick="grSortBy('${key}')">${label}<span style="opacity:.5;font-size:9px">${arrow}</span></th>`;
  };

  const thead = `<thead><tr>
    <th style="${thBase};text-align:left;color:var(--ink-3)">#</th>
    ${th(isCat ? 'Category' : 'Product','name','left')}
    ${isCat ? '' : th('Category','cat','left')}
    <th style="${thBase};text-align:right;color:var(--ink-3)">${bFrom}→${bTo}</th>
    <th style="${thBase};text-align:right;color:var(--ink-3)">${aFrom}→${aTo}</th>
    ${th('Change','diff')}
    ${th('% Change','pct')}
  </tr></thead>`;

  const tbody = rows.map((r, i) => `<tr>
    <td style="padding:10px 13px;font-size:12px;border-bottom:1px solid var(--border);color:var(--ink-3);font-family:var(--mono)">${i+1}</td>
    <td style="padding:10px 13px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);color:var(--ink)">${r.name}</td>
    ${isCat ? '' : `<td style="padding:10px 13px;font-size:12px;border-bottom:1px solid var(--border);color:var(--ink-3)">${r.cat||'—'}</td>`}
    <td style="padding:10px 13px;text-align:right;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);color:var(--ink-2)">${r.prev||'—'}</td>
    <td style="padding:10px 13px;text-align:right;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);font-family:var(--mono);color:var(--blue)">${r.curr||'—'}</td>
    <td style="padding:10px 13px;text-align:right;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono)">${diffCell(r.diff)}</td>
    <td style="padding:10px 13px;text-align:right;border-bottom:1px solid var(--border)">${pctBadge(r.pct, r.diff)}</td>
  </tr>`).join('');

  const totPctBadge = totPct !== null ? pctBadge(totPct, totDiff) : '—';
  const tfoot = `<tfoot><tr>
    <td colspan="${isCat ? 2 : 3}" style="padding:10px 13px;font-size:12px;font-weight:700;border-top:2px solid var(--border-2);background:var(--bg)">TOTAL (${rows.length} ${isCat ? 'categories' : 'products'})</td>
    <td style="padding:10px 13px;text-align:right;font-size:12px;font-weight:700;border-top:2px solid var(--border-2);background:var(--bg);font-family:var(--mono);color:var(--ink-2)">${totPrev}</td>
    <td style="padding:10px 13px;text-align:right;font-size:12px;font-weight:700;border-top:2px solid var(--border-2);background:var(--bg);font-family:var(--mono);color:var(--blue)">${totCurr}</td>
    <td style="padding:10px 13px;text-align:right;font-size:12px;font-weight:700;border-top:2px solid var(--border-2);background:var(--bg);font-family:var(--mono)">${diffCell(totDiff)}</td>
    <td style="padding:10px 13px;text-align:right;border-top:2px solid var(--border-2);background:var(--bg)">${totPctBadge}</td>
  </tr></tfoot>`;

  el.innerHTML = `<div style="overflow-x:auto"><table class="sc-table" style="min-width:900px">${thead}<tbody>${tbody}</tbody>${tfoot}</table></div>`;
  } catch(err) {
    el.innerHTML = `<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Render error</div><div class="state-body">${err}</div></div>`;
  }
}

/* ── SCOOP FLAVOUR RANKINGS ── */
let _scpData = [];
let _scpOnlineData = [];
let _scpDineinData = [];
let _scpSort = { key: 'units', dir: -1 };
let _scpCogsData = null;

function scpSetPreset(days) {
  [7,28].forEach(d => {
    const btn = document.getElementById('sctab-' + d);
    if (btn) btn.classList.toggle('active', d === days);
  });
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  const from = new Date(yesterday); from.setDate(yesterday.getDate() - (days - 1));
  const fmt = d => d.toISOString().split('T')[0];
  const s = document.getElementById('scp-start');
  const e = document.getElementById('scp-end');
  if (s) s.value = fmt(from);
  if (e) e.value = fmt(yesterday);
  scpLoad();
}

async function scpLoad() {
  const from = document.getElementById('scp-start')?.value;
  const to   = document.getElementById('scp-end')?.value;
  if (!from || !to) return;
  const outlet = document.getElementById('scp-outlet')?.value || '';
  const outletQ = outlet ? `&outlet=${encodeURIComponent(outlet)}` : '';
  const el = document.getElementById('scp-content');
  if (el) el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading… (Rista data may take 30–60s on first load)</div>';
  try {
    const [rankRes, cogsRes] = await Promise.all([
      fetch(`${API}/api/admin/scoop-rankings?date_from=${from}&date_to=${to}${outletQ}`, { headers: { 'Authorization': `Bearer ${_lsToken}` } }),
      fetch(`${API}/api/admin/scoop-cogs?date_from=${from}&date_to=${to}${outletQ}`,     { headers: { 'Authorization': `Bearer ${_lsToken}` } }),
    ]);
    if (rankRes.status === 401 || rankRes.status === 403 || cogsRes.status === 401 || cogsRes.status === 403) { lsLogout(); renderProductsPage(); return; }
    const d    = await rankRes.json();
    const cogs = cogsRes.ok ? await cogsRes.json() : null;
    _scpCogsData = cogs;
    const flavours = d.flavours || [];
    _scpOnlineData = d.flavours_online || [];
    _scpDineinData = d.flavours_dinein || [];
    // Populate outlet dropdown once (keep existing selection)
    const outSel = document.getElementById('scp-outlet');
    if (outSel && d.outlets && outSel.options.length <= 1) {
      d.outlets.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o; opt.textContent = o;
        outSel.appendChild(opt);
      });
      if (outlet) outSel.value = outlet;
    }
    const statusEl = document.getElementById('scp-status');
    if (statusEl) statusEl.textContent = flavours.length ? `${flavours.length} flavours · ${d.date_from} → ${d.date_to}${outlet ? ' · ' + outlet : ''}` : '';
    scpRenderTable(flavours, el);
  } catch(e) {
    if (el) el.innerHTML = '<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Failed to load</div><div class="state-body">'+e+'</div></div>';
  }
}

function scpRenderTable(flavours, el) {
  if (!flavours.length) {
    el.innerHTML = '<div class="no-outages" style="padding:40px">No scoop data for this range.</div>';
    return;
  }
  _scpData = flavours;
  _scpSort = { key: 'units', dir: -1 };
  scpDrawTable(el);
}

function scpDrawTable(el) {
  if (!el) el = document.getElementById('scp-content');
  const { key, dir } = _scpSort;
  const sorted = [..._scpData].sort((a, b) => {
    const av = a[key] ?? -Infinity, bv = b[key] ?? -Infinity;
    return typeof av === 'string' ? av.localeCompare(bv) * dir : (av - bv) * dir;
  });

  const thBase = 'padding:10px 13px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--border-2);white-space:nowrap;font-family:var(--mono);cursor:pointer;user-select:none;transition:color .14s';
  const thR = `${thBase};text-align:right`;
  const thL = `${thBase};text-align:left`;

  const col = (label, k, align='right') => {
    const active = key === k;
    const arrow  = active ? (dir === 1 ? ' ↑' : ' ↓') : ' ↕';
    const color  = active ? 'color:var(--blue)' : 'color:var(--ink-3)';
    const base   = align === 'left' ? thL : thR;
    return `<th style="${base};${color}" onclick="scpSortBy('${k}')">${label}<span style="opacity:.5;font-size:9px">${arrow}</span></th>`;
  };

  const thead = `<thead><tr>
    <th style="${thL};color:var(--ink-3)">#</th>
    ${col('Flavour','flavour','left')}
    ${col('Total Units','units')}
    ${col('2-Scoop','two_scoop_scoops')}
    ${col('3-Scoop','three_scoop_scoops')}
    ${col('Combo Units','combo_units')}
  </tr></thead>`;

  const mkRows = (rows) => rows.map((f, i) => {
    const tdL = (val, bold=false) => `<td style="padding:9px 12px;font-size:12px;${bold?'font-weight:700;':''}border-bottom:1px solid var(--border);color:var(--ink)">${val}</td>`;
    const tdN = (val, hi=false) => `<td style="padding:9px 12px;text-align:right;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);${hi?'font-weight:700;color:var(--blue)':''}">${val ?? '—'}</td>`;
    return `<tr>
      ${tdL(i + 1)}
      ${tdL(f.flavour, true)}
      ${tdN(f.units, true)}
      ${tdN(f.two_scoop_scoops)}
      ${tdN(f.three_scoop_scoops)}
      ${tdN(f.combo_units)}
    </tr>`;
  }).join('');

  const mkTable = (rows) => `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:340px">${thead}<tbody>${mkRows(rows)}</tbody></table></div>`;

  const sortFn = (a, b) => { const av = a[key] ?? -Infinity, bv = b[key] ?? -Infinity; return typeof av === 'string' ? av.localeCompare(bv) * dir : (av - bv) * dir; };
  const onlineSorted = [..._scpOnlineData].sort(sortFn).filter(f => f.two_scoop_scoops > 0 || f.three_scoop_scoops > 0);
  const dineinSorted = [..._scpDineinData].sort(sortFn).filter(f => f.two_scoop_scoops > 0 || f.three_scoop_scoops > 0);
  const flavourHtml = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden">
        <div style="padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px">
          🪑 Dine In
        </div>
        ${mkTable(dineinSorted)}
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden">
        <div style="padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px">
          🌐 Online
        </div>
        ${mkTable(onlineSorted)}
      </div>
    </div>`;

  const cogsHtml = _scpCogsData ? scpRenderCogs(_scpCogsData) : '';
  el.innerHTML = flavourHtml + cogsHtml;
}

function scpRenderCogs(data) {
  const rows = data.rows || [];
  const total = data.total || {};
  const fmt = v => v == null ? '—' : Number(v).toLocaleString('en-IN', {minimumFractionDigits:2,maximumFractionDigits:2});
  const fmt1 = v => v == null ? '—' : Number(v).toLocaleString('en-IN', {minimumFractionDigits:2,maximumFractionDigits:2});
  const cogsColor = pct => pct != null && pct < 40 ? 'color:var(--green);font-weight:700' : pct != null && pct < 50 ? 'color:var(--amber);font-weight:700' : 'color:var(--red);font-weight:700';

  const thS = 'padding:9px 14px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);background:#f8fafd;border-bottom:2px solid var(--border-2);white-space:nowrap;font-family:var(--mono)';
  const thSR = thS + ';text-align:right';

  const thead = `<thead><tr>
    <th style="${thS}">Row</th>
    <th style="${thSR}">Combos</th>
    <th style="${thSR}">Gross</th>
    <th style="${thSR}">Final Sale (Net+Pkg)</th>
    <th style="${thSR}">COGS (Mat+Sup)</th>
    <th style="${thSR}">COGS %</th>
    <th style="${thSR}">Final Sale / Combo</th>
    <th style="${thSR}">COGS / Combo</th>
  </tr></thead>`;

  const tdL = (v, bold=false) => `<td style="padding:9px 14px;font-size:12px;border-bottom:1px solid var(--border);${bold?'font-weight:700':''}color:var(--ink)">${v}</td>`;
  const tdR = (v, extra='') => `<td style="padding:9px 14px;text-align:right;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);${extra}">${v}</td>`;

  const bodyRows = rows.map(r => {
    const finalSale = (r.net || 0) + (r.pkg || 0);
    const cogsAmt   = (r.mat || 0) + (r.sup || 0);
    const combos    = r.combos || 0;
    return `<tr>
      ${tdL(r.label, true)}
      ${tdR(combos)}
      ${tdR(fmt(r.gross))}
      ${tdR(fmt(finalSale))}
      ${tdR(fmt(cogsAmt))}
      ${tdR(r.cogs_pct != null ? r.cogs_pct.toFixed(2)+'%' : '—', cogsColor(r.cogs_pct))}
      ${tdR(combos ? fmt1(finalSale / combos) : '—')}
      ${tdR(combos ? fmt1(cogsAmt   / combos) : '—')}
    </tr>`;
  }).join('');

  const tFS   = (total.net||0)+(total.pkg||0);
  const tCOGS = (total.mat||0)+(total.sup||0);
  const tC    = total.combos || 0;
  const totalRow = `<tr style="background:#f8fafd">
    ${tdL('<strong>Total</strong>', true)}
    ${tdR(`<strong>${tC}</strong>`)}
    ${tdR(`<strong>${fmt(total.gross)}</strong>`)}
    ${tdR(`<strong>${fmt(tFS)}</strong>`)}
    ${tdR(`<strong>${fmt(tCOGS)}</strong>`)}
    ${tdR(total.cogs_pct != null ? `<strong>${total.cogs_pct.toFixed(2)}%</strong>` : '—', cogsColor(total.cogs_pct))}
    ${tdR(tC ? `<strong>${fmt1(tFS/tC)}</strong>` : '—')}
    ${tdR(tC ? `<strong>${fmt1(tCOGS/tC)}</strong>` : '—')}
  </tr>`;

  return `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-top:4px">
      <div style="padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--ink)">
        📊 Scoop COGS Breakdown
      </div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:700px">
          ${thead}<tbody>${bodyRows}${totalRow}</tbody>
        </table>
      </div>
    </div>`;
}

function scpSortBy(key) {
  if (_scpSort.key === key) {
    _scpSort.dir *= -1;
  } else {
    _scpSort = { key, dir: -1 };
  }
  scpDrawTable();
}

let _invTrackerDays = 7;
let _invLiveData    = null;
let _invTrackerData = null;

function renderInventoryPage() {
  const el = document.getElementById('pageBody');
  el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading inventory data…</div>';
  _invLiveData = null; _invTrackerData = null;

  const authHdr = _lsToken ? { 'Authorization': `Bearer ${_lsToken}` } : {};
  Promise.all([
    fetch(API + '/api/inventory/oos', { headers: authHdr }).then(r => r.json()),
    fetch(`${API}/api/inventory/tracker?days=${_invTrackerDays}`).then(r => r.json()),
  ]).then(([live, tracker]) => {
    // /inventory/oos returns live Rista sold-out data filtered to critical SKUs
    _invLiveData    = live || { outlets: [], generated_at: '' };
    _invTrackerData = tracker;
    _renderInventory();
  }).catch(() => { el.innerHTML = errBox(''); });
}

async function triggerOosRefresh() {
  const status = document.getElementById('oosRefreshStatus');
  if (status) status.textContent = 'Fetching live Rista data…';
  renderInventoryPage();
}

function _invSetDays(n) {
  _invTrackerDays = n;
  fetch(`${API}/api/inventory/tracker?days=${n}`).then(r => r.json()).then(d => {
    _invTrackerData = d;
    _renderInventory();
  });
}

function _renderInventory() {
  const el = document.getElementById('pageBody');
  const live    = _invLiveData    || {};
  const tracker = _invTrackerData || {};

  // Live data comes from /api/inventory/oos (real-time Rista sold-out, filtered to critical SKUs)
  const outlets = live.outlets || [];
  const oos = [];
  const fetchErrors = [];
  outlets.forEach(o => {
    if (o.error) fetchErrors.push(o.outlet);
    (o.oos_items || []).forEach(it => {
      oos.push({
        outlet: o.outlet,
        sku:    it.sku,
        item:   it.name,
      });
    });
  });

  const events = tracker.events || [];

  const byOutlet = {};
  oos.forEach(x => { (byOutlet[x.outlet] = byOutlet[x.outlet] || []).push(x); });

  // Repeat offenders from tracker
  const repeatByOutlet = {};
  events.forEach(e => { repeatByOutlet[e.outlet] = (repeatByOutlet[e.outlet] || 0) + 1; });
  const worstOutlet = Object.entries(repeatByOutlet).sort((a,b) => b[1]-a[1])[0];

  // ── Stat cards ──
  const statsHtml = `
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">Live OOS Items</div>
        <div class="stat-value" style="color:${(live.total_oos||0)>0?'var(--red)':'var(--green)'}">${live.total_oos||0}</div>
        <div class="stat-sub">Critical SKUs sold out now</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Outlets Affected</div>
        <div class="stat-value" style="color:${(live.outlets_affected||0)>0?'var(--amber)':'var(--green)'}">${live.outlets_affected||0}</div>
        <div class="stat-sub">At least 1 critical OOS item</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Events (${_invTrackerDays}d)</div>
        <div class="stat-value" style="color:var(--ink)">${events.length}</div>
        <div class="stat-sub">Critical stock-outs</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Worst Outlet (${_invTrackerDays}d)</div>
        <div class="stat-value" style="color:var(--amber);font-size:18px">${worstOutlet ? worstOutlet[0] : '—'}</div>
        <div class="stat-sub">${worstOutlet ? worstOutlet[1]+' events' : 'No events'}</div>
      </div>
    </div>`;

  const errorBanner = fetchErrors.length
    ? `<div class="alert-banner show"><div class="alert-pulse"></div><div>Could not fetch live Rista data for: ${fetchErrors.join(', ')}</div></div>`
    : '';

  // ── Live OOS table per outlet ──
  const liveHtml = oos.length === 0
    ? `<div class="state-box"><div class="state-icon">✅</div><div class="state-title">All clear</div><div class="state-body">No critical items currently out of stock.</div></div>`
    : Object.entries(byOutlet).sort((a,b) => b[1].length - a[1].length).map(([outlet, rows]) => {
        return `
        <div class="section-card" style="margin-bottom:14px">
          <div class="section-head" style="padding:12px 16px">
            <div class="section-head-left" style="gap:10px">
              <div>
                <div class="section-title" style="font-size:14px">${outlet}</div>
                <div class="section-sub">${rows.length} critical item${rows.length>1?'s':''} sold out</div>
              </div>
            </div>
            <span style="background:var(--red-dim);color:var(--red);font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px">${rows.length} OOS</span>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead><tr>
                <th>Item</th><th>SKU</th><th>Status</th>
              </tr></thead>
              <tbody>
                ${rows.sort((a,b) => (a.item||'').localeCompare(b.item||'')).map(r => `
                <tr>
                  <td style="font-weight:600;font-size:13px">${r.item||'—'}</td>
                  <td style="font-family:var(--mono);font-size:11px;color:var(--ink-3)">${r.sku||'—'}</td>
                  <td><span style="background:var(--red-dim);color:var(--red);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px">OUT</span></td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
      }).join('');

  // ── Tracker history ──
  const dayBarHtml = `
    <div style="display:flex;gap:1px;background:var(--border);border-radius:var(--r);padding:3px;width:fit-content;margin-bottom:14px">
      ${[1,3,7,14,28].map(n => `<button class="ptab ${_invTrackerDays===n?'active':''}" onclick="_invSetDays(${n})">${n}d</button>`).join('')}
    </div>`;

  // Group tracker events by outlet for summary
  const trackerByOutlet = {};
  events.forEach(e => { (trackerByOutlet[e.outlet] = trackerByOutlet[e.outlet] || []).push(e); });
  const trackerSummaryRows = Object.entries(trackerByOutlet).sort((a,b) => b[1].length - a[1].length).map(([outlet, evts]) => {
    const items = [...new Set(evts.map(e => e.item))];
    return `<tr>
      <td style="font-weight:700;font-size:13px">${outlet}</td>
      <td style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--red);text-align:center">${evts.length}</td>
      <td style="font-size:12px;color:var(--ink-2)"><ul style="margin:0;padding-left:16px;list-style:disc">${items.map(it => `<li style="margin:1px 0">${it}</li>`).join('')}</ul></td>
    </tr>`;
  }).join('');

  const eventRows = events.map(e => `
    <tr>
      <td class="ts-cell">${e.timestamp||'—'}</td>
      <td style="font-weight:700;font-size:13px">${e.outlet}</td>
      <td style="font-size:12px">${e.item}</td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--ink-3)">${e.sku||'—'}</td>
    </tr>`).join('');

  const trackerHtml = events.length === 0
    ? `<div class="state-box"><div class="state-icon">✅</div><div class="state-title">No critical stock-outs</div><div class="state-body">None in the last ${_invTrackerDays} day${_invTrackerDays>1?'s':''}.</div></div>`
    : `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
        <div class="section-card">
          <div class="section-head"><div class="section-head-left"><div class="section-title">By Outlet</div></div></div>
          <table>
            <thead><tr><th>Outlet</th><th style="text-align:center">Events</th><th>Items</th></tr></thead>
            <tbody>${trackerSummaryRows}</tbody>
          </table>
        </div>
        <div class="section-card">
          <div class="section-head"><div class="section-head-left"><div class="section-title">Timeline</div><div class="section-sub">${events.length} events · last ${_invTrackerDays}d · ${tracker.generated_at||''}</div></div></div>
          <div style="overflow-x:auto;max-height:260px;overflow-y:auto">
            <table>
              <thead><tr><th>Time</th><th>Outlet</th><th>Item</th><th>SKU</th></tr></thead>
              <tbody>${eventRows}</tbody>
            </table>
          </div>
        </div>
      </div>`;

  el.innerHTML = statsHtml + errorBanner + `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">
      <div style="font-size:11px;color:var(--ink-3)">Live as of ${live.generated_at||'—'}</div>
      <button id="oosRefreshBtn" class="btn-refresh" style="font-size:11px;padding:4px 12px;display:inline-flex;align-items:center;gap:5px" onclick="triggerOosRefresh()">
        <span id="oosRefreshIcon">↻</span> Refresh Live
      </button>
      <span id="oosRefreshStatus" style="font-size:11px;color:var(--ink-3)"></span>
    </div>
    <div class="inv-section-head">📦 Live Out of Stock</div>
    ${liveHtml}
    <div class="inv-section-head" style="margin-top:24px">📈 Tracker History</div>
    ${dayBarHtml}
    ${trackerHtml}
  `;
}

let _masterData = null;
let _masterFilter = '';

function renderMasterPage() {
  const el = document.getElementById('pageBody');
  el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading master list…</div>';
  const authHdr = _lsToken ? { 'Authorization': `Bearer ${_lsToken}` } : {};
  fetch(API + '/api/inventory/master', { headers: authHdr })
    .then(r => r.json())
    .then(d => { _masterData = d; _renderMaster(); })
    .catch(() => { el.innerHTML = errBox(''); });
}

function _masterSetFilter(v) { _masterFilter = v; _renderMaster(true); }

async function _masterSave(sku, name, critical, statusElId) {
  const status = statusElId ? document.getElementById(statusElId) : null;
  if (status) status.textContent = 'Saving…';
  try {
    const r = await fetch(API + '/api/inventory/master', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(_lsToken ? { 'Authorization': `Bearer ${_lsToken}` } : {}) },
      body: JSON.stringify({ sku, name, critical }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.status === 'ok') {
      renderMasterPage();   // reload to reflect server truth
    } else if (status) {
      status.textContent = 'Error: ' + (d.detail || `HTTP ${r.status}`);
    }
  } catch (e) {
    if (status) status.textContent = 'Failed: ' + e.message;
  }
}

function _masterAdd() {
  const sku  = (document.getElementById('m-add-sku')  || {}).value || '';
  const name = (document.getElementById('m-add-name') || {}).value || '';
  const crit = (document.getElementById('m-add-crit') || {}).checked || false;
  const status = document.getElementById('m-add-status');
  if (!sku.trim()) { if (status) status.textContent = 'SKU is required'; return; }
  _masterSave(sku.trim(), name.trim(), crit, 'm-add-status');
}

function _renderMaster(filterOnly) {
  const el = document.getElementById('pageBody');
  const data  = _masterData || {};
  const items = data.items || [];
  const q = _masterFilter.trim().toLowerCase();
  const shown = q
    ? items.filter(x => x.sku.toLowerCase().includes(q) || (x.name||'').toLowerCase().includes(q))
    : items;
  const critCount = items.filter(x => x.critical).length;

  const rows = shown.map(x => {
    const safe = safeId(x.sku);
    return `
      <tr>
        <td style="font-family:var(--mono);font-size:12px;color:var(--ink-2)">${x.sku}</td>
        <td style="font-weight:600;font-size:13px">${x.name||'—'}</td>

            <input type="checkbox" ${x.critical?'checked':''}
              onchange="_masterSave('${x.sku.replace(/'/g,"\\'")}', '${(x.name||'').replace(/'/g,"\\'")}', this.checked, 'mstat-${safe}')">
            <span style="font-size:11px;font-weight:700;color:${x.critical?'var(--red)':'var(--ink-3)'}">${x.critical?'Critical':'Not critical'}</span>
          </label>
          <span id="mstat-${safe}" style="font-size:10px;color:var(--ink-3);margin-left:6px"></span>
        </td>
      </tr>`;
  }).join('');

  const tableCard = `
    <div class="section-card">
      <div class="section-head"><div class="section-head-left">
        <div class="section-title">All tracked items</div>
        <div class="section-sub">${items.length} items · ${critCount} critical · as of ${data.generated_at||'—'}</div>
      </div></div>
      <div style="padding:10px 16px">
        <input id="m-filter" placeholder="Search SKU or name…" value="${_masterFilter.replace(/"/g,'&quot;')}"

      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>SKU</th><th>Item Name</th><th style="text-align:center">Criticality</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="3" style="text-align:center;color:var(--ink-3);padding:16px">No items match.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;

  if (filterOnly && document.getElementById('m-filter')) {
    // Re-render only the table portion to keep the add-form & focus intact
    document.getElementById('master-table-wrap').innerHTML = tableCard;
    const f = document.getElementById('m-filter');
    if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    return;
  }

  const addCard = `
    <div class="section-card" style="margin-bottom:16px">
      <div class="section-head"><div class="section-head-left">
        <div class="section-title">➕ Add item to master list</div>
        <div class="section-sub">New SKUs are tracked; mark Critical to include in OOS alerts &amp; report</div>
      </div></div>
      <div style="padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <input id="m-add-sku"  placeholder="SKU code"  style="width:130px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px">
        <input id="m-add-name" placeholder="Item name" style="flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px">
        <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
          <input type="checkbox" id="m-add-crit"> Critical
        </label>
        <button class="btn-refresh" style="font-size:12px;padding:7px 16px" onclick="_masterAdd()">Add</button>
        <span id="m-add-status" style="font-size:11px;color:var(--ink-3)"></span>
      </div>
    </div>`;

  el.innerHTML = addCard + `<div id="master-table-wrap">${tableCard}</div>`;

/* ── DAILY RECON PAGE ── */
let _reconWindow = 7;
let _reconOutlet = 'All';
let _reconData   = null;
let _reconCustomFrom = '';
let _reconCustomTo   = '';

function renderReconPage() {
  const el = document.getElementById('pageBody');
  el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading…</div>';

  fetch(`${API}/api/ops/daily-recon`)
    .then(r => r.json())
    .then(d => {
      _reconData = d.rows || [];
      _renderRecon();
    })
    .catch(() => { el.innerHTML = errBox(''); });
}

function _reconSetOutlet(o) {
  _reconOutlet = o;
  _renderRecon();
}

function _reconSetWindow(w) {
  _reconWindow = w;
  [1,7,28,'custom'].forEach(n => {
    const b = document.getElementById('recontab-' + n);
    if (b) b.classList.toggle('active', n === w);
  });
  const cp = document.getElementById('recon-custom-picker');
  if (cp) cp.style.display = w === 'custom' ? 'flex' : 'none';
  _renderRecon();
}

function _reconApplyCustom() {
  const f = document.getElementById('recon-date-from');
  const t = document.getElementById('recon-date-to');
  if (!f || !t) return;
  _reconCustomFrom = f.value;
  _reconCustomTo   = t.value;
  _renderRecon();
}

function _localDateStr(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function _reconRows() {
  if (!_reconData) return [];
  const yesterdayStr = _localDateStr(-1);

  if (_reconWindow === 'custom') {
    if (!_reconCustomFrom || !_reconCustomTo) return [];
    return _reconData.filter(r => r.date >= _reconCustomFrom && r.date <= _reconCustomTo);
  }

  const cutoffStr = _localDateStr(-_reconWindow);

  if (_reconWindow === 1) {
    const pool = _reconOutlet === 'All' ? _reconData : _reconData.filter(r => r.outlet === _reconOutlet);
    const latestDate = pool.reduce((max, r) => r.date > max ? r.date : max, '');
    return _reconData.filter(r => r.date === latestDate);
  }

  return _reconData.filter(r => r.date >= cutoffStr && r.date <= yesterdayStr);
}

function _renderRecon() {
  const el = document.getElementById('pageBody');
  if (!_reconData) return;

  const allRows = _reconRows();
  const rows    = _reconOutlet === 'All' ? allRows : allRows.filter(r => r.outlet === _reconOutlet);
  const latestInRows = rows.length ? rows[0].date : '';
  const label  = _reconWindow === 'custom'
    ? (_reconCustomFrom && _reconCustomTo ? `${_reconCustomFrom} to ${_reconCustomTo}` : 'Custom Range')
    : _reconWindow === 1
    ? `Latest Day (${latestInRows || 'no data'})`
    : `Last ${_reconWindow} Days`;

  let tCash=0, tBharatpe=0, tSwiggy=0, tZomato=0, tTotal=0, tRista=0, tDiff=0, tMissing=0, tOpeningBal=0, tExpenses=0, tSendToRR=0, tClosingBal=0;
  rows.forEach(r => {
    tCash       += r.cash        || 0;
    tBharatpe   += r.bharatpe    || 0;
    tSwiggy     += r.swiggy      || 0;
    tZomato     += r.zomato      || 0;
    tTotal      += r.total       || 0;
    tRista      += r.rista       || 0;
    tDiff       += r.diff        || 0;
    tOpeningBal += r.opening_balance || 0;
    tExpenses   += r.expenses    || 0;
    tSendToRR   += r.send_to_rr  || 0;
    tClosingBal += r.closing_balance || 0;
    if (r.diff < 0) tMissing += Math.abs(r.diff);
  });

  el.innerHTML = `

function _saveCash(rid) {
  const r = _reconData.find(x => x.row === rid);
  if (!r) return;
  const inp = document.getElementById('rcash-inp-' + rid);
  if (!inp) return;
  const parsed = parseFloat(inp.value);
  if (isNaN(parsed) || parsed < 0) { inp.value = r.cash || 0; return; }
  if (Math.abs(parsed - (r.cash || 0)) < 0.01) return; // no change

  inp.style.opacity = '0.5';
  inp.disabled = true;

  fetch(`${API}/api/ops/daily-recon/cash`, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({row: r.row, cash: parsed})
  })
  .then(res => res.json())
  .then(d => {
    if (!d.ok) throw new Error(d.detail || 'Error');
    r.cash  = d.cash;
    r.total = d.total;
    r.diff  = d.diff;
    if (d.closing_balance !== undefined) r.closing_balance = d.closing_balance;
    inp.value = d.cash;
    inp.style.opacity = '1';
    inp.disabled = false;
    inp.style.borderColor = 'var(--green)';
    setTimeout(() => { if (inp) inp.style.borderColor = 'var(--border-2)'; }, 1500);
    const fmtN = n => n === 0 ? '—' : '₹' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
    const fmtBal = n => '₹' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
    const tEl = document.getElementById('rtotal-' + rid);
    if (tEl) tEl.textContent = fmtN(d.total);
    const dEl = document.getElementById('rdiff-' + rid);
    if (dEl) {
      if (Math.abs(d.diff) < 1) { dEl.textContent = '✓'; dEl.style.color = 'var(--green)'; }
      else { dEl.textContent = (d.diff < 0 ? '-' : '+') + fmtN(Math.abs(d.diff)); dEl.style.color = d.diff < 0 ? 'var(--red)' : 'var(--green)'; }
    }
    const clEl = document.getElementById('rclosing-' + rid);
    if (clEl && d.closing_balance !== undefined) clEl.textContent = d.closing_balance != null ? fmtBal(d.closing_balance) : '—';
    _showToast('Cash saved ✓');
  })
  .catch(e => {
    console.error('_saveCash error:', e);
    inp.value = r.cash || 0;
    inp.style.opacity = '1';
    inp.disabled = false;
    inp.style.borderColor = 'var(--red)';
    setTimeout(() => { if (inp) inp.style.borderColor = 'var(--border-2)'; }, 2000);
    _showToast('❌ Cash save failed: ' + (e?.message || 'unknown error'));
  });
}

function _saveExpenses(rid) {
  const r = _reconData.find(x => x.row === rid);
  if (!r) return;
  const inp = document.getElementById('rexp-inp-' + rid);
  if (!inp) return;
  const parsed = parseFloat(inp.value);
  if (isNaN(parsed) || parsed < 0) { inp.value = r.expenses || 0; return; }
  if (Math.abs(parsed - (r.expenses || 0)) < 0.01) return;

  inp.style.opacity = '0.5';
  inp.disabled = true;

  fetch(`${API}/api/ops/daily-recon/expenses`, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({date: r.date, outlet: r.outlet, expenses: parsed})
  })
  .then(res => res.json().then(d => ({ ok: res.ok, status: res.status, ...d })))
  .then(d => {
    if (!d.ok) throw new Error(d.detail || `HTTP ${d.status}`);
    r.expenses = d.expenses;
    r.closing_balance = d.closing_balance;
    inp.value = d.expenses;
    inp.style.opacity = '1';
    inp.disabled = false;
    inp.style.borderColor = 'var(--green)';
    setTimeout(() => { if (inp) inp.style.borderColor = 'var(--border-2)'; }, 1500);
    const fmtN = n => n === 0 ? '—' : '₹' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
    const clEl = document.getElementById('rclosing-' + rid);
    if (clEl) clEl.textContent = fmtN(d.closing_balance);
    _showToast('Expenses saved ✓');
  })
  .catch(e => {
    _showToast('❌ Expenses save failed: ' + (e?.message || 'unknown error'));
    inp.value = r.expenses || 0;
    inp.style.opacity = '1';
    inp.disabled = false;
    inp.style.borderColor = 'var(--red)';
    setTimeout(() => { if (inp) inp.style.borderColor = 'var(--border-2)'; }, 2000);
  });
}

let _rrReconData = null;

function renderRRReconPage() {
  const el = document.getElementById('pageBody');

  fetch(`${API}/api/ops/rr-recon`)
    .then(r => r.json())

      _renderRRRecon();
