function _renderRRRecon() {
  const el = document.getElementById('pageBody');
  if (!_rrReconData) return;

  const rows = [..._rrReconData].sort((a,b) => b.date.localeCompare(a.date));

  let tCash=0, tExp=0, tExpected=0, tActual=0, tDiff=0;
  rows.forEach(r => {
    tCash     += r.cash_collected    || 0;
    tExp      += r.expenses          || 0;
    tExpected += r.expected_handover || 0;
    tActual   += r.actual_received   || 0;
    tDiff     += r.difference        || 0;
  });

  const fmt = n => '₹' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
  const diffCell = d => {
    if (Math.abs(d) < 1) return `<td class="r" style="color:var(--green);font-weight:700">✓</td>`;
    const col = d < 0 ? 'var(--red)' : 'var(--green)';
    return `<td class="r" style="color:${col};font-weight:700">${d < 0 ? '-' : '+'}${fmt(d)}</td>`;
  };

  const totalShort = tDiff < -1 ? tDiff : 0;
  const totalColor = totalShort < -5000 ? 'var(--red)' : totalShort < -1000 ? 'var(--amber)' : 'var(--green)';

  const tableRows = rows.map(r => {
    const [y,m,d] = r.date.split('-').map(Number);
    const dateLabel = new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'numeric',month:'short',weekday:'short'});
    return `<tr>
      <td style="font-size:11px;font-weight:700;color:var(--ink-2)">${dateLabel}</td>
      <td class="r">${r.cash_collected > 0 ? fmt(r.cash_collected) : '—'}</td>
      <td class="r" style="color:var(--red)">${r.expenses > 0 ? fmt(r.expenses) : '—'}</td>
      <td class="r" style="font-weight:700">${fmt(r.expected_handover)}</td>
      <td class="r" style="color:var(--blue);font-weight:600">${r.actual_received > 0 ? fmt(r.actual_received) : '—'}</td>
      ${diffCell(r.difference)}
    </tr>`;
  }).join('');

  const totalsRow = `<tr style="border-top:2px solid var(--border-2);background:#f5f7fb;font-weight:800">
    <td style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)">Total</td>
    <td class="r">${fmt(tCash)}</td>
    <td class="r" style="color:var(--red)">${fmt(tExp)}</td>
    <td class="r">${fmt(tExpected)}</td>
    <td class="r" style="color:var(--blue)">${fmt(tActual)}</td>
    <td class="r" style="color:${tDiff < -1 ? 'var(--red)' : 'var(--green)'};font-weight:800">${tDiff < -1 ? '-'+fmt(tDiff) : tDiff > 1 ? '+'+fmt(tDiff) : '✓'}</td>
  </tr>`;

  el.innerHTML = `
    <div class="stat-row" style="margin-bottom:16px">
      <div class="stat-card">
        <div class="stat-label">Total Cash Collected</div>
        <div class="stat-value neu">₹${tCash.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">RR Daily Recon</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Expected Handover</div>
        <div class="stat-value neu">₹${tExpected.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">Cash − Expenses</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Actual Received</div>
        <div class="stat-value" style="color:var(--blue)">₹${tActual.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">Kim's Before Deposit</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Variance</div>
        <div class="stat-value" style="color:${totalColor}">₹${Math.abs(tDiff).toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">${tDiff < -1 ? 'Kim received less' : tDiff > 1 ? 'Kim received more' : 'Balanced'}</div>
      </div>
    </div>
    <div class="section-card">
      <div class="section-head">
        <div class="section-head-left">
          <div class="section-icon" style="background:#eff6ff">🏦</div>
          <div>
            <div class="section-title">RR Daily Reconciliation — Apr 1 onwards</div>
            <div class="section-sub">Expected handover (Cash − Expenses) vs Actual received by Kim (Before Deposit)</div>
          </div>
        </div>
      </div>
      ${rows.length === 0
        ? `<div class="no-outages">No data available</div>`
        : `<table>
          <thead><tr>
            <th>Date</th>
            <th class="r">Cash Collected</th>
            <th class="r">Expenses</th>
            <th class="r">Expected Handover</th>
            <th class="r">Actual Received</th>
            <th class="r">Difference</th>
          </tr></thead>
          <tbody>${tableRows}${totalsRow}</tbody>
        </table>`}
    </div>`;
}

function _showToast(msg) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:28px;right:28px;background:#16a34a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.18);transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._hide);
  t._hide = setTimeout(() => { t.style.opacity = '0'; }, 2000);
}

function _poRange() {
  const m = document.getElementById('po-month').value; // YYYY-MM
  if (!m) return null;
  const [y, mo] = m.split('-').map(Number);
  const from = `${m}-01`;
  const last = new Date(y, mo, 0).getDate();
  const to = `${m}-${String(last).padStart(2,'0')}`;
  return { from, to };
}

async function poLoad() {
  const r = _poRange(); if (!r) return;
  const el = document.getElementById('po-content');
  el.innerHTML = '<div class="loader-box"><div class="loader"></div> Fetching payouts from Swiggy…</div>';
  try {
    const res = await fetch(`${API}/api/ops/swiggy-payouts?date_from=${r.from}&date_to=${r.to}`,
      { headers: { Authorization: `Bearer ${_lsToken}` } });
    const d = await res.json();
    if (!res.ok) throw new Error(d.detail || 'Failed');
    const outlet = document.getElementById('po-outlet').value;
    _payoutData = (d.payouts || []).filter(p => outlet === 'ALL' || p.outlet_code === outlet);
    if (!_payoutData.length) { el.innerHTML = '<div style="padding:10px;color:var(--ink-3)">No payouts in this period.</div>'; poToggleDl(false); return; }
    const total = _payoutData.reduce((s,p)=>s+(+p.net_payout||0),0);
    const rows = _payoutData.map(p => `<tr style="border-top:1px solid var(--border-2)">
      <td style="padding:7px 12px;font-weight:600">${p.outlet} <span style="color:var(--ink-3);font-size:11px">(${p.outlet_code})</span></td>
      <td style="padding:7px 12px">${p.week_start} → ${p.week_end}</td>
      <td style="padding:7px 12px;text-align:right;font-weight:700">₹${(+p.net_payout).toLocaleString('en-IN',{minimumFractionDigits:2})}</td>
      <td style="padding:7px 12px"><span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:${p.status==='PAID'?'#dcfce7':'#fef3c7'};color:${p.status==='PAID'?'#15803d':'#92400e'}">${p.status}</span> <span style="font-size:11px;color:var(--ink-3)">${p.status_message||''}</span></td>
      <td style="padding:7px 12px;font-size:11px;color:var(--ink-3)">${p.payout_id}</td></tr>`).join('');
    el.innerHTML = `
      <div style="font-size:13px;margin:4px 0 10px">${_payoutData.length} payouts · total net <b>₹${total.toLocaleString('en-IN',{minimumFractionDigits:2})}</b></div>
      <div style="border:1.5px solid var(--border-2);border-radius:10px;overflow:hidden;background:var(--surface)">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="background:var(--bg)"><th style="padding:8px 12px;text-align:left;font-size:11px;color:var(--ink-3);text-transform:uppercase">Outlet</th><th style="padding:8px 12px;text-align:left;font-size:11px;color:var(--ink-3);text-transform:uppercase">Week</th><th style="padding:8px 12px;text-align:right;font-size:11px;color:var(--ink-3);text-transform:uppercase">Net Payout</th><th style="padding:8px 12px;text-align:left;font-size:11px;color:var(--ink-3);text-transform:uppercase">Status</th><th style="padding:8px 12px;text-align:left;font-size:11px;color:var(--ink-3);text-transform:uppercase">Payout ID</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    poToggleDl(true);
  } catch(e) {
    el.innerHTML = `<div style="padding:10px;color:var(--red)">Error: ${e.message}</div>`;
    poToggleDl(false);
  }
}

function poToggleDl(on) {
  ['po-dl','po-dl2','po-dl3'].forEach(id => {
    const b = document.getElementById(id); if (!b) return;
    b.disabled = !on; b.style.opacity = on ? '1' : '.5'; b.style.cursor = on ? 'pointer' : 'default';
  });
}

async function poDownload(doc) {
  const r = _poRange(); if (!r) return;
  const outlet = document.getElementById('po-outlet').value;
  const btn = document.getElementById(doc==='annexure'?'po-dl':doc==='taxInvoice'?'po-dl2':'po-dl3');
  const label = btn.textContent; btn.textContent = '⏳ Preparing…'; btn.disabled = true;
  try {
    const res = await fetch(`${API}/api/ops/swiggy-payouts/download?date_from=${r.from}&date_to=${r.to}&outlet=${outlet}&doc=${doc}`,
      { headers: { Authorization: `Bearer ${_lsToken}` } });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.detail || res.status); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `swiggy_${doc}_${outlet}_${r.from}_to_${r.to}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } catch(e) {
    alert('Download failed: ' + e.message);
  } finally {
    btn.textContent = label; btn.disabled = false;
  }
}

async function poCompile() {
  const r = _poRange(); if (!r) return;
  const btn = document.getElementById('po-compile');
  const st = document.getElementById('po-compile-status');
  const lbl = btn.textContent; btn.textContent = '⏳ Compiling…'; btn.disabled = true;
  st.style.color = 'var(--ink-3)';
  st.textContent = 'Pulling annexures and compiling the summary… this can take a minute.';
  try {
    const res = await fetch(`${API}/api/ops/swiggy-payouts/compile?date_from=${r.from}&date_to=${r.to}`,
      { method: 'POST', headers: { Authorization: `Bearer ${_lsToken}` } });
    const d = await res.json();
    if (!res.ok) throw new Error(d.detail || res.status);
    st.style.color = '#15803d';
    st.innerHTML = `✅ Compiled ${d.annexures_compiled} annexures (${d.payouts_found} payouts) → <b>Swiggy</b> summary + <b>Swiggy Raw Data</b> (${d.raw_rows} rows).`;
  } catch(e) {
    st.style.color = 'var(--red)';
    st.textContent = 'Compile failed: ' + e.message;
  } finally {
    btn.textContent = lbl; btn.disabled = false;
  }
}

async function _ckLoadBuild() {
  document.getElementById('ckBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
      <input type="date" id="ckDatePicker"
        style="padding:8px 12px;border:1.5px solid var(--border-2);border-radius:8px;font-size:14px;font-family:var(--sans)"
        value="${_ckState.date.split('/').reverse().join('-')}"
        onchange="const [y,m,d]=this.value.split('-');_ckState.date=d+'/'+m+'/'+y;_ckState.entries=[];_ckState.outlet_entries={};_ckState.loaded=false;_ckLoadBuild();">
      <span id="ckDayLabel" style="font-size:14px;font-weight:700;color:var(--ink)"></span>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button onclick="_ckAddAllKitchen()"
          style="padding:8px 16px;border:1.5px solid #7c3aed;border-radius:8px;background:#fff;color:#7c3aed;font-weight:600;cursor:pointer;font-size:13px">
          🍳 Add All Kitchen
        </button>
        <button onclick="_ckPrePopulate()"
          style="padding:8px 16px;border:1.5px solid var(--border-2);border-radius:8px;background:#fff;color:var(--ink-2);font-weight:600;cursor:pointer;font-size:13px">
          ↩ Auto-fill All
        </button>
        <button onclick="_ckPublish()"
          style="padding:10px 28px;border:none;border-radius:8px;background:${CK_GREEN};color:#fff;font-weight:700;cursor:pointer;font-size:14px">
          ☁ Publish
        </button>
      </div>
    </div>
    <div id="ckBuildBody"><div style="text-align:center;padding:40px;color:var(--ink-3)">Loading kitchen staff…</div></div>`;

  try {
    // Build 14 past dates for recent-workers detection
    const pastDates = [];
    for (let i = 1; i <= 14; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      pastDates.push(`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`);
    }

    const [empRes, existRes, ...historyResults] = await Promise.all([
      fetch(`${API}/api/ops/roster/employees?date=${encodeURIComponent(_ckState.date)}`).then(r=>r.json()),
      fetch(`${API}/api/ops/roster/for-date?date=${encodeURIComponent(_ckState.date)}`).then(r=>r.json()),
      ...pastDates.map(d => fetch(`${API}/api/ops/roster/for-date?date=${encodeURIComponent(d)}`).then(r=>r.json())),
    ]);

    // CK kitchen shifts
    _ckState.shifts = [
      { shift_id: 'ck-9-18',  shift_name: '9 AM to 6 PM (9hr)',  start_time: '09:00', end_time: '18:00' },
      { shift_id: 'ck-9-17',  shift_name: '10 AM to 6 PM (8hr)', start_time: '10:00', end_time: '18:00' },
      { shift_id: 'ck-11-22', shift_name: '11 AM to 10 PM',      start_time: '11:00', end_time: '22:00' },
      { shift_id: 'ck-13-22', shift_name: '1 PM to 10 PM (9hr)', start_time: '13:00', end_time: '22:00' },
      { shift_id: 'ck-13-21', shift_name: '2 PM to 10 PM (8hr)', start_time: '14:00', end_time: '22:00' },
      { shift_id: 'ck-15-00', shift_name: '3 PM to 12 AM (9hr)', start_time: '15:00', end_time: '00:00' },
      { shift_id: 'ck-15-23', shift_name: '4 PM to 12 AM (8hr)', start_time: '16:00', end_time: '00:00' },
    ];

    // Collect IDs who worked CK in past 2 weeks
    const recentIds = new Set();
    historyResults.forEach(res => {
      (res.entries || []).forEach(e => { if (e.outlet === 'CK') recentIds.add(e.employee_id); });
    });
    _ckState.recent_ids = recentIds;

    const pools = empRes.pools_by_outlet || {};
    const allCK = pools['CK'] || [];
    // Sort: recent workers first, then alphabetical
    _ckState.ck_pool = [
      ...allCK.filter(e =>  recentIds.has(e.employee_id)).sort((a,b)=>a.name.localeCompare(b.name)),
      ...allCK.filter(e => !recentIds.has(e.employee_id)).sort((a,b)=>a.name.localeCompare(b.name)),
    ];

    if (!_ckState.loaded) {
      _ckState.loaded = true;
      const allExisting = existRes.entries || [];

      // CK entries only — must be CK outlet or WO for a CK pool employee
      const ckIds = new Set(_ckState.ck_pool.map(e => e.employee_id));
      const existCK = allExisting.filter(e => (e.outlet === 'CK' || e.outlet === 'WO') && ckIds.has(e.employee_id));
      const _mapShift = (start, end) => {
        if (start === '09:00' && end === '18:00') return 'ck-9-18';
        if (start === '09:00') return 'ck-9-17';
        if (start === '13:00' && end === '22:00') return 'ck-13-22';
        if (start === '13:00') return 'ck-13-21';
        if (start === '15:00' && end === '00:00') return 'ck-15-00';
        if (start === '15:00') return 'ck-15-23';
        return 'ck-9-18';
      };
      if (existCK.length) {
        _ckState.entries = existCK.map(e => ({
          employee_id: e.employee_id, employee_name: e.employee_name || '', outlet: e.outlet === 'WO' ? 'WO' : 'CK',
          shift: e.outlet === 'WO' ? '' : _mapShift(e.start_time, e.end_time),
          start_time: e.outlet === 'WO' ? '' : (e.start_time || '09:00'),
          end_time:   e.outlet === 'WO' ? '' : (e.end_time   || '18:00'),
        }));
      } else {
        _ckState.entries = _ckState.ck_pool.filter(emp => recentIds.has(emp.employee_id))
          .map(emp => ({ employee_id: emp.employee_id, outlet: 'CK', shift: '7fae26a6', start_time: '21:00', end_time: '06:00' }));
      }
    }

    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const [d,m,y] = _ckState.date.split('/');
    document.getElementById('ckDayLabel').textContent = days[new Date(`${y}-${m}-${d}`).getDay()];
    _ckRenderBuild();
  } catch(e) {
    document.getElementById('ckBuildBody').innerHTML = `<div style="color:var(--red);padding:20px">Error: ${e.message}</div>`;
  }
}

function _ckRenderBuild() {
  const { ck_pool, shifts, entries } = _ckState;
  const empById = {};
  ck_pool.forEach(e => empById[e.employee_id] = e);

  const shiftOptsFor = (selectedId) =>
    shifts.map(s => `<option value="${s.shift_id}" ${selectedId===s.shift_id?'selected':''}>${s.shift_name} &nbsp; ${s.start_time}–${s.end_time}</option>`).join('');

  const usedIds = new Set(entries.map(r => r.employee_id));
  const available = ck_pool.filter(e => !usedIds.has(e.employee_id));

  const scheduledRows = entries.map((row, idx) => {
    const emp  = empById[row.employee_id];
    const name = emp ? emp.name : (row.employee_name || row.employee_id);

    return `

        <td style="padding:9px 14px;font-size:14px;font-weight:600;color:${isWO ? '#1d4ed8' : 'var(--ink)'}">${name}</td>
        <td style="padding:9px 14px">${shiftCell}</td>

        </td>

  }).join('');

  const poolRows = available.map(emp => {
    const isRecent = _ckState.recent_ids.has(emp.employee_id);

      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--border-2)">
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:2px">

          ${recentBadge}${shiftBadge}
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button onclick="_ckAddWO('${emp.employee_id}')"
            style="padding:4px 12px;border:1.5px solid #2563eb;border-radius:6px;color:#2563eb;background:none;cursor:pointer;font-size:12px;font-weight:600">WO</button>
          <button onclick="_ckAddEmp('${emp.employee_id}')"
            style="padding:4px 14px;border:1.5px solid ${CK_GREEN};border-radius:6px;color:${CK_GREEN};background:none;cursor:pointer;font-size:12px;font-weight:600">+ Add</button>
        </div>
      </div>`;
  }).join('');

  document.getElementById('ckBuildBody').innerHTML = `
    <!-- CK Section -->
    <div style="margin-bottom:28px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3);margin-bottom:8px">

          <div style="background:#f8f9fb;padding:7px 14px;display:grid;grid-template-columns:160px 1fr 60px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3)">

function _renderOutletSections() {
  const { outlet_pools, outlet_entries, outlet_shifts, outlet_labels } = _ckState;
  if (!outlet_pools || !Object.keys(outlet_pools).length) return '';
  return Object.entries(outlet_pools).map(([code, pool]) => {
    const entries  = outlet_entries[code] || [];
    const usedIds  = new Set(entries.map(r => r.employee_id));
    const available = pool.filter(e => !usedIds.has(e.employee_id));
    const label    = outlet_labels[code] || code;
    const shiftOpts = (sel) => outlet_shifts
      .filter(s => !s.outlet_name || s.outlet_name === code)
      .map(s =>

    const poolRows2 = available.map(emp => `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--border-2)">

            style="padding:4px 14px;border:1.5px solid var(--green);border-radius:6px;color:var(--green);background:none;cursor:pointer;font-size:12px;font-weight:600">+ Add</button>
        </div>

    return `

}

function _outletAdd(code, eid) {

function _outletAddWO(code, eid) {

function _outletRemove(code, idx) {

async function _ckPublish() {
  const { date, entries, outlet_entries } = _ckState;

  const toPublish = entries.filter(e => e.employee_id).map(e => ({ ...e, outlet: e.outlet || 'CK' }));

  if (!toPublish.length) { alert('No entries to publish.'); return; }
  const noShift = toPublish.filter(e => !e.shift && e.outlet !== 'WO');
  if (noShift.length && !confirm(`${noShift.length} employee(s) have no shift set. Publish anyway?`)) return;

  try {
    const res = await fetch(`${API}/api/ops/roster/publish`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date, entries: toPublish }),
    }).then(r => r.json());
    if (res.success) {
      _showToast(`CK Roster published — ${res.published} entries ✓`);
      _ckState.loaded = false;
      _ckState.entries = [];
      _ckLoadBuild();
    } else {
      alert('Publish failed: ' + JSON.stringify(res));
    }
  } catch(e) { alert('Error: ' + e.message); }
}


/* ── WEEKLY ROSTER ── */
const CK_DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function _ckWeekSat(refDate) {
  // Returns the Saturday on or before refDate
  const d = new Date(refDate);
  const dow = d.getDay(); // 0=Sun … 6=Sat
  d.setDate(d.getDate() - ((dow + 1) % 7)); // back to Saturday
  return d;
}

function _ckFmtDMY(d) {
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function _ckParseDMY(s) {
  const [dd,mm,yy] = s.split('/');
  return new Date(+yy, +mm-1, +dd);
}

async function _ckWeeklyLoad() {
  if (!_ckState.weekSat) {
    _ckState.weekSat = _ckFmtDMY(_ckWeekSat(new Date()));
  }
  if (typeof _ckState.weekDayIdx !== 'number') _ckState.weekDayIdx = 0;

  document.getElementById('ckBody').innerHTML = `<div style="text-align:center;padding:40px;color:var(--ink-3)">Loading…</div>`;

  const satDate = _ckParseDMY(_ckState.weekSat);
  const weekDates = Array.from({length:7}, (_,i) => {
    const d = new Date(satDate); d.setDate(d.getDate()+i); return _ckFmtDMY(d);
  });
  _ckState.weekDates = weekDates;

  try {
    const [empRes, ...dayResults] = await Promise.all([
      fetch(`${API}/api/ops/roster/employees`).then(r=>r.json()),
      ...weekDates.map(d => fetch(`${API}/api/ops/roster/for-date?date=${encodeURIComponent(d)}`).then(r=>r.json())),
    ]);

    const pools = empRes.pools_by_outlet || {};
    _ckState.ck_pool = (pools['CK'] || []).sort((a,b)=>a.name.localeCompare(b.name));

    _ckState.shifts = [
      { shift_id: 'ck-morning', shift_name: 'Morning', start_time: '09:00', end_time: '17:00' },
      { shift_id: 'ck-mid',     shift_name: 'Mid',     start_time: '13:00', end_time: '21:00' },
      { shift_id: 'ck-evening', shift_name: 'Evening', start_time: '16:00', end_time: '00:00' },
    ];

    const _mapShift = s => s==='09:00'?'ck-morning':s==='13:00'?'ck-mid':s==='16:00'?'ck-evening':'ck-morning';

    // Build weekScheduled: date -> entries[]
    if (!_ckState.weekScheduled || _ckState.weekSatLoaded !== _ckState.weekSat) {
      _ckState.weekScheduled = {};
      weekDates.forEach((date, i) => {
        const ckIds = new Set(_ckState.ck_pool.map(e => e.employee_id));
        const existing = (dayResults[i].entries || []).filter(e => (e.outlet === 'CK' || e.outlet === 'WO') && ckIds.has(e.employee_id));
        _ckState.weekScheduled[date] = existing.map(e => ({
          employee_id: e.employee_id, employee_name: e.employee_name || '',
          outlet: e.outlet === 'WO' ? 'WO' : 'CK',
          shift: e.outlet==='WO' ? '' : _mapShift(e.start_time),
          start_time: e.outlet==='WO' ? '' : (e.start_time||'09:00'),
          end_time:   e.outlet==='WO' ? '' : (e.end_time||'17:00'),
        }));
      });
      _ckState.weekSatLoaded = _ckState.weekSat;
    }

    _ckWeeklyRender();
  } catch(e) {
    document.getElementById('ckBody').innerHTML = `<div style="color:var(--red);padding:20px">Error: ${e.message}</div>`;
  }
}

  // Week summary dots per day
  const dayTabs = weekDates.map((date,i) => {

      style="flex:1;min-width:0;padding:8px 4px;border:1.5px solid ${isActive?'var(--blue)':'var(--border-2)'};
             border-radius:8px;background:${isActive?'var(--blue-dim)':'#fff'};cursor:pointer;
             font-family:var(--sans);text-align:center;transition:all .12s">
      <div style="font-size:10px;font-weight:700;color:${isActive?'var(--blue)':'var(--ink-3)'};">${CK_DAY_NAMES[d.getDay()].slice(0,3)}</div>
      <div style="font-size:13px;font-weight:700;color:${isActive?'var(--blue)':'var(--ink)'};margin:2px 0">${d.getDate()}</div>

// Weekly helpers
function _ckWkShift(dir) {
  const d = _ckParseDMY(_ckState.weekSat);
  d.setDate(d.getDate() + dir*7);
  _ckState.weekSat = _ckFmtDMY(d);
  _ckState.weekScheduled = null;
  _ckState.weekDayIdx = 0;
  _ckWeeklyLoad();
}

function _ckWkSetShift(idx, shiftId) {
  const sh = _ckState.shifts.find(s=>s.shift_id===shiftId)||{};
  const e = _ckState.weekScheduled[_ckState.weekDates[_ckState.weekDayIdx]][idx];
  e.shift=shiftId; e.start_time=sh.start_time||''; e.end_time=sh.end_time||'';
  _ckWeeklyRender();
}

function _ckWkToggleWO(idx) {
  const entries = _ckState.weekScheduled[_ckState.weekDates[_ckState.weekDayIdx]];
  const e = entries[idx];
  if (e.outlet==='WO') {
    e.outlet='CK'; e.shift='ck-morning'; e.start_time='09:00'; e.end_time='17:00';
  } else {
    e.outlet='WO'; e.shift=''; e.start_time=''; e.end_time='';
  }
  _ckWeeklyRender();
}

function _ckWkRemove(idx) {
  _ckState.weekScheduled[_ckState.weekDates[_ckState.weekDayIdx]].splice(idx,1);
  _ckWeeklyRender();
}

function _ckWkAddEmp(eid) {
  const date = _ckState.weekDates[_ckState.weekDayIdx];
  if (!_ckState.weekScheduled[date]) _ckState.weekScheduled[date]=[];
  _ckState.weekScheduled[date].push({employee_id:eid,outlet:'CK',shift:'ck-morning',start_time:'09:00',end_time:'17:00'});
  _ckWeeklyRender();
}

function _ckWkAddWO(eid) {
  const date = _ckState.weekDates[_ckState.weekDayIdx];
  if (!_ckState.weekScheduled[date]) _ckState.weekScheduled[date]=[];
  _ckState.weekScheduled[date].push({employee_id:eid,outlet:'WO',shift:'',start_time:'',end_time:''});
  _ckWeeklyRender();
}

function _ckWkAutoFill() {
  const date = _ckState.weekDates[_ckState.weekDayIdx];
  _ckState.weekScheduled[date] = _ckState.ck_pool.map(emp=>({
    employee_id:emp.employee_id,outlet:'CK',shift:'ck-morning',start_time:'09:00',end_time:'17:00'
  }));
  _ckWeeklyRender();
}

async function _ckWkPublishDay() {
  const date = _ckState.weekDates[_ckState.weekDayIdx];
  const toPublish = (_ckState.weekScheduled[date]||[]).filter(e=>e.employee_id).map(e=>({...e,outlet:e.outlet||'CK'}));
  if (!toPublish.length) { alert('No entries for this day.'); return; }
  try {
    const res = await fetch(`${API}/api/ops/roster/publish`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({date, entries:toPublish}),
    }).then(r=>r.json());
    if (res.success) _showToast(`Published ${date} — ${res.published_count||res.published} entries ✓`);
    else alert('Publish failed: ' + JSON.stringify(res));
  } catch(e) { alert('Error: ' + e.message); }
}

async function _ckWkPublishAll() {
  const { weekDates, weekScheduled } = _ckState;
  const allEmpty = weekDates.every(d=>!(weekScheduled[d]||[]).length);
  if (allEmpty) { alert('No entries to publish for this week.'); return; }
  if (!confirm(`Publish roster for all 7 days?`)) return;

  let total=0, errors=[];
  for (const date of weekDates) {
    const toPublish = (weekScheduled[date]||[]).filter(e=>e.employee_id).map(e=>({...e,outlet:e.outlet||'CK'}));
    if (!toPublish.length) continue;
    try {
      const res = await fetch(`${API}/api/ops/roster/publish`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({date, entries:toPublish}),
      }).then(r=>r.json());
      if (res.success) total += (res.published_count||res.published||0);
      else errors.push(date);
    } catch(e) { errors.push(date); }
  }
  if (errors.length) _showToast(`Published ${total} entries. Failed days: ${errors.join(', ')}`);
  else _showToast(`Week published — ${total} entries ✓`);
}


/* ── FULL WEEK ROSTER ── */
let _wrState = {

const _WR_OUTLETS = ['WO','RR','SKN','KOR','WF','KLN','BLN','IND','ARK','HSR','RAJ','CK','PL','UPL'];
const _WR_DAY_ABBR = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function _wrFmtDMY(d) {
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function _wrParseDMY(s) {
  const [dd,mm,yy] = s.split('/'); return new Date(+yy,+mm-1,+dd);
}
function _wrMonday(ref) {
  const d = new Date(ref);
  const dow = d.getDay();
  d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
  return d;
}
function _wrShiftWeek(dir) {
  const d = _wrParseDMY(_wrState.weekStart);
  d.setDate(d.getDate() + dir * 7);
  _wrState.weekStart = _wrFmtDMY(d);
  _wrState.data = null;
  _wrState.dirty = {};
  if (_ckState.mode === 'staffview') _svLoad();
  else _wrWeeklyLoad();
}

async function _wrWeeklyLoad() {
  if (!_wrState.weekStart) {
    _wrState.weekStart = _wrFmtDMY(_wrMonday(new Date()));
  }
  const el = document.getElementById('ckBody');
  if (!el) return;
  el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--ink-3)"><span style="font-size:20px">⏳</span><br>Loading roster…</div>`;

  try {
    // Build 7 dates Mon–Sun
    const monDate = _wrParseDMY(_wrState.weekStart);
    const dates = Array.from({length:7}, (_,i) => {
      const d = new Date(monDate); d.setDate(monDate.getDate()+i); return _wrFmtDMY(d);
    });

    // Fetch actual saved entries for each day + shifts list
    const [shiftRes, ...dayResults] = await Promise.all([
      fetch(`${API}/api/admin/shifts`, {headers:{Authorization:`Bearer ${_lsToken}`}}).then(r=>r.json()),
      ...dates.map(date =>
        fetch(`${API}/api/ops/roster/for-date?date=${encodeURIComponent(date)}`, {headers:{Authorization:`Bearer ${_lsToken}`}}).then(r=>r.json())
      ),
    ]);

    _wrState.shifts = shiftRes.shifts || [];

    // Collect all unique employees across the week
    const empMap = {}; // id → name
    dayResults.forEach(res => {
      (res.entries || []).forEach(e => { empMap[e.employee_id] = e.employee_name || e.employee_id; });
    });

    // Build week structure matching generate-week shape
    const week = {};
    dates.forEach((date, i) => {
      const entries = (dayResults[i].entries || []);
      // Index by employee_id for fast lookup
      const byEmp = {};
      entries.forEach(e => { byEmp[e.employee_id] = e; });
      // Build full entry list for all known employees
      const allEntries = Object.keys(empMap).sort().map(eid => {
        const e = byEmp[eid] || {};
        return {
          employee_id:   eid,
          employee_name: empMap[eid],
          date,
          outlet:      e.outlet      || '',
          shift:       e.shift       || '',
          shift_name:  e.shift_name  || '',
          start_time:  e.start_time  || '',
          end_time:    e.end_time    || '',
          already_exists: !!byEmp[eid],
        };
      });
      week[date] = { day: _WR_DAY_ABBR[i], entries: allEntries };
    });

    _wrState.data  = { success: true, week_start: _wrState.weekStart, week };
    _wrState.dirty = {};
    _wrRender();
  } catch(e) {
    if (el) el.innerHTML = `<div style="color:var(--red);padding:20px">Error: ${e.message}</div>`;
  }
}

function _wrGetCell(empId, date) {
  const key = `${empId}_${date}`;
  if (_wrState.dirty[key]) return _wrState.dirty[key];
  const day = _wrState.data?.week?.[date];
  if (!day) return {outlet:'', shift:'', shift_name:'', start_time:'', end_time:''};
  const entry = day.entries.find(e => e.employee_id === empId);
  return entry || {outlet:'', shift:'', shift_name:'', start_time:'', end_time:''};
}

function _wrSetCell(empId, date, outlet, shiftId) {
  const key = `${empId}_${date}`;
  const sh = _wrState.shifts.find(s => s.shift_id === shiftId) || {};
  const day = _wrState.data?.week?.[date];
  const entry = day?.entries?.find(e => e.employee_id === empId) || {};
  _wrState.dirty[key] = {
    employee_id: empId,
    employee_name: entry.employee_name || '',
    date, outlet,
    shift: shiftId,
    shift_name: sh.shift_name || '',
    start_time: sh.start_time || '',
    end_time: sh.end_time || '',
  };
  _wrCloseEditor();
  _wrRender();
}

function _wrOpenEditor(empId, date) {
  _wrState.editCell = { empId, date };
  // Seed the editor's outlet so the shift list filters to that outlet immediately.
  _wrEditOutlet = _wrGetCell(empId, date).outlet || '';
  _wrEditShift  = _wrGetCell(empId, date).shift || '';
  _wrRender();
}

function _wrCloseEditor() {
  _wrState.editCell = null;
}

function _wrRender() {
  const el = document.getElementById('ckBody');
  if (!el || !_wrState.data) return;

  const { week, week_start } = _wrState.data;
  const dates = Object.keys(week).sort((a,b) => _wrParseDMY(a) - _wrParseDMY(b));

  const dirtyCount = Object.keys(_wrState.dirty).length;

  // Per-employee weekly totals
  const empTotals = {};
  employees.forEach(e => { empTotals[e.id] = { work: 0, wo: 0, pl: 0, upl: 0 }; });
  dates.forEach(date => {
    employees.forEach(e => {
      const c = _wrGetCell(e.id, date);
      const o = (c.outlet || '').toUpperCase();
      if (!empTotals[e.id]) empTotals[e.id] = { work: 0, wo: 0, pl: 0, upl: 0 };
      if (o === 'WO')       empTotals[e.id].wo++;
      else if (o === 'PL')  empTotals[e.id].pl++;
      else if (o === 'UPL') empTotals[e.id].upl++;
      else if (o)           empTotals[e.id].work++;
    });
  });

  // Week nav header
  const monDate = _wrParseDMY(dates[0]);
  const sunDate = _wrParseDMY(dates[6]);
  const fmtShort = d => `${d.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]}`;
  const weekLabel = `${fmtShort(monDate)} – ${fmtShort(sunDate)} ${sunDate.getFullYear()}`;

  // Build shifts grouped by outlet for quick lookup
  const shiftsByOutlet = {};
  _wrState.shifts.forEach(s => {
    const o = s.outlet_name || 'ALL';
    if (!shiftsByOutlet[o]) shiftsByOutlet[o] = [];
    shiftsByOutlet[o].push(s);
  });

  const outletColor = o => {
    if (!o || o === 'WO') return 'color:#6b7280;background:#f3f4f6';
    if (o === 'CK') return 'color:#92400e;background:#fef3c7';
    if (o === 'PL' || o === 'UPL') return 'color:#1e40af;background:#dbeafe';
    return 'color:#14532d;background:#dcfce7';
  };

  // Cell renderer
  const cellHtml = (empId, date) => {
    const c = _wrGetCell(empId, date);
    const isDirty = !!_wrState.dirty[`${empId}_${date}`];
    const isEditing = _wrState.editCell?.empId === empId && _wrState.editCell?.date === date;
    const outlet = c.outlet || '—';
    const shiftLabel = c.shift_name ? c.shift_name.replace(/\(.*\)/,'').trim() : (c.start_time ? `${c.start_time?.slice(0,5)}–${c.end_time?.slice(0,5)}` : '');

    if (isEditing) {
      // Shift options filtered to the currently-selected outlet (shifts with no
      // outlet_name are treated as universal). _wrEditOutlet tracks live edits.
      // SKN and KLN share shifts (both cloud kitchens).
      const curOutlet = _wrEditOutlet || c.outlet || '';
      const curShift  = _wrEditShift || c.shift;
      const relatedOutlets = (curOutlet === 'SKN') ? ['SKN', 'KLN'] : (curOutlet === 'KLN') ? ['KLN', 'SKN'] : [curOutlet];
      const allShifts = _wrState.shifts.filter(s => !s.outlet_name || relatedOutlets.includes(s.outlet_name));
      const shiftOpts = allShifts.map(s =>
        `<option value="${s.shift_id}" ${curShift===s.shift_id?'selected':''}>${s.shift_name} (${s.outlet_name||''})</option>`
      ).join('');
      const outletOpts = _WR_OUTLETS.map(o => `<option value="${o}" ${curOutlet===o?'selected':''}>${o}</option>`).join('');
      return `<td style="padding:4px;background:rgba(37,99,235,0.08);min-width:130px;position:relative">
        <div style="display:flex;flex-direction:column;gap:3px">

          <select onchange="_wrUpdateEdit(this,'shift')" style="font-size:10px;padding:3px 4px;border:1px solid var(--border-2);border-radius:4px;background:white;color:var(--ink);width:100%">
            <option value="">No shift</option>${shiftOpts}
          </select>
          <div style="display:flex;gap:3px;margin-top:2px">
            <button onclick="_wrSaveEdit('${empId}','${date}')" style="flex:1;padding:3px;font-size:10px;font-weight:700;background:#2563eb;color:white;border:none;border-radius:4px;cursor:pointer">Save</button>
            <button onclick="_wrCloseEditor();_wrRender()" style="padding:3px 6px;font-size:10px;background:#f3f4f6;color:var(--ink);border:1px solid var(--border-2);border-radius:4px;cursor:pointer">✕</button>
          </div>
        </div>
      </td>`;
    }

    return `<td onclick="_wrOpenEditor('${empId}','${date}')" style="padding:6px 8px;cursor:pointer;min-width:90px;border:1px solid transparent;border-radius:4px;transition:background .1s;${isDirty?'outline:2px solid #2563eb;':''}">
      <span style="display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;${outletColor(c.outlet)}">${outlet}</span>
      ${shiftLabel ? `<div style="font-size:9px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:85px">${shiftLabel}</div>` : ''}
    </td>`;
  };

  // Table
  const thStyle = 'padding:8px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);white-space:nowrap;border-bottom:2px solid var(--border-2);position:sticky;top:0;background:var(--surface);z-index:2';
  const dateHeaders = dates.map((d,i) => {
    const dObj = _wrParseDMY(d);

  const bodyRows = employees.map(emp => {
    const cells = dates.map(d => cellHtml(emp.id, d)).join('');
    const t = empTotals[emp.id] || { work:0, wo:0, pl:0, upl:0 };
    const tdSum = (v, col) => `<td style="padding:7px 10px;text-align:center;font-size:12px;font-weight:700;color:${col};border-bottom:1px solid var(--border)">${v || '—'}</td>`;
    return `<tr>
      <td style="padding:8px 12px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;border-bottom:1px solid var(--border);position:sticky;left:0;background:var(--surface);z-index:1">
        <span style="color:var(--ink-3);font-size:10px;margin-right:4px">${emp.id}</span>${emp.name}
      </td>
      ${cells}
      ${tdSum(t.work, '#15803d')}
      ${tdSum(t.wo,   '#6b7280')}
      ${tdSum(t.pl,   '#1d4ed8')}
      ${tdSum(t.upl,  '#7c3aed')}
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div style="padding:0 0 24px">
      <!-- Toolbar -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <button onclick="_wrShiftWeek(-1)" style="padding:6px 12px;background:var(--bg);border:1px solid var(--border-2);border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink-2)">‹</button>
        <span style="font-size:13px;font-weight:600;color:var(--ink);min-width:180px;text-align:center">${weekLabel}</span>
        <button onclick="_wrShiftWeek(1)" style="padding:6px 12px;background:var(--bg);border:1px solid var(--border-2);border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink-2)">›</button>
        <button onclick="_wrWeeklyLoad()" style="padding:6px 14px;background:var(--bg);border:1px solid var(--border-2);border-radius:6px;cursor:pointer;font-size:12px;color:var(--ink-2)">↺ Reload</button>

        <button onclick="_wrPublish()" style="padding:6px 18px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700">

        </button>
        <button onclick="_wrState.dirty={};_wrRender()" style="padding:6px 12px;background:var(--bg);border:1px solid var(--border-2);border-radius:6px;cursor:pointer;font-size:12px;color:var(--red)">Discard</button>

      </div>
      <!-- Grid -->
      <div style="overflow:auto;border:1px solid var(--border-2);border-radius:10px">
        <table style="border-collapse:collapse;width:100%;min-width:900px">
          <thead><tr>
            <th style="${thStyle};text-align:left;position:sticky;left:0;z-index:3;background:var(--surface)">Employee</th>
            ${dateHeaders}
            <th style="${thStyle};text-align:center;color:#15803d;position:sticky;right:0;z-index:3;background:var(--surface)">Work</th>
            <th style="${thStyle};text-align:center;color:#6b7280;background:var(--surface)">WO</th>
            <th style="${thStyle};text-align:center;color:#1d4ed8;background:var(--surface)">PL</th>
            <th style="${thStyle};text-align:center;color:#7c3aed;background:var(--surface)">UPL</th>
          </tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
      <div style="margin-top:8px;font-size:11px;color:var(--ink-3)">${employees.length} employees · ${dirtyCount > 0 ? `<span style="color:#2563eb;font-weight:600">${dirtyCount} unsaved change${dirtyCount>1?'s':''}</span>` : 'no unsaved changes'}</div>
    </div>`;
}

let _wrEditOutlet = '';
let _wrEditShift  = '';

function _wrUpdateEdit(sel, field) {
  if (field === 'outlet') {
    _wrEditOutlet = sel.value;
    // Drop a shift that doesn't belong to the newly chosen outlet, then
    // re-render so the shift dropdown shows only that outlet's shifts.
    const stillValid = _wrState.shifts.some(s =>
      s.shift_id === _wrEditShift && (!s.outlet_name || s.outlet_name === _wrEditOutlet));
    if (!stillValid) _wrEditShift = '';
    _wrRender();
  }
  if (field === 'shift')  _wrEditShift  = sel.value;
}

function _wrSaveEdit(empId, date) {
  const cell = document.querySelector(`td select[onchange*="outlet"]`);
  // read current dropdown values from the editing cell
  const outletSel = document.querySelector(`td select[onchange*="outlet"]`);
  const shiftSel  = document.querySelector(`td select[onchange*="shift"]`);
  const outlet = outletSel ? outletSel.value : (_wrState.editCell ? _wrGetCell(empId, date).outlet : '');
  const shiftId = shiftSel ? shiftSel.value : '';
  _wrSetCell(empId, date, outlet, shiftId);
}

async function _wrPublish() {
  if (!Object.keys(_wrState.dirty).length) return;
  const { week } = _wrState.data;
  const dates = Object.keys(week);

  // Build days payload: for each date, merge dirty cells over existing entries
  const days = {};
  dates.forEach(date => {
    const baseEntries = (week[date]?.entries || []).map(e => ({...e}));
    const merged = [];
    const removedIds = new Set();
    
    // First pass: identify removed entries and apply updates
    baseEntries.forEach(e => {
      const key = `${e.employee_id}_${date}`;
      const dirty = _wrState.dirty[key];
      
      if (dirty) {
        if (dirty._action === 'remove') {
          removedIds.add(e.employee_id);
          return; // Skip this entry (remove it)
        }
        // Apply update (merge dirty over existing)
        merged.push({ ...e, ...dirty });
      } else {
        merged.push(e);
      }
    });
    
    // Second pass: add new entries
    Object.entries(_wrState.dirty).forEach(([key, dirty]) => {
      if (dirty._action === 'add' && dirty.date === date) {
        // Check if this employee already exists in merged (shouldn't happen if removed properly)
        if (!removedIds.has(dirty.employee_id) && !merged.find(e => e.employee_id === dirty.employee_id)) {
          merged.push({
            employee_id: dirty.employee_id,
            employee_name: dirty.employee_name || dirty.employee_id,
            date: date,
            outlet: dirty.outlet,
            shift: dirty.shift,
            shift_name: dirty.shift_name,
            start_time: dirty.start_time,
            end_time: dirty.end_time,
          });
        }
      }
    });
    
    days[date] = merged;
  });

  const btn = document.querySelector('button[onclick="_wrPublish()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Publishing…'; }

  try {
    const res = await fetch(`${API}/api/admin/roster/publish-week`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${_lsToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ week_start: _wrState.weekStart, days, overwrite: true }),
    }).then(r => r.json());

    if (res.success) {
      _showToast(`✅ Roster published — ${res.total_published || ''} entries saved`);
      _wrState.dirty = {};
      _wrState.data = null;
      _wrWeeklyLoad();
    } else {
      _showToast('Publish failed: ' + (res.detail || JSON.stringify(res)));
    }
  } catch(e) {
    _showToast('Error: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

      } else {

  }).join('');

  const outletLabel = o => {
    const map = {WO:'Week Off',RR:'Residency Rd',SKN:'Sahakarnagar',KOR:'Koramangala',WF:'Whitefield',KLN:'Kalyan Nagar',BLN:'Bellandur',IND:'Indiranagar',ARK:'Arekere',HSR:'HSR Layout',RAJ:'Rajajinagar',CK:'Central Kitchen',PL:'Paid Leave',UPL:'Unpaid Leave'};
    return map[o] || o;
  };

  // Get all employees for add dropdown
  const allEmployees = [];
  dates.forEach(date => {
    (week[date]?.entries || []).forEach(e => {
      if (!allEmployees.find(emp => emp.employee_id === e.employee_id)) {
        allEmployees.push({ employee_id: e.employee_id, name: e.employee_name || e.employee_id });
      }
    });
  });
  allEmployees.sort((a,b) => a.name.localeCompare(b.name));

  // Cell renderer for outlet staff view
  const cellHtml = (outlet, date) => {
    const staff = outletDayStaff[outlet]?.[date] || [];
    const isEditing = _wrState.editCell?.outlet === outlet && _wrState.editCell?.date === date;

    if (isEditing) {
      const curOutlet = _wrEditOutlet || outlet;
      const curShift = _wrEditShift || '';
      const allShifts = _svGetShiftsForOutlet(curOutlet);
      const shiftOpts = allShifts.map(s =>
        `<option value="${s.shift_id}" ${curShift===s.shift_id?'selected':''}>${s.shift_name} (${s.outlet_name||''})</option>`
      ).join('');
      const outletOpts = _WR_OUTLETS.map(o => `<option value="${o}" ${curOutlet===o?'selected':''}>${o}</option>`).join('');
      
      // Build staff list with remove buttons
      const staffList = staff.map((s, idx) => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:11px;font-weight:600">${escHtml(s.name)}</span>
          <button onclick="_svRemoveStaff('${outlet}','${date}','${s.employee_id}')" style="padding:2px 6px;font-size:10px;background:var(--red-dim);color:var(--red);border:1px solid var(--red);border-radius:4px;cursor:pointer">✕</button>
        </div>
      `).join('');
      
      // Build add employee dropdown (exclude already assigned)
      const assignedIds = new Set(staff.map(s => s.employee_id));
      const addOpts = allEmployees.filter(e => !assignedIds.has(e.employee_id)).map(e => 
        `<option value="${e.employee_id}">${escHtml(e.name)}</option>`
      ).join('');
      
      return `<td style="padding:4px;background:rgba(37,99,235,0.08);min-width:180px;position:relative;border-bottom:1px solid var(--border);border-right:1px solid var(--border)">
        <div style="display:flex;flex-direction:column;gap:3px">
          ${staffList ? `<div style="max-height:120px;overflow-y:auto;margin-bottom:4px">${staffList}</div>` : '<div style="font-size:11px;color:var(--ink-3);padding:4px 0">No staff assigned</div>'}
          <div style="border-top:1px solid var(--border);padding-top:4px;margin-top:2px">
            <div style="font-size:10px;font-weight:700;color:var(--ink-3);margin-bottom:2px">ADD STAFF</div>
            <select id="sv-add-emp-${outlet}-${date}" style="font-size:11px;padding:3px 4px;border:1px solid var(--border-2);border-radius:4px;background:white;color:var(--ink);width:100%;margin-bottom:3px">
              <option value="">Select employee...</option>
              ${addOpts}
            </select>
            <select onchange="_wrUpdateEdit(this,'outlet')" style="font-size:11px;padding:3px 4px;border:1px solid var(--border-2);border-radius:4px;background:white;color:var(--ink);width:100%;margin-bottom:3px">
              <option value="">Select outlet...</option>
              ${outletOpts}
            </select>
            <select onchange="_wrUpdateEdit(this,'shift')" style="font-size:10px;padding:3px 4px;border:1px solid var(--border-2);border-radius:4px;background:white;color:var(--ink);width:100%;margin-bottom:3px">
              <option value="">Select shift...</option>
              ${shiftOpts}
            </select>
          </div>
          <div style="display:flex;gap:3px;margin-top:2px">
            <button onclick="_svAddStaff('${outlet}','${date}')" style="flex:1;padding:3px;font-size:10px;font-weight:700;background:#16a34a;color:white;border:none;border-radius:4px;cursor:pointer">+ Add</button>
            <button onclick="_svSaveAll('${outlet}','${date}')" style="flex:1;padding:3px;font-size:10px;font-weight:700;background:#2563eb;color:white;border:none;border-radius:4px;cursor:pointer">Save</button>
            <button onclick="_wrCloseEditor();_svRender()" style="padding:3px 6px;font-size:10px;background:#f3f4f6;color:var(--ink);border:1px solid var(--border-2);border-radius:4px;cursor:pointer">✕</button>
          </div>
        </div>
      </td>`;
    }

    if (!staff.length) {
      const hasDirtyAdd = Object.values(_wrState.dirty).some(d => d._action === 'add' && d.date === date && (d.outlet || '').toUpperCase() === outlet);
      return `<td onclick="_svOpenEditor('${outlet}','${date}')" style="padding:6px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:${hasDirtyAdd ? '#dcfce7' : '#fafafa'};cursor:pointer;min-width:90px;border:1px solid transparent;border-radius:4px;transition:background .1s">
        <span style="color:var(--ink-3);font-size:11px">${hasDirtyAdd ? '✓ Added' : '—'}</span>
      </td>`;
    }

    const hasDirtyChanges = staff.some(s => {
      const key = `${s.employee_id}_${date}`;
      return _wrState.dirty[key] && !_wrState.dirty[key]._action;
    });
    const hasDirtyRemove = staff.some(s => {
      const key = `${s.employee_id}_${date}`;
      return _wrState.dirty[key] && _wrState.dirty[key]._action === 'remove';
    });

    const chips = staff.filter(s => {
      const key = `${s.employee_id}_${date}`;
      const dirty = _wrState.dirty[key];
      return !dirty || dirty._action !== 'remove';
    }).map(s => {
      const key = `${s.employee_id}_${date}`;
      const dirty = _wrState.dirty[key];
      const shift = s.shift_name ? s.shift_name.replace(/\(.*\)/,'').trim() : (s.start_time ? `${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}` : '');
      const dirtyShift = dirty && !dirty._action ? (dirty.shift_name ? dirty.shift_name.replace(/\(.*\)/,'').trim() : (dirty.start_time ? `${dirty.start_time.slice(0,5)}–${dirty.end_time.slice(0,5)}` : '')) : '';
      return `<div style="margin-bottom:3px"><span style="font-size:11px;font-weight:600;color:var(--ink)">${escHtml(s.name)}</span>${dirtyShift ? `<span style="font-size:9px;color:#2563eb;margin-left:4px;font-weight:600">${escHtml(dirtyShift)}*</span>` : (shift ? `<span style="font-size:9px;color:var(--ink-3);margin-left:4px">${escHtml(shift)}</span>` : '')}</div>`;
    }).join('');
    return `<td onclick="_svOpenEditor('${outlet}','${date}')" style="padding:6px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:top;cursor:pointer;min-width:90px;border:1px solid transparent;border-radius:4px;transition:background .1s;${hasDirtyChanges || hasDirtyRemove ? 'outline:2px solid #2563eb;' : ''}">
      ${chips}
      ${hasDirtyRemove ? `<div style="font-size:9px;color:var(--red);font-style:italic">Removed staff pending</div>` : ''}
    </td>`;
  };

  const bodyRows = outlets.map(outlet => {
    const cells = dates.map(date => cellHtml(outlet, date)).join('');

    // Total unique staff across the week
    const allStaff = new Set();
    dates.forEach(d => (outletDayStaff[outlet]?.[d] || []).forEach(s => allStaff.add(s.name)));

    return `<tr>
      <td style="padding:8px 12px;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;border-bottom:1px solid var(--border);border-right:1px solid var(--border-2);position:sticky;left:0;background:var(--surface);z-index:1">
        <div style="font-size:13px">${escHtml(outlet)}</div>
        <div style="font-size:10px;color:var(--ink-3);font-weight:400">${escHtml(outletLabel(outlet))}</div>
        <div style="margin-top:4px"><span style="font-size:10px;background:#dcfce7;color:#14532d;padding:1px 6px;border-radius:10px;font-weight:600">${allStaff.size} staff</span></div>
      </td>
      ${cells}
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div style="padding:0 0 24px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <button onclick="_wrShiftWeek(-1)" style="padding:6px 12px;background:var(--bg);border:1px solid var(--border-2);border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink-2)">‹</button>
        <span style="font-size:13px;font-weight:600;color:var(--ink);min-width:180px;text-align:center">${weekLabel}</span>
        <button onclick="_wrShiftWeek(1)" style="padding:6px 12px;background:var(--bg);border:1px solid var(--border-2);border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink-2)">›</button>
        <button onclick="_wrState.data=null;_svLoad()" style="padding:6px 14px;background:var(--bg);border:1px solid var(--border-2);border-radius:6px;cursor:pointer;font-size:12px;color:var(--ink-2)">↺ Reload</button>
        ${dirtyCount > 0 ? `
        <button onclick="_wrPublish()" style="padding:6px 18px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700">
          💾 Publish ${dirtyCount} change${dirtyCount>1?'s':''}
        </button>
        <button onclick="_wrState.dirty={};_svRender()" style="padding:6px 12px;background:var(--bg);border:1px solid var(--border-2);border-radius:6px;cursor:pointer;font-size:12px;color:var(--red)">Discard</button>
        ` : `<span style="font-size:12px;color:var(--ink-3)">Click any cell to edit</span>`}
      </div>
      <div style="overflow:auto;border:1px solid var(--border-2);border-radius:10px">
        <table style="border-collapse:collapse;width:100%;min-width:900px">
          <thead><tr>
            <th style="${thStyle};text-align:left;position:sticky;left:0;z-index:3;background:var(--surface);min-width:130px">Outlet</th>
            ${dateHeaders}
          </tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
      <div style="margin-top:8px;font-size:11px;color:var(--ink-3)">${outlets.length} outlets · ${dirtyCount > 0 ? `<span style="color:#2563eb;font-weight:600">${dirtyCount} unsaved change${dirtyCount>1?'s':''}</span>` : 'no unsaved changes'}</div>
    </div>`;
}

function _svOpenEditor(outlet, date) {
  _wrState.editCell = { outlet, date };
  _wrEditOutlet = outlet;
  _wrEditShift = '';
  _svRender();
}

function _svRemoveStaff(outlet, date, employeeId) {
  // Mark this employee as removed for this date (set to empty/removed)
  const key = `${employeeId}_${date}`;
  _wrState.dirty[key] = {
    employee_id: employeeId,
    date: date,
    outlet: '',
    shift: '',
    shift_name: '',
    start_time: '',
    end_time: '',
    _action: 'remove'
  };
  _svRender();
}

function _svAddStaff(outlet, date) {
  const empSel = document.getElementById(`sv-add-emp-${outlet}-${date}`);
  const outletSel = document.querySelector('td select[onchange*="outlet"]');
  const shiftSel = document.querySelector('td select[onchange*="shift"]');
  
  const empId = empSel ? empSel.value : '';
  const newOutlet = outletSel ? outletSel.value : outlet;
  const shiftId = shiftSel ? shiftSel.value : '';
  
  if (!empId) {
    alert('Please select an employee');
    return;
  }
  
  const sh = _wrState.shifts.find(s => s.shift_id === shiftId) || {};
  const emp = _wrState.data.week[date]?.entries?.find(e => e.employee_id === empId);
  
  const key = `${empId}_${date}`;
  _wrState.dirty[key] = {
    employee_id: empId,
    employee_name: emp ? emp.employee_name : empId,
    date: date,
    outlet: newOutlet,
    shift: shiftId,
    shift_name: sh.shift_name || '',
    start_time: sh.start_time || '',
    end_time: sh.end_time || '',
    _action: 'add'
  };
  
  // Reset selections
  if (empSel) empSel.value = '';
  _svRender();
}

function _svSaveAll(outlet, date) {
  // Apply all dirty changes for this date
  _wrCloseEditor();
  _svRender();
}

function _svSaveEdit(outlet, date) {
  // Legacy function - now handled by _svAddStaff and _svRemoveStaff
  _wrCloseEditor();
  _svRender();
}

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
}

function setStat(id, text, color) {
  const el = document.getElementById('hstat-' + id);
  if (!el) return;
  el.textContent = text;
  el.style.color = color || 'var(--ink-3)';
}

function isoDate(d) {
  return d.toISOString().slice(0, 10);
}

async function loadHomeSummaries() {
  _homeContext = {};
  const today = new Date();
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const twoDaysAgo = new Date(today); twoDaysAgo.setDate(today.getDate() - 2);

  // ── Power ──
  try {
    const d = await fetch(`${API}/api/power/live`).then(r=>r.json());
    const outlets = d.outlets || [];
    const offline = outlets.filter(o => o.swiggy_aod?.color==='red' || o.swiggy_fc?.color==='red' || o.zomato?.color==='red');
    if (offline.length > 0) setStat('power', `${offline.length} of ${outlets.length} outlets have platform issues`, 'var(--red)');
    else setStat('power', `All ${outlets.length} outlets online`, 'var(--green)');
    _homeContext.power = `Power status: ${offline.length} of ${outlets.length} outlets have issues. ${offline.length ? 'Affected: ' + offline.map(o=>`${o.outlet}(swiggy_aod:${o.swiggy_aod?.label} swiggy_fc:${o.swiggy_fc?.label} zomato:${o.zomato?.label})`).join(', ') : 'All online.'}`;
  } catch { setStat('power','—'); }

  // ── Late Sign-In (yesterday) ──
  try {
    const yStr = isoDate(yesterday);
    const d = await fetch(
      `${API}/api/admin/attendance-late-report?start_date=${yStr}&end_date=${yStr}`,
      { headers: _lsToken ? { 'Authorization': `Bearer ${_lsToken}` } : {} }
    ).then(r=>r.json());
    const records = (d.records||[]).filter(r => !/^wo$/i.test(r.outlet||'') && r.type !== 'missed_signout');
    const late    = records.filter(r => r.type === 'late');
    const absent  = records.filter(r => r.type === 'missed_signin');
    const parts = [];
    if (late.length)   parts.push(`${late.length} late`);
    if (absent.length) parts.push(`${absent.length} no sign-in`);
    if (parts.length) {
      setStat('signin', `Yesterday: ${parts.join(', ')}`, 'var(--amber)');
    } else {
      setStat('signin', 'Yesterday: all on time', 'var(--green)');
    }
    const lateNames  = late.map(r  => `${r.employee_name}(${r.outlet})`).join(', ');
    const absentNames= absent.map(r=> `${r.employee_name}(${r.outlet})`).join(', ');
    _homeContext.signin = `Yesterday attendance (${yStr}): ${late.length} late${lateNames?' — '+lateNames:''}, ${absent.length} missed sign-in${absentNames?' — '+absentNames:''}.`;
  } catch { setStat('signin', '—'); _homeContext.signin = 'Late sign-in data unavailable (login required).'; }

  // ── Platform Metrics ──
  try {
    const d = await fetch(`${API}/api/metrics/kpt_mfr?window=1`).then(r=>r.json());
    const outlets = d.outlets || [];
    const avg = (arr) => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : '—';
    const swKpts = outlets.map(o=>o.swiggy_kpt).filter(v=>v!=null);
    const swMfrs = outlets.map(o=>o.swiggy_mfr).filter(v=>v!=null);
    const zmKpts = outlets.map(o=>o.zomato_kpt).filter(v=>v!=null);
    const zmMfrs = outlets.map(o=>o.zomato_mfr).filter(v=>v!=null);
    const lines = [
      `Swiggy KPT avg ${avg(swKpts)} min · MFR avg ${avg(swMfrs)}%`,
      `Zomato KPT avg ${avg(zmKpts)} min · MFR avg ${avg(zmMfrs)}%`,
    ];
    setStat('metrics', lines.join('  |  '));
    const perOutlet = outlets.map(o=>`${o.outlet}: SW KPT=${o.swiggy_kpt??'—'} MFR=${o.swiggy_mfr??'—'} | ZM KPT=${o.zomato_kpt??'—'} MFR=${o.zomato_mfr??'—'}`).join('\n');
    _homeContext.metrics = `Platform metrics (period: ${d.swiggy_period||'latest'}):\n${perOutlet}\nAvg: Swiggy KPT=${avg(swKpts)} MFR=${avg(swMfrs)}% | Zomato KPT=${avg(zmKpts)} MFR=${avg(zmMfrs)}%`;
  } catch { setStat('metrics','—'); }

  // ── Employee Dashboard — bottom 5 ──
  try {
    const d = await fetch(`${API}/api/admin/employee-scorecard`, {
      headers: _lsToken ? { 'Authorization': `Bearer ${_lsToken}` } : {}
    }).then(r=>r.json());
    const sc = (d.scorecards || d.employees || []);
    const sorted = [...sc].sort((a,b) => (a.total_orders||0) - (b.total_orders||0));
    const bottom5 = sorted.slice(0, 5);
    if (bottom5.length) {
      setStat('scorecard', `Bottom 5: ${bottom5.map(e=>e.name?.split(' ')[0]||e.employee_id).join(', ')}`, 'var(--amber)');
    } else {
      setStat('scorecard', `${sc.length} employees tracked`);
    }
    _homeContext.scorecard = `Employee scorecard (${sc.length} employees). Bottom 5 by orders: ${bottom5.map(e=>`${e.name}(${e.employee_id}) ${e.total_orders} orders`).join(', ')}.`;
  } catch { setStat('scorecard','—'); }

  // ── Ratings ──
  try {
    const d = await fetch(`${API}/api/admin/outlet-ratings-summary`, { headers: { 'Authorization': `Bearer ${_lsToken}` } }).then(r=>r.json());
    const outlets = d.outlets||[];
    const avgs = outlets.map(o=>parseFloat(o.avg_rating||o.rating||0)).filter(v=>v>0);
    const avg = avgs.length ? (avgs.reduce((a,b)=>a+b,0)/avgs.length).toFixed(2) : null;
    setStat('ratings', avg ? `Avg rating ${avg} across ${outlets.length} outlets` : `${outlets.length} outlets`);
    _homeContext.ratings = `Outlet ratings: avg ${avg} across ${outlets.length} outlets. Per outlet: ${outlets.map(o=>`${o.outlet||o.name} ${o.avg_rating||o.rating}`).join(', ')}.`;
  } catch { setStat('ratings','—'); }

  // ── OOS — live Rista sold-out (critical SKUs only) ──
  try {
    const d = await fetch(`${API}/api/inventory/oos`).then(r=>r.json());
    const items = [];
    (d.outlets||[]).forEach(o => {
      (o.oos_items||[]).forEach(it => {
        items.push({ outlet: o.outlet, item: it.name, sku: it.sku });
      });
    });
    // group by outlet+item
    const groups = {};
    items.forEach(i => {
      const key = `${i.outlet}|${i.item||i.sku}`;
      groups[key] = (groups[key]||0) + 1;
    });
    const unique = Object.keys(groups);
    if (unique.length > 0) {
      setStat('stock', `${unique.length} OOS item${unique.length>1?'s':''}: ${unique.slice(0,3).map(k=>k.split('|')[1]).join(', ')}${unique.length>3?'…':''}`, 'var(--red)');
    } else {
      setStat('stock', 'All items in stock', 'var(--green)');
    }
    _homeContext.stock = `Out of stock (${unique.length} items): ${unique.map(k=>{ const [o,it]=k.split('|'); return `${it} @ ${o}`; }).join(', ')}.`;
  } catch { setStat('stock','—'); }

  // ── Daily Recon — last 2 days ──
  try {
    const d = await fetch(`${API}/api/ops/daily-recon`).then(r=>r.json());
    const rows = (d.rows||[]);
    const sorted = [...rows].sort((a,b) => (b.date||'').localeCompare(a.date||''));
    const last2 = sorted.slice(0, 2);
    if (last2.length) {
      const summaries = last2.map(r => {
        const diff = parseFloat(r.diff)||0;
        const color = diff < -500 ? 'var(--red)' : diff > 500 ? 'var(--amber)' : 'var(--green)';
        return `${r.date} ${r.outlet||''}: diff ₹${diff.toFixed(0)}`;
      });
      setStat('recon', summaries.join('  ·  '), last2.some(r=>(parseFloat(r.diff)||0)<-500)?'var(--red)':'var(--ink-3)');
      _homeContext.recon = `Daily recon last 2 days:\n${last2.map(r=>`${r.date} ${r.outlet}: cash=${r.cash} bharatpe=${r.bharatpe} swiggy=${r.swiggy} zomato=${r.zomato} total=${r.total} rista=${r.rista} diff=${r.diff} closing_balance=${r.closing_balance}`).join('\n')}`;
    } else {
      setStat('recon', 'No recon data');
    }
  } catch { setStat('recon','—'); }

  // ── CK Roster ──
  try {
    const todayDMY = [String(today.getDate()).padStart(2,'0'),String(today.getMonth()+1).padStart(2,'0'),today.getFullYear()].join('/');
    const d = await fetch(`${API}/api/ops/roster/for-date?date=${encodeURIComponent(todayDMY)}`).then(r=>r.json());
    const ck = (d.entries||[]).filter(e=>(e.outlet||'').toUpperCase()==='CK');
    const wo = (d.entries||[]).filter(e=>(e.outlet||'').toUpperCase()==='WO');
    setStat('roster', ck.length ? `${ck.length} CK staff on roster` : 'No CK roster today');
    _homeContext.roster = `CK Kitchen Roster today: ${ck.length} staff on shift: ${ck.map(e=>e.name||e.employee_id).join(', ')||'none'}. ${wo.length} on week-off: ${wo.map(e=>e.name||e.employee_id).join(', ')||'none'}.`;
  } catch { setStat('roster','—'); }

  // ── Products ──
  try {
    const yStr = isoDate(yesterday);
    const pr = await fetch(`${API}/api/admin/product-rankings?date_from=${yStr}&date_to=${yStr}`,
      { headers: _lsToken ? { 'Authorization': `Bearer ${_lsToken}` } : {} }
    ).then(r=>r.json());
    const items = (pr.products || []).filter(p => (p.online_orders||0) >= 10);
    if (items.length) {
      const top3 = items.slice(0, 3).map(p => `${p.name} (${p.net_pct??p.high_pct}%)`).join(', ');
      const bot3 = items.slice(-3).reverse().map(p => `${p.name} (${p.error_pct??0}% err)`).join(', ');
      setStat('products', `Top: ${top3}`);
      _homeContext.products = `Product rankings yesterday (≥10 orders, ${items.length} items):\nTop 3 by net rating: ${items.slice(0,3).map(p=>`${p.name}: ${p.online_orders} orders, net ${p.net_pct??p.high_pct}%, high ${p.high_pct}%, error ${p.error_pct}%`).join('; ')}\nBottom 3: ${items.slice(-3).reverse().map(p=>`${p.name}: ${p.online_orders} orders, net ${p.net_pct??p.high_pct}%, error ${p.error_pct}%`).join('; ')}`;
    } else {
      setStat('products', 'No product data (yesterday)');
    }
  } catch { setStat('products', '—'); }

  // ── Power Yesterday (outage summary) ──
  try {
    const ps = await fetch(`${API}/api/power/summary`).then(r=>r.json());
    const outlets = ps.outlets || {};
    const withYest = Object.entries(outlets).filter(([,o]) => (o.yesterday_mins||0) > 0);
    if (withYest.length) {
      const worst = withYest.sort((a,b) => (b[1].yesterday_mins||0) - (a[1].yesterday_mins||0));
      const parts = worst.slice(0,3).map(([name,o]) => `${name} ${o.yesterday_fmt}`).join(', ');
      setStat('power', `Yesterday power cuts: ${parts}${worst.length>3?' +more':''}`, 'var(--amber)');
      const allYest = worst.map(([name,o]) => `${name}: ${o.yesterday_fmt} (${o.yesterday_mins}m)`).join(', ');
      _homeContext.power = (_homeContext.power || '') + `\nYesterday power cuts: ${allYest}`;
    }
  } catch {}
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSend');
  const text = (input.value || '').trim();
  if (!text) return;

  input.value = '';
  input.style.height = '38px';
  sendBtn.disabled = true;

  appendChatMsg('user', text);
  _chatHistory.push({ role: 'user', content: text });

  const typingEl = document.createElement('div');
  typingEl.className = 'chat-msg bot';
  typingEl.id = 'chatTyping';
  typingEl.innerHTML = `<div class="chat-msg-label">Ops Assistant</div><div class="chat-typing"><span></span><span></span><span></span></div>`;
  document.getElementById('chatMessages').appendChild(typingEl);
  scrollChat();

  try {

      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: _chatHistory, system: buildChatSystemPrompt() }),

let _briefResult = null;

/* ── Brief persistence ── */
const BRIEF_STORE_KEY = 'zaan_briefs_v1';
const BRIEF_MAX_DAYS  = 14;

function _briefTodayKey() {
  const d = new Date(); d.setDate(d.getDate() - 1); // keyed by ops-date (yesterday)
  return d.toISOString().split('T')[0];
}

function _briefSave(data) {
  try {
    const store = JSON.parse(localStorage.getItem(BRIEF_STORE_KEY) || '{}');
    const key = _briefTodayKey();
    store[key] = { data, savedAt: new Date().toISOString() };
    // Prune old entries
    const keys = Object.keys(store).sort().reverse();
    keys.slice(BRIEF_MAX_DAYS).forEach(k => delete store[k]);
    localStorage.setItem(BRIEF_STORE_KEY, JSON.stringify(store));
  } catch(e) {}
}

function _briefLoad(dateKey) {
  try {
    const store = JSON.parse(localStorage.getItem(BRIEF_STORE_KEY) || '{}');
    return store[dateKey]?.data || null;
  } catch(e) { return null; }
}

function _briefDates() {
  try {
    return Object.keys(JSON.parse(localStorage.getItem(BRIEF_STORE_KEY) || '{}')).sort().reverse();
  } catch(e) { return []; }
}

function _renderBriefSidebar(logs) {
  // logs may be empty (pre-generation) or partial
  const rows = BRIEF_SECTIONS.map(sec => {
    const log = logs.find(l => l.section === sec);
    let icon = '·', cls = 'brief-log-pending', detail = '—';
    if (log) {
      if (log.status === 'ok') { icon = '✓'; cls = 'brief-log-ok'; detail = log.detail || 'ok'; }
      else { icon = '✗'; cls = 'brief-log-err'; detail = log.detail || 'error'; }
    }
    return `<div class="brief-log-row">
      <span class="brief-log-icon ${cls}">${icon}</span>
      <span class="brief-log-info">
        <span class="brief-log-section ${cls}">${escHtml(sec)}</span>
        <span class="brief-log-detail">${escHtml(detail)}</span>
      </span>
    </div>`;
  }).join('');

  const ok  = logs.filter(l=>l.status==='ok').length;
  const err = logs.filter(l=>l.status!=='ok').length;
  const summaryColor = err ? 'var(--red)' : (ok ? 'var(--green)' : 'var(--ink-3)');
  const summaryText  = logs.length ? `${ok}/${logs.length}${err?' · '+err+' err':''}` : 'pending';

  return `
    <div class="brief-sidebar">
      <div class="brief-sidebar-head">
        Data Sources
        <span class="brief-sidebar-summary" style="color:${summaryColor}">${summaryText}</span>
      </div>
      ${rows}
    </div>`;
}
