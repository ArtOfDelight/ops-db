function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
}

function setStat(id, text, color) {
  const el = document.getElementById('hstat-' + id);
  if (!el) return;
  el.textContent = text;
  el.style.color = color || 'var(--ink-3)';
}

function isoDate(d) {
  return d.toISOString().slice(0, 10);
}

async function loadHomeSummaries() {
  _homeContext = {};
  const today = new Date();
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const twoDaysAgo = new Date(today); twoDaysAgo.setDate(today.getDate() - 2);

  // ── Power ──
  try {
    const d = await fetch(`${API}/api/power/live`).then(r=>r.json());
    const outlets = d.outlets || [];
    const offline = outlets.filter(o => o.swiggy_aod?.color==='red' || o.swiggy_fc?.color==='red' || o.zomato?.color==='red');
    if (offline.length > 0) setStat('power', `${offline.length} of ${outlets.length} outlets have platform issues`, 'var(--red)');
    else setStat('power', `All ${outlets.length} outlets online`, 'var(--green)');
    _homeContext.power = `Power status: ${offline.length} of ${outlets.length} outlets have issues. ${offline.length ? 'Affected: ' + offline.map(o=>`${o.outlet}(swiggy_aod:${o.swiggy_aod?.label} swiggy_fc:${o.swiggy_fc?.label} zomato:${o.zomato?.label})`).join(', ') : 'All online.'}`;
  } catch { setStat('power','—'); }

  // ── Late Sign-In (yesterday) ──
  try {
    const yStr = isoDate(yesterday);
    const d = await fetch(
      `${LS_API}/api/admin/attendance-late-report?start_date=${yStr}&end_date=${yStr}`,
      { headers: _lsToken ? { 'Authorization': `Bearer ${_lsToken}` } : {} }
    ).then(r=>r.json());
    const records = (d.records||[]).filter(r => !/^wo$/i.test(r.outlet||'') && r.type !== 'missed_signout');
    const late    = records.filter(r => r.type === 'late');
    const absent  = records.filter(r => r.type === 'missed_signin');
    const parts = [];
    if (late.length)   parts.push(`${late.length} late`);
    if (absent.length) parts.push(`${absent.length} no sign-in`);
    if (parts.length) {
      setStat('signin', `Yesterday: ${parts.join(', ')}`, 'var(--amber)');
    } else {
      setStat('signin', 'Yesterday: all on time', 'var(--green)');
    }
    const lateNames  = late.map(r  => `${r.employee_name}(${r.outlet})`).join(', ');
    const absentNames= absent.map(r=> `${r.employee_name}(${r.outlet})`).join(', ');
    _homeContext.signin = `Yesterday attendance (${yStr}): ${late.length} late${lateNames?' — '+lateNames:''}, ${absent.length} missed sign-in${absentNames?' — '+absentNames:''}.`;
  } catch { setStat('signin', '—'); _homeContext.signin = 'Late sign-in data unavailable (login required).'; }

  // ── Platform Metrics ──
  try {
    const d = await fetch(`${API}/api/metrics/kpt_mfr?window=1`).then(r=>r.json());
    const outlets = d.outlets || [];
    const avg = (arr) => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : '—';
    const swKpts = outlets.map(o=>o.swiggy_kpt).filter(v=>v!=null);
    const swMfrs = outlets.map(o=>o.swiggy_mfr).filter(v=>v!=null);
    const zmKpts = outlets.map(o=>o.zomato_kpt).filter(v=>v!=null);
    const zmMfrs = outlets.map(o=>o.zomato_mfr).filter(v=>v!=null);
    const lines = [
      `Swiggy KPT avg ${avg(swKpts)} min · MFR avg ${avg(swMfrs)}%`,
      `Zomato KPT avg ${avg(zmKpts)} min · MFR avg ${avg(zmMfrs)}%`,
    ];
    setStat('metrics', lines.join('  |  '));
    const perOutlet = outlets.map(o=>`${o.outlet}: SW KPT=${o.swiggy_kpt??'—'} MFR=${o.swiggy_mfr??'—'} | ZM KPT=${o.zomato_kpt??'—'} MFR=${o.zomato_mfr??'—'}`).join('\n');
    _homeContext.metrics = `Platform metrics (period: ${d.swiggy_period||'latest'}):\n${perOutlet}\nAvg: Swiggy KPT=${avg(swKpts)} MFR=${avg(swMfrs)}% | Zomato KPT=${avg(zmKpts)} MFR=${avg(zmMfrs)}%`;
  } catch { setStat('metrics','—'); }

  // ── Employee Dashboard — bottom 5 ──
  try {
    const d = await fetch(`${LS_API}/api/admin/employee-scorecard`, {
      headers: _lsToken ? { 'Authorization': `Bearer ${_lsToken}` } : {}
    }).then(r=>r.json());
    const sc = (d.scorecards || d.employees || []);
    const sorted = [...sc].sort((a,b) => (a.total_orders||0) - (b.total_orders||0));
    const bottom5 = sorted.slice(0, 5);
    if (bottom5.length) {
      setStat('scorecard', `Bottom 5: ${bottom5.map(e=>e.name?.split(' ')[0]||e.employee_id).join(', ')}`, 'var(--amber)');
    } else {
      setStat('scorecard', `${sc.length} employees tracked`);
    }
    _homeContext.scorecard = `Employee scorecard (${sc.length} employees). Bottom 5 by orders: ${bottom5.map(e=>`${e.name}(${e.employee_id}) ${e.total_orders} orders`).join(', ')}.`;
  } catch { setStat('scorecard','—'); }

  // ── Ratings ──
  try {
    const d = await fetch(`${API}/api/admin/outlet-ratings-summary`).then(r=>r.json());
    const outlets = d.outlets||[];
    const avgs = outlets.map(o=>parseFloat(o.avg_rating||o.rating||0)).filter(v=>v>0);
    const avg = avgs.length ? (avgs.reduce((a,b)=>a+b,0)/avgs.length).toFixed(2) : null;
    setStat('ratings', avg ? `Avg rating ${avg} across ${outlets.length} outlets` : `${outlets.length} outlets`);
    _homeContext.ratings = `Outlet ratings: avg ${avg} across ${outlets.length} outlets. Per outlet: ${outlets.map(o=>`${o.outlet||o.name} ${o.avg_rating||o.rating}`).join(', ')}.`;
  } catch { setStat('ratings','—'); }

  // ── OOS — same outlet+product ──
  try {
    const d = await fetch(`${API}/api/inventory/live`).then(r=>r.json());
    const items = (d.items||[]).filter(i=>(i.status||'').toUpperCase().includes('OUT'));
    // group by outlet+item
    const groups = {};
    items.forEach(i => {
      const key = `${i.outlet}|${i.item||i.sku}`;
      groups[key] = (groups[key]||0) + 1;
    });
    const unique = Object.keys(groups);
    if (unique.length > 0) {
      setStat('stock', `${unique.length} OOS item${unique.length>1?'s':''}: ${unique.slice(0,3).map(k=>k.split('|')[1]).join(', ')}${unique.length>3?'…':''}`, 'var(--red)');
    } else {
      setStat('stock', 'All items in stock', 'var(--green)');
    }
    _homeContext.stock = `Out of stock (${unique.length} items): ${unique.map(k=>{ const [o,it]=k.split('|'); return `${it} @ ${o}`; }).join(', ')}.`;
  } catch { setStat('stock','—'); }

  // ── Daily Recon — last 2 days ──
  try {
    const d = await fetch(`${API}/api/ops/daily-recon`).then(r=>r.json());
    const rows = (d.rows||[]);
    const sorted = [...rows].sort((a,b) => (b.date||'').localeCompare(a.date||''));
    const last2 = sorted.slice(0, 2);
    if (last2.length) {
      const summaries = last2.map(r => {
        const diff = parseFloat(r.diff)||0;
        const color = diff < -500 ? 'var(--red)' : diff > 500 ? 'var(--amber)' : 'var(--green)';
        return `${r.date} ${r.outlet||''}: diff ₹${diff.toFixed(0)}`;
      });
      setStat('recon', summaries.join('  ·  '), last2.some(r=>(parseFloat(r.diff)||0)<-500)?'var(--red)':'var(--ink-3)');
      _homeContext.recon = `Daily recon last 2 days:\n${last2.map(r=>`${r.date} ${r.outlet}: cash=${r.cash} bharatpe=${r.bharatpe} swiggy=${r.swiggy} zomato=${r.zomato} total=${r.total} rista=${r.rista} diff=${r.diff} closing_balance=${r.closing_balance}`).join('\n')}`;
    } else {
      setStat('recon', 'No recon data');
    }
  } catch { setStat('recon','—'); }

  // ── CK Roster ──
  try {
    const todayDMY = [String(today.getDate()).padStart(2,'0'),String(today.getMonth()+1).padStart(2,'0'),today.getFullYear()].join('/');
    const d = await fetch(`${API}/api/ops/roster/for-date?date=${encodeURIComponent(todayDMY)}`).then(r=>r.json());
    const ck = (d.entries||[]).filter(e=>(e.outlet||'').toUpperCase()==='CK');
    const wo = (d.entries||[]).filter(e=>(e.outlet||'').toUpperCase()==='WO');
    setStat('roster', ck.length ? `${ck.length} CK staff on roster` : 'No CK roster today');
    _homeContext.roster = `CK Kitchen Roster today: ${ck.length} staff on shift: ${ck.map(e=>e.name||e.employee_id).join(', ')||'none'}. ${wo.length} on week-off: ${wo.map(e=>e.name||e.employee_id).join(', ')||'none'}.`;
  } catch { setStat('roster','—'); }

  // ── Products ──
  setStat('products', 'Top & bottom items by revenue');
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSend');
  const text = (input.value || '').trim();
  if (!text) return;

  input.value = '';
  input.style.height = '38px';
  sendBtn.disabled = true;

  appendChatMsg('user', text);
  _chatHistory.push({ role: 'user', content: text });

  const typingEl = document.createElement('div');
  typingEl.className = 'chat-msg bot';
  typingEl.id = 'chatTyping';
  typingEl.innerHTML = `<div class="chat-msg-label">Ops Assistant</div><div class="chat-typing"><span></span><span></span><span></span></div>`;
  document.getElementById('chatMessages').appendChild(typingEl);
  scrollChat();

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: _chatHistory, system: buildChatSystemPrompt() }),
    });
    const data = await res.json();
    const reply = data.reply || data.error || 'Something went wrong.';
    _chatHistory.push({ role: 'assistant', content: reply });
    document.getElementById('chatTyping')?.remove();
    appendChatMsg('bot', reply);
  } catch(e) {
    document.getElementById('chatTyping')?.remove();
    appendChatMsg('bot', 'Error reaching the server. Please try again.');
  }

  sendBtn.disabled = false;
  input.focus();
}

function appendChatMsg(role, text) {
  const wrap = document.getElementById('chatMessages');
  if (!wrap) return;
  const label = role === 'user' ? 'You' : 'Ops Assistant';
  const div = document.createElement('div');
  div.className = `chat-msg ${role}`;
  div.innerHTML = `<div class="chat-msg-label">${label}</div><div class="chat-bubble">${text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`;
  wrap.appendChild(div);
  scrollChat();
}

function scrollChat() {
  const wrap = document.getElementById('chatMessages');
  if (wrap) wrap.scrollTop = wrap.scrollHeight;
}

  'Daily Recon','RR Recon',
];

function _renderBriefSidebar(logs) {
  // logs may be empty (pre-generation) or partial
  const rows = BRIEF_SECTIONS.map(sec => {
    const log = logs.find(l => l.section === sec);
    let icon = '·', cls = 'brief-log-pending', detail = '—';
    if (log) {
      if (log.status === 'ok') { icon = '✓'; cls = 'brief-log-ok'; detail = log.detail || 'ok'; }
      else { icon = '✗'; cls = 'brief-log-err'; detail = log.detail || 'error'; }
    }
    return `<div class="brief-log-row">
      <span class="brief-log-icon ${cls}">${icon}</span>
      <span class="brief-log-info">
        <span class="brief-log-section ${cls}">${escHtml(sec)}</span>
        <span class="brief-log-detail">${escHtml(detail)}</span>
      </span>
    </div>`;
  }).join('');

  const ok  = logs.filter(l=>l.status==='ok').length;
  const err = logs.filter(l=>l.status!=='ok').length;
  const summaryColor = err ? 'var(--red)' : (ok ? 'var(--green)' : 'var(--ink-3)');
  const summaryText  = logs.length ? `${ok}/${logs.length}${err?' · '+err+' err':''}` : 'pending';

  return `
    <div class="brief-sidebar">
      <div class="brief-sidebar-head">
        Data Sources
        <span class="brief-sidebar-summary" style="color:${summaryColor}">${summaryText}</span>
      </div>
      ${rows}
    </div>`;
}

async function generateBrief() {
  const btn = document.getElementById('briefGenBtn');
  const body = document.getElementById('briefBody');
  btn.disabled = true;
  document.getElementById('briefGenIcon').textContent = '⏳';

  body.innerHTML = `
    <div class="brief-loading">
      <div id="briefProgressMsg" style="font-size:12px;color:var(--ink-3)">Gathering live data from all sections…</div>
      <div class="brief-progress"><div class="brief-progress-fill" id="briefProgressFill" style="width:0%"></div></div>
    </div>`;

  briefProgress(10, 'Sending to server…');

  try {
    const today = new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    briefProgress(30, 'Server gathering live data…');
    const res = await fetch(`${API}/api/daily-brief`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ date: today }),
    });
    briefProgress(90, 'Generating brief with Claude…');
    const data = await res.json();
    briefProgress(100, 'Done');
    _briefResult = data;
    renderBriefResult(data);
  } catch(e) {
    body.innerHTML = `<div style="color:var(--red);padding:20px 0;font-size:13px">Failed to generate brief: ${e.message}</div>`;
  }
  btn.disabled = false;
  document.getElementById('briefGenIcon').textContent = '📋';
}

function renderBriefResult(data) {
  const body = document.getElementById('briefBody');
  if (!body) return;
  const brief = data.brief || '';
  const actions = data.actions || [];
  const logs = data.logs || [];

  // Update the always-visible sidebar
  const sidebar = document.getElementById('briefSidebar');
  if (sidebar) sidebar.innerHTML = _renderBriefSidebar(logs);

  // Load checked state from localStorage
  const storageKey = 'briefChecked_' + new Date().toISOString().slice(0,10);
  let checked = {};
  try { checked = JSON.parse(localStorage.getItem(storageKey)||'{}'); } catch{}

  const actionItems = actions.map((a, i) => {
    const isDone = !!checked[i];
    const pri = (a.priority||'low').toLowerCase();
    return `
    <div class="action-item${isDone?' action-done':''}" id="action-item-${i}" onclick="toggleAction(${i},'${storageKey}')">
      <div class="action-check${isDone?' action-check-done':''}">
        ${isDone ? '✓' : ''}
      </div>
      <div class="action-content">
        <div class="action-top">
          <span class="pri-${pri}">${a.priority||'Low'}</span>
          <span class="action-area">${escHtml(a.area||'')}</span>
          <span class="action-due">${escHtml(a.due||'Today')}</span>
        </div>
        <div class="action-text">${escHtml(a.action||'')}</div>
        <div class="action-owner">${escHtml(a.owner||'Ops Manager')}</div>
      </div>
    </div>`;
  }).join('');

  // Parse brief text into named sections
  const SECTION_ICONS = {
    'power': '⚡', 'late sign': '🕐', 'platform': '📊', 'employee': '👥',
    'outlet ratings': '⭐', 'product': '🍽️', 'out of stock': '📦',
    'oos tracker': '🔴', 'daily recon': '💰', 'rr recon': '🏦',
    'ck roster': '🍳', 'priority alerts': '🚨', 'notable': '📈',
  };
  function secIcon(title) {
    const t = title.toLowerCase();
    for (const [k,v] of Object.entries(SECTION_ICONS)) if (t.includes(k)) return v;
    return '•';
  }
  function secColor(title) {
    const t = title.toLowerCase();
    if (t.includes('priority') || t.includes('alert')) return 'var(--red)';
    if (t.includes('notable') || t.includes('change')) return 'var(--blue)';
    return 'var(--ink)';
  }

  // Split on lines that look like "Section Name —" or "Section Name\n"
  const sectionBlocks = [];
  const lines = brief.split('\n');
  let curTitle = '', curLines = [];
  for (const line of lines) {
    const isHeader = /^[A-Z][A-Za-z0-9\s\-\/]+$/.test(line.trim()) && line.trim().length > 3 && line.trim().length < 60;
    if (isHeader && curLines.join('').trim()) {
      sectionBlocks.push({ title: curTitle, body: curLines.join('\n').trim() });
      curTitle = line.trim(); curLines = [];
    } else if (isHeader && !curLines.join('').trim()) {
      curTitle = line.trim();
    } else {
      curLines.push(line);
    }
  }
  if (curLines.join('').trim()) sectionBlocks.push({ title: curTitle, body: curLines.join('\n').trim() });

  function bodyToHtml(bodyText) {
    const lines = bodyText.split('\n').map(l => l.trim()).filter(Boolean);
    const bullets = lines.filter(l => l.startsWith('- ') || l.startsWith('• '));
    if (bullets.length > 0) {
      // Render all as bullet list; non-bullet lines become their own bullet
      return '<ul class="brief-bullets">' +
        lines.map(l => {
          const text = l.startsWith('- ') ? l.slice(2) : l.startsWith('• ') ? l.slice(2) : l;
          return `<li>${escHtml(text)}</li>`;
        }).join('') +
        '</ul>';
    }
    // Fallback: split on '. ' to make bullets from prose
    const sentences = bodyText.split(/(?<=\.)\s+/).map(s => s.trim()).filter(Boolean);
    if (sentences.length > 1) {
      return '<ul class="brief-bullets">' + sentences.map(s => `<li>${escHtml(s)}</li>`).join('') + '</ul>';
    }
    return `<p class="brief-para">${escHtml(bodyText)}</p>`;
  }

  const sectionCards = sectionBlocks.map(s => {
    if (!s.body) return '';
    const icon = secIcon(s.title);
    const col  = secColor(s.title);
    const isPriority = s.title.toLowerCase().includes('priority') || s.title.toLowerCase().includes('alert');
    return `
    <div class="brief-section-card${isPriority?' brief-section-alert':''}">
      ${s.title ? `<div class="brief-section-title" style="color:${col}">${icon} ${escHtml(s.title)}</div>` : ''}
      <div class="brief-section-body">${bodyToHtml(s.body)}</div>
    </div>`;
  }).join('');

  const sectionsHtml = sectionCards || `<div class="brief-output" style="white-space:pre-wrap">${escHtml(brief)}</div>`;

  body.innerHTML = `
    <div class="brief-sections">${sectionsHtml}</div>
    ${actions.length ? `
    <div style="margin-top:24px">
      <div class="inv-section-head">📌 Action List</div>
      <div class="action-list">${actionItems}</div>
    </div>` : ''}`;
}

/* ── BRIEF CHATBOT ── */
let _bcHistory = [];  // kept to last 6 turns to limit tokens

function _bcContext() {
  // Use the already-fetched brief as context — free, no extra API calls
  if (_briefResult?.brief) {
    const b = _briefResult.brief;
    // Trim to ~1400 chars to keep system prompt lean
    return b.length > 1400 ? b.slice(0, 1400) + '\n[…truncated]' : b;
  }
  return null;
}

function _bcSystem() {
  const ctx = _bcContext();
  const today = new Date().toLocaleDateString('en-IN', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const base = `You are an ops assistant for Zaān Restaurants, a cloud kitchen chain in Bangalore. Today is ${today}. Answer concisely in 2-5 bullet points max. Use ₹ for currency. If data is unavailable say so briefly.`;
  if (ctx) return `${base}\n\nLIVE OPS DATA (today's brief):\n${ctx}`;
  return `${base}\n\nNo brief generated yet — answer from general ops knowledge or ask the user to generate the brief first.`;
}

function bcAppend(role, text) {
  const wrap = document.getElementById('bcMsgs');
  if (!wrap) return;
  const hint = wrap.querySelector('.bc-hint');
  if (hint) hint.remove();
  const d = document.createElement('div');
  d.className = `bc-msg ${role}`;
  const label = role === 'user' ? 'You' : 'Assistant';
  d.innerHTML = `<div class="bc-label">${label}</div><div class="bc-bubble">${escHtml(text)}</div>`;
  wrap.appendChild(d);
  wrap.scrollTop = wrap.scrollHeight;
}

async function bcSend() {
  const inp  = document.getElementById('bcInput');
  const btn  = document.getElementById('bcSend');
  const wrap = document.getElementById('bcMsgs');
  const text = (inp?.value || '').trim();
  if (!text || !wrap) return;

  inp.value = '';
  btn.disabled = true;
  bcAppend('user', text);

  // Keep only last 6 turns (3 exchanges) to limit token use
  _bcHistory.push({ role: 'user', content: text });
  if (_bcHistory.length > 6) _bcHistory = _bcHistory.slice(-6);

  // Typing indicator
  const typing = document.createElement('div');
  typing.className = 'bc-msg bot'; typing.id = 'bcTyping';
  typing.innerHTML = '<div class="bc-label">Assistant</div><div class="bc-bubble"><div class="bc-typing"><span></span><span></span><span></span></div></div>';
  wrap.appendChild(typing);
  wrap.scrollTop = wrap.scrollHeight;

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: _bcHistory, system: _bcSystem() }),
    });
    const data = await res.json();
    const reply = data.reply || data.error || 'Something went wrong.';
    _bcHistory.push({ role: 'assistant', content: reply });
    if (_bcHistory.length > 6) _bcHistory = _bcHistory.slice(-6);
    document.getElementById('bcTyping')?.remove();
    bcAppend('bot', reply);
  } catch(e) {
    document.getElementById('bcTyping')?.remove();
    bcAppend('bot', 'Network error. Please try again.');
  }
  btn.disabled = false;
  inp?.focus();
}

function toggleAction(idx, storageKey) {
  let checked = {};
  try { checked = JSON.parse(localStorage.getItem(storageKey)||'{}'); } catch{}
  checked[idx] = !checked[idx];
  localStorage.setItem(storageKey, JSON.stringify(checked));
  const item = document.getElementById(`action-item-${idx}`);
  const chk  = item && item.querySelector('.action-check');
  if (item) item.classList.toggle('action-done', !!checked[idx]);
  if (chk)  { chk.classList.toggle('action-check-done', !!checked[idx]); chk.textContent = checked[idx] ? '✓' : ''; }
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function gatherBriefContext() {
  const ctx = {};
  const today = new Date();
  const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
  const sevenDaysAgo = new Date(today); sevenDaysAgo.setDate(today.getDate()-7);
  const yStr  = isoDate(yesterday);
  const w7Str = isoDate(sevenDaysAgo);
  const tStr  = isoDate(today);

  briefProgress(5, 'Power status…');
  try {
    const [live, summary] = await Promise.all([
      fetch(`${API}/api/power/live`).then(r=>r.json()),
      fetch(`${API}/api/power/summary`).then(r=>r.json()),
    ]);
    const outlets = live.outlets||[];
    const offline = outlets.filter(o=>o.swiggy_aod?.color==='red'||o.swiggy_fc?.color==='red'||o.zomato?.color==='red');
    const sumData = summary.outlets||{};
    const worst7 = Object.entries(sumData).sort((a,b)=>b[1].last_7_days_mins-a[1].last_7_days_mins)[0];
    const total28 = Object.values(sumData).reduce((s,o)=>s+o.last_28_days_mins,0);
    ctx.power = `POWER STATUS\nOffline now (${offline.length}): ${offline.map(o=>`${o.outlet} (${[o.swiggy_aod?.color==='red'?'Swiggy AOD':'',o.swiggy_fc?.color==='red'?'Swiggy FC':'',o.zomato?.color==='red'?'Zomato':''].filter(Boolean).join('+')})`).join(', ')||'None'}\n7-day worst: ${worst7?`${worst7[0]} at ${worst7[1].last_7_days_fmt}`:'—'}\n28-day total op-hours lost: ${Math.floor(total28/60)}h ${total28%60}m`;
  } catch(e) { ctx.power = 'Power data unavailable.'; }

  briefProgress(18, 'Late sign-ins…');
  try {
    const [yd, w7] = await Promise.all([
      fetch(`${LS_API}/api/admin/attendance-late-report?start_date=${yStr}&end_date=${yStr}`, {headers:_lsToken?{Authorization:`Bearer ${_lsToken}`}:{}}).then(r=>r.json()),
      fetch(`${LS_API}/api/admin/attendance-late-report?start_date=${w7Str}&end_date=${yStr}`, {headers:_lsToken?{Authorization:`Bearer ${_lsToken}`}:{}}).then(r=>r.json()),
    ]);
    const filt = recs => (recs||[]).filter(r=>!/^wo$/i.test(r.outlet||'')&&r.type!=='missed_signout');
    const ydR = filt(yd.records); const w7R = filt(w7.records);
    const byEmp = {}; w7R.forEach(r=>{ const k=r.employee_id; if(!byEmp[k]) byEmp[k]={name:r.employee_name,outlet:r.outlet,late:0,missed:0}; if(r.type==='late') byEmp[k].late++; else byEmp[k].missed++; });
    const top5 = Object.values(byEmp).sort((a,b)=>(b.late+b.missed)-(a.late+a.missed)).slice(0,5);
    ctx.signin = `LATE SIGN-IN\nYesterday (${yStr}): ${ydR.filter(r=>r.type==='late').length} late, ${ydR.filter(r=>r.type==='missed_signin').length} missed — ${ydR.map(r=>`${r.employee_name}(${r.outlet},${r.type})`).join(', ')||'none'}\n7-day (${w7Str} to ${yStr}): ${w7R.filter(r=>r.type==='late').length} late, ${w7R.filter(r=>r.type==='missed_signin').length} missed across ${Object.keys(byEmp).length} employees\nTop offenders 7d: ${top5.map(e=>`${e.name}(${e.outlet}, ${e.late}L+${e.missed}M)`).join(', ')}`;
  } catch { ctx.signin = 'Late sign-in data unavailable (admin login required).'; }

  briefProgress(32, 'Platform metrics…');
  try {
    const d = await fetch(`${API}/api/metrics/kpt_mfr?window=7`).then(r=>r.json());
    const outlets = d.outlets||[];
    const avg = arr => arr.filter(v=>v!=null).length ? (arr.filter(v=>v!=null).reduce((a,b)=>a+b,0)/arr.filter(v=>v!=null).length).toFixed(1) : '—';
    ctx.metrics = `PLATFORM METRICS (7-day, ${d.swiggy_period||'latest'})\n`+outlets.map(o=>`${o.outlet}: Swiggy KPT=${o.swiggy_kpt??'—'} MFR=${o.swiggy_mfr??'—'}% | Zomato KPT=${o.zomato_kpt??'—'} MFR=${o.zomato_mfr??'—'}%`).join('\n')+`\nAvg: Swiggy KPT=${avg(outlets.map(o=>o.swiggy_kpt))} MFR=${avg(outlets.map(o=>o.swiggy_mfr))}% | Zomato KPT=${avg(outlets.map(o=>o.zomato_kpt))} MFR=${avg(outlets.map(o=>o.zomato_mfr))}%`;
  } catch { ctx.metrics = 'Platform metrics unavailable.'; }

  briefProgress(44, 'Employee scorecard…');
  try {
    const d = await fetch(`${LS_API}/api/admin/employee-scorecard?week_start=${w7Str}&week_end=${yStr}`, {headers:_lsToken?{Authorization:`Bearer ${_lsToken}`}:{}}).then(r=>r.json());
    const sc = (d.scorecards||d.employees||[]).sort((a,b)=>(b.total_orders||0)-(a.total_orders||0));
    ctx.scorecard = `EMPLOYEE DASHBOARD (7-day)\nTop 5: ${sc.slice(0,5).map(e=>`${e.name} ${e.total_orders} orders / ${e.high_rated||0} high-rated`).join(', ')}\nBottom 5: ${sc.slice(-5).map(e=>`${e.name} ${e.total_orders} orders`).join(', ')}`;
  } catch { ctx.scorecard = 'Employee scorecard unavailable.'; }

  briefProgress(54, 'Outlet ratings…');
  try {
    const d = await fetch(`${API}/api/admin/outlet-ratings-summary?date_from=${w7Str}&date_to=${tStr}`).then(r=>r.json());
    const outlets = (d.outlets||[]).sort((a,b)=>(parseFloat(b.avg_rating||b.rating)||0)-(parseFloat(a.avg_rating||a.rating)||0));
    ctx.ratings = `OUTLET RATINGS (7-day)\nBest: ${outlets.slice(0,3).map(o=>`${o.outlet||o.name} ${o.avg_rating||o.rating}%`).join(', ')}\nWorst: ${outlets.slice(-3).map(o=>`${o.outlet||o.name} ${o.avg_rating||o.rating}%`).join(', ')}\nAll: ${outlets.map(o=>`${o.outlet||o.name}=${o.avg_rating||o.rating}%`).join(', ')}`;
  } catch { ctx.ratings = 'Ratings unavailable.'; }

  briefProgress(62, 'Out of stock…');
  try {
    const d = await fetch(`${API}/api/inventory/live`).then(r=>r.json());
    const oos = (d.items||[]).filter(i=>(i.status||'').toUpperCase().includes('OUT'));
    const byOutlet = {}; oos.forEach(i=>{ byOutlet[i.outlet]=(byOutlet[i.outlet]||[]); byOutlet[i.outlet].push(i.item||i.sku); });
    ctx.stock = `OUT OF STOCK NOW\nTotal: ${oos.length} items across ${Object.keys(byOutlet).length} outlets\n`+Object.entries(byOutlet).sort((a,b)=>b[1].length-a[1].length).map(([o,items])=>`${o} (${items.length}): ${items.slice(0,5).join(', ')}${items.length>5?'…':''}`).join('\n');
  } catch { ctx.stock = 'OOS data unavailable.'; }

  briefProgress(70, 'OOS tracker…');
  try {
    const d = await fetch(`${API}/api/inventory/tracker?days=7`).then(r=>r.json());
    const evts = d.events||[]; const byOutlet={};
    evts.forEach(e=>{ byOutlet[e.outlet]=(byOutlet[e.outlet]||0)+1; });
    const sorted = Object.entries(byOutlet).sort((a,b)=>b[1]-a[1]);
    ctx.tracker = `OOS TRACKER (7-day)\nTotal events: ${evts.length}\nWorst outlets: ${sorted.slice(0,5).map(([o,c])=>`${o}(${c})`).join(', ')}`;
  } catch { ctx.tracker = 'OOS tracker unavailable.'; }

  briefProgress(78, 'Daily recon…');
  try {
    const d = await fetch(`${API}/api/ops/daily-recon`).then(r=>r.json());
    const rows = (d.rows||[]).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,14);
    const totalDiff = rows.reduce((s,r)=>s+(parseFloat(r.diff)||0),0);
    const gaps = rows.filter(r=>(parseFloat(r.diff)||0)<-200).sort((a,b)=>(parseFloat(a.diff)||0)-(parseFloat(b.diff)||0));
    ctx.recon = `DAILY RECON (last 7 days)\nNet variance: ₹${totalDiff.toFixed(0)} (${totalDiff<0?'deficit':'surplus'})\nBiggest gaps: ${gaps.slice(0,4).map(r=>`${r.outlet} ${r.date} ₹${parseFloat(r.diff||0).toFixed(0)}`).join(', ')||'None'}\nAll rows: ${rows.map(r=>`${r.outlet} ${r.date}: cash=${r.cash} swiggy=${r.swiggy} zomato=${r.zomato} diff=${r.diff}`).join(' | ')}`;
  } catch { ctx.recon = 'Recon data unavailable.'; }

  briefProgress(86, 'RR recon…');
  try {
    const d = await fetch(`${API}/api/ops/rr-recon`).then(r=>r.json());
    const rows = (d.rows||[]).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,7);
    const flags = rows.filter(r=>Math.abs(parseFloat(r.difference||0))>10);
    ctx.rrrecon = `RR RECON (last 7 days)\nFlags (|diff|>₹10): ${flags.map(r=>`${r.date} diff=₹${parseFloat(r.difference||0).toFixed(0)}`).join(', ')||'None'}`;
  } catch { ctx.rrrecon = 'RR recon unavailable.'; }

  briefProgress(92, 'CK Roster…');
  try {
    const d = await fetch(`${API}/api/ops/roster/ck`).then(r=>r.json());
    const ck = (d.entries||[]).filter(e=>e.outlet==='CK');
    const wo = (d.entries||[]).filter(e=>e.outlet==='WO');
    ctx.roster = `CK ROSTER TODAY\n${ck.length} staff on shift: ${ck.map(e=>e.name||e.employee_id).join(', ')}\n${wo.length} on week-off: ${wo.map(e=>e.name||e.employee_id).join(', ')||'None'}`;
  } catch { ctx.roster = 'CK roster unavailable.'; }

  briefProgress(97, 'Compiling…');
  return Object.values(ctx).join('\n\n');
}
