    const btn = document.getElementById('trtab-' + d);
    if (btn) btn.classList.toggle('active', d === days);
  });
  const fmt = d => d.toISOString().split('T')[0];
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  const s = id => document.getElementById(id);
  let aStart, aEnd, bStart, bEnd;
  if (days === 1) {
    // 1D: yesterday vs same day last week (7 days before)
    aStart = aEnd = new Date(yesterday);
    bStart = bEnd = new Date(yesterday); bStart.setDate(yesterday.getDate() - 7); bEnd = new Date(bStart);
  } else {
    // 7D: last 7 days vs the 7 days before that
    aEnd   = new Date(yesterday);
    aStart = new Date(yesterday); aStart.setDate(aEnd.getDate() - 6);
    bEnd   = new Date(aStart); bEnd.setDate(aStart.getDate() - 1);
    bStart = new Date(bEnd);   bStart.setDate(bEnd.getDate() - 6);
  }
  if (s('tr-a-start')) s('tr-a-start').value = fmt(aStart);
  if (s('tr-a-end'))   s('tr-a-end').value   = fmt(aEnd);
  if (s('tr-b-start')) s('tr-b-start').value = fmt(bStart);
  if (s('tr-b-end'))   s('tr-b-end').value   = fmt(bEnd);
  trLoad();
}

async function trLoad() {
  const s = id => document.getElementById(id)?.value;
  const aFrom = s('tr-a-start'), aTo = s('tr-a-end');
  const bFrom = s('tr-b-start'), bTo = s('tr-b-end');
  if (!aFrom || !aTo || !bFrom || !bTo) return;
  const el = document.getElementById('tr-content');
  if (el) el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading both periods…</div>';
  const statusEl = document.getElementById('tr-status');
  try {
    const fetchPeriod = async (from, to) => {
      const r = await fetch(`https://aodapp-backend.onrender.com/api/admin/product-rankings?date_from=${from}&date_to=${to}`,
        { headers: { 'Authorization': `Bearer ${_orToken}` } });
      if (r.status === 401 || r.status === 403) { lsLogout(); renderProductsPage(); throw new Error('auth'); }
      return (await r.json()).products || [];
    };
    const [pA, pB] = await Promise.all([fetchPeriod(aFrom, aTo), fetchPeriod(bFrom, bTo)]);
    // Build lookup by product name
    const mapB = {};
    pB.forEach(p => { mapB[p.product] = p; });
    // Only show products that have ratings in at least one period
    const allNames = [...new Set([...pA.map(p=>p.product), ...pB.map(p=>p.product)])];
    const rows = allNames.map(name => {
      const a = pA.find(p=>p.product===name) || { high_rated:0, low_rated:0, total_rated:0, online_orders:0, category:'' };
      const b = mapB[name]                   || { high_rated:0, low_rated:0, total_rated:0, online_orders:0, category:'' };
      return {
        product:   name,
        category:  a.category || b.category || '',
        aHigh: a.high_rated, aLow: a.low_rated, aTotal: a.total_rated, aOrders: a.online_orders,
        bHigh: b.high_rated, bLow: b.low_rated, bTotal: b.total_rated, bOrders: b.online_orders,
        dHigh: a.high_rated - b.high_rated,
        dLow:  a.low_rated  - b.low_rated,
        dTotal: a.total_rated - b.total_rated,
        dOrders: a.online_orders - b.online_orders,
      };
    }).filter(r => r.aTotal > 0 || r.bTotal > 0)
      .sort((a,b) => b.aOrders - a.aOrders);

    if (statusEl) statusEl.textContent = `${rows.length} products · A: ${aFrom}→${aTo} · B: ${bFrom}→${bTo}`;
    trRenderTable(rows, aFrom, aTo, bFrom, bTo, el);
  } catch(e) {
    if (e.message !== 'auth' && el)
      el.innerHTML = '<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Failed to load</div><div class="state-body">'+e+'</div></div>';
  }
}

function trRenderTable(rows, aFrom, aTo, bFrom, bTo, el) {
  if (!rows.length) { el.innerHTML = '<div class="no-outages" style="padding:40px">No rated data for these ranges.</div>'; return; }
  const thBase = 'padding:9px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--border-2);white-space:nowrap;font-family:var(--mono);color:var(--ink-3)';
  const thC = `${thBase};text-align:center`;
  const thL = `${thBase};text-align:left`;
  const tdL = v => `<td style="padding:9px 12px;font-size:12px;border-bottom:1px solid var(--border);color:var(--ink)">${v}</td>`;
  const tdN = v => `<td style="padding:9px 12px;text-align:center;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);color:var(--ink)">${v}</td>`;
  const tdD = (v, base) => {
    const cls = v > 0 ? 'color:#16a34a;font-weight:700' : v < 0 ? 'color:#dc2626;font-weight:700' : 'color:var(--ink-3)';
    const sym = v > 0 ? '▲' : v < 0 ? '▼' : '—';
    const pct = base > 0 ? Math.round(Math.abs(v) / base * 100) : null;
    const pctStr = pct !== null ? `<span style="font-size:10px;opacity:.8"> ${pct}%</span>` : '';
    const val = v !== 0 ? `${sym} ${Math.abs(v)}${pctStr}` : '—';
    return `<td style="padding:9px 12px;text-align:center;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);${cls}">${val}</td>`;
  };
  const thead = `<thead>
    <tr>
      <th style="${thL}" rowspan="2">#</th>
      <th style="${thL}" rowspan="2">Product</th>
      <th style="${thL}" rowspan="2">Category</th>
      <th style="${thC};background:#eff6ff;border-left:2px solid var(--blue)" colspan="3">Period A · ${aFrom} → ${aTo}</th>
      <th style="${thC};background:#f0fdf4;border-left:2px solid var(--green)" colspan="3">Period B · ${bFrom} → ${bTo}</th>
      <th style="${thC};background:#faf5ff;border-left:2px solid #7c3aed" colspan="3">Δ Change (A − B)</th>
    </tr>
    <tr>
      <th style="${thC};background:#eff6ff;color:var(--blue)">Orders</th>
      <th style="${thC};background:#eff6ff;color:var(--blue)">High ⭐</th>
      <th style="${thC};background:#eff6ff;color:var(--blue)">Low 👎</th>
      <th style="${thC};background:#f0fdf4;color:var(--green);border-left:2px solid var(--green)">Orders</th>
      <th style="${thC};background:#f0fdf4;color:var(--green)">High ⭐</th>
      <th style="${thC};background:#f0fdf4;color:var(--green)">Low 👎</th>
      <th style="${thC};background:#faf5ff;color:#7c3aed;border-left:2px solid #7c3aed">Orders</th>
      <th style="${thC};background:#faf5ff;color:#7c3aed">High</th>
      <th style="${thC};background:#faf5ff;color:#7c3aed">Low</th>
    </tr>
  </thead>`;
  const tbody = rows.map((r,i) => `<tr>
    ${tdL(i+1)} ${tdL(`<strong>${r.product}</strong>`)} ${tdL(r.category||'—')}
    ${tdN(r.aOrders||'—')} ${tdN(r.aHigh||'—')} ${tdN(r.aLow||'—')}
    ${tdN(r.bOrders||'—')} ${tdN(r.bHigh||'—')} ${tdN(r.bLow||'—')}
    ${tdD(r.dOrders, r.bOrders)} ${tdD(r.dHigh, r.bHigh)} ${tdD(r.dLow*-1, r.bLow)}
  </tr>`).join('');
  el.innerHTML = `<div style="overflow-x:auto"><table class="sc-table" style="min-width:900px">${thead}<tbody>${tbody}</tbody></table></div>
    <div style="font-size:11px;color:var(--ink-3);margin-top:10px;font-family:var(--mono)">
      Δ Orders/High ▲ = more in A vs B (good). Δ Low ▲ = fewer low ratings in A vs B (good). Sorted by Period A online orders.
    </div>`;
}

let _scpData = [];
let _scpSort = { key: 'units', dir: -1 };

function scpSetPreset(days) {
  [7,28].forEach(d => {
    const btn = document.getElementById('sctab-' + d);
    if (btn) btn.classList.toggle('active', d === days);
  });

  if (e) e.value = fmt(today);
  scpLoad();

async function scpLoad() {
  const from = document.getElementById('scp-start')?.value;
  const to   = document.getElementById('scp-end')?.value;
  if (!from || !to) return;
  const el = document.getElementById('scp-content');
  if (el) el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading… (Rista data may take 30–60s on first load)</div>';
  try {
    const r = await fetch(`https://aodapp-backend.onrender.com/api/admin/scoop-rankings?date_from=${from}&date_to=${to}`,
      { headers: { 'Authorization': `Bearer ${_orToken}` } });
    if (r.status === 401 || r.status === 403) { lsLogout(); renderProductsPage(); return; }
    const d = await r.json();
    const flavours = d.flavours || [];
    const statusEl = document.getElementById('scp-status');
    if (statusEl) statusEl.textContent = flavours.length ? `${flavours.length} flavours · ${d.date_from} → ${d.date_to}` : '';
    scpRenderTable(flavours, el);
  } catch(e) {
    if (el) el.innerHTML = '<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Failed to load</div><div class="state-body">'+e+'</div></div>';
  }
}

function scpRenderTable(flavours, el) {
  if (!flavours.length) {
    el.innerHTML = '<div class="no-outages" style="padding:40px">No scoop data for this range.</div>';
    return;
  }
  _scpData = flavours;
  _scpSort = { key: 'units', dir: -1 };
  scpDrawTable(el);
}

function scpDrawTable(el) {
  if (!el) el = document.getElementById('scp-content');
  const { key, dir } = _scpSort;
  const sorted = [..._scpData].sort((a, b) => {
    const av = a[key] ?? -Infinity, bv = b[key] ?? -Infinity;
    return typeof av === 'string' ? av.localeCompare(bv) * dir : (av - bv) * dir;
  });

  const thBase = 'padding:10px 13px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--border-2);white-space:nowrap;font-family:var(--mono);cursor:pointer;user-select:none;transition:color .14s';
  const thR = `${thBase};text-align:right`;
  const thL = `${thBase};text-align:left`;

  const col = (label, k, align='right') => {
    const active = key === k;
    const arrow  = active ? (dir === 1 ? ' ↑' : ' ↓') : ' ↕';
    const color  = active ? 'color:var(--blue)' : 'color:var(--ink-3)';
    const base   = align === 'left' ? thL : thR;
    return `<th style="${base};${color}" onclick="scpSortBy('${k}')">${label}<span style="opacity:.5;font-size:9px">${arrow}</span></th>`;
  };

  const thead = `<thead><tr>
    <th style="${thL};color:var(--ink-3)">#</th>
    ${col('Flavour','flavour','left')}
    ${col('Total Units (50g)','units')}
    ${col('Singles (100g)','single_orders')}
    ${col('Units from Singles','single_units')}
    ${col('2-Scoop Scoops','two_scoop_scoops')}
    ${col('3-Scoop Scoops','three_scoop_scoops')}
    ${col('Combo Units','combo_units')}
  </tr></thead>`;

  const rows = sorted.map((f, i) => {
    const tdL = (val, bold=false) => `<td style="padding:10px 13px;font-size:12px;${bold?'font-weight:700;':''}border-bottom:1px solid var(--border);color:var(--ink)">${val}</td>`;
    const tdN = (val, highlight=false) => `<td style="padding:10px 13px;text-align:right;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);${highlight?'font-weight:700;color:var(--blue)':''}">${val ?? '—'}</td>`;
    return `<tr>
      ${tdL(i + 1)}
      ${tdL(f.flavour, true)}
      ${tdN(f.units, true)}
      ${tdN(f.single_orders)}
      ${tdN(f.single_units)}
      ${tdN(f.two_scoop_scoops)}
      ${tdN(f.three_scoop_scoops)}
      ${tdN(f.combo_units)}
    </tr>`;
  }).join('');

  el.innerHTML = `<div style="overflow-x:auto"><table class="sc-table" style="min-width:900px">${thead}<tbody>${rows}</tbody></table></div>`;
}

function scpSortBy(key) {
  if (_scpSort.key === key) {
    _scpSort.dir *= -1;
  } else {
    _scpSort = { key, dir: -1 };
  }
  scpDrawTable();
}

      const fmtDur = hrs => {

            <td style="padding:9px 13px;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);color:var(--red);font-weight:600">${fmtDur(r.duration_hrs)}</td>

        return `
          <div class="card" style="margin-bottom:16px">
            <div class="card-header" style="display:flex;align-items:center;gap:8px">
              <span style="font-size:13px;font-weight:700">${outlet}</span>
              <span style="background:var(--red-dim);color:var(--red);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">${rows.length} OOS</span>
            </div>
            <div style="overflow-x:auto">

/* ── DAILY RECON PAGE ── */
let _reconWindow = 7;
let _reconData   = null;

function renderReconPage() {
  const el = document.getElementById('pageBody');
  el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading…</div>';

  fetch(`${API}/api/ops/daily-recon`)
    .then(r => r.json())
    .then(d => {
      _reconData = d.rows || [];
      _renderRecon();
    })
    .catch(() => { el.innerHTML = errBox(''); });
}

function _reconSetWindow(w) {
  _reconWindow = w;
  [1,7,28].forEach(n => {
    const b = document.getElementById('recontab-' + n);
    if (b) b.classList.toggle('active', n === w);
  });
  _renderRecon();
}

function _localDateStr(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function _reconRows() {
  if (!_reconData) return [];
  const todayStr  = _localDateStr(0);
  const cutoffStr = _localDateStr(-_reconWindow);

  if (_reconWindow === 1) {
    // Show the most recent available date (calu may not have run yet for true yesterday)
    const latestDate = _reconData.reduce((max, r) => r.date > max ? r.date : max, '');
    return _reconData.filter(r => r.date === latestDate);
  }

  return _reconData.filter(r => r.date >= cutoffStr && r.date < todayStr);
}

function _renderRecon() {
  const el = document.getElementById('pageBody');
  if (!_reconData) return;

  const rows   = _reconRows();
  const latestInRows = rows.length ? rows[0].date : '';
  const label  = _reconWindow === 1
    ? `Latest Day (${latestInRows || 'no data'})`
    : `Last ${_reconWindow} Days`;

  let tCash=0, tBharatpe=0, tSwiggy=0, tZomato=0, tTotal=0, tRista=0, tDiff=0, tMissing=0, tOpeningBal=0, tExpenses=0, tClosingBal=0;
  rows.forEach(r => {
    tCash       += r.cash        || 0;
    tBharatpe   += r.bharatpe    || 0;
    tSwiggy     += r.swiggy      || 0;
    tZomato     += r.zomato      || 0;
    tTotal      += r.total       || 0;
    tRista      += r.rista       || 0;
    tDiff       += r.diff        || 0;
    tOpeningBal += r.opening_balance || 0;
    tExpenses   += r.expenses    || 0;
    tClosingBal += r.closing_balance || 0;
    if (r.diff < 0) tMissing += Math.abs(r.diff);
  });

  const fmt = n => n === 0 ? '—' : '₹' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
  const diffCell = (d, rowIdx) => {
    if (Math.abs(d) < 1) return `<td class="r" style="color:var(--green);font-weight:700" id="rdiff-${rowIdx}">✓</td>`;
    const col = d < 0 ? 'var(--red)' : 'var(--green)';
    return `<td class="r" style="color:${col};font-weight:700" id="rdiff-${rowIdx}">${d < 0 ? '-' : '+'}${fmt(d)}</td>`;
  };

  const tabBar = `<div style="display:flex;gap:1px;background:var(--border);border-radius:var(--r);padding:3px;width:fit-content">
    ${[1,7,28].map(n => `<button class="ptab ${_reconWindow===n?'active':''}" id="recontab-${n}" onclick="_reconSetWindow(${n})" style="padding:4px 14px;font-size:10px">${n===1?'Yesterday':n===7?'7 Days':'28 Days'}</button>`).join('')}
  </div>`;

  const missingColor = tMissing > 5000 ? 'var(--red)' : tMissing > 1000 ? 'var(--amber)' : 'var(--green)';
  const summaryCards = `
    <div class="stat-row" style="margin-bottom:0">
      <div class="stat-card">
        <div class="stat-label">Total Collected</div>
        <div class="stat-value neu">₹${tTotal.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">${label}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Rista POS</div>
        <div class="stat-value neu">₹${tRista.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">Expected</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Missing</div>
        <div class="stat-value" style="color:${missingColor}">₹${tMissing.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">Unaccounted</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cash Collected</div>
        <div class="stat-value neu">₹${tCash.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">From checklist</div>
      </div>
    </div>`;

  const byDate = {};
  rows.forEach((r,i) => { r._idx = i; (byDate[r.date] = byDate[r.date] || []).push(r); });
  const dates = Object.keys(byDate).sort().reverse();

  const tableRows = dates.flatMap(date => {
    const dayRows = byDate[date];
    const dayMissing = dayRows.reduce((s,r) => r.diff < 0 ? s + Math.abs(r.diff) : s, 0);
    const [y,m,d] = date.split('-').map(Number);
    const dateLabel = new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'numeric',month:'short',weekday:'short'});
    return dayRows.map((r,i) => {
      const outletFirst = i === 0
        ? `<td rowspan="${dayRows.length}" style="font-size:11px;font-weight:700;color:var(--ink-2);vertical-align:top;padding-top:10px;border-right:1px solid var(--border)">${dateLabel}${dayMissing > 0 ? `<br><span style="font-size:10px;color:var(--red);font-weight:700">-₹${dayMissing.toLocaleString('en-IN',{maximumFractionDigits:0})}</span>` : ''}</td>`
        : '';
      const byTxt = r.submitted_by
        ? `<div style="font-size:10px;color:var(--ink-3);margin-top:2px">by ${r.submitted_by}</div>`
        : '';
      return `<tr>
        ${outletFirst}
        <td style="font-weight:600">${r.outlet}${byTxt}</td>
        <td class="r" style="color:var(--ink-3)">${r.opening_balance > 0 ? fmt(r.opening_balance) : '—'}</td>
        <td class="r" id="rcash-${r._idx}">
          <input id="rcash-inp-${r._idx}" type="number" value="${r.cash || 0}"
            style="width:72px;text-align:right;border:1px solid var(--border-2);border-radius:4px;padding:2px 4px;font-size:12px;font-family:inherit;background:var(--surface)"
            onblur="_saveCash(${r._idx})" onkeydown="if(event.key==='Enter')this.blur()">
        </td>
        <td class="r">${r.bharatpe > 0 ? fmt(r.bharatpe) : '—'}</td>
        <td class="r">${r.zomato > 0 ? fmt(r.zomato) : '—'}</td>
        <td class="r" style="color:var(--red)">${r.expenses > 0 ? fmt(r.expenses) : '—'}</td>
        <td class="r" style="font-weight:700" id="rtotal-${r._idx}">${fmt(r.total)}</td>
        <td class="r" style="color:var(--ink-3)">${fmt(r.rista)}</td>
        ${diffCell(r.diff, r._idx)}
        <td class="r" style="color:var(--ink-2);font-weight:600">${r.closing_balance > 0 ? fmt(r.closing_balance) : '—'}</td>
      </tr>`;
    });
  });

  const totalsRow = `<tr style="border-top:2px solid var(--border-2);background:#f5f7fb;font-weight:800">
    <td colspan="2" style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)">Total</td>
    <td class="r" style="color:var(--ink-3)">${fmt(tOpeningBal)}</td>
    <td class="r">${fmt(tCash)}</td>
    <td class="r">${fmt(tBharatpe)}</td>
    <td class="r">${fmt(tZomato)}</td>
    <td class="r" style="color:var(--red)">${fmt(tExpenses)}</td>
    <td class="r">${fmt(tTotal)}</td>
    <td class="r" style="color:var(--ink-3)">${fmt(tRista)}</td>
    <td class="r" style="color:${tDiff < -1 ? 'var(--red)' : 'var(--green)'};font-weight:800">${tDiff < -1 ? '-'+fmt(tDiff) : tDiff > 1 ? '+'+fmt(tDiff) : '✓'}</td>
    <td class="r" style="color:var(--ink-2)">${fmt(tClosingBal)}</td>
  </tr>`;

  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      ${tabBar}
      <span style="font-size:11px;color:var(--ink-3)">${rows.length} rows · ${dates.length} days</span>
    </div>
    ${summaryCards}
    <div class="section-card" style="margin-top:16px">
      <div class="section-head">
        <div class="section-head-left">
          <div class="section-icon" style="background:#fef3c7">💰</div>
          <div>
            <div class="section-title">Daily Reconciliation — ${label}</div>
            <div class="section-sub">Cash · BharatPe · Zomato vs Rista POS · tap cash to edit</div>
          </div>
        </div>
      </div>
      ${rows.length === 0
        ? `<div class="no-outages">No data for this period</div>`
        : `<table>
          <thead><tr>
            <th>Date</th>
            <th>Outlet / Submitted By</th>
            <th class="r">Opening Bal</th>
            <th class="r">Cash</th>
            <th class="r">BharatPe</th>
            <th class="r">Zomato</th>
            <th class="r">Expenses</th>
            <th class="r">Collected</th>
            <th class="r">Rista POS</th>
            <th class="r">Diff</th>
            <th class="r">Closing Bal</th>
          </tr></thead>
          <tbody>${tableRows.join('')}${totalsRow}</tbody>
        </table>`}
    </div>`;
}

function _saveCash(idx) {
  const r = _reconData.find(x => x._idx === idx);
  if (!r) return;
  const inp = document.getElementById('rcash-inp-' + idx);
  if (!inp) return;
  const parsed = parseFloat(inp.value);
  if (isNaN(parsed) || parsed < 0) { inp.value = r.cash || 0; return; }
  if (Math.abs(parsed - (r.cash || 0)) < 0.01) return; // no change

  inp.style.opacity = '0.5';
  inp.disabled = true;

  fetch('/api/ops/daily-recon/cash', {
    method: 'PATCH',
    headers: {'Content-Type':'application/json', 'x-api-key': API_KEY},
    body: JSON.stringify({row: r.row, cash: parsed})
  })
  .then(res => res.json())
  .then(d => {
    if (!d.ok) throw new Error(d.detail || 'Error');
    r.cash  = d.cash;
    r.total = d.total;
    r.diff  = d.diff;
    inp.value = d.cash;
    inp.style.opacity = '1';
    inp.disabled = false;
    inp.style.borderColor = 'var(--green)';
    setTimeout(() => { if (inp) inp.style.borderColor = 'var(--border-2)'; }, 1500);
    const fmtN = n => n === 0 ? '—' : '₹' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
    const tEl = document.getElementById('rtotal-' + idx);
    if (tEl) tEl.textContent = fmtN(d.total);
    const dEl = document.getElementById('rdiff-' + idx);
    if (dEl) {
      if (Math.abs(d.diff) < 1) { dEl.textContent = '✓'; dEl.style.color = 'var(--green)'; }
      else { dEl.textContent = (d.diff < 0 ? '-' : '+') + fmtN(d.diff); dEl.style.color = d.diff < 0 ? 'var(--red)' : 'var(--green)'; }
    }
  })
  .catch(e => {
    inp.value = r.cash || 0;
    inp.style.opacity = '1';
    inp.disabled = false;
    inp.style.borderColor = 'var(--red)';
    setTimeout(() => { if (inp) inp.style.borderColor = 'var(--border-2)'; }, 2000);
  });
}

/* ── BOOT ── */
renderPowerPage();
</script>
</body>
</html>
