async function custFetch() {
  const from = document.getElementById('custFrom').value;
  const to   = document.getElementById('custTo').value;
  const btn  = document.getElementById('custFetchBtn');
  btn.disabled = true; btn.textContent = 'Loading…';
  document.getElementById('custTabsRow').style.display = 'none';
  document.getElementById('custTabContent').innerHTML =
    '<div style="padding:40px;text-align:center;color:var(--ink-3);font-size:13px">Loading…</div>';

  try {
    const [r1, r2] = await Promise.all([
      fetch(`${API}/api/reelo/new-repeat?start=${from}&end=${to}`),
      fetch(`${API}/api/reelo/outlets?start=${from}&end=${to}`)
    ]);

    if (r1.status === 401 || r2.status === 401) {
      document.getElementById('custTabContent').innerHTML = `
        <div class="cust-expired-box">
          <div class="cust-expired-title">🔒 Token Expired</div>
          <div class="cust-expired-sub">Update REELO_TOKEN in Render environment variables and redeploy.</div>
        </div>`;
      return;
    }
    if (r1.status === 503) {
      _custAllData = REELO_SAMPLE;
      _custOutletData = [];
      custBuildTabs(true);
      return;
    }

    const d1 = await r1.json();
    const d2 = r2.ok ? await r2.json() : { outlets: [] };
    _custAllData    = d1.payload || [];
    _custOutletData = d2.outlets || [];
    custBuildTabs(false);
  } catch(e) {
    _custAllData = REELO_SAMPLE; _custOutletData = [];
    custBuildTabs(true);
  } finally {
    btn.disabled = false; btn.textContent = 'Load';
  }
}

function custBuildTabs(isSample) {
  const tabs = [{ key: 'all', label: 'All Outlets' }];
  (_custOutletData || []).forEach(o => tabs.push({ key: o.outlet, label: o.outlet }));

  const tabsRow = document.getElementById('custTabsRow');
  tabsRow.style.display = 'flex';
  tabsRow.innerHTML = tabs.map(t =>
    `<button class="cust-tab${t.key==='all'?' active':''}" onclick="custSwitchTab('${t.key}',this)">${t.label}</button>`
  ).join('');

  custSwitchTab('all', tabsRow.querySelector('.cust-tab'), isSample);
}

function custSwitchTab(key, btn, isSample) {
  document.querySelectorAll('.cust-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  let payload, sample = isSample || false;
  if (key === 'all') {
    payload = _custAllData || REELO_SAMPLE;
    if (!_custAllData) sample = true;
  } else {
    const outlet = (_custOutletData || []).find(o => o.outlet === key);
    payload = outlet ? outlet.daily : [];
  }

  custRenderTab(key, payload, sample);
}

function custRenderTab(key, payload, isSample) {
  const wrap = document.getElementById('custTabContent');
  if (!payload || !payload.length) {
    wrap.innerHTML = `<div style="padding:40px;text-align:center;color:var(--ink-3);font-size:13px">No data for this period.</div>`;
    return;
  }

  const totalNew    = payload.reduce((s,r)=>s+r.new,0);
  const totalRepeat = payload.reduce((s,r)=>s+r.repeat,0);
  const total       = totalNew + totalRepeat;
  const repeatRate  = total > 0 ? ((totalRepeat/total)*100).toFixed(1) : '0.0';
  const peak        = payload.reduce((best,r)=> (r.new+r.repeat) > (best.new+best.repeat) ? r : best, payload[0]);

  const sampleNote = isSample ? `<div style="font-size:10px;color:var(--amber);font-weight:700;margin-bottom:10px;">⚠ Showing sample data</div>` : '';

  wrap.innerHTML = `
    ${sampleNote}
    <div class="cust-metrics">
      <div class="cust-metric blue">
        <div class="cust-metric-label">Total New</div>
        <div class="cust-metric-val">${totalNew.toLocaleString()}</div>
        <div class="cust-metric-sub">First-time customers</div>
      </div>
      <div class="cust-metric green">
        <div class="cust-metric-label">Total Repeat</div>
        <div class="cust-metric-val">${totalRepeat.toLocaleString()}</div>
        <div class="cust-metric-sub">Returning customers</div>
      </div>
      <div class="cust-metric amber">
        <div class="cust-metric-label">Repeat Rate</div>
        <div class="cust-metric-val">${repeatRate}%</div>
        <div class="cust-metric-sub">repeat / (new + repeat)</div>
      </div>
      <div class="cust-metric navy">
        <div class="cust-metric-label">Peak Day</div>
        <div class="cust-metric-val" style="font-size:18px">${peak.date}</div>
        <div class="cust-metric-sub">${(peak.new+peak.repeat).toLocaleString()} customers</div>
      </div>
    </div>
    <div class="cust-chart-wrap">
      <div class="cust-chart-title">Daily New vs Repeat Customers</div>
      <div class="cust-chart-sub">Stacked by day</div>
      <div class="cust-legend">
        <div class="cust-legend-item"><div class="cust-legend-dot" style="background:#2563eb"></div>New</div>
        <div class="cust-legend-item"><div class="cust-legend-dot" style="background:#16a34a"></div>Repeat</div>
      </div>
      <canvas id="custBarCanvas" style="width:100%;display:block"></canvas>
    </div>
    <div class="cust-chart-wrap">
      <div class="cust-chart-title">7-Day Rolling Average — New Customers</div>
      <div class="cust-chart-sub">Smoothed trend line</div>
      <canvas id="custLineCanvas" style="width:100%;display:block"></canvas>
    </div>`;

  requestAnimationFrame(() => { custDrawBar(payload); custDrawLine(payload); });
}

function custSetupCanvas(canvas, logicalH) {
  const dpr = window.devicePixelRatio || 1;
  const logicalW = canvas.offsetWidth || canvas.parentElement.offsetWidth || 800;
  canvas.width  = logicalW * dpr;
  canvas.height = logicalH * dpr;
  canvas.style.width  = logicalW + 'px';
  canvas.style.height = logicalH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, W: logicalW, H: logicalH };
}

function custDrawBar(payload) {
  const canvas = document.getElementById('custBarCanvas');
  if (!canvas) return;
  const { ctx, W, H } = custSetupCanvas(canvas, 200);
  ctx.clearRect(0,0,W,H);

  const PAD_L=40, PAD_R=16, PAD_T=12, PAD_B=36;
  const chartW = W - PAD_L - PAD_R;
  const chartH = H - PAD_T - PAD_B;
  const n = payload.length;
  const maxVal = Math.max(...payload.map(r=>r.new+r.repeat), 1);
  const barW   = Math.max(4, Math.floor(chartW/n*0.72));
  const gap    = chartW/n;

  // Y-axis gridlines
  ctx.strokeStyle = '#e3e8f2'; ctx.lineWidth = 1;
  ctx.fillStyle   = '#7a92ab'; ctx.font = '10px DM Mono, monospace'; ctx.textAlign='right';
  const steps = 4;
  for (let i=0; i<=steps; i++) {
    const v = Math.round(maxVal * i/steps);
    const y = PAD_T + chartH - (v/maxVal)*chartH;
    ctx.beginPath(); ctx.moveTo(PAD_L,y); ctx.lineTo(W-PAD_R,y); ctx.stroke();
    ctx.fillText(v, PAD_L-6, y+3);
  }

  // Bars
  payload.forEach((r,i) => {
    const x       = PAD_L + i*gap + (gap-barW)/2;
    const hRepeat = (r.repeat/maxVal)*chartH;
    const hNew    = (r.new/maxVal)*chartH;

    // Repeat (bottom, green)
    ctx.fillStyle = '#16a34a';
    ctx.beginPath();
    ctx.roundRect(x, PAD_T+chartH-hRepeat, barW, hRepeat, [2,2,0,0]);
    ctx.fill();

    // New (top, blue)
    ctx.fillStyle = '#2563eb';
    ctx.beginPath();
    ctx.roundRect(x, PAD_T+chartH-hRepeat-hNew, barW, hNew, [2,2,0,0]);
    ctx.fill();

    // X-axis label — every Nth to avoid crowding
    const every = Math.ceil(n/14);
    if (i % every === 0) {
      ctx.fillStyle = '#7a92ab'; ctx.font = '9px DM Mono, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(r.date, x + barW/2, H - PAD_B + 14);
    }
  });
}

function custDrawLine(payload) {
  const canvas = document.getElementById('custLineCanvas');
  if (!canvas) return;
  const { ctx, W, H } = custSetupCanvas(canvas, 140);
  ctx.clearRect(0,0,W,H);

  const PAD_L=40, PAD_R=16, PAD_T=12, PAD_B=28;
  const chartW = W - PAD_L - PAD_R;
  const chartH = H - PAD_T - PAD_B;
  const n = payload.length;

  // Compute 7-day rolling average
  const avgs = payload.map((_,i) => {
    const window = payload.slice(Math.max(0,i-6), i+1);
    return window.reduce((s,r)=>s+r.new,0) / window.length;
  });

  const maxAvg = Math.max(...avgs, 1);

  // Gridlines
  ctx.strokeStyle = '#e3e8f2'; ctx.lineWidth = 1;
  ctx.fillStyle = '#7a92ab'; ctx.font = '10px DM Mono, monospace'; ctx.textAlign='right';
  for (let i=0; i<=3; i++) {
    const v = Math.round(maxAvg * i/3);
    const y = PAD_T + chartH - (v/maxAvg)*chartH;
    ctx.beginPath(); ctx.moveTo(PAD_L,y); ctx.lineTo(W-PAD_R,y); ctx.stroke();
    ctx.fillText(v, PAD_L-6, y+3);
  }

  // Gradient fill under line
  const grad = ctx.createLinearGradient(0, PAD_T, 0, PAD_T+chartH);
  grad.addColorStop(0, 'rgba(37,99,235,.18)');
  grad.addColorStop(1, 'rgba(37,99,235,0)');
  ctx.beginPath();
  avgs.forEach((v,i) => {
    const x = PAD_L + (i/(n-1||1))*chartW;
    const y = PAD_T + chartH - (v/maxAvg)*chartH;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.lineTo(PAD_L + chartW, PAD_T+chartH);
  ctx.lineTo(PAD_L, PAD_T+chartH);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  // Line
  ctx.beginPath();
  ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  avgs.forEach((v,i) => {
    const x = PAD_L + (i/(n-1||1))*chartW;
    const y = PAD_T + chartH - (v/maxAvg)*chartH;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();

  // Dots + x-labels
  const every = Math.ceil(n/14);
  avgs.forEach((v,i) => {
    const x = PAD_L + (i/(n-1||1))*chartW;
    const y = PAD_T + chartH - (v/maxAvg)*chartH;
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#2563eb'; ctx.lineWidth=2; ctx.stroke();

    if (i % every === 0) {
      ctx.fillStyle='#7a92ab'; ctx.font='9px DM Mono, monospace'; ctx.textAlign='center';
      ctx.fillText(payload[i].date, x, H - PAD_B + 14);
    }
  });
}

async function _thSave(pid) {
  const val = document.getElementById('thinput-' + pid)?.value?.trim();
  const msg = document.getElementById('thmsg-' + pid);
  if (!val) { msg.textContent = 'Please paste a value.'; return; }
  msg.style.color = 'var(--ink-3)'; msg.textContent = 'Saving…';
  try {
    const body = pid === 'zomato' ? { cookie: val } : { access_token: val };
    const r = await fetch(`${API}/api/admin/${pid}-auth`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${_lsToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) { msg.style.color = '#c00'; msg.textContent = d.detail || 'Failed'; return; }
    msg.style.color = '#2e7d32'; msg.textContent = '✅ Saved! Re-checking…';
    setTimeout(() => renderTokenHealthPage(), 1200);
  } catch(e) { msg.style.color = '#c00'; msg.textContent = 'Network error'; }
}

async function _thLogin(pid) {
  const username = document.getElementById('thuser-' + pid)?.value?.trim() || '';
  const password = document.getElementById('thpass-' + pid)?.value || '';
  const msg = document.getElementById('thloginmsg-' + pid);
  msg.style.color = 'var(--ink-3)'; msg.textContent = 'Logging in…';
  try {
    const r = await fetch(`${API}/api/admin/swiggy-login`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${_lsToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();
    if (!r.ok) { msg.style.color = '#c00'; msg.textContent = d.detail || 'Login failed'; return; }
    msg.style.color = '#2e7d32'; msg.textContent = `✅ Logged in as ${d.name || d.mobile || 'Swiggy user'} — token saved! Re-checking…`;
    setTimeout(() => renderTokenHealthPage(), 1200);
  } catch(e) { msg.style.color = '#c00'; msg.textContent = 'Network error'; }
}

async function _ownlyLoad() {
  const days = document.getElementById('ownly-days').value;
  const statusEl = document.getElementById('ownly-status');

  try {
    const r = await fetch(`${API}/api/admin/ownly-analytics?days=${days}`, { headers: { 'Authorization': `Bearer ${_lsToken}` } });

    _ownlyData = d;

function _ownlyDrawTable() {
  const wrap = document.getElementById('ownly-table-wrap');
  if (!wrap) return;
  if (!_ownlyData) { wrap.innerHTML = ''; return; }

  const outlets = _ownlyData.outlets || {};
  const outletNames = Object.keys(outlets).sort();

  // Union of metric labels across outlets for this tab, in first-seen order
  const cols = [];
  const seen = new Set();
  outletNames.forEach(o => {
    const tabData = outlets[o]?.[_ownlyActiveTab] || {};
    Object.keys(tabData).forEach(k => { if (!seen.has(k)) { seen.add(k); cols.push(k); } });
  });

  if (!cols.length) {
    wrap.innerHTML = '<div style="font-size:13px;color:var(--ink-3);padding:20px">No data for this tab yet.</div>';
    return;
  }

  let html = '<table style="width:100%;border-collapse:collapse;font-size:12px">';
  html += '<thead><tr>' +
    '<th style="text-align:left;padding:8px 12px;border-bottom:2px solid var(--border-2);color:var(--ink-3);position:sticky;left:0;background:var(--bg)">Outlet</th>' +
    cols.map(c => `<th style="text-align:right;padding:8px 12px;border-bottom:2px solid var(--border-2);color:var(--ink-3);white-space:nowrap">${c}</th>`).join('') +
    '</tr></thead><tbody>';

  outletNames.forEach(o => {
    const tabData = outlets[o]?.[_ownlyActiveTab];
    if (tabData?.error) {
      html += `<tr><td style="padding:8px 12px;border-bottom:1px solid var(--border);font-weight:600;color:var(--ink)">${o}</td>` +
        `<td colspan="${cols.length}" style="padding:8px 12px;border-bottom:1px solid var(--border);color:#c62828">${tabData.error}</td></tr>`;
      return;
    }
    html += `<tr><td style="padding:8px 12px;border-bottom:1px solid var(--border);font-weight:600;color:var(--ink);position:sticky;left:0;background:var(--bg)">${o}</td>` +
      cols.map(c => `<td style="text-align:right;padding:8px 12px;border-bottom:1px solid var(--border);color:var(--ink);white-space:nowrap">${(tabData && tabData[c]) ?? '—'}</td>`).join('') +
      '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

async function _incPollStatus(idx, emp_id) {
  const cell = document.getElementById('paycell-' + idx);
  const row  = document.getElementById('inc-row-' + idx);
  if (cell) cell.innerHTML = `<span style="font-size:11px;color:#92400e;font-weight:600">⏳ PENDING…</span>`;

  let attempts = 0;
  const poll = async () => {
    attempts++;
    try {
      const r = await fetch(`${API}/api/admin/incentives/payout-status/${emp_id}`, {
        headers: { 'Authorization': `Bearer ${_lsToken}` }
      });
      const d = await r.json();
      const st = d.status || '';
      if (st === 'SUCCESS') {
        if (_incPayoutData[idx]) _incPayoutData[idx].paid_status = 'SUCCESS';
        if (row) row.style.background = '#f0fdf4';
        if (cell) cell.innerHTML = `<span style="font-size:11px;color:#166534;font-weight:700">✓ SUCCESS</span><div style="font-size:9px;color:var(--ink-3);font-family:var(--mono);margin-top:2px">${d.txn_id || ''}</div>`;
        return; // done
      } else if (st === 'FAILED') {
        if (row) row.style.background = '#fff7f7';
        if (cell) cell.innerHTML = `<span style="font-size:11px;color:var(--red);font-weight:600">✕ FAILED</span>`;
        return;
      }
    } catch(_) {}
    // Still pending — retry up to 20 times (100s total)
    if (attempts < 20) setTimeout(poll, 5000);
  };
  setTimeout(poll, 5000);
}

function _renderIncPayoutTable(emps) {
  const fmt = n => '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const totalPayout  = emps.reduce((s, e) => s + e.total, 0);
  const withBank     = emps.filter(e => e.has_bank).length;
  const missingBank  = emps.filter(e => !e.has_bank).length;
  const paidEmps     = emps.filter(e => e.paid);
  const paidTotal    = paidEmps.reduce((s, e) => s + e.total, 0);
  const payable      = emps.filter(e => e.has_bank && e.total > 0 && !e.paid);

  // Stats

    <div class="stat-card"><div class="stat-label">Paid</div><div class="stat-value ok" style="font-size:20px">${fmt(paidTotal)}</div><div class="stat-sub">${paidEmps.length} completed</div></div>

    al.style.background = '#fffbeb'; al.style.border = '1px solid #fde68a'; al.style.color = '#92400e';

    const amtColor = e.total > 0 ? 'color:var(--ink);font-weight:700' : 'color:var(--ink-3)';
    const rowBg = e.paid ? 'background:#f0fdf4' : '';
    const payCell = e.paid
      ? `<span style="font-size:11px;color:#166534;font-weight:700">✓ ${e.paid_status || 'Paid'}</span><div style="font-size:9px;color:var(--ink-3);font-family:var(--mono);margin-top:2px">${e.paid_txn_id || ''}</div>`
      : canPay
        ? `<button id="paybtn-${i}" onclick="_incPay(${i})" style="padding:5px 14px;font-size:11px;font-weight:700;border-radius:6px;border:none;background:#111827;color:#fff;cursor:pointer;transition:opacity .15s" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">Pay</button>`
        : `<button disabled style="padding:5px 14px;font-size:11px;font-weight:700;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--ink-3);cursor:not-allowed">Pay</button>`;
    return `<tr id="inc-row-${i}" style="${rowBg}">
      <td><div style="font-weight:700;font-size:12px">${e.name}</div><div style="font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-top:1px">${e.emp_id}</div></td>
      <td style="font-family:var(--mono);font-size:12px;text-align:right">${e.incentive > 0 ? fmt(e.incentive) : '<span style="color:var(--ink-3)">—</span>'}</td>

      <td style="font-family:var(--mono);font-size:13px;text-align:right;${amtColor}">${fmt(e.total)}</td>
      <td><div style="font-family:var(--mono);font-size:11px">${acctDisplay}</div><div style="font-size:9px;color:var(--ink-3);margin-top:1px">${e.ifsc || '—'}</div></td>

        </div>

            <th>Employee</th>

            <th>Bank Account</th>
            <th>Status</th>
            <th></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>

}

async function _incPayOne(idx) {
  const e   = _incPayoutData[idx];
  const btn = document.getElementById('paybtn-' + idx);
  const cell= document.getElementById('paycell-' + idx);
  const row = document.getElementById('inc-row-' + idx);
  if (!e || !btn) return;
  btn.disabled = true; btn.textContent = '…';
  try {
    const r = await fetch(`${API}/api/admin/incentives/pay-employee`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${_lsToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ emp_id: e.emp_id, amount: e.total })
    });
    const d = await r.json();
    if (!r.ok) {
      cell.innerHTML = `<span style="font-size:11px;color:var(--red);font-weight:600">✕ ${d.detail || 'Failed'}</span>`;
      return;
    }
    const ok = d.status === 'SUCCESS' || d.status === 'PENDING' || d.status === 'PROCESSING';
    row.style.background = ok ? '#f0fdf4' : '#fff7f7';
    if (d.status === 'SUCCESS') {
      cell.innerHTML = `<span style="font-size:11px;color:#166534;font-weight:700">✓ SUCCESS</span><div style="font-size:9px;color:var(--ink-3);font-family:var(--mono);margin-top:2px">${d.txn_id || ''}</div>`;
    } else if (d.status === 'PENDING' || d.status === 'PROCESSING') {
      cell.innerHTML = `<span style="font-size:11px;color:#92400e;font-weight:600">⏳ ${d.status}…</span><div style="font-size:9px;color:var(--ink-3);font-family:var(--mono);margin-top:2px">${d.txn_id || ''}</div>`;
      if (e && e.emp_id) _incPollStatus(idx, e.emp_id);
    } else {
      cell.innerHTML = `<span style="font-size:11px;color:var(--red);font-weight:600">✕ ${d.status}</span>`;
    }
  } catch(err) {
    cell.innerHTML = `<span style="font-size:11px;color:var(--red);font-weight:600">✕ Network error</span>`;
  }
}

async function _incPay(idx) {
  const e   = _incPayoutData[idx];
  if (!e) return;
  const fmt = n => '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const confirmed = confirm(`Pay ${e.name} (${e.emp_id})\nAmount: ${fmt(e.total)}\nAccount: ••••${e.bank_account.slice(-4)}\nIFSC: ${e.ifsc}\n\nThis will initiate a real bank transfer via Bulkpe. Confirm?`);
  if (!confirmed) return;
  await _incPayOne(idx);
}

async function _incResetWeek() {
  if (!confirm('Clear all paid records? Do this when starting a new week\'s payout run.')) return;
  try {
    const r = await fetch(`${API}/api/admin/incentives/payout-reset`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${_lsToken}`, 'Content-Type': 'application/json' }
    });
    const d = await r.json();
    if (!r.ok) { alert('Failed: ' + (d.detail || 'Unknown error')); return; }
    alert(`Cleared ${d.cleared} paid records. Refreshing…`);
    renderIncPayoutPage();
  } catch(e) { alert('Network error: ' + e); }
}

async function _incPayAll() {
  const payable = _incPayoutData
    .map((e, i) => ({ e, i }))
    .filter(({ e }) => e.has_bank && e.total > 0 && !e.paid);

  if (!payable.length) { alert('No payable employees (need bank account + amount > 0).'); return; }

  const fmt = n => '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const totalAmt = payable.reduce((s, { e }) => s + e.total, 0);
  const lines = payable.map(({ e }) => `${e.name} (${e.emp_id}) — ${fmt(e.total)}`).join('\n');
  const confirmed = confirm(`Pay ALL ${payable.length} employees?\n\nTotal: ${fmt(totalAmt)}\n\n${lines}\n\nThis will initiate ${payable.length} real bank transfers via Bulkpe. Confirm?`);
  if (!confirmed) return;

  const allBtn = document.getElementById('inc-pay-all-btn');
  if (allBtn) { allBtn.disabled = true; allBtn.textContent = 'Paying…'; }

  for (const { i } of payable) {
    await _incPayOne(i);
  }

  if (allBtn) { allBtn.disabled = false; allBtn.textContent = 'Pay All'; }
}

async function _incPushZoho() {
  // Prompt for date
  const today = new Date();
  const dd = String(today.getDate()).padStart(2,'0');
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const yyyy = today.getFullYear();
  const defaultDate = `${dd}/${mm}/${yyyy}`;

  const dateInput = prompt('Journal entry date (DD/MM/YYYY):', defaultDate);
  if (!dateInput) return;
  if (!/^\d{2}\/\d{2}\/\d{4}$/.test(dateInput.trim())) { alert('Invalid date format. Use DD/MM/YYYY.'); return; }

  const btn = document.getElementById('inc-zoho-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Pushing…'; }

  try {
    const r = await fetch(`${API}/api/admin/incentives/push-zoho-journal`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${_lsToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: dateInput.trim() }),
    });
    const d = await r.json();
    if (!r.ok) { alert(`❌ Failed:\n\n${d.detail || JSON.stringify(d)}`); return; }

    const fmt = n => '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const lines = (d.line_items || []).map(l =>
      `${l.debit_or_credit === 'debit' ? 'DR' : 'CR'}  ${fmt(l.amount)}  ${l.description}`
    ).join('\n');
    alert(`✅ Journal entry created in Zoho!\n\nEntry #: ${d.entry_number || 'N/A'}\nDate: ${d.journal_date}\nTotal: ${fmt(d.total)}\n\n${lines}\n\n(Also written to "Zoho Expo Entry" tab in the sheet)`);
  } catch(e) {
    alert(`❌ Error: ${e.message}`);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📒 Push to Zoho'; }
  }
}

async function keLoad() {
  const API = 'https://aodapp-backend.onrender.com/api';
  const month = document.getElementById('keMonthPicker')?.value;
  if (!month) return;
  const loading = document.getElementById('keLoading');
  const content = document.getElementById('keContent');
  loading.style.display = ''; loading.textContent = 'Loading…';
  content.style.display = 'none';

  try {
    const res = await fetch(`${API}/kitchen/extra-hours?month=${encodeURIComponent(month)}`);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    _keData = data.entries || [];
    _keMonth = month;

    // Populate employee filter
    const empFilter = document.getElementById('keEmpFilter');
    const empSeen = new Set();
    empFilter.innerHTML = '<option value="">All Employees</option>';
    _keData.forEach(e => {
      if (!empSeen.has(e.employee_id)) {
        empSeen.add(e.employee_id);
        empFilter.innerHTML += `<option value="${e.employee_id}">${e.employee_name} (${e.employee_id})</option>`;
      }
    });

    loading.style.display = 'none';
    content.style.display = '';
    keRender();
  } catch(e) {
    loading.textContent = 'Failed: ' + e.message;
  }
}

function keRender() {
  const content = document.getElementById('keContent');
  if (!content) return;
  const empFilter = document.getElementById('keEmpFilter')?.value || '';
  const apprFilter = document.getElementById('keApprFilter')?.value || '';

  const rows = _keData.filter(e => {
    if (empFilter && e.employee_id !== empFilter) return false;
    if (apprFilter === 'approved' && !e.approved) return false;
    if (apprFilter === 'pending' && e.approved) return false;
    return true;
  });

  if (rows.length === 0) {
    content.innerHTML = `<div style="text-align:center;padding:60px;color:var(--ink-3);font-size:13px">No entries match the selected filters.</div>`;

  html += `</tbody></table></div>`;

}

// Extract HH:MM from "YYYY-MM-DD HH:MM:SS" or return "" if empty
function keExtractTime(ts) {
  if (!ts) return '';
  // Format: "YYYY-MM-DD HH:MM:SS"
  const m = ts.match(/(\d{2}:\d{2})(?::\d{2})?/);
  return m ? m[1] : '';
}

// Format DD/MM/YYYY → "Mon DD"
function keFmtDate(d) {
  if (!d) return '—';
  const parts = d.split('/');
  if (parts.length !== 3) return d;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(parts[1])-1] || ''} ${parts[0]}`;
}

// Calculate extra hours: actual - shift, floor at 0
function keCalcExtra(shiftStart, shiftEnd, signIn, signOut) {
  try {
    if (!signIn || !signOut || !shiftStart || !shiftEnd) return 0;
    const toMins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
    let shift = toMins(shiftEnd) - toMins(shiftStart);
    if (shift < 0) shift += 24*60; // overnight shift
    let actual = toMins(signOut) - toMins(signIn);
    if (actual < 0) actual += 24*60;
    const extra = Math.max(0, actual - shift);
    return Math.round(extra) / 60;
  } catch { return 0; }
}

// Live-recalculate extra hours when time inputs change
function keRecalc(rosterId) {
  const entry = _keData.find(e => e.roster_id === rosterId);
  if (!entry) return;
  const rowId = `ke-${rosterId.replace(/[^a-zA-Z0-9]/g,'_')}`;
  const signIn = document.getElementById(rowId + '-in')?.value || '';
  const signOut = document.getElementById(rowId + '-out')?.value || '';
  const extra = keCalcExtra(entry.shift_start, entry.shift_end, signIn, signOut);
  const extraCell = document.getElementById(rowId + '-extra');
  if (extraCell) {
    const display = (!signIn || !signOut) ? '—' : extra.toFixed(2) + ' h';
    const color = extra > 0 ? '#2563EB' : 'var(--ink-3)';
    extraCell.innerHTML = `<span style="font-weight:700;color:${color}">${display}</span>`;
  }
}

async function keSave(rosterId, approve) {
  const API = 'https://aodapp-backend.onrender.com/api';
  const entry = _keData.find(e => e.roster_id === rosterId);
  if (!entry) return;
  const rowId = `ke-${rosterId.replace(/[^a-zA-Z0-9]/g,'_')}`;
  const signIn = document.getElementById(rowId + '-in')?.value || '';
  const signOut = document.getElementById(rowId + '-out')?.value || '';
  const extra = keCalcExtra(entry.shift_start, entry.shift_end, signIn, signOut);

  try {
    const res = await fetch(`${API}/kitchen/extra-hours/save`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        roster_id: rosterId,
        employee_id: entry.employee_id,
        date: entry.date,
        sign_in_override: signIn,
        sign_out_override: signOut,
        extra_hours: extra,
        notes: '',
        approved: approve,
        approved_by: approve ? 'ops' : '',
      })
    });
    if (!res.ok) throw new Error(await res.text());
    // Update local cache
    entry.sign_in_override = signIn;
    entry.sign_out_override = signOut;
    entry.extra_hours = extra;
    if (approve) { entry.approved = true; entry.approved_by = 'ops'; }
    // Re-render just this row by refreshing full table
    keRender();
  } catch(e) { alert('Save failed: ' + e.message); }
}

async function keUnapprove(rosterId) {
  const API = 'https://aodapp-backend.onrender.com/api';
  const entry = _keData.find(e => e.roster_id === rosterId);
  if (!entry) return;
  try {
    await fetch(`${API}/kitchen/extra-hours/save`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        roster_id: rosterId,
        employee_id: entry.employee_id,
        date: entry.date,
        sign_in_override: entry.sign_in_override || '',
        sign_out_override: entry.sign_out_override || '',
        extra_hours: entry.extra_hours || 0,
        notes: entry.notes || '',
        approved: false,
        approved_by: '',
      })
    });
    entry.approved = false;
    entry.approved_by = '';
    keRender();
  } catch(e) { alert('Failed: ' + e.message); }
}

function ovSwitchTab(tab) {
  _ovTab = tab;
  ['visits','actions','completed','summary','stafffeedback'].forEach(t => {

async function ovLoad() {
  const API = 'https://aodapp-backend.onrender.com/api';
  const loading = document.getElementById('ovLoading');
  const content = document.getElementById('ovContent');
  if (!loading || !content) return;
  if (_ovTab === 'stafffeedback') { sfLoadOV(); return; }
  loading.style.display = ''; content.style.display = 'none';
  const sfPanel = document.getElementById('ovSfPanel');
  if (sfPanel) sfPanel.style.display = 'none';

  const outlet = document.getElementById('ovOutletFilter')?.value || '';
  const url = `${API}/outlet-visit/list?limit=100${outlet ? '&outlet_code=' + encodeURIComponent(outlet) : ''}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    // Feedback-only submissions (from the admin "Give Staff Feedback" flow) have no
    // checklist — keep them out of the visits/actions/summary tabs; they still show
    // up in the Staff Feedback tab, which reads from its own separate fetch.
    _ovVisits = (data.visits || []).filter(v => !v.feedback_only);
    loading.style.display = 'none';
    content.style.display = '';
    ovRender();
  } catch(e) {
    loading.textContent = 'Failed to load: ' + e.message;
  }
}

                style="padding:8px 14px;font-size:12px;font-weight:600;border-radius:8px;border:0;background:#16A34A;color:#fff;cursor:pointer;white-space:nowrap">✓ Done</button>

  container.innerHTML = html;
}

async function ovSaveAction(visitId, itemId, inputId, resolved) {
  const input = document.getElementById(inputId);
  const actionText = input ? input.value.trim() : '';
  if (!actionText && !resolved) { alert('Please enter what action was taken.'); return; }
  const API = 'https://aodapp-backend.onrender.com/api';
  try {
    const res = await fetch(`${API}/outlet-visit/${encodeURIComponent(visitId)}/action`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item_id: itemId, action_taken: actionText, resolved })
    });
    if (!res.ok) throw new Error('Save failed');
    // Update local cache — append to the action log rather than overwrite,
    // so multiple actions can be logged over time before "Done" is clicked.
    const visit = _ovVisits.find(v => v.visit_id === visitId);
    if (visit) {
      const item = (visit.checklist_items || []).find(i => i.id === itemId);
      if (item) {
        if (actionText) {
          if (!item.action_log) item.action_log = [];
          item.action_log.push({ text: actionText, at: new Date().toISOString() });
          item.action_taken = actionText;
          item.action_taken_at = new Date().toISOString();
        }
        item.action_resolved = resolved;
      }
    }
    if (resolved) {
      // Remove from action required, show in completed
      const card = document.getElementById(`ovaction-${visitId}_${itemId}`);
      if (card) { card.style.opacity = '0.4'; card.style.pointerEvents = 'none'; }
      setTimeout(() => ovRender(), 600);
    } else {
      // Stay in Action Required — re-render so the new log entry shows below
      // and the input clears for the next action.
      ovRender();
    }
  } catch(e) {
    alert('Failed to save action: ' + e.message);
  }
}

async function ovReopenAction(visitId, itemId) {
  if (!confirm('Send this back to Action Required as not satisfied?')) return;
  const API = 'https://aodapp-backend.onrender.com/api';
  try {
    const res = await fetch(`${API}/outlet-visit/${encodeURIComponent(visitId)}/action`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item_id: itemId, action_taken: '', resolved: false })
    });
    if (!res.ok) throw new Error('Save failed');
    const visit = _ovVisits.find(v => v.visit_id === visitId);
    if (visit) {
      const item = (visit.checklist_items || []).find(i => i.id === itemId);
      if (item) { item.action_taken = ''; item.action_resolved = false; }
    }
    const card = document.getElementById(`ovcomp-${visitId}_${itemId}`);
    if (card) { card.style.opacity = '0.3'; card.style.pointerEvents = 'none'; }
    setTimeout(() => ovRender(), 500);
  } catch(e) { alert('Failed to reopen: ' + e.message); }
}

async function ovClearAction(visitId, itemId) {
  const API = 'https://aodapp-backend.onrender.com/api';
  try {
    const res = await fetch(`${API}/outlet-visit/${encodeURIComponent(visitId)}/clear-action?item_id=${encodeURIComponent(itemId)}`, { method: 'POST' });
    if (!res.ok) throw new Error('Failed');
    // Update local cache
    const visit = _ovVisits.find(v => v.visit_id === visitId);
    if (visit) {
      const item = (visit.checklist_items || []).find(i => i.id === itemId);
      if (item) item.action_cleared = true;
    }
    const card = document.getElementById(`ovcomp-${visitId}_${itemId}`);
    if (card) { card.style.opacity = '0.3'; card.style.pointerEvents = 'none'; }
    setTimeout(() => ovRender(), 500);
  } catch(e) { alert('Failed to clear: ' + e.message); }
}

function ovRenderSummaryTab(container) {
  if (_ovVisits.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:60px;color:var(--ink-3);font-size:13px">No visits recorded yet.</div>`;
    return;
  }

  // Collect all outlets that appear in visits (preserve order of first appearance)
  const outletOrder = [];
  const outletSeen = new Set();
  _ovVisits.forEach(v => {
    const code = v.outlet_code;
    if (!outletSeen.has(code)) { outletSeen.add(code); outletOrder.push(code); }
  });

  // Collect all questions in section order (first appearance wins)
  const questionOrder = []; // [{id, text, section}]
  const questionSeen = new Set();
  _ovVisits.forEach(v => {
    (v.checklist_items || []).forEach(item => {
      if (!questionSeen.has(item.id)) {
        questionSeen.add(item.id);
        questionOrder.push({ id: item.id, text: item.text || item.id, section: item.section || '' });
      }
    });
  });

  // Build pivot: questionId → outletCode → {visits, nos}
  const pivot = {};
  questionOrder.forEach(q => {
    pivot[q.id] = {};
    outletOrder.forEach(o => { pivot[q.id][o] = { visits: 0, nos: 0 }; });
  });

  _ovVisits.forEach(v => {
    const outlet = v.outlet_code;
    (v.checklist_items || []).forEach(item => {
      if (!pivot[item.id] || !pivot[item.id][outlet]) return;
      pivot[item.id][outlet].visits++;
      if (item.answer === 'no') pivot[item.id][outlet].nos++;
    });
  });

  // Outlet visit counts for header
  const outletVisitCount = {};
  outletOrder.forEach(o => { outletVisitCount[o] = _ovVisits.filter(v => v.outlet_code === o).length; });

  // Group questions by section
  const sections = [];
  const sectionSeen = new Set();
  questionOrder.forEach(q => {
    if (!sectionSeen.has(q.section)) { sectionSeen.add(q.section); sections.push(q.section); }
  });

  // Color helper: 0% = light green, 100% = deep red
  function cellColor(pct, visits) {
    if (visits === 0) return { bg: 'var(--surface)', color: 'var(--ink-3)', label: '—' };
    if (pct === 0)   return { bg: '#F0FDF4', color: '#16A34A', label: '0%' };
    if (pct <= 25)   return { bg: '#FEF9C3', color: '#854D0E', label: pct + '%' };
    if (pct <= 50)   return { bg: '#FED7AA', color: '#9A3412', label: pct + '%' };
    return                 { bg: '#FEE2E2', color: '#B91C1C', label: pct + '%' };
  }

  const colW = Math.max(70, Math.floor(520 / outletOrder.length));

  let html = `<div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:${200 + colW * outletOrder.length}px">
      <thead>
        <tr style="background:var(--surface-2)">
          <th style="padding:10px 14px;text-align:left;font-weight:600;color:var(--ink-2);border:1px solid var(--border-1);min-width:200px;position:sticky;left:0;background:var(--surface-2);z-index:2">Question</th>`;
  outletOrder.forEach(o => {
    html += `<th style="padding:8px 6px;text-align:center;font-weight:700;color:var(--ink);border:1px solid var(--border-1);width:${colW}px">
      <div>${o}</div>
      <div style="font-size:10px;font-weight:500;color:var(--ink-3)">${outletVisitCount[o]} visit${outletVisitCount[o] !== 1 ? 's' : ''}</div>
    </th>`;
  });
  html += `</tr></thead><tbody>`;

  let rowIdx = 0;
  sections.forEach(sec => {
    const qs = questionOrder.filter(q => q.section === sec);
    // Section header row
    html += `<tr>
      <td colspan="${outletOrder.length + 1}" style="padding:8px 14px;font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em;background:var(--surface-2);border:1px solid var(--border-1)">${sec}</td>
    </tr>`;

    qs.forEach(q => {
      const rowBg = rowIdx++ % 2 === 0 ? 'var(--surface)' : '#fff';
      html += `<tr style="background:${rowBg}">
        <td style="padding:8px 14px;color:var(--ink);border:1px solid var(--border-1);position:sticky;left:0;background:${rowBg};z-index:1;line-height:1.4">${q.text}</td>`;
      outletOrder.forEach(o => {
        const cell = pivot[q.id][o];
        const pct = cell.visits > 0 ? Math.round(cell.nos / cell.visits * 100) : -1;
        const { bg, color, label } = cellColor(pct < 0 ? -1 : pct, cell.visits);
        const title = cell.visits > 0 ? `${cell.nos} No / ${cell.visits} visits` : 'No visits';
        html += `<td title="${title}" style="padding:8px 4px;text-align:center;border:1px solid var(--border-1);background:${bg}">
          <span style="font-size:12px;font-weight:700;color:${color}">${label}</span>
          ${cell.visits > 0 ? `<div style="font-size:9px;color:var(--ink-3);margin-top:1px">${cell.nos}/${cell.visits}</div>` : ''}
        </td>`;
      });
      html += `</tr>`;
    });
  });

  html += `</tbody></table></div>
    <div style="margin-top:14px;display:flex;gap:16px;font-size:11px;color:var(--ink-3);align-items:center;flex-wrap:wrap">
      <span>Legend:</span>
      <span style="background:#F0FDF4;color:#16A34A;padding:2px 8px;border-radius:4px;font-weight:600">0% — All good</span>
      <span style="background:#FEF9C3;color:#854D0E;padding:2px 8px;border-radius:4px;font-weight:600">1–25% — Minor</span>
      <span style="background:#FED7AA;color:#9A3412;padding:2px 8px;border-radius:4px;font-weight:600">26–50% — Moderate</span>
      <span style="background:#FEE2E2;color:#B91C1C;padding:2px 8px;border-radius:4px;font-weight:600">&gt;50% — Critical</span>
      <span style="background:var(--surface);color:var(--ink-3);padding:2px 8px;border-radius:4px">— No visits</span>
    </div>`;

  container.innerHTML = html;
}

function ovShowDetail(idx) {
  const v = _ovVisits[idx];

  if (!panel) return;
  panel.style.display = '';

  const score = v.score_pct ?? 0;
  const scoreColor = score >= 80 ? '#16A34A' : score >= 60 ? '#D97706' : '#DC2626';
  const yes = v.yes_items ?? v.checked_items ?? 0;
  const no = v.no_items ?? ((v.total_items ?? 0) - yes);

  // Group checklist by section
  const sections = {};
  (v.checklist_items || []).forEach(item => {
    if (!sections[item.section]) sections[item.section] = [];
    sections[item.section].push(item);
  });

  let checklistHtml = '';
  Object.entries(sections).forEach(([sec, items]) => {
    checklistHtml += `<div style="margin-top:14px"><div style="font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">${sec}</div>`;
    items.forEach(item => {
      const isNo = item.answer === 'no';
      const icon = isNo ? '❌' : '✅';
      checklistHtml += `
        <div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--border-1);${isNo ? 'background:#FEF9F9;border-radius:4px;padding:6px 4px;' : ''}">
          <span style="font-size:13px;flex-shrink:0">${icon}</span>
          <div style="flex:1">
            <div style="font-size:12px;color:var(--ink)">${item.text || item.id}${item.is_custom ? ' <span style="font-size:9px;font-weight:700;color:#7C3AED;background:#F3E8FF;padding:1px 6px;border-radius:4px;margin-left:4px">CUSTOM</span>' : ''}</div>
            ${item.note ? `<div style="font-size:11px;color:#DC2626;margin-top:2px">Issue: ${item.note}</div>` : ''}
            ${item.action_taken ? `<div style="font-size:11px;color:#16A34A;margin-top:2px">Action: ${item.action_taken}</div>` : ''}
          </div>
        </div>`;
    });
    checklistHtml += `</div>`;

  let feedbackHtml = '';
  (v.employee_feedbacks || []).forEach(f => {
    if (!f.feedback || !f.feedback.trim()) return;
    feedbackHtml += `
      <div style="background:var(--surface);border:1px solid var(--border-1);border-radius:8px;padding:12px;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <div style="width:32px;height:32px;border-radius:8px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">${(f.short_name||'').slice(0,2).toUpperCase()}</div>
          <div>
            <div style="font-size:13px;font-weight:600;color:var(--ink)">${f.short_name}</div>
            <div style="font-size:11px;color:var(--ink-3)">${f.employee_id}</div>
          </div>
        </div>
        <div style="font-size:13px;color:var(--ink-2)">${f.feedback || '<span style="color:var(--ink-3);font-style:italic">No feedback given</span>'}</div>
      </div>`;
  });

  const dt = v.submitted_at ? new Date(v.submitted_at) : null;
  const dtStr = dt ? dt.toLocaleString('en-IN', { weekday:'short', day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true }) : '—';

  panel.innerHTML = `
    <div style="background:var(--surface);border:1px solid var(--border-1);border-radius:12px;overflow:hidden">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border-1);display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:15px;font-weight:700;color:var(--ink)">${v.outlet_name || v.outlet_code} — Visit Detail</div>
          <div style="font-size:11px;color:var(--ink-3);margin-top:3px">${dtStr} · ${v.submitted_by_name || v.submitted_by}</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:28px;font-weight:800;color:${scoreColor}">${score}%</div>
          <div style="font-size:10px;color:var(--ink-3)"><span style="color:#16A34A">${yes}✓</span> / <span style="color:#DC2626">${no}✗</span></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0">
        <div style="padding:20px;border-right:1px solid var(--border-1)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <div style="font-size:12px;font-weight:700;color:var(--ink)">Checklist Results</div>
            <button onclick="ovShowAddAction('${v.visit_id}')" id="ovAddActionBtn-${v.visit_id}"
              style="padding:4px 10px;font-size:11px;font-weight:600;border-radius:6px;border:1px solid var(--border-2);background:var(--surface);cursor:pointer;color:var(--ink)">+ Add Action</button>
          </div>
          <div id="ovAddActionForm-${v.visit_id}" style="display:none;margin-bottom:14px;background:var(--surface-2);border:1px solid var(--border-1);border-radius:8px;padding:10px">
            <input id="ovAddActionInput-${v.visit_id}" placeholder="Describe the issue / custom action needed…"
              style="width:100%;box-sizing:border-box;padding:8px 10px;font-size:13px;border-radius:6px;border:1px solid var(--border-2);outline:none;background:#fff;margin-bottom:8px" />
            <div style="display:flex;gap:8px">
              <button onclick="ovSubmitAddAction('${v.visit_id}')"
                style="padding:6px 14px;font-size:12px;font-weight:600;border-radius:6px;border:0;background:#111827;color:#fff;cursor:pointer">Add</button>
              <button onclick="ovShowAddAction('${v.visit_id}', true)"
                style="padding:6px 14px;font-size:12px;font-weight:600;border-radius:6px;border:1px solid var(--border-2);background:#fff;color:var(--ink);cursor:pointer">Cancel</button>
            </div>
          </div>
          ${checklistHtml}
        </div>
        <div style="padding:20px">
          <div style="font-size:12px;font-weight:700;color:var(--ink);margin-bottom:10px">Staff Feedback</div>
          ${feedbackHtml || '<div style="color:var(--ink-3);font-size:12px;font-style:italic">No feedback recorded.</div>'}
          ${v.visit_notes ? `<div style="margin-top:16px"><div style="font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Visit Notes</div><div style="font-size:13px;color:var(--ink-2)">${v.visit_notes}</div></div>` : ''}
        </div>
      </div>
    </div>`;

  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function ovShowAddAction(visitId, forceHide) {
  const form = document.getElementById(`ovAddActionForm-${visitId}`);
  if (!form) return;
  const show = forceHide ? false : form.style.display === 'none';
  form.style.display = show ? '' : 'none';
  if (show) document.getElementById(`ovAddActionInput-${visitId}`)?.focus();
}

async function ovPostAddAction(visitId, text) {
  const API = 'https://aodapp-backend.onrender.com/api';
  const res = await fetch(`${API}/outlet-visit/${encodeURIComponent(visitId)}/add-action`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  if (!res.ok) throw new Error('Failed to add action');
  const data = await res.json();
  const visit = _ovVisits.find(v => v.visit_id === visitId);
  if (visit) {
    if (!visit.checklist_items) visit.checklist_items = [];
    visit.checklist_items.push(data.item);
    visit.total_items = (visit.total_items || 0) + 1;
    visit.no_items = (visit.no_items || 0) + 1;
  }
  ovUpdatePendingBadge();
  return data.item;
}

async function ovSubmitAddAction(visitId) {
  const input = document.getElementById(`ovAddActionInput-${visitId}`);
  const text = input ? input.value.trim() : '';
  if (!text) { alert('Please describe the action needed.'); return; }
  try {
    await ovPostAddAction(visitId, text);
    if (input) input.value = '';
    ovShowAddAction(visitId, true);
    const idx = _ovVisits.findIndex(v => v.visit_id === visitId);
    if (idx !== -1) ovShowDetail(idx);
  } catch(e) {
    alert('Failed to add action: ' + e.message);
  }
}

async function ovSubmitQuickAddAction() {
  const select = document.getElementById('ovqAddOutlet');
  const input = document.getElementById('ovqAddInput');
  const outletCode = select ? select.value : '';
  const outletName = select ? select.options[select.selectedIndex]?.dataset.name : '';
  const text = input ? input.value.trim() : '';
  if (!outletCode) { alert('Please pick an outlet.'); return; }
  if (!text) { alert('Please describe the action needed.'); return; }
  const API = 'https://aodapp-backend.onrender.com/api';
  try {
    const res = await fetch(`${API}/outlet-visit/quick-action`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ outlet_code: outletCode, outlet_name: outletName, text })
    });
    if (!res.ok) throw new Error('Failed to add action');
    const data = await res.json();
    let visit = _ovVisits.find(v => v.visit_id === data.visit_id);
    if (!visit) {
      // Brand-new outlet with no prior visits — add a minimal local entry
      // (feedback_only-style docs stay filtered out; this one isn't).
      visit = { visit_id: data.visit_id, outlet_code: outletCode, outlet_name: outletName, checklist_items: [] };
      _ovVisits.push(visit);
    }
    if (!visit.checklist_items) visit.checklist_items = [];
    visit.checklist_items.push(data.item);
    visit.total_items = (visit.total_items || 0) + 1;
    visit.no_items = (visit.no_items || 0) + 1;
    if (input) input.value = '';
    ovRender();
  } catch(e) {
    alert('Failed to add action: ' + e.message);
  }
}

async function sfLoad() {
  const API = 'https://aodapp-backend.onrender.com/api';
  const loading = document.getElementById('sfLoading');
  const content = document.getElementById('sfContent');
  if (!loading || !content) return;
  loading.style.display = ''; content.style.display = 'none';

  try {
    const res = await fetch(`${API}/outlet-visit/list?limit=200`);
    const data = await res.json();
    _sfVisits = data.visits || [];
    loading.style.display = 'none';
    content.style.display = '';
    sfPopulateStaffDropdown();
    sfRender();
  } catch(e) {
    loading.textContent = 'Failed to load: ' + e.message;
  }
}

function sfPopulateStaffDropdown() {
  const select = document.getElementById('sfStaffFilter');
  if (!select) return;
  
  // Extract all unique staff who have feedback
  const staffMap = {};
  _sfVisits.forEach(v => {
    (v.employee_feedbacks || []).forEach(f => {
      if (f.employee_id && f.short_name) {
        staffMap[f.employee_id] = { id: f.employee_id, name: f.short_name };
      }
    });
  });
  
  const staffList = Object.values(staffMap).sort((a, b) => a.name.localeCompare(b.name));
  
  // Keep current selection
  const currentValue = select.value;
  
  select.innerHTML = `<option value="">All Staff (${staffList.length})</option>` + 
    staffList.map(s => `<option value="${s.id}">${s.name} (${s.id})</option>`).join('');
  
  if (currentValue && staffMap[currentValue]) {
    select.value = currentValue;
  }
}

function sfFilterStaff() {
  _sfSelectedStaff = document.getElementById('sfStaffFilter')?.value || '';
  sfRender();
}

function sfRender() {
  const content = document.getElementById('sfContent');
  if (!content) return;

  // Aggregate all feedback by staff
  const staffFeedback = {};
  
  _sfVisits.forEach(v => {
    const dt = v.submitted_at ? new Date(v.submitted_at) : null;
    const dateStr = dt ? dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
    const timeStr = dt ? dt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }) : '';
    
    (v.employee_feedbacks || []).forEach(f => {
      if (!f.employee_id || !f.feedback || !f.feedback.trim()) return;

      if (!staffFeedback[f.employee_id]) {
        staffFeedback[f.employee_id] = {
          employee_id: f.employee_id,
          name: f.short_name || f.employee_id,
          feedbacks: []
        };
      }

      staffFeedback[f.employee_id].feedbacks.push({
        date: dateStr,
        time: timeStr,
        outlet: v.outlet_name || v.outlet_code,
        feedback: f.feedback,
        visit_id: v.visit_id,
        submitted_by: v.submitted_by_name || v.submitted_by
      });
    });
  });

  // Filter by selected staff if any
  let displayStaff = Object.values(staffFeedback);
  if (_sfSelectedStaff) {
    displayStaff = displayStaff.filter(s => s.employee_id === _sfSelectedStaff);
  }
  
  // Sort by name
  displayStaff.sort((a, b) => a.name.localeCompare(b.name));

  if (displayStaff.length === 0) {
    content.innerHTML = `<div style="text-align:center;padding:60px;color:var(--ink-3);font-size:13px">No staff feedback recorded yet.</div>`;
    return;
  }

  let html = '';
  
  displayStaff.forEach(staff => {
    // Sort feedbacks by date (newest first)
    staff.feedbacks.sort((a, b) => {
      const dateA = new Date(a.date);
      const dateB = new Date(b.date);
      return dateB - dateA;
    });
    
    html += `
      <div style="background:var(--surface);border:1px solid var(--border-1);border-radius:12px;overflow:hidden;margin-bottom:20px">
        <div style="padding:14px 18px;background:#f8f9fb;border-bottom:1px solid var(--border-1);display:flex;align-items:center;gap:10px">
          <div style="width:36px;height:36px;border-radius:10px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">${(staff.name).slice(0,2).toUpperCase()}</div>
          <div>
            <div style="font-size:14px;font-weight:700;color:var(--ink)">${staff.name}</div>
            <div style="font-size:11px;color:var(--ink-3)">${staff.employee_id} · ${staff.feedbacks.length} feedback${staff.feedbacks.length !== 1 ? 's' : ''}</div>
          </div>
        </div>
        <div style="padding:0">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
              <tr style="background:var(--surface-2)">
                <th style="padding:10px 14px;text-align:left;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--border-1);width:120px">Date</th>
                <th style="padding:10px 14px;text-align:left;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--border-1);width:100px">Outlet</th>
                <th style="padding:10px 14px;text-align:left;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--border-1)">Feedback</th>
                <th style="padding:10px 14px;text-align:left;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--border-1);width:140px">By</th>
              </tr>
            </thead>
            <tbody>`;
    
    staff.feedbacks.forEach((f, i) => {
      const rowBg = i % 2 === 0 ? '' : 'background:var(--surface)';
      html += `
              <tr style="${rowBg}">
                <td style="padding:10px 14px;color:var(--ink);border-bottom:1px solid var(--border-1);white-space:nowrap">
                  <div style="font-weight:600">${f.date}</div>
                  <div style="font-size:11px;color:var(--ink-3)">${f.time}</div>
                </td>
                <td style="padding:10px 14px;color:var(--ink);border-bottom:1px solid var(--border-1)">
                  <span style="font-weight:600">${f.outlet}</span>
                </td>
                <td style="padding:10px 14px;color:var(--ink-2);border-bottom:1px solid var(--border-1);line-height:1.5">${f.feedback}</td>
                <td style="padding:10px 14px;color:var(--ink-3);border-bottom:1px solid var(--border-1);font-size:12px">${f.submitted_by}</td>
              </tr>`;
    });
    
    html += `
            </tbody>
          </table>
        </div>
      </div>`;
  });

  content.innerHTML = html;
}

async function zsSaveTokens() {
  const at = document.getElementById('zs-access-token').value.trim();
  const pt = document.getElementById('zs-payload-token').value.trim();
  if (!at || !pt) { zsSetStatus('err', 'Both tokens required'); return; }
  zsSetStatus('', 'Saving…');
  try {
    const r = await fetch(`${API}/api/admin/zomato-support/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_lsToken}` },
      body: JSON.stringify({ access_token: at, payload_token: pt }),
    });
    const d = await r.json();
    if (d.success) zsSetStatus('ok', 'Tokens saved ✓');
    else zsSetStatus('err', d.detail || 'Error');
  } catch(e) { zsSetStatus('err', String(e)); }
}

async function zsCheckTokenStatus() {
  try {
    const r = await fetch(`${API}/api/admin/zomato-support/auth`, {
      headers: { Authorization: `Bearer ${_lsToken}` }
    });
    const d = await r.json();
    if (d.has_credentials) {
      zsSetStatus('ok', `Tokens configured · updated ${d.updated_at} by ${d.updated_by}`);
    } else {
      zsSetStatus('err', 'No tokens saved yet — paste them above');
    }
  } catch(e) { zsSetStatus('err', 'Could not check status'); }
}

function zsSetStatus(type, msg) {
  const el = document.getElementById('zs-token-status');
  if (!el) return;
  el.className = 'zs-token-status' + (type ? ' ' + type : '');
  el.textContent = msg;
}

function zsSetBar(connected, msg) {
  const dot  = document.getElementById('zs-status-dot');
  const text = document.getElementById('zs-status-text');
  if (!dot || !text) return;
  dot.className  = 'zs-dot ' + (connected ? 'green' : '');
  text.textContent = msg;
}

function zsLoadNuggetWidget(accessToken) {
  // Load hidden Nugget widget to keep MQTT connection alive so Spark responds
  const existing = document.getElementById('nugget-chat-widget');
  if (existing) { existing.remove(); }
  const oldScript = document.getElementById('nugget-embed-script');
  if (oldScript) { oldScript.remove(); }
  // Pre-init the NuggetChat queue
  window.NuggetChat = { q: [] };
  window.NuggetChat.q.push(['init', {
    accessToken: accessToken,
    domain: 'eternal.nugget.com',
    alwaysHideBubble: true,
    initiallyVisible: false,
    initiallyExpanded: false,
  }]);
  const s = document.createElement('script');
  s.id = 'nugget-embed-script';
  s.src = 'https://eternal.nugget.com/user/chat-embed.js';
  s.async = true;
  document.body.appendChild(s);
}

async function zsStartSession(orderId) {
  // Opens the active Spark chat (synced from the Zomato widget) and starts polling.
  zsSetBar(false, 'Loading Spark chat…');
  document.getElementById('zs-send-btn').disabled = false;
  document.getElementById('zs-resolve-btn').style.display = '';
  document.getElementById('zs-conv-id').textContent = 'Spark · live chat';
  await zsLoadMessages();
  zsStartPolling();
}

async function zsLoadMessages() {
  try {
    const r = await fetch(`${API}/api/zomato-support/messages?older=true`, {
      headers: { Authorization: `Bearer ${_lsToken}` }
    });
    if (r.status === 401) { zsSetBar(false, 'Tokens expired — re-sync from Zomato'); return; }
    const d = await r.json();
    if (!r.ok) { zsSetBar(false, d.detail || 'Could not load messages'); return; }
    zsRenderMessages(d);
    const _te = document.getElementById('zs-typing');
    if (_te) _te.classList.remove('visible');
    document.getElementById('zs-send-btn').disabled = false;
    zsSetBar(true, 'Last refreshed ' + new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit',hour12:true}));
  } catch(e) { zsSetBar(false, 'Fetch error: ' + e); }
}

let _zsBotMeta = null;
let _zsBotItems = [];

// Light markdown → HTML for Spark replies (escapes HTML first)
function zsMd(text) {
  let s = String(text)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');     // **bold**
  s = s.replace(/(^|\n)\s*[-•]\s+/g, '$1• ');          // list bullets
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>'); // links
  s = s.replace(/\n/g, '<br>');
  return s;
}

function zsRenderMessages(data) {
  const container = document.getElementById('zs-msgs');
  if (!container) return;
  const msgs = Array.isArray(data) ? data : (data.messages || data.data || []);

  // Filter out data_message (session tracking only, no visible text)
  const visible = msgs.filter(m => m.contentType !== 'data_message');
  if (!visible.length) {
    container.innerHTML = '<div class="zs-msgs-empty">No messages yet.</div>';
    return;
  }

  // Mark unread bot messages as read
  const unreadIds = visible
    .filter(m => m.contentType !== 'email_message' && m.messageId && !m.isReadByAll)
    .map(m => m.messageId);
  if (unreadIds.length && _zsConvId) {
    fetch(`${API}/api/zomato-support/read-receipts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_lsToken}` },
      body: JSON.stringify({ conversation_id: _zsConvId, message_ids: unreadIds }),
    }).catch(() => {});
  }

  container.innerHTML = visible.map(m => {
    // pointOfView 'agent' = Spark/Zomato; anything else = us
    const isUser = m.pointOfView !== 'agent';
    const side   = isUser ? 'user' : 'agent';

    let text = '';
    try {
      const d = m.content?.data;
      if (m.contentType === 'email_message') {
        text = d?.content || m.caption || '';
      } else {
        const node = d?.dynamic_node;
        const hdr = node?.header;
        text = hdr?.copy_text_config?.text
          || hdr?.component_copy_text?.text
          || hdr?.text_snippet_type_3?.title?.text
          || hdr?.text_snippet_type_3?.subtitle?.text
          || d?.content
          || m.caption
          || '';
        if (!text && node?.body) {
          for (const comp of (node.body || [])) {
            const t = comp?.copy_text_config?.text || comp?.text_snippet_type_3?.title?.text || comp?.text;
            if (t) { text = t; break; }
          }
        }
      }
    } catch(e) { text = ''; }

    if (!text) return '';

    const sender  = isUser ? 'You' : (m.senderInfo?.senderName || m.senderInfo?.displayName || 'Spark');
    const ts      = m.timestamp || '';
    const timeStr = ts ? new Date(ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}) : '';
    return `<div class="zs-msg ${side}">
      <div class="zs-msg-sender">${sender}</div>
      <div class="zs-bubble">${zsMd(text)}</div>
      ${timeStr ? `<div class="zs-msg-meta">${timeStr}</div>` : ''}
    </div>`;
  }).filter(Boolean).join('');
  container.scrollTop = container.scrollHeight;

  // Capture conversationId from session info if present
  try {
    const sinfo = (data.sessionInfo || data.custom_data?.sessionInfo);
    if (sinfo?.conversationId) _zsConvId = sinfo.conversationId;
  } catch(e) {}

  // Extract bot option buttons from last journey_message with items
  const optionsEl = document.getElementById('zs-bot-options');
  _zsBotMeta = null; _zsBotItems = [];
  const lastBotMsg = [...visible].reverse().find(m =>
    m.contentType === 'journey_message' && (m.content?.data?.dynamic_node?.items || []).length > 0
  );
  if (lastBotMsg && optionsEl) {
    const node = lastBotMsg.content.data.dynamic_node;
    _zsBotMeta = {
      journey_id: node.journey_id,
      journey_variable_id: node.journey_variable_id,
      internal_message_id: lastBotMsg.content?.data?.internal_message_id || lastBotMsg.messageId,
      message_id: lastBotMsg.messageId,
    };
    _zsBotItems = node.items;
    optionsEl.innerHTML = node.items.map((item, i) => {
      const label = item.text_snippet_type_3?.title?.text
        || item.form_data?.text_snippet_type_3?.title?.text
        || item.component_type || `Option ${i+1}`;
      return `<button class="zs-bot-btn" onclick="zsBotClick(${i})">${String(label).replace(/</g,'&lt;')}</button>`;
    }).join('');
    optionsEl.style.display = '';
  } else if (optionsEl) {
    optionsEl.style.display = 'none';
    optionsEl.innerHTML = '';
  }
}

async function zsBotClick(idx) {
  if (!_zsConvId || !_zsBotMeta || !_zsBotItems[idx]) return;
  document.querySelectorAll('.zs-bot-btn').forEach(b => b.disabled = true);
  const item = _zsBotItems[idx];
  const formData = item.form_data || item;
  try {
    const r = await fetch(`${API}/api/zomato-support/bot`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_lsToken}` },
      body: JSON.stringify({
        conversation_id: _zsConvId,
        journey_id: _zsBotMeta.journey_id,
        journey_variable_id: _zsBotMeta.journey_variable_id,
        session_journey_variable_id: _zsBotMeta.journey_variable_id,
        internal_message_id: _zsBotMeta.internal_message_id,
        message_id: _zsBotMeta.message_id,
        form_response: JSON.stringify(formData),
      }),
    });
    if (r.status === 401) { zsSetBar(false, 'Token expired — refresh tokens'); return; }
    document.getElementById('zs-bot-options').style.display = 'none';
    await new Promise(res => setTimeout(res, 1800));
    await zsLoadMessages();
  } catch(e) { zsSetBar(false, String(e)); }
}

async function zsSend() {
  const input = document.getElementById('zs-input');
  const msg   = (input?.value || '').trim();
  if (!msg) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('zs-send-btn').disabled = true;
  // Optimistic echo
  const container = document.getElementById('zs-msgs');
  if (container) {
    if (container.querySelector('.zs-msgs-empty')) container.innerHTML = '';
    container.insertAdjacentHTML('beforeend',
      `<div class="zs-msg user"><div class="zs-msg-sender">You</div><div class="zs-bubble">${zsMd(msg)}</div></div>`);
    container.scrollTop = container.scrollHeight;
  }
  const typingEl = document.getElementById('zs-typing');
  if (typingEl) typingEl.classList.add('visible');
  zsSetBar(true, 'Spark is typing…');
  try {
    const r = await fetch(`${API}/api/zomato-support/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_lsToken}` },
      body: JSON.stringify({ message: msg }),
    });
    if (r.status === 401) { zsSetBar(false, 'Tokens expired — re-sync from Zomato'); return; }
    const d = await r.json();
    if (!r.ok) { zsSetBar(false, d.detail || 'Send failed'); return; }
    // Spark replies async via the bot journey — poll a couple times to catch it
    await new Promise(res => setTimeout(res, 1500));
    await zsLoadMessages();
    setTimeout(zsLoadMessages, 2500);
  } catch(e) { zsSetBar(false, String(e)); }
  finally {
    document.getElementById('zs-send-btn').disabled = false;
    if (typingEl) typingEl.classList.remove('visible');
  }
}

async function zsResolve() {
  if (!_zsConvId || !confirm('Resolve this support chat?')) return;
  try {
    await fetch(`${API}/api/zomato-support/resolve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_lsToken}` },
      body: JSON.stringify({ conversation_id: _zsConvId }),
    });
    _zsConvId = null;
    document.getElementById('zs-conv-id').textContent = 'No active session';
    document.getElementById('zs-resolve-btn').style.display = 'none';
    document.getElementById('zs-send-btn').disabled = true;
    document.getElementById('zs-msgs').innerHTML = '<div class="zs-msgs-empty">Ticket resolved.</div>';
    zsSetBar(false, 'Resolved');
    zsStopPolling();
  } catch(e) { alert('Error: ' + e); }
}

function zsStartPolling() {
  zsStopPolling();
  _zsPolling = setInterval(() => { if (_zsConvId) zsLoadMessages(); }, 15000);
}
function zsStopPolling() {
  if (_zsPolling) { clearInterval(_zsPolling); _zsPolling = null; }
}

</script>
