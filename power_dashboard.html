async function generateBrief() {
  if (_briefViewDate) { briefViewDate(_briefTodayKey()); return; }
  const btn  = document.getElementById('briefGenBtn');
  const body = document.getElementById('briefBody');
  if (!btn || !body) return;
  btn.disabled = true;
  document.getElementById('briefGenIcon').textContent = '⏳';

  body.innerHTML = `
    <div class="brief-loading">
      <div id="briefProgressMsg" style="font-size:12px;color:var(--ink-3)">Gathering live data…</div>
      <div class="brief-progress"><div class="brief-progress-fill" id="briefProgressFill" style="width:0%"></div></div>
    </div>`;

  briefProgress(10, 'Sending to server…');

  try {
    const today = new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    briefProgress(30, 'Server gathering live data…');
    const res = await fetch(`${API}/api/daily-brief`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ date: today }),
    });
    if (!res.ok) {
      const err = await res.text().catch(() => res.statusText);
      throw new Error(`Server error ${res.status}: ${err.slice(0,200)}`);
    }
    briefProgress(90, 'Generating brief with Claude…');
    const data = await res.json();
    briefProgress(100, 'Done');
    _briefResult = data;
    _briefSave(data);
    _briefViewDate = null;
    const freshActions = data.actions || [];
    if (freshActions.length) _mergeActionsIntoStore(freshActions);
    renderBriefResult(data);
    _briefRenderHistoryPills();
  } catch(e) {
    const b = document.getElementById('briefBody');
    if (b) b.innerHTML = `<div style="color:var(--red);padding:20px 0;font-size:13px">Failed to generate brief: ${e.message}</div>`;
  }
  const b2 = document.getElementById('briefGenBtn');
  if (b2) { b2.disabled = false; }
  const ic = document.getElementById('briefGenIcon');
  if (ic) ic.textContent = '📋';
}

function _briefRenderHistoryPills() {
  const wrap = document.getElementById('briefHistoryPills');
  if (!wrap) return;
  const savedDates = _briefDates();
  const todayKey   = _briefTodayKey();
  const viewKey    = _briefViewDate || todayKey;
  if (savedDates.length <= 1) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = savedDates.map(d => {
    const isActive = d === viewKey;
    const label    = d === todayKey ? 'Today' : d;
    return `<button onclick="briefViewDate('${d}')" style="padding:3px 9px;border-radius:12px;border:1px solid ${isActive?'var(--blue)':'var(--border)'};background:${isActive?'var(--blue)':'var(--surface)'};color:${isActive?'#fff':'var(--ink-3)'};font-size:10px;font-family:var(--mono);cursor:pointer">${label}</button>`;
  }).join('');
}

function renderBriefResult(data) {
  const body = document.getElementById('briefBody');
  if (!body) return;
  const brief = data.brief || '';
  const actions = data.actions || [];
  const logs = data.logs || [];

  // Update the always-visible sidebar
  const sidebar = document.getElementById('briefSidebar');
  if (sidebar) sidebar.innerHTML = _renderBriefSidebar(logs);

  // Parse brief text into named sections
  const SECTION_ICONS = {
    'power': '⚡', 'late sign': '🕐', 'kpt': '📊', 'mfr': '📊',
    'outlet rating': '⭐', 'product': '🍽️', 'daily recon': '💰',
    'mango': '🥭', 'checklist': '✅',
  };
  function secIcon(title) {
    const t = title.toLowerCase();
    for (const [k,v] of Object.entries(SECTION_ICONS)) if (t.includes(k)) return v;
    return '•';
  }
  function secColor(title) {
    const t = title.toLowerCase();
    if (t.includes('priority') || t.includes('alert')) return 'var(--red)';
    if (t.includes('notable') || t.includes('change')) return 'var(--blue)';
    return 'var(--ink)';
  }

  // Split on lines that look like section headers (plain, markdown ##, or **bold**)
  const sectionBlocks = [];
  const lines = brief.split('\n');
  let curTitle = '', curLines = [];
  for (const line of lines) {
    // Strip markdown: ## Heading or **Heading** or __Heading__
    const stripped = line.trim()
      .replace(/^#+\s*/, '')
      .replace(/^\*\*(.*)\*\*$/, '$1')
      .replace(/^__(.*?)__$/, '$1')
      .trim();
    const isHeader = /^[A-Z][A-Za-z0-9\s\-\/]+$/.test(stripped) && stripped.length > 3 && stripped.length < 60;
    if (isHeader && curLines.join('').trim()) {
      sectionBlocks.push({ title: curTitle, body: curLines.join('\n').trim() });
      curTitle = stripped; curLines = [];
    } else if (isHeader && !curLines.join('').trim()) {
      curTitle = stripped;
    } else {
      // Strip inline bold from body lines too
      curLines.push(line);
    }
  }
  if (curLines.join('').trim()) sectionBlocks.push({ title: curTitle, body: curLines.join('\n').trim() });

  function bodyToHtml(bodyText) {
    const lines = bodyText.split('\n').map(l => l.trim()).filter(Boolean);
    const bullets = lines.filter(l => l.startsWith('- ') || l.startsWith('• '));
    if (bullets.length > 0) {
      // Render all as bullet list; non-bullet lines become their own bullet
      return '<ul class="brief-bullets">' +
        lines.map(l => {
          const text = l.startsWith('- ') ? l.slice(2) : l.startsWith('• ') ? l.slice(2) : l;
          return `<li>${escHtml(text)}</li>`;
        }).join('') +
        '</ul>';
    }
    // Fallback: split on '. ' to make bullets from prose
    const sentences = bodyText.split(/(?<=\.)\s+/).map(s => s.trim()).filter(Boolean);
    if (sentences.length > 1) {
      return '<ul class="brief-bullets">' + sentences.map(s => `<li>${escHtml(s)}</li>`).join('') + '</ul>';
    }
    return `<p class="brief-para">${escHtml(bodyText)}</p>`;
  }

  const sectionCards = sectionBlocks.map(s => {
    if (!s.body) return '';
    const icon = secIcon(s.title);
    const col  = secColor(s.title);
    const isPriority = s.title.toLowerCase().includes('priority') || s.title.toLowerCase().includes('alert');
    return `
    <div class="brief-section-card${isPriority?' brief-section-alert':''}">
      ${s.title ? `<div class="brief-section-title" style="color:${col}">${icon} ${escHtml(s.title)}</div>` : ''}
      <div class="brief-section-body">${bodyToHtml(s.body)}</div>
    </div>`;
  }).join('');

  const sectionsHtml = sectionCards || `<div class="brief-output" style="white-space:pre-wrap">${escHtml(brief)}</div>`;

  body.innerHTML = `
    <div class="brief-sections">${sectionsHtml}</div>
    <div style="margin-top:24px" id="briefActionSection">
      <div class="inv-section-head" style="margin-bottom:12px">📌 Action List</div>
      <div style="color:var(--ink-3);font-size:13px;padding:8px 0">Loading actions…</div>
    </div>`;

  // Async: fetch from Firestore then render tabs
  _renderActionTabs().then(tabsHtml => {
    const sec = document.getElementById('briefActionSection');
    if (sec) sec.innerHTML = '<div class="inv-section-head" style="margin-bottom:12px">📌 Action List</div>' + tabsHtml;
  });
}

/* ── BRIEF CHATBOT ── */
let _bcHistory = [];  // kept to last 6 turns to limit tokens

// Map keywords → which section of the brief to extract
const _BC_SECTION_KEYS = [
  { keys: ['power','offline','outage','downtime'],                  tag: 'Power Status' },
  { keys: ['late','sign','signin','absent','missed sign'],          tag: 'Late Sign-In' },
  { keys: ['kpt','mfr','kitchen prep','menu fill'],                 tag: 'KPT / MFR' },
  { keys: ['rating','net','review','error rate'],                   tag: 'Outlet Ratings' },
  { keys: ['product','ranking','error','order count'],              tag: 'Product Rankings' },
  { keys: ['recon','cash','collection','variance','diff','match'],  tag: 'Daily Recon' },
  { keys: ['mango','kg','stock','diff'],                            tag: 'Mango Tracker' },
  { keys: ['checklist','slot','submitted','missed'],                tag: 'Checklist' },
];

function _bcPickSections(question) {
  // Return the 1-2 most relevant section bodies from the brief for this question
  if (!_briefResult?.brief) return null;
  const q   = question.toLowerCase();
  const hits = _BC_SECTION_KEYS.filter(s => s.keys.some(k => q.includes(k)));
  if (!hits.length) return null; // no match → backend handles it with full brief

  // Parse brief into section map (title → body)
  const map = {};
  const lines = _briefResult.brief.split('\n');
  let cur = '', buf = [];
  for (const line of lines) {
    const isH = /^[A-Z][A-Za-z0-9\s\-\/]+$/.test(line.trim()) && line.trim().length > 3 && line.trim().length < 60;
    if (isH && buf.join('').trim()) { map[cur] = buf.join('\n').trim(); cur = line.trim(); buf = []; }
    else if (isH) { cur = line.trim(); }
    else buf.push(line);
  }
  if (buf.join('').trim()) map[cur] = buf.join('\n').trim();

  const parts = hits.slice(0,2).map(s => {
    const body = map[s.tag] || '';
    return body ? `${s.tag}:\n${body}` : null;
  }).filter(Boolean);

  return parts.length ? parts.join('\n\n') : null;
}

function _bcSystem(question) {
  const today = new Date().toLocaleDateString('en-IN', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const base  = `Ops assistant for Zaān Restaurants, Bangalore. Today: ${today}. Reply in ≤5 bullet points. Use ₹. Be direct.`;

  const relevant = _bcPickSections(question);
  if (relevant) return `${base}\n\nDATA:\n${relevant}`;
  if (_briefResult?.brief) {
    // No keyword match — send full brief but truncated hard at 900 chars
    const b = _briefResult.brief.slice(0, 900);
    return `${base}\n\nDATA:\n${b}`;
  }
  return base + '\n\nNo brief loaded yet.';
}

function bcAppend(role, text) {
  const wrap = document.getElementById('bcMsgs');
  if (!wrap) return;
  wrap.querySelector('.bc-hint')?.remove();
  const d = document.createElement('div');
  d.className = `bc-msg ${role}`;
  d.innerHTML = `<div class="bc-label">${role==='user'?'You':'Assistant'}</div><div class="bc-bubble">${escHtml(text)}</div>`;
  wrap.appendChild(d);
  wrap.scrollTop = wrap.scrollHeight;
}

async function bcSend() {
  const inp  = document.getElementById('bcInput');
  const btn  = document.getElementById('bcSend');
  const wrap = document.getElementById('bcMsgs');
  const text = (inp?.value || '').trim();
  if (!text || !wrap) return;

  inp.value = '';
  btn.disabled = true;
  bcAppend('user', text);

  _bcHistory.push({ role: 'user', content: text });

  // Typing indicator
  const typing = document.createElement('div');
  typing.className = 'bc-msg bot'; typing.id = 'bcTyping';
  typing.innerHTML = '<div class="bc-label">Assistant</div><div class="bc-bubble"><div class="bc-typing"><span></span><span></span><span></span></div></div>';
  wrap.appendChild(typing);
  wrap.scrollTop = wrap.scrollHeight;

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: _bcHistory, system: _bcSystem(text) }),
    });
    const data = await res.json();
    const reply = data.reply || data.error || 'Something went wrong.';
    _bcHistory.push({ role: 'assistant', content: reply });
    // Keep only last 4 turns — oldest get dropped to save tokens on follow-up questions
    if (_bcHistory.length > 4) _bcHistory = _bcHistory.slice(-4);
    document.getElementById('bcTyping')?.remove();
    bcAppend('bot', reply);
  } catch(e) {
    document.getElementById('bcTyping')?.remove();
    bcAppend('bot', 'Network error. Please try again.');
  }
  btn.disabled = false;
  inp?.focus();
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let _cmpAll = [];
let _cmpFilters = { platform: 'all', status: 'pending' };
let _cmpReviewDebounce = {};
let _cmpLiveStatuses = {};

function renderComplaintsPage() {
  const body = document.getElementById('pageBody');
  body.innerHTML = `
    <div id="cmpStats" class="cmp-stats" style="display:none"></div>
    <div class="cmp-controls">
      <input type="date" id="cmpDate" class="cmp-date-inp">
      <button class="btn-refresh" id="cmpLoadBtn" onclick="cmpLoad()" style="display:inline-flex">
        <span id="cmpLoadIcon">↻</span> Load
      </button>
      <div class="cmp-ftabs" id="cmpFP" style="display:none">
        <button class="cmp-ftab active" data-fp="all"    onclick="cmpSetFilter('platform','all',this)">All</button>
        <button class="cmp-ftab"        data-fp="swiggy" onclick="cmpSetFilter('platform','swiggy',this)">Swiggy</button>
        <button class="cmp-ftab"        data-fp="zomato" onclick="cmpSetFilter('platform','zomato',this)">Zomato</button>
      </div>
      <div class="cmp-ftabs" id="cmpFS" style="display:none">
        <button class="cmp-ftab active" data-fs="pending" onclick="cmpSetFilter('status','pending',this)">Pending</button>
        <button class="cmp-ftab"        data-fs="done"    onclick="cmpSetFilter('status','done',this)">Refunded</button>
        <button class="cmp-ftab"        data-fs="all"     onclick="cmpSetFilter('status','all',this)">All</button>
      </div>
      <span id="cmpCount" style="font-size:11px;color:var(--ink-3)"></span>
    </div>
    <div id="cmpList"><div class="cmp-empty"><div class="cmp-empty-i">📋</div><div class="cmp-empty-t">Pick a date and click Load</div></div></div>
    <div id="cmpLightbox"><button id="cmpLbClose" onclick="cmpLbClose()">✕</button><img id="cmpLbImg" src="" alt=""></div>
    <div id="cmpToast"></div>`;

  // set default date = yesterday
  const dp = document.getElementById('cmpDate');
  const yd = new Date(); yd.setDate(yd.getDate() - 1);
  dp.value = yd.toISOString().slice(0, 10);
  dp.addEventListener('keydown', e => { if (e.key === 'Enter') cmpLoad(); });

  // reset state
  _cmpAll = []; _cmpFilters = { platform:'all', status:'pending' };
  _cmpLiveStatuses = {};
}

async function cmpLoad() {
  const date = document.getElementById('cmpDate')?.value;
  if (!date) { cmpToast('Pick a date first', 'err'); return; }
  const icon = document.getElementById('cmpLoadIcon');
  const btn  = document.getElementById('cmpLoadBtn');
  if (icon) { icon.className = 'spin'; icon.textContent = '↻'; }
  if (btn)  btn.disabled = true;
  _cmpLiveStatuses = {};
  try {
    const d = await fetch(`${API}/api/admin/auto-refund/skipped?date=${date}`, {
      headers: {}
    }).then(r => r.json());
    if (!d.success) throw new Error('API error');
    _cmpAll = d.records || [];
    cmpRenderStats();
    cmpRenderList();
    document.getElementById('cmpStats').style.display = 'flex';
    document.getElementById('cmpFP').style.display = '';
    document.getElementById('cmpFS').style.display = '';
  } catch(e) {
    document.getElementById('cmpList').innerHTML =
      `<div class="cmp-empty"><div class="cmp-empty-i">⚠️</div><div class="cmp-empty-t">Failed to load</div><div style="font-size:11px;color:var(--ink-3)">${cmpEsc(e.message)}</div></div>`;
    cmpToast('Load failed: ' + e.message, 'err');
  } finally {
    if (icon) { icon.className=''; icon.textContent='↻'; }
    if (btn)  btn.disabled = false;
  }
}

function cmpSetFilter(key, val, el) {
  _cmpFilters[key] = val;
  const attr = key === 'platform' ? 'data-fp' : 'data-fs';
  document.querySelectorAll(`[${attr}]`).forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  cmpRenderList();
}

function cmpFiltered() {
  return _cmpAll.filter(c => {
    if (_cmpFilters.platform !== 'all' && c.platform !== _cmpFilters.platform) return false;
    if (_cmpFilters.status === 'pending' && c.refunded) return false;
    if (_cmpFilters.status === 'done'    && !c.refunded) return false;
    return true;
  });
}

function cmpRenderStats() {
  const el = document.getElementById('cmpStats');
  if (!el) return;
  const total    = _cmpAll.length;
  const pending  = _cmpAll.filter(c => !c.refunded).length;
  const refunded = _cmpAll.filter(c => c.refunded).length;
  const notGen   = _cmpAll.filter(c => c.review_genuine === false).length;
  const staff    = _cmpAll.filter(c => c.review_staff_mistake === true).length;
  const exp      = _cmpAll.filter(c => !c.refunded).reduce((s,c)=>s+(parseFloat(c.refund_amount)||0),0);
  el.innerHTML = [
    ['Total', total], ['Pending', pending], ['Refunded', refunded],
    ['Not Genuine', notGen], ['Staff Mistake', staff], ['Exposure', '₹'+exp.toFixed(0)]
  ].map(([l,v]) => `<div class="cmp-stat"><div class="cmp-stat-l">${l}</div><div class="cmp-stat-v">${v}</div></div>`).join('');
}

function cmpRenderList() {
  const list = cmpFiltered();
  const el   = document.getElementById('cmpList');
  const cntEl = document.getElementById('cmpCount');
  if (cntEl) cntEl.textContent = `${list.length} complaint${list.length!==1?'s':''}`;
  if (!list.length) {
    el.innerHTML = `<div class="cmp-empty"><div class="cmp-empty-i">✅</div><div class="cmp-empty-t">No complaints match this filter</div></div>`;
    return;
  }
  el.innerHTML = '<div class="cmp-list" id="cmpCards"></div>';
  const ul = document.getElementById('cmpCards');
  list.forEach(c => ul.appendChild(cmpBuildCard(c)));
}

function cmpBuildCard(c) {
  const el = document.createElement('div');
  el.className = 'cmp-card' +
    (c.refunded ? ' is-refunded' : '') +
    (c.review_genuine === false ? ' not-genuine' : '');
  el.id = 'cmpc-' + c.complaint_id;

  const platCls  = c.platform === 'swiggy' ? 'sw' : 'zo';
  const platTxt  = c.platform === 'swiggy' ? 'Swiggy' : 'Zomato';
  const issue    = c.complaint_item || c.issue || '—';
  const ts       = cmpFmtTime(c.timestamp);
  const bill     = c.order_bill_total ? '₹'+cmpFmtN(c.order_bill_total) : '—';
  const discount = c.order_discount   ? '₹'+cmpFmtN(c.order_discount)   : '—';
  const custOrd  = c.customer_orders     != null ? c.customer_orders     : '—';
  const custCmp  = c.customer_complaints != null ? c.customer_complaints : '—';

  const skipBadge  = c.skip_reason ? `<span class="cmp-skip-badge">⚠ ${cmpEsc(c.skip_reason)}</span>` : '';
  const genBadge   = c.review_genuine === false ? `<span class="cmp-notgen">Not genuine</span>` : '';
  const staffBadge = c.review_staff_mistake ? `<span class="cmp-staff">Staff mistake</span>` : '';

  const lsBadge = ls ? cmpLsBadge(ls) : '';

  const imgs = (c.images||[]);
  const imgHtml = imgs.length ? `<div class="cmp-imgs">${imgs.map(u=>`<img class="cmp-thumb" src="${cmpEsc(u)}" alt="" onclick="cmpLbOpen('${cmpEsc(u)}')">`).join('')}</div>` : '';
  const itemsHtml = c.items_in_order ? `<div class="cmp-items"><span style="font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em">Items:</span> ${cmpEsc(c.items_in_order)}</div>` : '';

  el.innerHTML = `
    <div class="cmp-hdr">
      <div class="cmp-hdr-l">
        <span class="cmp-plat ${platCls}">${platTxt}</span>
        <span class="cmp-outlet">${cmpEsc(c.outlet||'')}</span>
        <span class="cmp-issue">${cmpEsc(issue)}</span>
        ${skipBadge}${genBadge}${staffBadge}
        <span id="cmp-ls-badge-${c.complaint_id}">${lsBadge}</span>
      </div>
      <span class="cmp-time">${ts}</span>
    </div>
    <div class="cmp-body">
      <div class="cmp-det">
        <div class="cmp-grid">
          <div><div class="cmp-dl">Customer</div><div class="cmp-dv">${cmpEsc(c.customer_name||'—')}</div></div>
          <div><div class="cmp-dl">Type</div><div class="cmp-dv">${cmpEsc(c.customer_type||'—')}</div></div>
          <div><div class="cmp-dl">Orders / Complaints</div><div class="cmp-dv mono">${custOrd} / ${custCmp}</div></div>
          <div><div class="cmp-dl">Lifetime Value</div><div class="cmp-dv mono">${c.customer_total_amount?'₹'+cmpFmtN(c.customer_total_amount):'—'}</div></div>
          <div><div class="cmp-dl">Order Bill</div><div class="cmp-dv big">${bill}</div></div>
          <div><div class="cmp-dl">Discount</div><div class="cmp-dv mono">${discount}</div></div>
          ${c.order_id?`<div><div class="cmp-dl">Order ID</div><div class="cmp-dv mono" style="font-size:10px">${cmpEsc(c.order_id)}</div></div>`:''}
          <div><div class="cmp-dl">Complaint ID</div><div class="cmp-dv mono" style="font-size:10px">${cmpEsc(c.complaint_id)}</div></div>

    </div>
    <div class="cmp-trow">
      <span class="cmp-tlabel">Staff mistake</span>

    </div>

function cmpRefundedPanel(c) {
  const genuine    = c.review_genuine !== false;

  const notes = cmpEsc(c.review_notes || '');

    </div>
    <div class="cmp-trow">
      <span class="cmp-tlabel">Staff mistake</span>
      <label class="cmp-sw"><input type="checkbox" class="am" ${staffMistake?'checked':''} onchange="cmpToggle('${id}','${pl}','staff_mistake',this.checked)"><div class="cmp-tr"></div></label>

      <span class="cmp-ls-lbl">Platform Status</span>
      <button class="cmp-ls-btn" id="cmplsbtn-${id}" onclick="cmpCheckStatus('${id}','${pl}')">Check ↗</button>
    </div>

}

function cmpToggle(id, platform, field, val) {
  const c = _cmpAll.find(x => x.complaint_id == id);
  if (!c) return;
  if (field === 'genuine')       c.review_genuine = val;
  if (field === 'staff_mistake') c.review_staff_mistake = val;
  const card = document.getElementById('cmpc-' + id);
  if (card) {
    card.classList.toggle('not-genuine', c.review_genuine === false);
    const hl = card.querySelector('.cmp-hdr-l');
    if (hl) {
      hl.querySelectorAll('.cmp-notgen,.cmp-staff').forEach(e => e.remove());
      if (c.review_genuine === false) { const b=document.createElement('span'); b.className='cmp-notgen'; b.textContent='Not genuine'; hl.appendChild(b); }
      if (c.review_staff_mistake)     { const b=document.createElement('span'); b.className='cmp-staff';  b.textContent='Staff mistake'; hl.appendChild(b); }
    }
  }
  cmpRenderStats();
  cmpSaveReview(id, platform, { [field]: val });
}

function cmpNotes(id, platform, val) {
  const c = _cmpAll.find(x => x.complaint_id == id);
  if (c) c.review_notes = val;
  cmpSaveReview(id, platform, { notes: val });
}

function cmpSaveReview(id, platform, patch) {
  clearTimeout(_cmpReviewDebounce[id]);
  _cmpReviewDebounce[id] = setTimeout(async () => {
    try {
      const c = _cmpAll.find(x => x.complaint_id == id);
      await fetch(`${API}/api/admin/complaints/review`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          complaint_id: id, platform,
          genuine: c?.review_genuine ?? null,
          staff_mistake: c?.review_staff_mistake ?? null,
          notes: c?.review_notes ?? null,
          ...patch,
        }),
      });
    } catch(e) { console.warn('review save:', e.message); }
  }, 700);
}

async function cmpIssueRefund(id) {
  const c = _cmpAll.find(x => x.complaint_id == id);
  if (!c) return;
  const inp = document.getElementById(`cmpri-${id}`);
  const amt = parseFloat(inp?.value || c.refund_amount || 0);
  if (amt <= 0) { cmpToast('Enter refund amount > 0', 'err'); return; }
  const btn = document.querySelector(`#cmpa-${id} .cmp-btn-refund`);
  if (btn) { btn.disabled = true; btn.textContent = 'Issuing…'; }
  try {
    const d = await fetch(`${API}/api/admin/auto-refund/issue`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ complaint_id: c.complaint_id, platform: c.platform, refund_amount: amt, res_id: c.res_id||null }),
    }).then(r => r.json());
    if (!d.success) throw new Error(d.message || 'API failure');
    c.refunded = true; c.refunded_amount = amt;
    c.refunded_at = new Date().toLocaleString('en-IN'); c.refunded_by = 'you';
    cmpToast(`Refund ₹${amt.toFixed(0)} issued ✓`, 'ok');
    cmpRenderStats();
    const ap = document.getElementById(`cmpa-${id}`);
    if (ap) ap.innerHTML = cmpRefundedPanel(c);
    const card = document.getElementById('cmpc-' + id);
    if (card) card.classList.add('is-refunded');
    if (_cmpFilters.status === 'pending') {
      if (card) { card.style.opacity = '.35'; card.style.pointerEvents = 'none'; }
      setTimeout(() => cmpRenderList(), 1400);
    }
  } catch(e) {
    cmpToast('Refund failed: ' + e.message, 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Issue Refund'; }
  }
}

async function cmpCheckStatus(id, platform) {
  const btn = document.getElementById(`cmplsbtn-${id}`);
  const det = document.getElementById(`cmplsdet-${id}`);
  const badge = document.getElementById(`cmp-ls-badge-${id}`);
  if (btn) { btn.textContent = '…'; btn.disabled = true; }
  if (badge) badge.innerHTML = `<span class="cmp-ls-badge cmp-ls-checking">Checking…</span>`;
  if (det) det.textContent = '';
  try {
    const d = await fetch(`${API}/api/admin/complaints/live-status?complaint_id=${encodeURIComponent(id)}&platform=${platform}`, {
      headers: {}
    }).then(r => r.json());
    const status = (d.status||'unknown').toLowerCase();
    _cmpLiveStatuses[id] = { status, detail: d.detail||status };
    if (badge) badge.innerHTML = cmpLsBadge({ status, detail: d.detail||status });
    if (det) det.textContent = d.detail || status;
    if (btn) { btn.textContent = 'Recheck ↗'; btn.disabled = false; }
  } catch(e) {
    if (badge) badge.innerHTML = `<span class="cmp-ls-badge cmp-ls-error">Error</span>`;
    if (det) det.textContent = e.message;
    if (btn) { btn.textContent = 'Retry ↗'; btn.disabled = false; }
  }
}

function cmpLsBadge({ status, detail }) {
  const s = (status||'').toLowerCase();
  let cls = 'cmp-ls-unknown', icon = '○';
  if (s==='open')     { cls='cmp-ls-open';     icon='●'; }
  if (s==='resolved') { cls='cmp-ls-resolved'; icon='✓'; }
  if (s==='closed')   { cls='cmp-ls-closed';   icon='✓'; }
  if (s==='refunded') { cls='cmp-ls-refunded'; icon='✓'; }
  if (s==='error')    { cls='cmp-ls-error';    icon='!'; }
  return `<span class="cmp-ls-badge ${cls}">${icon} ${cmpEsc(s)}</span>`;
}

function cmpLbOpen(url) {
  const lb = document.getElementById('cmpLightbox');
  const img = document.getElementById('cmpLbImg');
  if (!lb || !img) return;
  img.src = url; lb.classList.add('open');
}
function cmpLbClose() {
  const lb = document.getElementById('cmpLightbox');
  if (lb) lb.classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') cmpLbClose(); });

let _cmpToastT;
function cmpToast(msg, type='') {
  const t = document.getElementById('cmpToast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'show' + (type ? ' '+type : '');
  clearTimeout(_cmpToastT);
  _cmpToastT = setTimeout(() => { t.className = ''; }, 3200);
}

function cmpFmtTime(ts) {
  if (!ts) return '—';
  try {
    const [dp, tp] = ts.split(' ');
    const [dd,mm,yyyy] = dp.split('/');
    const d = new Date(`${yyyy}-${mm}-${dd}T${tp||'00:00:00'}`);
    if (isNaN(d)) return ts;
    return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}) +
           ' · ' + d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  } catch { return ts; }
}
function cmpFmtN(v) {
  const n = parseFloat(v); if (isNaN(n)) return v;
  return n%1===0 ? n.toLocaleString('en-IN') : n.toFixed(2);
}
function cmpEsc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Mango state ──
let _mgData = {};
let _mgActiveTab = 0;
let _mgSortState = {};
let _mgCombinedRows = [];
const _MG_SKUS = [
  { key: 'Badami Mango',      label: 'Badami Mango',  cut: false },
  { key: 'Cut Badami Mango',  label: 'Cut Badami',    cut: true  },
  { key: 'Raspuri Mango',     label: 'Raspuri Mango', cut: false },
  { key: 'Raspuri Cut Mango', label: 'Cut Raspuri',   cut: true  },
];
const _MG_CUT_HIDE = ['Purchased', 'Transfer In'];
const _MG_NUM_COLS = ['Opening Stock','Purchased','Transfer In','Sales','House Consumed','Housemade','Shrinkage','Closing Stock','Calculated Closing Stock','Difference'];
// SKUs shown as a diff calculation instead of raw cards. Each has its OWN metrics
// (signed terms that feed Calculated Closing); then Difference = Closing − Calculated.
//   Whole Badami: no Purchased/Sales/Housemade  -> Opening + Transfer In − House Consumed
//   Cut Badami:   no Purchased/Transfer In/House Consumed -> Opening + Housemade − Sales
// reason = inferred cause shown under the Difference, by sign.
const _MG_EQ_SPEC = {
  'Badami Mango': {
    terms: [['Opening Stock', '+'], ['Transfer In', '+'], ['House Consumed', '−'], ['Shrinkage', '−']],
    reason: {
      neg: 'Likely housemade was not entered, the yield is less, or a transfer entry mistake.',
      pos: 'Likely the yield is more.',
    },
  },
  'Cut Badami Mango': {
    terms: [['Opening Stock', '+'], ['Housemade', '+'], ['Sales', '−'], ['Shrinkage', '−']],
    reason: {
      pos: 'Likely housemade was not entered.',
      neg: 'Likely staff are eating it, or extra portions are being served.',
    },
  },
};

async function mgLoad() {
  const date = document.getElementById('mgDate')?.value;
  if (!date) { mgSetStatus('Pick a date.', ''); return; }
  mgSetStatus('<span style="display:inline-block;width:12px;height:12px;border:2px solid #d97706;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px"></span> Loading…', 'running');
  const btn = document.getElementById('mgBtnRefresh');
  if (btn) btn.disabled = true;
  try {
    const res = await fetch(`${API}/api/mango/data?date=${date}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    _mgData = await res.json();
    mgBuildOutletFilter();
    mgRenderSummary();
    mgRenderCombined();
    mgSetStatus(`Loaded data for ${date}`, 'ok');
  } catch(e) {
    mgSetStatus('Error: ' + e.message, 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function mgLoad7Days() {
  const btn = document.getElementById('mgBtn7d');
  if (btn) btn.disabled = true;
  mgSetStatus('<span style="display:inline-block;width:12px;height:12px;border:2px solid #d97706;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px"></span> Loading last 7 days…', 'running');
  try {
    // Use IST date to avoid timezone shift issues
    const nowIST = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
    const dates = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(nowIST); d.setDate(nowIST.getDate() - i);
      dates.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'));
    }
    const results = await Promise.all(dates.map(d => fetch(`${API}/api/mango/data?date=${d}`).then(r => r.ok ? r.json() : {})));
    // Aggregate: sum numeric cols per outlet across all 7 days
    const merged = {};
    _MG_SKUS.forEach(sku => {
      let headers = [];
      const outletMap = {}; // outlet -> aggregated row array
      results.forEach(res => {
        const d = res[sku.key];
        if (!d || !d.headers.length) return;
        if (!headers.length) headers = d.headers;
        const dateIdx   = headers.indexOf('Date');
        const outletIdx = headers.indexOf('Outlet');
        const typeIdx   = headers.indexOf('Type');
        const openIdx   = headers.indexOf('Opening Stock');
        const closeIdx  = headers.indexOf('Closing Stock');
        const calcIdx   = headers.indexOf('Calculated Closing Stock');
        const diffIdx   = headers.indexOf('Difference');
        d.rows.forEach(row => {
          const outlet = row[outletIdx] || '';
          if (!outletMap[outlet]) {
            outletMap[outlet] = row.slice(); // copy first occurrence
            // zero out numeric cols we'll re-sum
            headers.forEach((h, i) => {
              if (_MG_NUM_COLS.includes(h) || h === 'Difference') outletMap[outlet][i] = 0;
            });
            if (dateIdx >= 0) outletMap[outlet][dateIdx] = '7-day';
          }
          const agg = outletMap[outlet];
          headers.forEach((h, i) => {
            if (!(_MG_NUM_COLS.includes(h) || h === 'Difference')) return;
            if (i === openIdx) {
              // keep the earliest non-zero opening (first day)
              if (agg[i] === 0 && parseFloat(row[i]) !== 0) agg[i] = parseFloat(row[i]) || 0;
            } else if (i === closeIdx || i === calcIdx || i === diffIdx) {
              // overwrite with latest value
              agg[i] = parseFloat(row[i]) || 0;
            } else {
              agg[i] = (parseFloat(agg[i]) || 0) + (parseFloat(row[i]) || 0);
            }
          });
        });
      });
      // Recompute diff from aggregated closing vs calc
      const closeIdx = headers.indexOf('Closing Stock');
      const calcIdx  = headers.indexOf('Calculated Closing Stock');
      const diffIdx  = headers.indexOf('Difference');
      const rows = Object.values(outletMap).map(r => {
        const agg = r.slice();
        if (closeIdx >= 0 && calcIdx >= 0 && diffIdx >= 0)
          agg[diffIdx] = Math.round((parseFloat(agg[closeIdx]) - parseFloat(agg[calcIdx])) * 1000) / 1000;
        return agg;
      });
      merged[sku.key] = { headers, rows };
    });
    _mgData = merged;
    mgBuildOutletFilter();
    mgRenderSummary();
    mgRenderCombined();
    mgSetStatus(`Loaded last 7 days (${dates[0]} – ${dates[6]})`, 'ok');
  } catch(e) {
    mgSetStatus('Error: ' + e.message, 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

function mgSetStatus(msg, type) {
  const el = document.getElementById('mgStatus');
  if (!el) return;
  el.innerHTML = msg;
  el.className = 'mg-status ' + (type || '');
}

function mgBuildOutletFilter() {
  const outlets = new Set();
  _MG_SKUS.forEach(sku => {
    const d = _mgData[sku.key];
    if (!d) return;
    d.rows.forEach(r => { if (r[1]) outlets.add(r[1]); });
  });
  const sel = document.getElementById('mgOutlet');
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '<option value="">All Outlets</option>';
  Array.from(outlets).sort().forEach(o => {
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o;
    if (o === cur) opt.selected = true;
    sel.appendChild(opt);
  });
}

function mgRenderSummary() {
  _MG_SKUS.forEach((sku, i) => {
    const d = _mgData[sku.key];
    const count = d ? d.rows.length : 0;
    const card = document.getElementById('mgSum' + i);
    const val  = document.getElementById('mgSumVal' + i);
    if (!card || !val) return;
    val.textContent = count > 0 ? count : '—';
    val.className   = 'mg-sum-val' + (count > 0 ? ' active' : '');
    card.className  = 'mg-sum-card' + (count > 0 ? ' has-data' : '');
  });
}

function mgFilterRows(rows, headers) {
  const typeF   = document.getElementById('mgType')?.value || '';
  const outletF = document.getElementById('mgOutlet')?.value || '';
  const search  = (document.getElementById('mgSearch')?.value || '').toLowerCase().trim();
  const diffF   = document.getElementById('mgDiff')?.value || '';
  const typeIdx   = headers.indexOf('Type');
  const outletIdx = headers.indexOf('Outlet');
  const diffIdx   = headers.indexOf('Difference');
  return rows.filter(row => {
    if (typeF   && typeIdx   >= 0 && row[typeIdx]   !== typeF)   return false;
    if (outletF && outletIdx >= 0 && row[outletIdx] !== outletF) return false;
    if (search  && outletIdx >= 0 && String(row[outletIdx]).toLowerCase().indexOf(search) === -1) return false;
    if (diffF   && diffIdx   >= 0) {
      const dv = parseFloat(row[diffIdx]) || 0;
      if (diffF === 'neg'  && dv >= -0.005) return false;
      if (diffF === 'pos'  && dv <=  0.005) return false;
      if (diffF === 'zero' && Math.abs(dv) > 0.005) return false;
    }
    return true;
  });
}

function mgSortRows(rows, headers, tabIdx) {
  const st = _mgSortState[tabIdx];
  if (!st) return rows;
  return rows.slice().sort((a, b) => {
    let av = a[st.col], bv = b[st.col];
    const an = parseFloat(av), bn = parseFloat(bv);
    if (!isNaN(an) && !isNaN(bn)) { av = an; bv = bn; }
    if (av < bv) return st.dir === 'asc' ? -1 : 1;
    if (av > bv) return st.dir === 'asc' ?  1 : -1;
    return 0;
  });
}

// ── Combined summary table (Outlet | Badami diff | Cut Badami diff) ──
let _mgCombinedSort = { col: 'outlet', dir: 'asc' };

// Build a map of outlet -> { type, diff } for one SKU, honouring type/outlet/search filters
// (the Difference filter is applied later at the combined-row level).
function mgDiffMap(skuKey) {
  const d = _mgData[skuKey];
  const map = {};
  if (!d || !d.headers.length) return map;
  const outletIdx = d.headers.indexOf('Outlet');
  const typeIdx   = d.headers.indexOf('Type');
  const diffIdx   = d.headers.indexOf('Difference');
  const typeF   = document.getElementById('mgType')?.value || '';
  const outletF = document.getElementById('mgOutlet')?.value || '';
  const search  = (document.getElementById('mgSearch')?.value || '').toLowerCase().trim();
  d.rows.forEach(row => {
    const outlet = outletIdx >= 0 ? row[outletIdx] : '';
    if (!outlet) return;
    const type = typeIdx >= 0 ? row[typeIdx] : '';
    if (typeF   && type !== typeF) return;
    if (outletF && outlet !== outletF) return;
    if (search  && String(outlet).toLowerCase().indexOf(search) === -1) return;
    const cfg = _MG_EQ_SPEC[skuKey];
    const diff = cfg
      ? mgCalcDiff(d.headers, row, cfg).diff           // use the per-SKU formula (matches detail popup)
      : (diffIdx >= 0 ? (parseFloat(row[diffIdx]) || 0) : 0);
    map[outlet] = { type, diff };
  });
  return map;
}

// Compute Calculated Closing (Σ signed terms) and Difference (Closing − Calculated) for a SKU.
function mgCalcDiff(headers, row, cfg) {
  const numOf = (h) => { const i = headers.indexOf(h); return i >= 0 ? (parseFloat(row[i]) || 0) : 0; };
  let calc = 0;
  cfg.terms.forEach(([field, op]) => { const v = numOf(field); calc += (op === '−' ? -v : v); });
  calc = Math.round(calc * 1000) / 1000;
  const diff = Math.round((numOf('Closing Stock') - calc) * 1000) / 1000;
  return { calc, diff };
}

// Inferred reason for a SKU's difference, by sign (empty if ~zero or no spec).
function mgReasonText(skuKey, diff) {
  if (diff === null || diff === undefined || Math.abs(diff) <= 0.005) return '';
  const reason = (_MG_EQ_SPEC[skuKey] || {}).reason || {};
  return (diff < 0 ? reason.neg : reason.pos) || '';
}

function mgDiffPasses(diffF, ...diffs) {
  if (!diffF) return true;
  // pass if ANY of the provided diffs matches the chosen filter
  return diffs.some(v => {
    if (v === null || v === undefined) return false;
    if (diffF === 'neg')  return v <  -0.005;
    if (diffF === 'pos')  return v >   0.005;
    if (diffF === 'zero') return Math.abs(v) <= 0.005;
    return true;
  });
}

function mgRenderCombined() {
  const wrap = document.getElementById('mgCombined');
  if (!wrap) return;

  const badami = mgDiffMap('Badami Mango');
  const cut    = mgDiffMap('Cut Badami Mango');
  const diffF  = document.getElementById('mgDiff')?.value || '';

  // Union of outlets across both SKUs
  const outlets = new Set([...Object.keys(badami), ...Object.keys(cut)]);
  let rows = [];
  outlets.forEach(o => {
    const b = badami[o] ? badami[o].diff : null;
    const c = cut[o]    ? cut[o].diff    : null;
    if (!mgDiffPasses(diffF, b, c)) return;
    const type = (badami[o] && badami[o].type) || (cut[o] && cut[o].type) || '';
    rows.push({ outlet: o, type, badami: b, cut: c });
  });

  // Sort
  const s = _mgCombinedSort;
  rows.sort((a, b) => {
    let av = a[s.col], bv = b[s.col];
    if (s.col === 'outlet') { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
    else { av = av === null ? -Infinity : av; bv = bv === null ? -Infinity : bv; }
    if (av < bv) return s.dir === 'asc' ? -1 : 1;
    if (av > bv) return s.dir === 'asc' ?  1 : -1;
    return 0;
  });

  const arrow = col => s.col === col ? (s.dir === 'asc' ? 'sa' : 'sd') : '';
  const diffCell = v => {
    if (v === null || v === undefined) return `<td class="mg-td-num mg-diff-zero">—</td>`;
    const cls = Math.abs(v) <= 0.005 ? 'mg-diff-zero' : v < 0 ? 'mg-diff-neg' : 'mg-diff-pos';
    const sign = v > 0.005 ? '+' : '';
    return `<td class="mg-td-num ${cls}">${sign}${mgFmt(v)}</td>`;
  };
  const reasonCell = rw => {
    const parts = [];
    const br = mgReasonText('Badami Mango', rw.badami);
    const cr = mgReasonText('Cut Badami Mango', rw.cut);
    if (br) parts.push(`<div class="mg-reason-line"><b>Badami:</b> ${mgEsc(br)}</div>`);
    if (cr) parts.push(`<div class="mg-reason-line"><b>Cut:</b> ${mgEsc(cr)}</div>`);
    return `<td class="mg-reason-cell">${parts.length ? parts.join('') : '<span class="mg-diff-zero">—</span>'}</td>`;
  };

  _mgCombinedRows = rows;
  let tbody = '<tbody>';
  if (rows.length === 0) {
    tbody += `<tr><td colspan="4" style="text-align:center;padding:36px;color:#6b7280">No outlets match the current filters.</td></tr>`;
  } else {
    rows.forEach((r, idx) => {
      tbody += `<tr class="mg-row-click" data-mg-outlet-idx="${idx}">
        <td class="mg-td-outlet">${mgEsc(r.outlet)} <span class="mg-row-arrow">›</span></td>
        ${diffCell(r.badami)}
        ${diffCell(r.cut)}
        ${reasonCell(r)}
      </tr>`;
    });
  }
  tbody += '</tbody>';

  wrap.innerHTML = `<div class="mg-table-wrap">
    <div class="mg-table-toolbar">
      <span class="mg-table-title">Mango Difference by Outlet</span>
      <span class="mg-table-meta">${rows.length} outlet${rows.length !== 1 ? 's' : ''} · tap a row for full details</span>
    </div>
    <div class="mg-tbl-scroll"><table class="mg-tbl">
      <thead><tr>
        <th class="${arrow('outlet')}" data-mg-csort="outlet">Outlet</th>
        <th class="${arrow('badami')}" data-mg-csort="badami">Badami Diff</th>
        <th class="${arrow('cut')}" data-mg-csort="cut">Cut Badami Diff</th>
        <th>Likely Reason</th>
      </tr></thead>
      ${tbody}
    </table></div>
  </div>`;

  wrap.querySelectorAll('th[data-mg-csort]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.mgCsort;
      _mgCombinedSort = { col, dir: s.col === col && s.dir === 'asc' ? 'desc' : 'asc' };
      mgRenderCombined();
    });
  });
  wrap.querySelectorAll('tr[data-mg-outlet-idx]').forEach(tr => {
    tr.addEventListener('click', () => {
      const row = _mgCombinedRows[parseInt(tr.dataset.mgOutletIdx)];
      if (row) mgShowOutletDetail(row.outlet);
    });
  });
}

// ── Outlet detail popup: full breakdown across all 4 mango types ──
function mgShowOutletDetail(outlet) {
  const body = document.getElementById('mgDetailBody');
  const title = document.getElementById('mgDetailTitle');
  if (!body || !title) return;
  title.textContent = outlet;

  let html = '';
  _MG_SKUS.forEach(sku => {
    const d = _mgData[sku.key];
    let card = `<div class="mg-detail-card"><div class="mg-detail-sku">${mgEsc(sku.label)}</div>`;
    if (!d || !d.headers.length) {
      card += `<div class="mg-detail-empty">No data.</div></div>`;
      html += card; return;
    }
    const outletIdx = d.headers.indexOf('Outlet');
    const row = d.rows.find(r => r[outletIdx] === outlet);
    if (!row) {
      card += `<div class="mg-detail-empty">No data for this outlet.</div></div>`;
      html += card; return;
    }
    if (_MG_EQ_SPEC[sku.key]) {
      card += mgEquationHtml(d.headers, row, _MG_EQ_SPEC[sku.key]);
      card += '</div>';
      html += card;
      return;
    }
    const skipCols = sku.cut ? _MG_CUT_HIDE : [];
    card += '<div class="mg-detail-grid">';
    d.headers.forEach((h, i) => {
      if (h === 'Date' || h === 'Outlet' || skipCols.includes(h)) return;
      const val = row[i];
      let vHtml;
      if (h === 'Type') {
        const bc = val === 'Dine In' ? 'mg-bdg-dine' : 'mg-bdg-cloud';
        vHtml = `<span class="mg-bdg ${bc}">${mgEsc(val)}</span>`;
      } else if (h === 'Difference') {
        const num = parseFloat(val) || 0;
        const cls = Math.abs(num) <= 0.005 ? 'mg-diff-zero' : num < 0 ? 'mg-diff-neg' : 'mg-diff-pos';
        const sign = num > 0.005 ? '+' : '';
        vHtml = `<span class="${cls}">${sign}${mgFmt(num)}</span>`;
      } else if (_MG_NUM_COLS.includes(h)) {
        vHtml = mgFmt(parseFloat(val) || 0);
      } else {
        vHtml = mgEsc(val);
      }
      card += `<div class="mg-detail-kv"><div class="mg-detail-k">${mgEsc(h)}</div><div class="mg-detail-v">${vHtml}</div></div>`;
    });
    card += '</div></div>';
    html += card;
  });

  body.innerHTML = html;
  document.getElementById('mgDetailModal').classList.add('open');
}

// Render the diff as a calculation instead of raw cards, using a per-SKU config.
// cfg = { terms: [[field, '+'|'−'], ...], reason: {neg, pos} }
// Calculated Closing = Σ(signed terms);  Difference = Closing − Calculated.
function mgEquationHtml(headers, row, cfg) {
  const numOf = (h) => { const i = headers.indexOf(h); return i >= 0 ? (parseFloat(row[i]) || 0) : 0; };

  const r = (op, label, val, cls = '') =>
    `<div class="mg-eq-row ${cls}"><span class="mg-eq-l"><span class="mg-eq-op">${op}</span>${label}</span><span class="mg-eq-v">${val}</span></div>`;

  const termRows = cfg.terms.map(([field, op], idx) =>
    r(idx === 0 ? '' : op, field, mgFmt(numOf(field)))  // first term carries no leading operator
  ).join('');

  const { calc, diff } = mgCalcDiff(headers, row, cfg);
  const closing = numOf('Closing Stock');
  const diffCls = Math.abs(diff) <= 0.005 ? 'mg-diff-zero' : diff < 0 ? 'mg-diff-neg' : 'mg-diff-pos';
  const sign    = diff > 0.005 ? '+' : '';

  const reason = cfg.reason || {};
  const msg = Math.abs(diff) <= 0.005 ? '' : (diff < 0 ? reason.neg : reason.pos);
  const reasonHtml = msg ? `<div class="mg-eq-reason"><span class="mg-eq-reason-icon">💡</span>${msg}</div>` : '';

  return `<div class="mg-eq">
    ${termRows}
    <div class="mg-eq-rule"></div>
    ${r('=', 'Calculated Closing <span class="mg-eq-sub">expected</span>', mgFmt(calc), 'mg-eq-total')}
    ${r('',  'Closing Stock <span class="mg-eq-sub">actual</span>', mgFmt(closing))}
    ${r('−', 'Calculated Closing', mgFmt(calc))}
    <div class="mg-eq-rule"></div>
    ${r('=', 'Difference', `<span class="${diffCls}">${sign}${mgFmt(diff)}</span>`, 'mg-eq-total')}
    ${reasonHtml}
  </div>`;
}

async function mgTriggerRun(mode) {
  let date = '';
  if (mode === 'specific') {
    date = document.getElementById('mgRunDate')?.value || '';
    if (!date) { document.getElementById('mgRunStatus').textContent = 'Pick a date first.'; return; }
  }
  const rs = document.getElementById('mgRunStatus');
  rs.innerHTML = '<span style="display:inline-block;width:11px;height:11px;border:2px solid #d97706;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px"></span> Running…';
  document.querySelectorAll('#mgRunModal .mg-btn').forEach(b => b.disabled = true);
  try {
    const res = await fetch(`${API}/api/mango/run`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ mode, date }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }
    const body = await res.json();
    rs.style.color = '#d97706';
    rs.textContent = `⏳ Running for ${body.date}… (this may take 1–2 min)`;
    // Poll status
    const poll = setInterval(async () => {
      try {
        const sr = await fetch(`${API}/api/mango/run-status`);
        const st = await sr.json();
        if (!st.running) {
          clearInterval(poll);
          if (st.last_result === 'ok') {
            rs.style.color = '#16a34a';
            rs.textContent = `✓ Done! Data written for ${st.last_date}.`;
            document.getElementById('mgDate').value = st.last_date;
            setTimeout(() => { mgLoad(); mgCloseRunModal(); }, 800);
          } else {
            rs.style.color = '#dc2626';
            rs.textContent = 'Error: ' + (st.last_error || 'Unknown error');
          }
        }
      } catch(_) {}
    }, 3000);
  } catch(e) {
    rs.style.color = '#dc2626';
    rs.textContent = 'Error: ' + e.message;
  } finally {
    document.querySelectorAll('#mgRunModal .mg-btn').forEach(b => b.disabled = false);
  }
}

function mgEsc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mgFmt(n) { return Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ── ACTION TAKEN MODAL – Firestore-backed (shared across all users/devices) ── */

// In-memory cache so we don't re-fetch on every render within a session
let _actionsCache = null;

async function _fetchActionsStore() {
  try {
    const res = await fetch(`${API}/api/brief-actions`);
    const data = await res.json();
    _actionsCache = data.actions || [];
  } catch { _actionsCache = _actionsCache || []; }
  return _actionsCache;
}

async function clearAllActions() {
  if (!confirm('Clear all actions? Fresh ones will be generated on the next brief.')) return;
  try {
    await fetch(`${API}/api/brief-actions/clear`, { method: 'POST' });
    _actionsCache = null;
    const sec = document.getElementById('briefActionSection');
    if (sec) {
      _renderActionTabs().then(tabsHtml => {
        sec.innerHTML = '<div class="inv-section-head" style="margin-bottom:12px">📌 Action List</div>' + tabsHtml;
      });
    }
  } catch(e) { alert('Failed to clear: ' + e.message); }
}

async function _mergeActionsIntoStore(newActions) {
  if (!newActions || !newActions.length) return;
  try {
    await fetch(`${API}/api/brief-actions`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(newActions),
    });
    _actionsCache = null; // invalidate cache so next render re-fetches
  } catch {}
}

function _buildActionTabsHtml(store) {
  const today = new Date().toISOString().slice(0,10);
  const pending   = store.filter(s => s.status === 'pending');
  const completed = store.filter(s => s.status === 'completed').slice().reverse();

  const pendingHtml = pending.length === 0
    ? `<div class="action-pending-empty">No pending actions — all clear ✓</div>`
    : pending.map(a => {
        const isOld = a.addedDate && a.addedDate < today;
        const safeId     = escHtml(a.id);
        const safeAction = escHtml(a.action||'').replace(/'/g, '&#39;');
        return `<div class="action-item" id="astore-${a.id}">
          <div class="action-check" onclick="showActionTakenModal('${safeId}','${safeAction}')"></div>
          <div class="action-content" onclick="showActionTakenModal('${safeId}','${safeAction}')">
            <div class="action-top">
              <span class="pri-${(a.priority||'low').toLowerCase()}">${escHtml(a.priority||'Low')}</span>
              <span class="action-area">${escHtml(a.area||'')}</span>
              ${isOld ? `<span class="action-carryover-badge">carried over</span>` : ''}
              <span class="action-due">${escHtml(a.due||'Today')}</span>
            </div>
            <div class="action-text">${escHtml(a.action||'')}</div>
            <div class="action-owner">${escHtml(a.owner||'')}</div>
          </div>
          <button class="action-suppress-btn" title="Not needed — suppress this action type" onclick="event.stopPropagation();showSuppressModal('${safeId}','${safeAction}')">Not needed</button>
        </div>`;
      }).join('');

  const completedHtml = completed.length === 0
    ? `<div class="action-pending-empty">No completed actions yet.</div>`
    : completed.map(a => {
        const dt = a.completedAt ? new Date(a.completedAt).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
        return `<div class="action-log-row">
          <div class="action-log-header">
            <div class="action-log-check">✓</div>
            <div class="action-log-task">${escHtml(a.action||'')}</div>
            <div class="action-log-meta">${escHtml(dt)}</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:3px">
            <span class="pri-${(a.priority||'low').toLowerCase()}" style="font-size:10px">${escHtml(a.priority||'Low')}</span>
            <span style="font-size:11px;color:var(--ink-3)">${escHtml(a.area||'')} ${a.owner?'· '+a.owner:''}</span>
          </div>
          <div class="action-log-taken">
            <span class="action-log-taken-label">Action taken</span>
            ${escHtml(a.actionTaken||'')}
          </div>
        </div>`;
      }).join('');

  return `
    <div class="action-tabs" style="display:flex;align-items:center">
      <div class="action-tab active" id="atab-pending" onclick="switchActionTab('pending')">
        Pending <span style="background:${pending.length?'var(--red)':'var(--green)'};color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;margin-left:4px">${pending.length}</span>
      </div>
      <div class="action-tab" id="atab-completed" onclick="switchActionTab('completed')">
        Completed Log <span style="background:var(--border-2);color:var(--ink-3);border-radius:10px;padding:1px 7px;font-size:10px;margin-left:4px">${completed.length}</span>
      </div>
      <button onclick="clearAllActions()" style="margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-3);background:transparent;border:1px solid var(--border-2);border-radius:5px;padding:3px 10px;cursor:pointer" title="Delete all actions so fresh ones are generated on next brief">🗑 Clear All</button>
      <div class="action-tab" id="atab-roster" onclick="switchActionTab('roster')">
        Missing Roster <span id="atab-roster-badge" style="background:var(--border-2);color:var(--ink-3);border-radius:10px;padding:1px 7px;font-size:10px;margin-left:4px">…</span>
      </div>
    </div>
    <div class="action-tab-panel active" id="atpanel-pending">
      <div class="action-list">${pendingHtml}</div>
    </div>
    <div class="action-tab-panel" id="atpanel-completed">
      ${completedHtml}
    </div>
    <div class="action-tab-panel" id="atpanel-roster">
      <div id="rosterMissingBody" style="padding:8px 0;font-size:13px;color:var(--ink-3)">Loading…</div>
    </div>`;
}

async function _renderActionTabs() {
  const store = await _fetchActionsStore();
  return _buildActionTabsHtml(store);
}

function switchActionTab(tab) {
  ['pending','completed','roster'].forEach(t => {
    document.getElementById('atab-'+t)?.classList.toggle('active', t===tab);
    document.getElementById('atpanel-'+t)?.classList.toggle('active', t===tab);
  });
  if (tab === 'roster') _loadMissingRoster();
}

async function _loadMissingRoster(date) {
  const body = document.getElementById('rosterMissingBody');
  if (!body) return;
  body.innerHTML = '<span style="color:var(--ink-3)">Loading…</span>';
  try {
    const url = date
      ? `${API}/api/admin/roster/missing-outlets?date=${encodeURIComponent(date)}`
      : `${API}/api/admin/roster/missing-outlets`;
    const data = await fetch(url, { headers: { 'Authorization': `Bearer ${_lsToken}` } }).then(r => r.json());
    if (!data.success) throw new Error('API error');

    const badge = document.getElementById('atab-roster-badge');
    if (badge) {
      badge.textContent = data.missing_count;
      badge.style.background = data.missing_count ? 'var(--red)' : 'var(--green)';
      badge.style.color = '#fff';
    }

    const dateLabel = data.date || '';
    const filledPct = data.total_outlets ? Math.round((data.filled / data.total_outlets) * 100) : 0;

    if (!data.missing_count) {
      body.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;padding:12px 0;color:var(--green);font-size:13px;font-weight:600">
          ✓ All ${data.total_outlets} outlets have roster for ${dateLabel}
        </div>`;
      return;
    }

    const rows = data.missing.map(o => `
      <div class="roster-missing-row">
        <span class="roster-missing-dot"></span>
        <span class="roster-missing-name">${escHtml(o.outlet_name || o.outlet_code)}</span>
        <span class="roster-missing-code">${escHtml(o.outlet_code)}</span>
      </div>`).join('');

    body.innerHTML = `
      <div class="roster-missing-header">
        <div>
          <span style="font-size:13px;font-weight:700;color:var(--ink)">${data.missing_count} outlet${data.missing_count!==1?'s':''} missing roster</span>
          <span style="font-size:11px;color:var(--ink-3);margin-left:8px">for ${dateLabel}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="roster-progress-bar"><div class="roster-progress-fill" style="width:${filledPct}%"></div></div>
          <span style="font-size:11px;color:var(--ink-3)">${data.filled}/${data.total_outlets} filled</span>
          <input type="date" id="rosterMissingDate" class="roster-date-inp" value="${_isoFromDmy(dateLabel)}" onchange="_loadMissingRoster(_dmyFromIso(this.value))">
        </div>
      </div>
      <div class="roster-missing-list">${rows}</div>`;
  } catch(e) {
    if (body) body.innerHTML = `<span style="color:var(--red);font-size:13px">Failed to load: ${escHtml(e.message)}</span>`;
  }
}

function _isoFromDmy(dmy) {
  // DD/MM/YYYY → YYYY-MM-DD
  if (!dmy) return '';
  const [d, m, y] = dmy.split('/');
  return y && m && d ? `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}` : '';
}
function _dmyFromIso(iso) {
  // YYYY-MM-DD → DD/MM/YYYY
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return y && m && d ? `${d}/${m}/${y}` : '';
}

  document.getElementById('atModalOverlay')?.remove();

async function confirmActionTaken(id) {
  const actionTaken = (document.getElementById('atModalInput')?.value || '').trim();
  if (!actionTaken) { document.getElementById('atModalInput')?.focus(); return; }

  const btn = document.getElementById('atModalConfirm');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  try {
    await fetch(`${API}/api/brief-actions/${encodeURIComponent(id)}/complete`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ actionTaken }),
    });
    _actionsCache = null; // invalidate so next render re-fetches fresh data
  } catch {}

  closeActionModal();

  // Re-render the action list section
  const actionSection = document.getElementById('briefActionSection');
  if (actionSection) {
    actionSection.innerHTML = '<div class="inv-section-head" style="margin-bottom:12px">📌 Action List</div><div style="color:var(--ink-3);font-size:13px;padding:8px 0">Refreshing…</div>';

    actionSection.innerHTML = '<div class="inv-section-head" style="margin-bottom:12px">📌 Action List</div>' + html;
  }
}

function _clTodayISO() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function _clAddDays(iso, d) {
  const dt = new Date(iso + 'T12:00:00');
  dt.setDate(dt.getDate() + d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function _clFmtDate(iso) {
  return new Date(iso+'T12:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function _clFmtTime(ts) {
  if (!ts) return '';
  const p = String(ts).split(' ');
  return p.length >= 2 ? p[1].substring(0,5) : ts;
}
function _clEsc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }
// Google Drive uc?id= URLs no longer embed directly — convert to thumbnail endpoint
function fixDriveUrl(url) {
  if (!url) return url;
  const m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w800`;
  return url;
}

async function _clLoadDaily(date) {
  const content = document.getElementById('cl-daily-content');
  const chips   = document.getElementById('cl-chips');
  content.innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink-3)"><span class="cl-spin"></span> Loading…</div>';
  chips.style.display = 'none';
  try {
    const r = await fetch(`${API}/api/admin/checklist/daily-status?date=${date}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    _clData = data;
    _clSubmissionMap = {};
    (data.outlets || []).forEach(outlet => {
      (outlet.slots || []).forEach(s => {
        if (s.submission_id) _clSubmissionMap[s.submission_id] = { slot:s.slot, submitted_by:s.submitted_by||'', submitted_at:s.submitted_at||'' };
      });
    });

    const filled = data.filled_outlets ?? 0;
    const total  = data.total_outlets ?? 0;
    chips.style.display = 'flex';
    chips.innerHTML = `<span class="cl-chip green">✓ ${filled} Complete</span><span class="cl-chip red">✗ ${total-filled} Pending</span>`;

    const outlets = data.outlets || [];
    if (outlets.length === 0) { content.innerHTML = '<div style="padding:60px;text-align:center;color:var(--ink-3)">No data for this date.</div>'; return; }

    content.innerHTML = '';
    ['Morning','Mid Day','Closing'].forEach(slot => {
      // Only show outlets that have this slot in their expected slots list
      const slotOutlets = outlets.filter(o => (o.slots||[]).some(s => s.slot === slot));
      if (slotOutlets.length === 0) return;

      const color = CL_SLOT_COLORS[slot] || '#6b7280';
      const filledCount = slotOutlets.filter(o=>(o.slots||[]).some(s=>s.slot===slot&&s.status==='filled')).length;
      const badgeBg    = filledCount===slotOutlets.length?'#dcfce7':filledCount>0?'#fef9c3':'#fee2e2';
      const badgeColor = filledCount===slotOutlets.length?'#16a34a':filledCount>0?'#d97706':'#dc2626';

      const group = document.createElement('div');
      group.className = 'cl-slot-group';
      group.innerHTML = `
        <div class="cl-slot-label">
          <div class="cl-slot-bar" style="background:${color}"></div>
          <span class="cl-slot-title">${_clEsc(slot)}</span>
          <span class="cl-slot-badge" style="background:${badgeBg};color:${badgeColor}">${filledCount}/${slotOutlets.length}</span>
        </div>
        <div class="cl-card">${slotOutlets.map(outlet => {
          const s = (outlet.slots||[]).find(x=>x.slot===slot);
          const isFilled = s && s.status==='filled';
          return `<div class="cl-row${isFilled?' clickable':''}"${isFilled?` data-sid="${_clEsc(s.submission_id)}"`:''}>
            <span class="cl-outlet-badge">${_clEsc(outlet.outlet_code)}</span>
            <div class="cl-row-right">
              ${isFilled
                ? `<div class="cl-filled-info"><div class="cl-filled-by">${_clEsc(s.submitted_by||'—')}</div><div class="cl-filled-at">${_clFmtTime(s.submitted_at)}</div></div><span style="color:var(--ink-3);font-size:12px">›</span>`
                : `<span class="cl-not-filled">Not filled</span>`}
            </div>
          </div>`;
        }).join('')}</div>`;

      group.querySelectorAll('.cl-row.clickable').forEach(row => {
        row.addEventListener('click', function() {
          const sid = this.dataset.sid;
          const meta = _clSubmissionMap[sid] || {};
          clOpenResponses(sid, meta.slot||slot, meta.submitted_by||'', _clFmtTime(meta.submitted_at||''));
        });
      });
      content.appendChild(group);
    });
  } catch(e) {
    content.innerHTML = `<div style="padding:40px;text-align:center;color:var(--red)">Error: ${e.message}</div>`;
  }
}

async function clOpenResponses(submissionId, slot, by, time) {
  const overlay = document.createElement('div');
  overlay.className = 'cl-modal-overlay';
  overlay.id = 'cl-modal';
  overlay.innerHTML = `
    <div class="cl-modal">
      <div class="cl-modal-head">
        <div>
          <div class="cl-modal-title">${_clEsc(slot)} Checklist</div>
          ${by?`<div class="cl-modal-sub">by ${_clEsc(by)}${time?' · '+time:''}</div>`:''}
        </div>
        <button class="cl-modal-close" onclick="document.getElementById('cl-modal').remove()">×</button>
      </div>
      <div class="cl-modal-body" id="cl-modal-body">
        <div style="text-align:center;padding:30px"><span class="cl-spin"></span> Loading…</div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if(e.target===overlay) overlay.remove(); });
  try {
    const r = await fetch(`${API}/api/admin/checklist/submission/${encodeURIComponent(submissionId)}/responses`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const body = document.getElementById('cl-modal-body');
    if (!data.responses || data.responses.length===0) { body.innerHTML='<div style="text-align:center;padding:30px;color:var(--ink-3)">No responses found.</div>'; return; }
    body.innerHTML = data.responses.map((resp,i) => `
      <div class="cl-resp-card">
        <div class="cl-resp-q"><div class="cl-resp-qbadge">${i+1}</div><div class="cl-resp-qtext">${_clEsc(resp.question)}</div></div>
        <div class="cl-resp-ans ${resp.answer==='Yes'?'yes':resp.answer==='No'?'no':''}">${_clEsc(resp.answer||'—')}</div>
        ${resp.image_url?`<img class="cl-resp-img" data-src="${_clEsc(fixDriveUrl(resp.image_url))}">`: ''}
      </div>`).join('');
    body.querySelectorAll('img[data-src]').forEach(img => { img.src=img.dataset.src; img.onclick=()=>clFullscreenImg(img.dataset.src); });
  } catch(e) {
    const body=document.getElementById('cl-modal-body');
    if(body) body.innerHTML=`<div style="color:var(--red);padding:20px">Error: ${e.message}</div>`;
  }
}

function clFullscreenImg(url) {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;display:flex;align-items:center;justify-content:center;cursor:pointer';
  ov.innerHTML = `<img src="${_clEsc(url)}" style="max-width:95%;max-height:85vh;object-fit:contain;border-radius:8px">`;
  ov.onclick = () => ov.remove();
  document.body.appendChild(ov);
}

async function clLoadMissed() {
  const from = document.getElementById('cl-miss-from').value;
  const to   = document.getElementById('cl-miss-to').value;
  if (!from || !to) return;
  const result = document.getElementById('cl-missed-result');
  result.innerHTML = '<div style="padding:20px;text-align:center"><span class="cl-spin"></span> Loading…</div>';
  try {
    const r = await fetch(`${API}/api/admin/checklist/missed-by-employee?start_date=${from}&end_date=${to}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const rows = (data.employees||[]).filter(e=>e.scheduled>0);
    const totalMissed = rows.reduce((s,r)=>s+r.missed,0);
    if (rows.length===0) { result.innerHTML='<div style="padding:40px;text-align:center;color:var(--green)">✓ No missed checklists in this range.</div>'; return; }
    result.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px">
        <span style="font-size:13px;font-weight:600;color:var(--ink-2)">${_clFmtDate(data.start_date)} – ${_clFmtDate(data.end_date)}</span>
        <span class="cl-chip red">${totalMissed} total missed</span>
      </div>
      <div class="cl-missed-table">
        <div class="cl-missed-thead"><span>Employee</span><span class="cl-num" style="color:#9ca3af">Sched</span><span class="cl-num" style="color:#16a34a">Done</span><span class="cl-num" style="color:#dc2626">Missed</span></div>
        ${rows.map(row=>`<div class="cl-missed-row">
          <span style="font-size:13px;font-weight:500;color:var(--ink)">${_clEsc(row.short_name)}</span>
          <span class="cl-num" style="color:var(--ink-3)">${row.scheduled}</span>
          <span class="cl-num" style="color:#16a34a">${row.submitted}</span>
          <span class="cl-num" style="${row.missed>0?'color:#dc2626;font-weight:700':'color:#16a34a'}">${row.missed}</span>
        </div>`).join('')}
      </div>`;
  } catch(e) {
    result.innerHTML = `<div style="padding:20px;text-align:center;color:var(--red)">Error: ${e.message}</div>`;
  }
}

async function _clLoadCritical(date) {
  const content = document.getElementById('cl-crit-content');
  content.dataset.loaded = '1';
  content.innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink-3)"><span class="cl-spin"></span> Loading…</div>';
  try {
    const r = await fetch(`${API}/api/admin/checklist/critical-summary?date=${date}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    if (!data.has_critical_questions) { content.innerHTML='<div style="padding:60px;text-align:center;color:var(--ink-3)">No critical questions set up yet.</div>'; return; }

    const entries = data.entries || [];
    const subCount  = entries.filter(e=>e.submitted).length;
    const flagCount = entries.filter(e=>e.submitted&&e.critical_responses.some(r=>r.answer==='No')).length;

    const byQ = new Map();
    entries.forEach(entry => {
      entry.critical_responses.forEach(resp => {
        if (!byQ.has(resp.question)) byQ.set(resp.question, []);
        byQ.get(resp.question).push({ outlet_code:entry.outlet_code, slot:entry.slot, submitted:entry.submitted, answer:resp.answer, image_url:resp.image_url });
      });
    });

    let html = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <span class="cl-chip green">✓ ${subCount} Submitted</span>
      ${flagCount>0?`<span class="cl-chip red">⚠ ${flagCount} Issues</span>`:''}
    </div>`;
    let qi=0;
    byQ.forEach((rows,question) => {
      qi++;
      const issueCount    = rows.filter(r=>r.submitted&&r.answer==='No').length;
      const answeredCount = rows.filter(r=>r.submitted).length;
      html += `<div class="cl-crit-card">
        <div class="cl-crit-head">
          <div class="cl-q-badge">${qi}</div>
          <div class="cl-q-text">${_clEsc(question)}</div>
          ${issueCount>0?`<span class="cl-crit-issue-badge">⚠ ${issueCount}</span>`:''}
          <span class="cl-q-meta">${answeredCount}/${rows.length}</span>
        </div>
        ${rows.map(row => {
          const hasIssue=row.submitted&&row.answer==='No', isOk=row.submitted&&row.answer==='Yes';
          const slotColor=CL_SLOT_COLORS[row.slot]||'#6b7280';
          return `<div class="cl-crit-row ${hasIssue?'bad-row':isOk?'ok-row':''}">
            <div class="cl-outlet-slot">
              <span class="cl-outlet-badge">${_clEsc(row.outlet_code)}</span>
              <span class="cl-slot-pill" style="background:${slotColor}22;color:${slotColor}">${_clEsc(row.slot)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px">
              ${!row.submitted
                ? '<span class="cl-not-sub">Not submitted</span>'
                : `<span class="cl-ans-badge ${row.answer==='Yes'?'cl-ans-yes':'cl-ans-no'}">${_clEsc(row.answer||'—')}</span>
                   ${row.image_url?`<img class="cl-thumb" data-src="${_clEsc(fixDriveUrl(row.image_url))}">`:''}` }
            </div>
          </div>`;
        }).join('')}
      </div>`;
    });
    content.innerHTML = html || '<div style="padding:40px;text-align:center;color:var(--ink-3)">No critical data for this date.</div>';
    content.querySelectorAll('img[data-src]').forEach(img => { img.src=img.dataset.src; img.onclick=()=>clFullscreenImg(img.dataset.src); });
  } catch(e) {
    content.innerHTML = `<div style="padding:40px;text-align:center;color:var(--red)">Error: ${e.message}</div>`;
  }
}

function ccFmtNum(v) {

function custQuick(days, btn) {
  document.querySelectorAll('.cust-quick-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('custTo').value   = custIsoToday();

}

function custIsoToday() {
  return new Date().toISOString().slice(0,10);
}
function custIsoMinus(days) {
  const d = new Date(); d.setDate(d.getDate() - days);
  return d.toISOString().slice(0,10);
}

function renderCustomersPage() {
