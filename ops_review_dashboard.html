<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Review — Zaān</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f9fafb; --surface: #ffffff; --border: #e5e7eb; --border-2: #d1d5db;
  --ink: #111827; --ink-2: #6b7280; --ink-3: #9ca3af;
  --blue: #111827; --blue-dim: rgba(17,24,39,.06);
  --red: #dc2626; --red-dim: #fef2f2;
  --amber: #d97706; --amber-dim: #fffbeb;
  --green: #16a34a; --green-dim: #f0fdf4;
  --r: 8px; --r-lg: 12px;
  --sh: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
html, body { height: 100%; font-family: var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
.wrap { height: 100vh; margin: 0; padding: 16px 20px; display: flex; flex-direction: column; box-sizing: border-box; }
.hdr { margin-bottom: 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; flex-shrink: 0; }
.hdr h1 { font-size: 18px; font-weight: 700; }
.hdr p { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.who b { color: var(--ink); }
.who button { border: 1px solid var(--border-2); background: var(--surface); border-radius: var(--r); padding: 5px 10px; font-size: 11.5px; cursor: pointer; color: var(--ink-2); }
.banner { border-radius: var(--r-lg); padding: 10px 16px; margin-bottom: 12px; font-weight: 600; font-size: 13px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--sh); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }
.banner .deadline { font-weight: 400; color: var(--ink-2); font-size: 11.5px; }
.banner.done { background: var(--green-dim); border-color: #bbf7d0; color: #166534; }
.banner.pending { background: var(--amber-dim); border-color: #fde68a; color: #92400e; }
.stack { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 14px; min-height: 0; }
@media (max-width: 900px) {
  html, body { overflow: auto; }
  .wrap { height: auto; min-height: 100vh; }
  .stack { grid-template-columns: 1fr; grid-template-rows: none; }
  .card-body { max-height: 320px; }
}
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.card-hdr { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 8px; gap: 10px; flex-wrap: wrap; flex-shrink: 0; }
.card-hdr h2 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.live-badge { font-size: 10px; font-weight: 700; color: #fff; background: var(--red); padding: 2px 7px; border-radius: 999px; letter-spacing: .04em; display: inline-flex; align-items: center; gap: 4px; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.4s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.filterbar { display: flex; gap: 6px; padding: 0 14px 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.filter-btn { border: 1px solid var(--border-2); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 11.5px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.filter-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.filter-date { border: 1px solid var(--border-2); border-radius: var(--r); padding: 3px 8px; font-size: 11.5px; font-family: var(--sans); }
.card-body { padding: 10px 14px 14px; font-size: 12.5px; color: var(--ink-2); flex: 1; min-height: 0; overflow: auto; }
.card-body table { width: 100%; border-collapse: collapse; font-size: 12px; }
.card-body td, .card-body th { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.card-body th { color: var(--ink-3); font-weight: 600; text-transform: uppercase; font-size: 10px; position: sticky; top: 0; background: var(--surface); }
.card-body tr:hover td { background: var(--bg); }
.stat-row { display: flex; gap: 16px; padding: 8px 4px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; margin-bottom: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .n { font-size: 19px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat .l { font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .03em; }
.stat.warn .n { color: var(--amber); }
.stat.bad .n { color: var(--red); }
.stat.good .n { color: var(--green); }
.badge { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .02em; }
.badge.ok { background: var(--green-dim); color: var(--green); }
.badge.warn { background: var(--amber-dim); color: var(--amber); }
.badge.bad { background: var(--red-dim); color: var(--red); }
.approve-row { display: flex; justify-content: flex-end; padding: 8px 14px; border-top: 1px solid var(--border); flex-shrink: 0; }
.approve-btn { border: none; border-radius: var(--r); padding: 8px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer; background: var(--blue); color: #fff; white-space: nowrap; }
.approve-btn:disabled { background: var(--green); cursor: default; opacity: .9; }
.approve-btn.loading { opacity: .6; cursor: wait; }
.who-box { max-width: 360px; margin: 100px auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 28px; box-shadow: var(--sh); text-align: center; }
.who-box h1 { font-size: 17px; margin-bottom: 6px; }
.who-box p { font-size: 12.5px; color: var(--ink-2); margin-bottom: 22px; }
.who-picks { display: flex; gap: 12px; justify-content: center; }
.who-pick { flex: 1; padding: 22px 10px; border: 1.5px solid var(--border-2); border-radius: var(--r-lg); background: var(--surface); cursor: pointer; font-size: 15px; font-weight: 700; color: var(--ink); transition: border-color .12s, background .12s; }
.who-pick:hover { border-color: var(--blue); background: var(--blue-dim); }
.who-pick .emoji { display: block; font-size: 28px; margin-bottom: 8px; }
.plat { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; display: inline-block; }
.plat.green { background: var(--green-dim); color: var(--green); }
.plat.amber { background: var(--amber-dim); color: var(--amber); }
.plat.red { background: var(--red-dim); color: var(--red); }
.plat.gray { background: var(--bg); color: var(--ink-3); border: 1px solid var(--border); }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="whoScreen" class="who-box">
  <h1>Daily Ops Review</h1>
  <p>Who's filling this out?</p>
  <div class="who-picks">
    <button class="who-pick" onclick="selectManager('AOD021','Jimmy')"><span class="emoji">🧑‍💼</span>Jimmy</button>
    <button class="who-pick" onclick="selectManager('AOD091','Sanu')"><span class="emoji">🧑‍💼</span>Sanu</button>
  </div>
</div>

<div id="mainScreen" class="wrap hidden">
  <div class="hdr">
    <div>
      <h1>Daily Ops Review</h1>
      <p>Review each section below and mark it read &amp; approved. All 4 must be approved by 1:00 PM.</p>
    </div>
    <div class="who">
      Signed in as <b id="whoName"></b>
      <button onclick="switchManager()">Switch</button>
    </div>
  </div>

  <div id="banner" class="banner"></div>

  <div class="filterbar" id="filterbar-global" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh);padding:8px 14px;margin-bottom:12px;flex-shrink:0;"></div>

  <div class="stack">
    <div class="card" data-section="late_signins">
      <div class="card-hdr">
        <h2>🕐 Late Sign-Ins</h2>
      </div>
      <div class="filterbar" id="filterbar-late_signins"></div>
      <div class="card-body" id="body-late_signins">Loading…</div>
      <div class="approve-row"><button class="approve-btn" onclick="approve('late_signins')">Mark as Read &amp; Approved</button></div>
    </div>

    <div class="card" data-section="power_status">
      <div class="card-hdr">
        <h2>⚡ Power Status <span class="live-badge"><span class="live-dot"></span>LIVE</span></h2>
      </div>
      <div class="card-body" id="body-power_status">Loading…</div>
      <div class="approve-row"><button class="approve-btn" onclick="approve('power_status')">Mark as Read &amp; Approved</button></div>
    </div>

    <div class="card" data-section="outlet_db">
      <div class="card-hdr">
        <h2>⭐ Outlet DB</h2>
      </div>
      <div class="filterbar" id="filterbar-outlet_db"></div>
      <div class="card-body" id="body-outlet_db">Loading…</div>
      <div class="approve-row"><button class="approve-btn" onclick="approve('outlet_db')">Mark as Read &amp; Approved</button></div>
    </div>

    <div class="card" data-section="employee_db">
      <div class="card-hdr">
        <h2>👥 Employee DB</h2>
      </div>
      <div class="filterbar" id="filterbar-employee_db"></div>
      <div class="card-body" id="body-employee_db">Loading…</div>
      <div class="approve-row"><button class="approve-btn" onclick="approve('employee_db')">Mark as Read &amp; Approved</button></div>
    </div>
  </div>
</div>

<script>
const API = 'https://aodapp-backend.onrender.com';
const SECTIONS = ['late_signins', 'power_status', 'outlet_db', 'employee_db'];
const FILTERED_SECTIONS = ['late_signins', 'outlet_db', 'employee_db'];
const FILTER_MODES = [
  { id: 'today',     label: 'Today' },
  { id: 'yesterday', label: 'Yesterday' },
  { id: '7d',        label: '7 Days' },
  { id: '28d',        label: '28 Days' },
  { id: 'custom',    label: 'Custom' },
];
let manager = JSON.parse(localStorage.getItem('opsReviewManager') || 'null');
const realToday = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
let approvedState = {};
let filterState = {
  late_signins: { mode: 'today', customDate: realToday },
  outlet_db:    { mode: 'today', customDate: realToday },
  employee_db:  { mode: 'today', customDate: realToday },
};
let globalMode = 'today';
let globalCustomDate = realToday;

function selectManager(id, name) {
  manager = { id, name };
  localStorage.setItem('opsReviewManager', JSON.stringify(manager));
  showMain();
}

function switchManager() {
  localStorage.removeItem('opsReviewManager');
  manager = null;
  document.getElementById('mainScreen').classList.add('hidden');
  document.getElementById('whoScreen').classList.remove('hidden');
}

function showMain() {
  document.getElementById('whoScreen').classList.add('hidden');
  document.getElementById('mainScreen').classList.remove('hidden');
  document.getElementById('whoName').textContent = manager.name;
  renderGlobalFilterBar();
  FILTERED_SECTIONS.forEach(renderFilterBar);
  loadAll();
}

function renderGlobalFilterBar() {
  const el = document.getElementById('filterbar-global');
  el.innerHTML = '<span style="font-size:11.5px;font-weight:600;color:var(--ink-2);margin-right:4px;">Apply to all:</span>' +
    FILTER_MODES.map(m =>
      `<button class="filter-btn ${globalMode === m.id ? 'active' : ''}" onclick="setGlobalFilter('${m.id}')">${m.label}</button>`
    ).join('') + (globalMode === 'custom' ? `<input type="date" class="filter-date" value="${globalCustomDate}" max="${realToday}" onchange="setGlobalCustomDate(this.value)">` : '');
}

function setGlobalFilter(mode) {
  globalMode = mode;
  if (mode !== 'custom') {
    FILTERED_SECTIONS.forEach(s => { filterState[s].mode = mode; renderFilterBar(s); loadSection(s); });
  }
  renderGlobalFilterBar();
  if (mode === 'custom') {
    FILTERED_SECTIONS.forEach(s => { filterState[s].mode = 'custom'; filterState[s].customDate = globalCustomDate; renderFilterBar(s); loadSection(s); });
  }
}

function setGlobalCustomDate(date) {
  globalCustomDate = date || realToday;
  FILTERED_SECTIONS.forEach(s => { filterState[s].customDate = globalCustomDate; loadSection(s); });
}

function daysAgoISO(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
}

function rangeForFilter(section) {
  const st = filterState[section];
  if (st.mode === 'today')     return { from: realToday, to: realToday };
  if (st.mode === 'yesterday') { const y = daysAgoISO(1); return { from: y, to: y }; }
  if (st.mode === '7d')        return { from: daysAgoISO(6), to: realToday };
  if (st.mode === '28d')       return { from: daysAgoISO(27), to: realToday };
  return { from: st.customDate, to: st.customDate };
}

function renderFilterBar(section) {
  const st = filterState[section];
  const el = document.getElementById(`filterbar-${section}`);
  el.innerHTML = FILTER_MODES.map(m =>
    `<button class="filter-btn ${st.mode === m.id ? 'active' : ''}" onclick="setFilter('${section}','${m.id}')">${m.label}</button>`
  ).join('') + (st.mode === 'custom' ? `<input type="date" class="filter-date" value="${st.customDate}" max="${realToday}" onchange="setCustomDate('${section}', this.value)">` : '');
}

function setFilter(section, mode) {
  filterState[section].mode = mode;
  renderFilterBar(section);
  loadSection(section);
}

function setCustomDate(section, date) {
  filterState[section].customDate = date || realToday;
  loadSection(section);
}

function loadSection(section) {
  if (section === 'late_signins') return loadLateSignins();
  if (section === 'outlet_db')    return loadOutletDb();
  if (section === 'employee_db')  return loadEmployeeDb();
}

async function api(path) {
  const r = await fetch(`${API}${path}`);
  return r.json();
}

function renderBanner() {
  const doneCount = SECTIONS.filter(s => approvedState[s]).length;
  const el = document.getElementById('banner');
  const complete = doneCount === SECTIONS.length;
  el.className = 'banner ' + (complete ? 'done' : 'pending');
  el.innerHTML = `<span>${complete ? '✅ All 4 sections approved for today' : `${doneCount} of ${SECTIONS.length} sections approved`}</span><span class="deadline">Due by 1:00 PM daily · ${realToday}</span>`;
}

function renderApproveButton(section) {
  const card = document.querySelector(`.card[data-section="${section}"]`);
  const btn = card.querySelector('.approve-btn');
  const info = approvedState[section];
  if (info) {
    btn.disabled = true;
    btn.textContent = `✓ Approved by ${info.approved_by || manager.name}`;
  } else {
    btn.disabled = false;
    btn.textContent = 'Mark as Read & Approved';
  }
}

async function loadStatus() {
  const d = await api(`/api/admin/ops-review/status?manager_id=${manager.id}&date=${realToday}`);
  approvedState = {};
  (d.sections || []).forEach(s => { if (s.approved) approvedState[s.section] = s; });
  SECTIONS.forEach(renderApproveButton);
  renderBanner();
}

async function approve(section) {
  const card = document.querySelector(`.card[data-section="${section}"]`);
  const btn = card.querySelector('.approve-btn');
  btn.classList.add('loading');
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/api/admin/ops-review/approve`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: realToday, section, manager_id: manager.id })
    });
    const d = await r.json();
    approvedState = {};
    (d.sections || []).forEach(s => { if (s.approved) approvedState[s.section] = s; });
    SECTIONS.forEach(renderApproveButton);
    renderBanner();
  } catch (e) {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

function fmtErr(id) { document.getElementById(id).textContent = 'Unable to load — try refreshing.'; }
function esc(s) { return String(s ?? '—').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function loadLateSignins() {
  const el = document.getElementById('body-late_signins');
  el.textContent = 'Loading…';
  try {
    const { from, to } = rangeForFilter('late_signins');
    const d = await api(`/api/admin/ops-review/data/late-signins?manager_id=${manager.id}&date_from=${from}&date_to=${to}`);
    const all = d.records || [];
    const late = all.filter(r => r.type === 'late');
    const missedIn = all.filter(r => r.type === 'missed_signin');
    const missedOut = all.filter(r => r.type === 'missed_signout');
    let html = `<div class="stat-row">
      <div class="stat ${late.length ? 'warn' : 'good'}"><div class="n">${late.length}</div><div class="l">Late</div></div>
      <div class="stat ${missedIn.length ? 'bad' : 'good'}"><div class="n">${missedIn.length}</div><div class="l">Missed Sign-in</div></div>
      <div class="stat ${missedOut.length ? 'warn' : 'good'}"><div class="n">${missedOut.length}</div><div class="l">Missed Sign-out</div></div>
    </div>`;
    if (all.length === 0) {
      html += '<span class="badge ok">All clear</span>';
    } else {
      const rows = [...late, ...missedIn, ...missedOut];
      html += '<table><tr><th>Date</th><th>Employee</th><th>Outlet</th><th>Shift</th><th>Sign In</th><th>Issue</th></tr>' +
        rows.map(r => {
          const issue = r.type === 'late' ? `<span class="badge warn">Late ${r.late_by_minutes ?? '—'}m</span>`
            : r.type === 'missed_signin' ? `<span class="badge bad">No sign-in</span>`
            : `<span class="badge warn">No sign-out</span>`;
          return `<tr><td>${esc(r.date)}</td><td>${esc(r.employee_name || r.employee_id)}</td><td>${esc(r.outlet_code || r.outlet)}</td><td>${esc(r.start_time)}–${esc(r.end_time)}</td><td>${esc(r.sign_in) || '—'}</td><td>${issue}</td></tr>`;
        }).join('') + '</table>';
    }
    el.innerHTML = html;
  } catch { fmtErr('body-late_signins'); }
}

// Known spelling mismatches between the "Power Cut Log" sheet (used by
// /power/summary) and the "Power status live" sheet (used by /power/live) —
// same outlet, different string, so a plain name match would silently drop it.
const POWER_NAME_ALIASES = { 'brookefield': 'brookfield' };
function normOutletName(n) {
  const k = String(n || '').trim().toLowerCase();
  return POWER_NAME_ALIASES[k] || k;
}
function platBadge(info) {
  if (!info || !info.label || info.label === '—') return '<span class="plat gray">—</span>';
  return `<span class="plat ${info.color || 'gray'}">${esc(info.label)}</span>`;
}

async function loadPowerStatus() {
  const el = document.getElementById('body-power_status');
  try {
    const [summary, live] = await Promise.all([api('/api/power/summary'), api('/api/power/live')]);
    const outlets = summary.outlets || {};
    const names = Object.keys(outlets).sort();
    const liveByName = {};
    (live.outlets || []).forEach(o => { liveByName[normOutletName(o.outlet)] = o; });
    // "Currently down" = outlet mid-outage (last event is off, no Power On form yet).
    const down = names.filter(n => (outlets[n].recent_outages || []).some(o => o.on === 'Still Off'));
    const affectedToday = names.filter(n => (outlets[n].today_mins || 0) > 0);
    const platformIssues = names.filter(n => {
      const p = liveByName[normOutletName(n)];
      if (!p) return false;
      return [p.swiggy_aod, p.swiggy_fc, p.zomato, p.ownly].some(x => x && x.color === 'red');
    });
    let html = `<div class="stat-row">
      <div class="stat ${down.length ? 'bad' : 'good'}"><div class="n">${down.length}</div><div class="l">Currently Down</div></div>
      <div class="stat ${platformIssues.length ? 'bad' : 'good'}"><div class="n">${platformIssues.length}</div><div class="l">Platform Issues</div></div>
      <div class="stat ${affectedToday.length ? 'warn' : 'good'}"><div class="n">${affectedToday.length}</div><div class="l">Affected Today</div></div>
      <div class="stat"><div class="n">${names.length}</div><div class="l">Total Outlets</div></div>
      <div class="stat"><div class="l" style="margin-top:5px">As of ${esc(live.generated_at || summary.generated_at || '—')}</div></div>
    </div>`;
    if (names.length === 0) {
      html += '<span>No outlet power data available.</span>';
    } else {
      // Currently-down outlets float to the top, then platform issues, then affected-today, then the rest.
      const ranked = names.slice().sort((a, b) => {
        const rank = n => down.includes(n) ? 0 : platformIssues.includes(n) ? 1 : (outlets[n].today_mins || 0) > 0 ? 2 : 3;
        return rank(a) - rank(b) || a.localeCompare(b);
      });
      html += '<table><tr><th>Outlet</th><th>Power</th><th>Swiggy AOD</th><th>Swiggy FC</th><th>Zomato</th><th>Ownly</th><th>Down Today</th><th>Last 7d</th><th>Last 28d</th></tr>' +
        ranked.map(n => {
          const o = outlets[n];
          const p = liveByName[normOutletName(n)];
          const isDown = down.includes(n);
          const status = isDown ? '<span class="badge bad">Still Off</span>'
            : (o.today_mins || 0) > 0 ? '<span class="badge ok">Restored</span>'
            : '<span class="badge ok">Normal</span>';
          return `<tr><td>${esc(n)}</td><td>${status}</td><td>${platBadge(p && p.swiggy_aod)}</td><td>${platBadge(p && p.swiggy_fc)}</td><td>${platBadge(p && p.zomato)}</td><td>${platBadge(p && p.ownly)}</td><td>${(o.today_mins || 0) > 0 ? `<span class="badge warn">${esc(o.today_fmt || (o.today_mins + ' min'))}</span>` : '—'}</td><td>${esc(o.last_7_days_fmt) || '—'}</td><td>${esc(o.last_28_days_fmt) || '—'}</td></tr>`;
        }).join('') + '</table>';
    }
    el.innerHTML = html;
  } catch { fmtErr('body-power_status'); }
}

async function loadOutletDb() {
  const el = document.getElementById('body-outlet_db');
  el.textContent = 'Loading…';
  try {
    const { from, to } = rangeForFilter('outlet_db');
    const d = await api(`/api/admin/ops-review/data/outlet-db?manager_id=${manager.id}&date_from=${from}&date_to=${to}`);
    const rows = (d.outlets || []).slice().sort((a, b) => (a.net_pct ?? 0) - (b.net_pct ?? 0));
    const worst = rows.filter(r => (r.error_rate_pct || 0) > 5).length;
    let html = `<div class="stat-row">
      <div class="stat"><div class="n">${rows.length}</div><div class="l">Outlets</div></div>
      <div class="stat ${worst ? 'bad' : 'good'}"><div class="n">${worst}</div><div class="l">Error Rate &gt; 5%</div></div>
    </div>`;
    if (rows.length === 0) {
      html += '<span>No ratings data for this range yet.</span>';
    } else {
      html += '<table><tr><th>Outlet</th><th>Orders</th><th>High%</th><th>Error%</th><th>Net%</th><th>IGCC</th></tr>' +
        rows.map(r => `<tr><td>${esc(r.outlet_code)}</td><td>${esc(r.rista_orders)}</td><td>${esc(r.high_rate_pct)}</td><td><span class="badge ${(r.error_rate_pct||0) > 5 ? 'bad' : 'ok'}">${esc(r.error_rate_pct)}%</span></td><td>${esc(r.net_pct)}</td><td>${esc(r.igcc)}</td></tr>`).join('') +
        '</table>';
    }
    el.innerHTML = html;
  } catch { fmtErr('body-outlet_db'); }
}

async function loadEmployeeDb() {
  const el = document.getElementById('body-employee_db');
  el.textContent = 'Loading…';
  try {
    const { from, to } = rangeForFilter('employee_db');
    const d = await api(`/api/admin/employee-scorecard?week_start=${from}&week_end=${to}`);
    const rows = (d.scorecards || []).slice().sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
    const lowScorers = rows.filter(r => (r.score ?? 0) < 0).length;
    let html = `<div class="stat-row">
      <div class="stat"><div class="n">${rows.length}</div><div class="l">Employees</div></div>
      <div class="stat ${lowScorers ? 'bad' : 'good'}"><div class="n">${lowScorers}</div><div class="l">Score &lt; 0</div></div>
      <div class="stat"><div class="n">${from} → ${to}</div><div class="l">Range</div></div>
    </div>`;
    if (rows.length === 0) {
      html += '<span>No scorecard data for this range.</span>';
    } else {
      html += '<table><tr><th>Employee</th><th>Orders</th><th>High</th><th>Errors</th><th>Checklist%</th><th>Late</th><th>Score</th></tr>' +
        rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.total_orders)}</td><td>${esc(r.high_rated)}</td><td>${esc(r.errors)}</td><td>${esc(r.checklist_pct)}</td><td>${esc(r.late_count)}</td><td><span class="badge ${(r.score||0) < 0 ? 'bad' : 'ok'}">${esc(r.score)}</span></td></tr>`).join('') +
        '</table>';
    }
    el.innerHTML = html;
  } catch { fmtErr('body-employee_db'); }
}

async function loadAll() {
  await Promise.all([loadStatus(), loadLateSignins(), loadPowerStatus(), loadOutletDb(), loadEmployeeDb()]);
}

if (manager) { showMain(); } else { document.getElementById('whoScreen').classList.remove('hidden'); }
</script>
</body>
</html>
