function prSetPreset(days) {
  [7,28].forEach(d => {
    const btn = document.getElementById('prtab-' + d);
    if (btn) btn.classList.toggle('active', d === days);
  });
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  const from = new Date(yesterday); from.setDate(yesterday.getDate() - (days - 1));
  const fmt = d => d.toISOString().split('T')[0];
  const startEl = document.getElementById('pr-start');
  const endEl   = document.getElementById('pr-end');
  if (startEl) startEl.value = fmt(from);
  if (endEl)   endEl.value   = fmt(yesterday);
  prLoad();
}

function prSetViewTab(tab) {
  _prViewTab = tab;
  ['online','dinein','combined'].forEach(t => {
    const btn = document.getElementById('prvtab-' + t);
    if (btn) btn.classList.toggle('active', t === tab);
  });
  // reset sort key to match the new tab's primary column
  _prSort = { key: tab === 'dinein' ? 'dine_in_orders' : tab === 'combined' ? 'rista_orders' : 'online_orders', dir: -1 };
  prDrawTable();
}

async function prLoad() {
  const from = document.getElementById('pr-start')?.value;
  const to   = document.getElementById('pr-end')?.value;
  if (!from || !to) return;
  const el = document.getElementById('pr-content');
  if (el) el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading… (Rista data may take 30–60s on first load)</div>';
  try {
    const r = await fetch(`https://aodapp-backend.onrender.com/api/admin/product-rankings?date_from=${from}&date_to=${to}`,
      { headers: { 'Authorization': `Bearer ${_orToken}` } });
    if (r.status === 401 || r.status === 403) { lsLogout(); renderProductsPage(); return; }
    const d = await r.json();
    const products = d.products || [];
    const statusEl = document.getElementById('pr-status');
    if (statusEl) statusEl.textContent = products.length ? `${products.length} products · ${d.date_from} → ${d.date_to}` : '';
    prRenderTable(products, el);
  } catch(e) {
    if (el) el.innerHTML = '<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Failed to load</div><div class="state-body">'+e+'</div></div>';
  }
}

let _prData = [];
let _prSort = { key: 'online_orders', dir: -1 };

function prRenderTable(products, el) {
  if (!products.length) {
    el.innerHTML = '<div class="no-outages" style="padding:40px">No data for this range.</div>';
    return;
  }
  _prData = products;
  const cats = [...new Set(products.map(p => p.category || '').filter(Boolean))].sort();
  const sel = document.getElementById('pr-category');
  if (sel) {
    const prev = sel.value;
    sel.innerHTML = '<option value="">All</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
    if (cats.includes(prev)) sel.value = prev;
  }
  prDrawTable(el);
}

function prDrawTable(el) {
  if (!el) el = document.getElementById('pr-content');
  const minOrders = parseInt(document.getElementById('pr-min-orders')?.value || '0', 10) || 0;
  const catFilter = document.getElementById('pr-category')?.value || '';
  const { key, dir } = _prSort;
  const view = _prViewTab; // 'online' | 'dinein' | 'combined'

  // For min-orders filter, use the primary order col for the current view
  const orderKey = view === 'dinein' ? 'dine_in_orders' : view === 'combined' ? 'rista_orders' : 'online_orders';

  const sorted = [..._prData]
    .filter(p => (p[orderKey] || 0) >= minOrders)
    .filter(p => !catFilter || (p.category || '') === catFilter)
    // hide products with 0 orders in current view
    .filter(p => (p[orderKey] || 0) > 0 || view === 'combined')
    .sort((a, b) => {
      const av = a[key] ?? -Infinity, bv = b[key] ?? -Infinity;
      return typeof av === 'string' ? av.localeCompare(bv) * dir : (av - bv) * dir;
    });

  const thBase = 'padding:10px 13px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--border-2);white-space:nowrap;font-family:var(--mono);cursor:pointer;user-select:none;transition:color .14s';
  const thR = `${thBase};text-align:right`;
  const thL = `${thBase};text-align:left`;

  const col = (label, k, align='right') => {
    const active = key === k;
    const arrow  = active ? (dir === 1 ? ' ↑' : ' ↓') : ' ↕';
    const color  = active ? 'color:var(--blue)' : 'color:var(--ink-3)';
    const base   = align === 'left' ? thL : thR;
    return `<th style="${base};${color}" onclick="prSortBy('${k}')">${label}<span style="opacity:.5;font-size:9px">${arrow}</span></th>`;
  };

  let thead, rowsFn;

  const td  = (val, cls='') => `<td style="padding:10px 13px;text-align:right;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono)"><span class="sc-pct ${cls}">${val}</span></td>`;
  const tdL = (val, bold=false) => `<td style="padding:10px 13px;font-size:12px;${bold?'font-weight:700;':''}border-bottom:1px solid var(--border);color:var(--ink)">${val}</td>`;
  const tdB = (val) => `<td style="padding:10px 13px;text-align:right;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);font-family:var(--mono);color:var(--blue)">${val}</td>`;

  if (view === 'online') {
    thead = `<thead><tr>
      <th style="${thL};color:var(--ink-3)">#</th>
      ${col('Product','product','left')}
      ${col('Category','category','left')}
      ${col('Online Orders','online_orders')}
      ${col('Total Rated','total_rated')}
      ${col('High ⭐','high_rated')}
      ${col('Low 👎','low_rated')}
      ${col('IGCC','igcc')}
      ${col('Errors','total_errors')}
      ${col('High %','high_pct')}
      ${col('Error %','error_pct')}
      ${col('Net %','net_pct')}
    </tr></thead>`;
    rowsFn = (p, i) => {
      const netCls  = p.net_pct  >= 10 ? 'good' : p.net_pct  >= 0 ? '' : 'bad';
      const errCls  = p.error_pct < 1  ? 'good' : p.error_pct < 2 ? 'warn' : 'bad';
      const highCls = p.high_pct >= 20 ? 'good' : p.high_pct >= 10 ? 'warn' : 'bad';
      return `<tr>
        ${tdL(i+1)} ${tdL(p.product,true)} ${tdL(p.category||'—')}
        ${tdB(p.online_orders||'—')} ${tdB(p.total_rated)}
        ${td(p.high_rated)} ${td(p.low_rated)} ${td(p.igcc)} ${td(p.total_errors)}
        ${td(p.high_pct+'%',highCls)} ${td(p.error_pct+'%',errCls)} ${td(p.net_pct+'%',netCls)}
      </tr>`;
    };
  } else if (view === 'dinein') {
    thead = `<thead><tr>
      <th style="${thL};color:var(--ink-3)">#</th>
      ${col('Product','product','left')}
      ${col('Category','category','left')}
      ${col('Dine In Orders','dine_in_orders')}
    </tr></thead>`;
    rowsFn = (p, i) => `<tr>
      ${tdL(i+1)} ${tdL(p.product,true)} ${tdL(p.category||'—')}
      ${tdB(p.dine_in_orders||'—')}
    </tr>`;
  } else {
    // combined — sorted by online_orders, shows both + ratings
    thead = `<thead><tr>
      <th style="${thL};color:var(--ink-3)">#</th>
      ${col('Product','product','left')}
      ${col('Category','category','left')}
      ${col('Online','online_orders')}
      ${col('Dine In','dine_in_orders')}
      ${col('Total','rista_orders')}
      ${col('Total Rated','total_rated')}
      ${col('High ⭐','high_rated')}
      ${col('Low 👎','low_rated')}
      ${col('IGCC','igcc')}
      ${col('High %','high_pct')}
      ${col('Error %','error_pct')}
      ${col('Net %','net_pct')}
    </tr></thead>`;
    rowsFn = (p, i) => {
      const netCls  = p.net_pct  >= 10 ? 'good' : p.net_pct  >= 0 ? '' : 'bad';
      const errCls  = p.error_pct < 1  ? 'good' : p.error_pct < 2 ? 'warn' : 'bad';
      const highCls = p.high_pct >= 20 ? 'good' : p.high_pct >= 10 ? 'warn' : 'bad';
      return `<tr>
        ${tdL(i+1)} ${tdL(p.product,true)} ${tdL(p.category||'—')}
        ${tdB(p.online_orders||'—')} ${tdB(p.dine_in_orders||'—')} ${tdB(p.rista_orders||'—')}
        ${tdB(p.total_rated)}
        ${td(p.high_rated)} ${td(p.low_rated)} ${td(p.igcc)}
        ${td(p.high_pct+'%',highCls)} ${td(p.error_pct+'%',errCls)} ${td(p.net_pct+'%',netCls)}
      </tr>`;
    };
  }

  const rows = sorted.map(rowsFn).join('');
  const minW = view === 'dinein' ? '500px' : view === 'combined' ? '1100px' : '1000px';
  el.innerHTML = `<div style="overflow-x:auto"><table class="sc-table" style="min-width:${minW}">${thead}<tbody>${rows}</tbody></table></div>`;
  if (!sorted.length) el.innerHTML = '<div class="no-outages" style="padding:40px">No data for this view.</div>';
}

function prSortBy(key) {
  if (_prSort.key === key) {
    _prSort.dir *= -1;
  } else {
    _prSort = { key, dir: -1 };
  }
  prDrawTable();
}

/* ── RATING TRENDS ── */
function trSetPreset(days) {
  [7,1].forEach(d => {
    const btn = document.getElementById('trtab-' + d);
    if (btn) btn.classList.toggle('active', d === days);
  });
  const fmt = d => d.toISOString().split('T')[0];
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  const s = id => document.getElementById(id);
  let aStart, aEnd, bStart, bEnd;
  if (days === 1) {
    // 1D: yesterday vs same day last week (7 days before)
    aStart = aEnd = new Date(yesterday);
    bStart = bEnd = new Date(yesterday); bStart.setDate(yesterday.getDate() - 7); bEnd = new Date(bStart);
  } else {
    // 7D: last 7 days vs the 7 days before that
    aEnd   = new Date(yesterday);
    aStart = new Date(yesterday); aStart.setDate(aEnd.getDate() - 6);
    bEnd   = new Date(aStart); bEnd.setDate(aStart.getDate() - 1);
    bStart = new Date(bEnd);   bStart.setDate(bEnd.getDate() - 6);
  }
  if (s('tr-a-start')) s('tr-a-start').value = fmt(aStart);
  if (s('tr-a-end'))   s('tr-a-end').value   = fmt(aEnd);
  if (s('tr-b-start')) s('tr-b-start').value = fmt(bStart);
  if (s('tr-b-end'))   s('tr-b-end').value   = fmt(bEnd);
  trLoad();
}

async function trLoad() {
  const s = id => document.getElementById(id)?.value;
  const aFrom = s('tr-a-start'), aTo = s('tr-a-end');
  const bFrom = s('tr-b-start'), bTo = s('tr-b-end');
  if (!aFrom || !aTo || !bFrom || !bTo) return;
  const el = document.getElementById('tr-content');
  if (el) el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading both periods…</div>';
  const statusEl = document.getElementById('tr-status');
  try {
    const fetchPeriod = async (from, to) => {
      const r = await fetch(`https://aodapp-backend.onrender.com/api/admin/product-rankings?date_from=${from}&date_to=${to}`,
        { headers: { 'Authorization': `Bearer ${_orToken}` } });
      if (r.status === 401 || r.status === 403) { lsLogout(); renderProductsPage(); throw new Error('auth'); }
      return (await r.json()).products || [];
    };
    const [pA, pB] = await Promise.all([fetchPeriod(aFrom, aTo), fetchPeriod(bFrom, bTo)]);
    // Build lookup by product name
    const mapB = {};
    pB.forEach(p => { mapB[p.product] = p; });
    // Only show products that have ratings in at least one period
    const allNames = [...new Set([...pA.map(p=>p.product), ...pB.map(p=>p.product)])];
    const rows = allNames.map(name => {
      const a = pA.find(p=>p.product===name) || { high_rated:0, low_rated:0, total_rated:0, online_orders:0, category:'' };
      const b = mapB[name]                   || { high_rated:0, low_rated:0, total_rated:0, online_orders:0, category:'' };
      return {
        product:   name,
        category:  a.category || b.category || '',
        aHigh: a.high_rated, aLow: a.low_rated, aTotal: a.total_rated, aOrders: a.online_orders,
        bHigh: b.high_rated, bLow: b.low_rated, bTotal: b.total_rated, bOrders: b.online_orders,
        dHigh: a.high_rated - b.high_rated,
        dLow:  a.low_rated  - b.low_rated,
        dTotal: a.total_rated - b.total_rated,
        dOrders: a.online_orders - b.online_orders,
      };
    }).filter(r => r.aTotal > 0 || r.bTotal > 0)
      .sort((a,b) => b.aOrders - a.aOrders);

    if (statusEl) statusEl.textContent = `${rows.length} products · A: ${aFrom}→${aTo} · B: ${bFrom}→${bTo}`;
    trRenderTable(rows, aFrom, aTo, bFrom, bTo, el);
  } catch(e) {
    if (e.message !== 'auth' && el)
      el.innerHTML = '<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Failed to load</div><div class="state-body">'+e+'</div></div>';
  }
}

function trRenderTable(rows, aFrom, aTo, bFrom, bTo, el) {
  if (!rows.length) { el.innerHTML = '<div class="no-outages" style="padding:40px">No rated data for these ranges.</div>'; return; }
  const thBase = 'padding:9px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--border-2);white-space:nowrap;font-family:var(--mono);color:var(--ink-3)';
  const thC = `${thBase};text-align:center`;
  const thL = `${thBase};text-align:left`;
  const tdL = v => `<td style="padding:9px 12px;font-size:12px;border-bottom:1px solid var(--border);color:var(--ink)">${v}</td>`;
  const tdN = v => `<td style="padding:9px 12px;text-align:center;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);color:var(--ink)">${v}</td>`;
  const tdD = (v, base) => {
    const cls = v > 0 ? 'color:#16a34a;font-weight:700' : v < 0 ? 'color:#dc2626;font-weight:700' : 'color:var(--ink-3)';
    const sym = v > 0 ? '▲' : v < 0 ? '▼' : '—';
    const pct = base > 0 ? Math.round(Math.abs(v) / base * 100) : null;
    const pctStr = pct !== null ? `<span style="font-size:10px;opacity:.8"> ${pct}%</span>` : '';
    const val = v !== 0 ? `${sym} ${Math.abs(v)}${pctStr}` : '—';
    return `<td style="padding:9px 12px;text-align:center;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);${cls}">${val}</td>`;
  };
  const thead = `<thead>
    <tr>
      <th style="${thL}" rowspan="2">#</th>
      <th style="${thL}" rowspan="2">Product</th>
      <th style="${thL}" rowspan="2">Category</th>
      <th style="${thC};background:#eff6ff;border-left:2px solid var(--blue)" colspan="3">Period A · ${aFrom} → ${aTo}</th>
      <th style="${thC};background:#f0fdf4;border-left:2px solid var(--green)" colspan="3">Period B · ${bFrom} → ${bTo}</th>
      <th style="${thC};background:#faf5ff;border-left:2px solid #7c3aed" colspan="3">Δ Change (A − B)</th>
    </tr>
    <tr>
      <th style="${thC};background:#eff6ff;color:var(--blue)">Orders</th>
      <th style="${thC};background:#eff6ff;color:var(--blue)">High ⭐</th>
      <th style="${thC};background:#eff6ff;color:var(--blue)">Low 👎</th>
      <th style="${thC};background:#f0fdf4;color:var(--green);border-left:2px solid var(--green)">Orders</th>
      <th style="${thC};background:#f0fdf4;color:var(--green)">High ⭐</th>
      <th style="${thC};background:#f0fdf4;color:var(--green)">Low 👎</th>
      <th style="${thC};background:#faf5ff;color:#7c3aed;border-left:2px solid #7c3aed">Orders</th>
      <th style="${thC};background:#faf5ff;color:#7c3aed">High</th>
      <th style="${thC};background:#faf5ff;color:#7c3aed">Low</th>
    </tr>
  </thead>`;
  const tbody = rows.map((r,i) => `<tr>
    ${tdL(i+1)} ${tdL(`<strong>${r.product}</strong>`)} ${tdL(r.category||'—')}
    ${tdN(r.aOrders||'—')} ${tdN(r.aHigh||'—')} ${tdN(r.aLow||'—')}
    ${tdN(r.bOrders||'—')} ${tdN(r.bHigh||'—')} ${tdN(r.bLow||'—')}
    ${tdD(r.dOrders, r.bOrders)} ${tdD(r.dHigh, r.bHigh)} ${tdD(r.dLow*-1, r.bLow)}
  </tr>`).join('');
  el.innerHTML = `<div style="overflow-x:auto"><table class="sc-table" style="min-width:900px">${thead}<tbody>${tbody}</tbody></table></div>
    <div style="font-size:11px;color:var(--ink-3);margin-top:10px;font-family:var(--mono)">
      Δ Orders/High ▲ = more in A vs B (good). Δ Low ▲ = fewer low ratings in A vs B (good). Sorted by Period A online orders.
    </div>`;
}

      fetch(`https://aodapp-backend.onrender.com/api/admin/scoop-cogs?date_from=${from}&date_to=${to}`,     { headers: { 'Authorization': `Bearer ${_orToken}` } }),
    ]);
    if (rankRes.status === 401 || rankRes.status === 403) { lsLogout(); renderProductsPage(); return; }
    const d    = await rankRes.json();
    const cogs = cogsRes.ok ? await cogsRes.json() : null;
    _scpCogsData = cogs;
    const flavours = d.flavours || [];
    _scpOnlineData = d.flavours_online || [];
    _scpDineinData = d.flavours_dinein || [];
    const statusEl = document.getElementById('scp-status');
    if (statusEl) statusEl.textContent = flavours.length ? `${flavours.length} flavours · ${d.date_from} → ${d.date_to}` : '';
    scpRenderTable(flavours, el);
  } catch(e) {
    if (el) el.innerHTML = '<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Failed to load</div><div class="state-body">'+e+'</div></div>';
  }
}

function scpRenderTable(flavours, el) {
  if (!flavours.length) {
    el.innerHTML = '<div class="no-outages" style="padding:40px">No scoop data for this range.</div>';
    return;
  }
  _scpData = flavours;
  _scpSort = { key: 'units', dir: -1 };
  scpDrawTable(el);
}

function scpDrawTable(el) {
  if (!el) el = document.getElementById('scp-content');
  const { key, dir } = _scpSort;
  const sorted = [..._scpData].sort((a, b) => {
    const av = a[key] ?? -Infinity, bv = b[key] ?? -Infinity;
    return typeof av === 'string' ? av.localeCompare(bv) * dir : (av - bv) * dir;
  });

  const thBase = 'padding:10px 13px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--border-2);white-space:nowrap;font-family:var(--mono);cursor:pointer;user-select:none;transition:color .14s';
  const thR = `${thBase};text-align:right`;
  const thL = `${thBase};text-align:left`;

  const col = (label, k, align='right') => {
    const active = key === k;
    const arrow  = active ? (dir === 1 ? ' ↑' : ' ↓') : ' ↕';
    const color  = active ? 'color:var(--blue)' : 'color:var(--ink-3)';
    const base   = align === 'left' ? thL : thR;
    return `<th style="${base};${color}" onclick="scpSortBy('${k}')">${label}<span style="opacity:.5;font-size:9px">${arrow}</span></th>`;
  };

  const thead = `<thead><tr>
    <th style="${thL};color:var(--ink-3)">#</th>
    ${col('Flavour','flavour','left')}
    ${col('Total Units','units')}
    ${col('2-Scoop','two_scoop_scoops')}
    ${col('3-Scoop','three_scoop_scoops')}
    ${col('Combo Units','combo_units')}
  </tr></thead>`;

  const mkRows = (rows) => rows.map((f, i) => {
    const tdL = (val, bold=false) => `<td style="padding:9px 12px;font-size:12px;${bold?'font-weight:700;':''}border-bottom:1px solid var(--border);color:var(--ink)">${val}</td>`;
    const tdN = (val, hi=false) => `<td style="padding:9px 12px;text-align:right;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);${hi?'font-weight:700;color:var(--blue)':''}">${val ?? '—'}</td>`;
    return `<tr>
      ${tdL(i + 1)}
      ${tdL(f.flavour, true)}
      ${tdN(f.units, true)}
      ${tdN(f.two_scoop_scoops)}
      ${tdN(f.three_scoop_scoops)}
      ${tdN(f.combo_units)}
    </tr>`;
  }).join('');

  const mkTable = (rows) => `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:340px">${thead}<tbody>${mkRows(rows)}</tbody></table></div>`;

  const sortFn = (a, b) => { const av = a[key] ?? -Infinity, bv = b[key] ?? -Infinity; return typeof av === 'string' ? av.localeCompare(bv) * dir : (av - bv) * dir; };
  const onlineSorted = [..._scpOnlineData].sort(sortFn).filter(f => f.two_scoop_scoops > 0 || f.three_scoop_scoops > 0);
  const dineinSorted = [..._scpDineinData].sort(sortFn).filter(f => f.two_scoop_scoops > 0 || f.three_scoop_scoops > 0);
  const flavourHtml = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden">
        <div style="padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px">
          🪑 Dine In
        </div>
        ${mkTable(dineinSorted)}
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden">
        <div style="padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px">
          🌐 Online
        </div>
        ${mkTable(onlineSorted)}
      </div>
    </div>`;

  const cogsHtml = _scpCogsData ? scpRenderCogs(_scpCogsData) : '';
  el.innerHTML = flavourHtml + cogsHtml;
}

function scpRenderCogs(data) {
  const rows = data.rows || [];
  const total = data.total || {};
  const fmt = v => v == null ? '—' : Number(v).toLocaleString('en-IN', {minimumFractionDigits:2,maximumFractionDigits:2});
  const cogsColor = () => 'color:var(--green);font-weight:700';

  const thS = 'padding:9px 14px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);background:#f8fafd;border-bottom:2px solid var(--border-2);white-space:nowrap;font-family:var(--mono)';
  const thSR = thS + ';text-align:right';

  const thead = `<thead><tr>
    <th style="${thS}">Row</th>
    <th style="${thSR}">Combos</th>
    <th style="${thSR}">Gross</th>
    <th style="${thSR}">Net</th>
    <th style="${thSR}">Material</th>
    <th style="${thSR}">Supplies</th>
    <th style="${thSR}">Pkg Charge</th>
    <th style="${thSR}">COGS %</th>
  </tr></thead>`;

  const tdL = (v, bold=false) => `<td style="padding:9px 14px;font-size:12px;border-bottom:1px solid var(--border);${bold?'font-weight:700':''}color:var(--ink)">${v}</td>`;
  const tdR = (v, extra='') => `<td style="padding:9px 14px;text-align:right;font-size:12px;border-bottom:1px solid var(--border);font-family:var(--mono);${extra}">${v}</td>`;

  const bodyRows = rows.map(r => `<tr>
    ${tdL(r.label, true)}
    ${tdR(r.combos)}
    ${tdR(fmt(r.gross))}
    ${tdR(fmt(r.net))}
    ${tdR(fmt(r.mat))}
    ${tdR(fmt(r.sup))}
    ${tdR(fmt(r.pkg))}
    ${tdR(r.cogs_pct != null ? r.cogs_pct.toFixed(2)+'%' : '—', cogsColor(r.cogs_pct))}
  </tr>`).join('');

  const totalRow = `<tr style="background:#f8fafd">
    ${tdL('<strong>Total</strong>', true)}
    ${tdR(`<strong>${total.combos ?? ''}</strong>`)}
    ${tdR(`<strong>${fmt(total.gross)}</strong>`)}
    ${tdR(`<strong>${fmt(total.net)}</strong>`)}
    ${tdR(`<strong>${fmt(total.mat)}</strong>`)}
    ${tdR(`<strong>${fmt(total.sup)}</strong>`)}
    ${tdR(`<strong>${fmt(total.pkg)}</strong>`)}
    ${tdR(total.cogs_pct != null ? `<strong>${total.cogs_pct.toFixed(2)}%</strong>` : '—', cogsColor(total.cogs_pct))}
  </tr>`;

  return `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-top:4px">
      <div style="padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--ink)">
        📊 Scoop COGS Breakdown
      </div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:700px">
          ${thead}<tbody>${bodyRows}${totalRow}</tbody>
        </table>
      </div>
    </div>`;
}

function scpSortBy(key) {
  if (_scpSort.key === key) {
    _scpSort.dir *= -1;
  } else {
    _scpSort = { key, dir: -1 };
  }
  scpDrawTable();
}

/* ── INVENTORY PAGE (Live OOS + Tracker + Actions) ── */
let _invTrackerDays = 7;
let _invLiveData    = null;
let _invTrackerData = null;

function renderInventoryPage() {
  const el = document.getElementById('pageBody');
  el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading inventory data…</div>';
  _invLiveData = null; _invTrackerData = null;

  Promise.all([
    fetch(API + '/api/inventory/live').then(r => r.json()),
    fetch(`${API}/api/inventory/tracker?days=${_invTrackerDays}`).then(r => r.json()),
  ]).then(([live, tracker]) => {
    _invLiveData    = live;
    _invTrackerData = tracker;
    _renderInventory();
  }).catch(() => { el.innerHTML = errBox(''); });
}

function _invSetDays(n) {
  _invTrackerDays = n;
  fetch(`${API}/api/inventory/tracker?days=${n}`).then(r => r.json()).then(d => {
    _invTrackerData = d;
    _renderInventory();
  });
}

function _renderInventory() {
  const el = document.getElementById('pageBody');
  const live    = _invLiveData    || {};
  const tracker = _invTrackerData || {};

  const items   = live.items   || [];
  const events  = tracker.events || [];
  const oos     = items.filter(x => (x.status||'').toUpperCase().includes('OUT'));
  const inStock = items.filter(x => (x.status||'').toUpperCase().includes('IN'));

  const byOutlet = {};
  oos.forEach(x => { (byOutlet[x.outlet] = byOutlet[x.outlet] || []).push(x); });

  // Repeat offenders from tracker
  const repeatByOutlet = {};
  events.forEach(e => { repeatByOutlet[e.outlet] = (repeatByOutlet[e.outlet] || 0) + 1; });
  const worstOutlet = Object.entries(repeatByOutlet).sort((a,b) => b[1]-a[1])[0];

  const fmtDur = hrs => {
    if (hrs == null || hrs === '') return '—';
    const h = Math.floor(hrs), m = Math.round((hrs - h) * 60);
    return h === 0 ? `${m}m` : `${h}h ${m > 0 ? ' '+m+'m' : ''}`;
  };

  // ── Stat cards ──
  const statsHtml = `
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">Live OOS Items</div>
        <div class="stat-value" style="color:${oos.length>0?'var(--red)':'var(--green)'}">${oos.length}</div>
        <div class="stat-sub">Right now</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Outlets Affected</div>
        <div class="stat-value" style="color:${Object.keys(byOutlet).length>0?'var(--amber)':'var(--green)'}">${Object.keys(byOutlet).length}</div>
        <div class="stat-sub">At least 1 OOS item</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Events (${_invTrackerDays}d)</div>
        <div class="stat-value" style="color:var(--ink)">${events.length}</div>
        <div class="stat-sub">Critical stock-outs</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Worst Outlet (${_invTrackerDays}d)</div>
        <div class="stat-value" style="color:var(--amber);font-size:18px">${worstOutlet ? worstOutlet[0] : '—'}</div>
        <div class="stat-sub">${worstOutlet ? worstOutlet[1]+' events' : 'No events'}</div>
      </div>
    </div>`;

  // ── Action items ──
  const actions = [];
  // Critical: OOS > 4 hours
  oos.filter(x => (x.duration_hrs||0) > 4)
     .sort((a,b) => (b.duration_hrs||0) - (a.duration_hrs||0))
     .forEach(x => actions.push({ priority:'High', outlet: x.outlet, item: x.item, detail: `Out for ${fmtDur(x.duration_hrs)} — restock immediately` }));
  // Medium: OOS < 4 hrs
  oos.filter(x => (x.duration_hrs||0) <= 4)
     .sort((a,b) => (b.duration_hrs||0) - (a.duration_hrs||0))
     .forEach(x => actions.push({ priority:'Medium', outlet: x.outlet, item: x.item, detail: `Out since ${x.out_since||'—'} — monitor and restock` }));
  // Repeat offenders from tracker (not currently OOS)
  Object.entries(repeatByOutlet).sort((a,b) => b[1]-a[1]).slice(0,5).forEach(([outlet, count]) => {
    if (count >= 3) actions.push({ priority:'Medium', outlet, item: '—', detail: `${count} critical stock-outs in last ${_invTrackerDays}d — review procurement` });
  });

  const storageKey = 'invActions_' + new Date().toISOString().slice(0,10);
  let checked = {};
  try { checked = JSON.parse(localStorage.getItem(storageKey)||'{}'); } catch {}

  const actionsHtml = actions.length ? `
    <div class="inv-section-head">📌 Actions Required</div>
    <div class="action-list" style="margin-bottom:24px">
      ${actions.map((a,i) => {
        const done = !!checked['inv_'+i];
        return `<div class="action-item${done?' action-done':''}" id="inv-action-${i}" onclick="toggleInvAction(${i},'${storageKey}')">
          <div class="action-check${done?' action-check-done':''}">${done?'✓':''}</div>
          <div class="action-content">
            <div class="action-top">
              <span class="pri-${a.priority.toLowerCase()}">${a.priority}</span>
              <span class="action-area">${a.outlet}</span>
              ${a.item !== '—' ? `<span style="font-size:11px;color:var(--ink-3);font-family:var(--mono)">${a.item}</span>` : ''}
            </div>
            <div class="action-text">${a.detail}</div>
          </div>
        </div>`;
      }).join('')}
    </div>` : `<div style="font-size:12px;color:var(--green);margin-bottom:20px;display:flex;align-items:center;gap:6px"><span>✅</span> No inventory actions required right now.</div>`;

  // ── Live OOS table per outlet ──
  const liveHtml = oos.length === 0
    ? `<div class="state-box"><div class="state-icon">✅</div><div class="state-title">All clear</div><div class="state-body">No items currently out of stock.</div></div>`
    : Object.entries(byOutlet).sort((a,b) => b[1].length - a[1].length).map(([outlet, rows]) => {
        const maxDur = Math.max(...rows.map(r => r.duration_hrs||0));
        const urgentColor = maxDur > 4 ? 'var(--red)' : maxDur > 1 ? 'var(--amber)' : 'var(--ink-3)';
        return `
        <div class="section-card" style="margin-bottom:14px">
          <div class="section-head" style="padding:12px 16px">
            <div class="section-head-left" style="gap:10px">
              <div>
                <div class="section-title" style="font-size:14px">${outlet}</div>
                <div class="section-sub">${rows.length} item${rows.length>1?'s':''} out of stock · longest out: <span style="color:${urgentColor};font-weight:700">${fmtDur(maxDur)}</span></div>
              </div>
            </div>
            <span style="background:var(--red-dim);color:var(--red);font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px">${rows.length} OOS</span>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead><tr>
                <th>Item</th><th>SKU</th><th>Out Since</th><th>Duration</th><th>Status</th>
              </tr></thead>
              <tbody>
                ${rows.sort((a,b) => (b.duration_hrs||0)-(a.duration_hrs||0)).map(r => `
                <tr>
                  <td style="font-weight:600;font-size:13px">${r.item||'—'}</td>
                  <td style="font-family:var(--mono);font-size:11px;color:var(--ink-3)">${r.sku||'—'}</td>
                  <td style="font-size:12px;color:var(--ink-2)">${r.out_since||'—'}</td>
                  <td style="font-family:var(--mono);font-size:12px;font-weight:700;color:${(r.duration_hrs||0)>4?'var(--red)':(r.duration_hrs||0)>1?'var(--amber)':'var(--ink-3)'}">${fmtDur(r.duration_hrs)}</td>
                  <td><span style="background:var(--red-dim);color:var(--red);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px">OUT</span></td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
      }).join('');

  // ── Tracker history ──
  const dayBarHtml = `
    <div style="display:flex;gap:1px;background:var(--border);border-radius:var(--r);padding:3px;width:fit-content;margin-bottom:14px">
      ${[1,3,7,14,28].map(n => `<button class="ptab ${_invTrackerDays===n?'active':''}" onclick="_invSetDays(${n})">${n}d</button>`).join('')}
    </div>`;

  // Group tracker events by outlet for summary
  const trackerByOutlet = {};
  events.forEach(e => { (trackerByOutlet[e.outlet] = trackerByOutlet[e.outlet] || []).push(e); });
  const trackerSummaryRows = Object.entries(trackerByOutlet).sort((a,b) => b[1].length - a[1].length).map(([outlet, evts]) => {
    const items = [...new Set(evts.map(e => e.item))];
    return `<tr>
      <td style="font-weight:700;font-size:13px">${outlet}</td>
      <td style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--red);text-align:center">${evts.length}</td>
      <td style="font-size:12px;color:var(--ink-2)">${items.slice(0,4).join(', ')}${items.length>4?` +${items.length-4} more`:''}</td>
    </tr>`;
  }).join('');

  const eventRows = events.map(e => `
    <tr>
      <td class="ts-cell">${e.timestamp||'—'}</td>
      <td style="font-weight:700;font-size:13px">${e.outlet}</td>
      <td style="font-size:12px">${e.item}</td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--ink-3)">${e.sku||'—'}</td>
    </tr>`).join('');

  const trackerHtml = events.length === 0
    ? `<div class="state-box"><div class="state-icon">✅</div><div class="state-title">No critical stock-outs</div><div class="state-body">None in the last ${_invTrackerDays} day${_invTrackerDays>1?'s':''}.</div></div>`
    : `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
        <div class="section-card">
          <div class="section-head"><div class="section-head-left"><div class="section-title">By Outlet</div></div></div>
          <table>
            <thead><tr><th>Outlet</th><th style="text-align:center">Events</th><th>Items</th></tr></thead>
            <tbody>${trackerSummaryRows}</tbody>
          </table>
        </div>
        <div class="section-card">
          <div class="section-head"><div class="section-head-left"><div class="section-title">Timeline</div><div class="section-sub">${events.length} events · last ${_invTrackerDays}d · ${tracker.generated_at||''}</div></div></div>
          <div style="overflow-x:auto;max-height:260px;overflow-y:auto">
            <table>
              <thead><tr><th>Time</th><th>Outlet</th><th>Item</th><th>SKU</th></tr></thead>
              <tbody>${eventRows}</tbody>
            </table>
          </div>
        </div>
      </div>`;

  el.innerHTML = statsHtml + `
    <div style="font-size:11px;color:var(--ink-3);margin-bottom:18px">Live as of ${live.generated_at||'—'}</div>
    ${actionsHtml}
    <div class="inv-section-head">📦 Live Out of Stock</div>
    ${liveHtml}
    <div class="inv-section-head" style="margin-top:24px">📈 Stock-Out History</div>
    ${dayBarHtml}
    ${trackerHtml}
  `;
}

function toggleInvAction(idx, storageKey) {
  let checked = {};
  try { checked = JSON.parse(localStorage.getItem(storageKey)||'{}'); } catch {}
  const k = 'inv_'+idx;
  checked[k] = !checked[k];
  localStorage.setItem(storageKey, JSON.stringify(checked));
  const item = document.getElementById(`inv-action-${idx}`);
  const chk  = item && item.querySelector('.action-check');
  if (item) item.classList.toggle('action-done', !!checked[k]);
  if (chk)  { chk.classList.toggle('action-check-done', !!checked[k]); chk.textContent = checked[k] ? '✓' : ''; }
}

/* ── DAILY RECON PAGE ── */
let _reconWindow = 7;
let _reconOutlet = 'All';
let _reconData   = null;

function renderReconPage() {
  const el = document.getElementById('pageBody');
  el.innerHTML = '<div class="loader-box"><div class="loader"></div> Loading…</div>';

  fetch(`${API}/api/ops/daily-recon`)
    .then(r => r.json())
    .then(d => {
      _reconData = d.rows || [];
      _renderRecon();
    })
    .catch(() => { el.innerHTML = errBox(''); });
}

function _reconSetOutlet(o) {
  _reconOutlet = o;
  _renderRecon();
}

function _reconSetWindow(w) {
  _reconWindow = w;
  [1,7,28].forEach(n => {
    const b = document.getElementById('recontab-' + n);
    if (b) b.classList.toggle('active', n === w);
  });
  _renderRecon();
}

function _localDateStr(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function _reconRows() {
  if (!_reconData) return [];
  const todayStr  = _localDateStr(0);
  const cutoffStr = _localDateStr(-_reconWindow);

  if (_reconWindow === 1) {
    // Show the most recent available date (calu may not have run yet for true yesterday)
    const latestDate = _reconData.reduce((max, r) => r.date > max ? r.date : max, '');
    return _reconData.filter(r => r.date === latestDate);
  }

  return _reconData.filter(r => r.date >= cutoffStr && r.date < todayStr);
}

function _renderRecon() {
  const el = document.getElementById('pageBody');
  if (!_reconData) return;

  const allRows = _reconRows();
  const rows    = _reconOutlet === 'All' ? allRows : allRows.filter(r => r.outlet === _reconOutlet);
  const latestInRows = rows.length ? rows[0].date : '';
  const label  = _reconWindow === 1
    ? `Latest Day (${latestInRows || 'no data'})`
    : `Last ${_reconWindow} Days`;

  let tCash=0, tBharatpe=0, tSwiggy=0, tZomato=0, tTotal=0, tRista=0, tDiff=0, tMissing=0, tOpeningBal=0, tExpenses=0, tSendToRR=0, tClosingBal=0;
  rows.forEach(r => {
    tCash       += r.cash        || 0;
    tBharatpe   += r.bharatpe    || 0;
    tSwiggy     += r.swiggy      || 0;
    tZomato     += r.zomato      || 0;
    tTotal      += r.total       || 0;
    tRista      += r.rista       || 0;
    tDiff       += r.diff        || 0;
    tOpeningBal += r.opening_balance || 0;
    tExpenses   += r.expenses    || 0;
    tSendToRR   += r.send_to_rr  || 0;
    tClosingBal += r.closing_balance || 0;
    if (r.diff < 0) tMissing += Math.abs(r.diff);
  });

  const fmt = n => n === 0 ? '—' : (n < 0 ? '-' : '') + '₹' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
  const diffCell = (d, rowIdx) => {
    if (Math.abs(d) < 1) return `<td class="r" style="color:var(--green);font-weight:700" id="rdiff-${rowIdx}">✓</td>`;
    const col = d < 0 ? 'var(--red)' : 'var(--green)';
    return `<td class="r" style="color:${col};font-weight:700" id="rdiff-${rowIdx}">${d < 0 ? '-' : '+'}${fmt(d)}</td>`;
  };

  const tabBar = `<div style="display:flex;gap:1px;background:var(--border);border-radius:var(--r);padding:3px;width:fit-content">
    ${[1,7,28].map(n => `<button class="ptab ${_reconWindow===n?'active':''}" id="recontab-${n}" onclick="_reconSetWindow(${n})" style="padding:4px 14px;font-size:10px">${n===1?'Yesterday':n===7?'7 Days':'28 Days'}</button>`).join('')}
  </div>`;

  const OUTLET_LABELS = {'All':'All Outlets','Sahakar Nagar':'SKN','Residency Road':'RR','Koramangala':'KOR','Jayanagar':'JAY'};
  const outletBar = `<div style="display:flex;gap:6px;flex-wrap:wrap">
    ${Object.entries(OUTLET_LABELS).map(([o,lbl]) => `<button onclick="_reconSetOutlet('${o}')" style="padding:4px 14px;border-radius:20px;border:1px solid ${_reconOutlet===o?'var(--blue)':'var(--border-2)'};background:${_reconOutlet===o?'var(--blue-dim)':'var(--surface)'};color:${_reconOutlet===o?'var(--blue)':'var(--ink-2)'};font-size:11px;font-weight:${_reconOutlet===o?'700':'500'};cursor:pointer;font-family:var(--sans)">${lbl}</button>`).join('')}
  </div>`;

  const missingColor = tMissing > 5000 ? 'var(--red)' : tMissing > 1000 ? 'var(--amber)' : 'var(--green)';
  const summaryCards = `
    <div class="stat-row" style="margin-bottom:0">
      <div class="stat-card">
        <div class="stat-label">Total Collected</div>
        <div class="stat-value neu">₹${tTotal.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">${label}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Rista POS</div>
        <div class="stat-value neu">₹${tRista.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">Expected</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Missing</div>
        <div class="stat-value" style="color:${missingColor}">₹${tMissing.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">Unaccounted</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cash Collected</div>
        <div class="stat-value neu">₹${tCash.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">From checklist</div>
      </div>
    </div>`;

  const byDate = {};
  rows.forEach((r,i) => { r._idx = i; (byDate[r.date] = byDate[r.date] || []).push(r); });
  const dates = Object.keys(byDate).sort().reverse();

  const tableRows = dates.flatMap(date => {
    const dayRows = byDate[date];
    const dayMissing = dayRows.reduce((s,r) => r.diff < 0 ? s + Math.abs(r.diff) : s, 0);
    const [y,m,d] = date.split('-').map(Number);
    const dateLabel = new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'numeric',month:'short',weekday:'short'});
    return dayRows.map((r,i) => {
      const outletFirst = i === 0
        ? `<td rowspan="${dayRows.length}" style="font-size:11px;font-weight:700;color:var(--ink-2);vertical-align:top;padding-top:10px;border-right:1px solid var(--border)">${dateLabel}${dayMissing > 0 ? `<br><span style="font-size:10px;color:var(--red);font-weight:700">-₹${dayMissing.toLocaleString('en-IN',{maximumFractionDigits:0})}</span>` : ''}</td>`
        : '';
      const byTxt = r.submitted_by
        ? `<div style="font-size:10px;color:var(--ink-3);margin-top:2px">by ${r.submitted_by}</div>`
        : '';
      return `<tr>
        ${outletFirst}
        <td style="font-weight:600">${r.outlet}${byTxt}</td>
        <td class="r" style="color:var(--ink-3)">${r.opening_balance > 0 ? fmt(r.opening_balance) : '—'}</td>
        <td class="r" id="rcash-${r._idx}">
          <input id="rcash-inp-${r._idx}" type="number" value="${r.cash || 0}"
            style="width:72px;text-align:right;border:1px solid var(--border-2);border-radius:4px;padding:2px 4px;font-size:12px;font-family:inherit;background:var(--surface)"
            onblur="_saveCash(${r._idx})" onkeydown="if(event.key==='Enter')this.blur()">
        </td>
        <td class="r">${r.bharatpe > 0 ? fmt(r.bharatpe) : '—'}</td>
        <td class="r">${r.zomato > 0 ? fmt(r.zomato) : '—'}</td>
        <td class="r" style="color:var(--red)">
          <input id="rexp-inp-${r._idx}" type="number" value="${r.expenses || 0}"
            style="width:72px;text-align:right;border:1px solid var(--border-2);border-radius:4px;padding:2px 4px;font-size:12px;font-family:inherit;background:var(--surface);color:var(--red)"
            onblur="_saveExpenses(${r._idx})" onkeydown="if(event.key==='Enter')this.blur()">
        </td>
        <td class="r" style="color:var(--amber)">${r.send_to_rr > 0 ? fmt(r.send_to_rr) : '—'}</td>
        <td class="r" style="font-weight:700" id="rtotal-${r._idx}">${fmt(r.total)}</td>
        <td class="r" style="color:var(--ink-3)">${fmt(r.rista)}</td>
        ${diffCell(r.diff, r._idx)}
        <td class="r" style="color:var(--ink-2);font-weight:600" id="rclosing-${r._idx}">${r.closing_balance > 0 ? fmt(r.closing_balance) : '—'}</td>
      </tr>`;
    });
  });

  const totalsRow = `<tr style="border-top:2px solid var(--border-2);background:#f5f7fb;font-weight:800">
    <td colspan="2" style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)">Total</td>
    <td class="r" style="color:var(--ink-3)">${fmt(tOpeningBal)}</td>
    <td class="r">${fmt(tCash)}</td>
    <td class="r">${fmt(tBharatpe)}</td>
    <td class="r">${fmt(tZomato)}</td>
    <td class="r" style="color:var(--red)">${fmt(tExpenses)}</td>
    <td class="r" style="color:var(--amber)">${fmt(tSendToRR)}</td>
    <td class="r">${fmt(tTotal)}</td>
    <td class="r" style="color:var(--ink-3)">${fmt(tRista)}</td>
    <td class="r" style="color:${tDiff < -1 ? 'var(--red)' : 'var(--green)'};font-weight:800">${tDiff < -1 ? '-'+fmt(tDiff) : tDiff > 1 ? '+'+fmt(tDiff) : '✓'}</td>
    <td class="r" style="color:var(--ink-2)">${fmt(tClosingBal)}</td>
  </tr>`;

  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      ${tabBar}
      <span style="font-size:11px;color:var(--ink-3)">${rows.length} rows · ${dates.length} days</span>
    </div>
    <div style="margin-bottom:16px">${outletBar}</div>
    ${summaryCards}
    <div class="section-card" style="margin-top:16px">
      <div class="section-head">
        <div class="section-head-left">
          <div class="section-icon" style="background:#fef3c7">💰</div>
          <div>
            <div class="section-title">Daily Reconciliation — ${label}</div>

            <th class="r">Collected</th>
            <th class="r">Rista POS</th>
            <th class="r">Diff</th>

          <tbody>${tableRows.join('')}${totalsRow}</tbody>
        </table>`}

}

function _saveCash(idx) {
  const r = _reconData.find(x => x._idx === idx);
  if (!r) return;
  const inp = document.getElementById('rcash-inp-' + idx);
  if (!inp) return;
  const parsed = parseFloat(inp.value);
  if (isNaN(parsed) || parsed < 0) { inp.value = r.cash || 0; return; }
  if (Math.abs(parsed - (r.cash || 0)) < 0.01) return; // no change

  inp.style.opacity = '0.5';
  inp.disabled = true;

  fetch(`${API}/api/ops/daily-recon/cash`, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({row: r.row, cash: parsed})
  })
  .then(res => res.json())
  .then(d => {
    if (!d.ok) throw new Error(d.detail || 'Error');
    r.cash  = d.cash;
    r.total = d.total;
    r.diff  = d.diff;
    inp.value = d.cash;
    inp.style.opacity = '1';
    inp.disabled = false;
    inp.style.borderColor = 'var(--green)';
    setTimeout(() => { if (inp) inp.style.borderColor = 'var(--border-2)'; }, 1500);
    const fmtN = n => n === 0 ? '—' : '₹' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
    const tEl = document.getElementById('rtotal-' + idx);
    if (tEl) tEl.textContent = fmtN(d.total);
    const dEl = document.getElementById('rdiff-' + idx);
    if (dEl) {
      if (Math.abs(d.diff) < 1) { dEl.textContent = '✓'; dEl.style.color = 'var(--green)'; }
      else { dEl.textContent = (d.diff < 0 ? '-' : '+') + fmtN(d.diff); dEl.style.color = d.diff < 0 ? 'var(--red)' : 'var(--green)'; }
    }
  })
  .catch(e => {
    inp.value = r.cash || 0;
    inp.style.opacity = '1';
    inp.disabled = false;
    inp.style.borderColor = 'var(--red)';
    setTimeout(() => { if (inp) inp.style.borderColor = 'var(--border-2)'; }, 2000);
  });
}

function _saveExpenses(idx) {
  const r = _reconData.find(x => x._idx === idx);
  if (!r) return;
  const inp = document.getElementById('rexp-inp-' + idx);
  if (!inp) return;
  const parsed = parseFloat(inp.value);
  if (isNaN(parsed) || parsed < 0) { inp.value = r.expenses || 0; return; }
  if (Math.abs(parsed - (r.expenses || 0)) < 0.01) return;

  inp.style.opacity = '0.5';
  inp.disabled = true;

  fetch(`${API}/api/ops/daily-recon/expenses`, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({date: r.date, outlet: r.outlet, expenses: parsed})
  })
  .then(res => res.json().then(d => ({ ok: res.ok, status: res.status, ...d })))
  .then(d => {
    if (!d.ok) throw new Error(d.detail || `HTTP ${d.status}`);
    r.expenses = d.expenses;
    r.closing_balance = d.closing_balance;
    inp.value = d.expenses;
    inp.style.opacity = '1';
    inp.disabled = false;
    inp.style.borderColor = 'var(--green)';
    setTimeout(() => { if (inp) inp.style.borderColor = 'var(--border-2)'; }, 1500);
    const fmtN = n => n === 0 ? '—' : '₹' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
    const clEl = document.getElementById('rclosing-' + idx);
    if (clEl) clEl.textContent = fmtN(d.closing_balance);
    _showToast('Expenses saved ✓');
  })
  .catch(e => {
    alert('Expenses save failed: ' + (e?.message || 'unknown error'));
    inp.value = r.expenses || 0;
    inp.style.opacity = '1';
    inp.disabled = false;
    inp.style.borderColor = 'var(--red)';
    setTimeout(() => { if (inp) inp.style.borderColor = 'var(--border-2)'; }, 2000);
  });
}

function _renderRRRecon() {
  const el = document.getElementById('pageBody');

  const rows = [..._rrReconData].sort((a,b) => b.date.localeCompare(a.date));

  let tCash=0, tExp=0, tExpected=0, tActual=0, tDiff=0;
  rows.forEach(r => {
    tCash     += r.cash_collected    || 0;
    tExp      += r.expenses          || 0;
    tExpected += r.expected_handover || 0;
    tActual   += r.actual_received   || 0;
    tDiff     += r.difference        || 0;
  });

  const fmt = n => '₹' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
  const diffCell = d => {
    if (Math.abs(d) < 1) return `<td class="r" style="color:var(--green);font-weight:700">✓</td>`;
    const col = d < 0 ? 'var(--red)' : 'var(--green)';
    return `<td class="r" style="color:${col};font-weight:700">${d < 0 ? '-' : '+'}${fmt(d)}</td>`;
  };

  const totalShort = tDiff < -1 ? tDiff : 0;
  const totalColor = totalShort < -5000 ? 'var(--red)' : totalShort < -1000 ? 'var(--amber)' : 'var(--green)';

  const tableRows = rows.map(r => {
    const [y,m,d] = r.date.split('-').map(Number);
    const dateLabel = new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'numeric',month:'short',weekday:'short'});
    return `<tr>
      <td style="font-size:11px;font-weight:700;color:var(--ink-2)">${dateLabel}</td>
      <td class="r">${r.cash_collected > 0 ? fmt(r.cash_collected) : '—'}</td>

      <td class="r" style="color:var(--blue);font-weight:600">${r.actual_received > 0 ? fmt(r.actual_received) : '—'}</td>

  }).join('');

  const totalsRow = `<tr style="border-top:2px solid var(--border-2);background:#f5f7fb;font-weight:800">
    <td style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)">Total</td>
    <td class="r">${fmt(tCash)}</td>

    <td class="r" style="color:var(--blue)">${fmt(tActual)}</td>
    <td class="r" style="color:${tDiff < -1 ? 'var(--red)' : 'var(--green)'};font-weight:800">${tDiff < -1 ? '-'+fmt(tDiff) : tDiff > 1 ? '+'+fmt(tDiff) : '✓'}</td>
  </tr>`;

  el.innerHTML = `
    <div class="stat-row" style="margin-bottom:16px">
      <div class="stat-card">
        <div class="stat-label">Total Cash Collected</div>
        <div class="stat-value neu">₹${tCash.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">RR Daily Recon</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Expected Handover</div>
        <div class="stat-value neu">₹${tExpected.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">Cash − Expenses</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Actual Received</div>
        <div class="stat-value" style="color:var(--blue)">₹${tActual.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">Kim's Before Deposit</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Variance</div>
        <div class="stat-value" style="color:${totalColor}">₹${Math.abs(tDiff).toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="stat-sub">${tDiff < -1 ? 'Kim received less' : tDiff > 1 ? 'Kim received more' : 'Balanced'}</div>
      </div>
    </div>
    <div class="section-card">
      <div class="section-head">
        <div class="section-head-left">
          <div class="section-icon" style="background:#eff6ff">🏦</div>

            <div class="section-title">RR Daily Reconciliation — Apr 1 onwards</div>

function _showToast(msg) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:28px;right:28px;background:#16a34a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.18);transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._hide);
  t._hide = setTimeout(() => { t.style.opacity = '0'; }, 2000);
}

/* ── BUILD TAB ── */
async function _ckLoadBuild() {
  document.getElementById('ckBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
      <input type="date" id="ckDatePicker"
        style="padding:8px 12px;border:1.5px solid var(--border-2);border-radius:8px;font-size:14px;font-family:var(--sans)"
        value="${_ckState.date.split('/').reverse().join('-')}"
        onchange="const [y,m,d]=this.value.split('-');_ckState.date=d+'/'+m+'/'+y;_ckState.entries=[];_ckState.outlet_entries={};_ckState.loaded=false;_ckLoadBuild();">
      <span id="ckDayLabel" style="font-size:14px;font-weight:700;color:var(--ink)"></span>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button onclick="_ckPrePopulate()"
          style="padding:8px 16px;border:1.5px solid var(--border-2);border-radius:8px;background:#fff;color:var(--ink-2);font-weight:600;cursor:pointer;font-size:13px">
          ↩ Auto-fill All
        </button>
        <button onclick="_ckPublish()"
          style="padding:10px 28px;border:none;border-radius:8px;background:${CK_GREEN};color:#fff;font-weight:700;cursor:pointer;font-size:14px">
          ☁ Publish
        </button>
      </div>
    </div>
    <div id="ckBuildBody"><div style="text-align:center;padding:40px;color:var(--ink-3)">Loading kitchen staff…</div></div>`;

  try {
    // Build 14 past dates for recent-workers detection
    const pastDates = [];
    for (let i = 1; i <= 14; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      pastDates.push(`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`);
    }

    const [empRes, existRes, ...historyResults] = await Promise.all([
      fetch(`${API}/api/ops/roster/employees?date=${encodeURIComponent(_ckState.date)}`).then(r=>r.json()),
      fetch(`${API}/api/ops/roster/for-date?date=${encodeURIComponent(_ckState.date)}`).then(r=>r.json()),
      ...pastDates.map(d => fetch(`${API}/api/ops/roster/for-date?date=${encodeURIComponent(d)}`).then(r=>r.json())),
    ]);

    // Hardcoded CK kitchen shifts only
    _ckState.shifts = [
      { shift_id: 'ck-morning', shift_name: 'Morning', start_time: '09:00', end_time: '17:00' },
      { shift_id: 'ck-mid',     shift_name: 'Mid',     start_time: '13:00', end_time: '21:00' },
      { shift_id: 'ck-evening', shift_name: 'Evening', start_time: '16:00', end_time: '00:00' },
    ];

    // Collect IDs who worked CK in past 2 weeks
    const recentIds = new Set();
    historyResults.forEach(res => {
      (res.entries || []).forEach(e => { if (e.outlet === 'CK') recentIds.add(e.employee_id); });
    });
    _ckState.recent_ids = recentIds;

    const pools = empRes.pools_by_outlet || {};
    const allCK = pools['CK'] || [];
    // Sort: recent workers first, then alphabetical
    _ckState.ck_pool = [
      ...allCK.filter(e =>  recentIds.has(e.employee_id)).sort((a,b)=>a.name.localeCompare(b.name)),
      ...allCK.filter(e => !recentIds.has(e.employee_id)).sort((a,b)=>a.name.localeCompare(b.name)),
    ];

    // Build outlet pools (excluding CK — those are handled separately)
    const OUTLET_LABELS = { SKN:'Sahakar Nagar', RR:'Residency Road', KOR:'Koramangala', JAY:'Jayanagar', WF:'Whitefield', KLN:'Kalayanagar', BLN:'Bellandur', IND:'Indiranagar', ARK:'Arkavathi' };
    _ckState.outlet_pools = {};
    Object.entries(pools).forEach(([code, emps]) => {
      if (code !== 'CK' && code !== 'OTHER' && emps.length) _ckState.outlet_pools[code] = emps;
    });

    // Outlet shifts (standard dine-in)
    _ckState.outlet_shifts = [
      { shift_id: 'morning',  shift_name: 'Morning',  start_time: '09:00', end_time: '17:00' },
      { shift_id: 'mid',      shift_name: 'Mid Day',   start_time: '13:00', end_time: '21:00' },
      { shift_id: 'closing',  shift_name: 'Closing',   start_time: '17:00', end_time: '01:00' },
    ];
    _ckState.outlet_labels = OUTLET_LABELS;

    if (!_ckState.loaded) {
      _ckState.loaded = true;
      const allExisting = existRes.entries || [];

      // CK entries
      const existCK = allExisting.filter(e => e.outlet === 'CK' || e.outlet === 'WO');
      const _mapShift = (start) => {
        if (start === '09:00') return 'ck-morning';
        if (start === '13:00') return 'ck-mid';
        if (start === '16:00') return 'ck-evening';
        return 'ck-morning';
      };
      if (existCK.length) {
        _ckState.entries = existCK.map(e => ({
          employee_id: e.employee_id, outlet: e.outlet === 'WO' ? 'WO' : 'CK',
          shift: e.outlet === 'WO' ? '' : _mapShift(e.start_time),
          start_time: e.outlet === 'WO' ? '' : (e.start_time || '09:00'),
          end_time:   e.outlet === 'WO' ? '' : (e.end_time   || '17:00'),
        }));
      } else {
        _ckState.entries = _ckState.ck_pool.filter(emp => recentIds.has(emp.employee_id))
          .map(emp => ({ employee_id: emp.employee_id, outlet: 'CK', shift: 'ck-morning', start_time: '09:00', end_time: '17:00' }));
      }

      // Outlet entries
      _ckState.outlet_entries = {};
      Object.keys(_ckState.outlet_pools).forEach(code => {
        const existing = allExisting.filter(e => e.outlet === code);
        const _mapOutletShift = (start) => {
          if (start === '09:00') return 'morning';
          if (start === '13:00') return 'mid';
          if (start === '17:00') return 'closing';
          return 'morning';
        };
        _ckState.outlet_entries[code] = existing.map(e => ({
          employee_id: e.employee_id, outlet: code,
          shift: _mapOutletShift(e.start_time), start_time: e.start_time || '09:00', end_time: e.end_time || '17:00',
        }));
      });
    }

    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const [d,m,y] = _ckState.date.split('/');
    document.getElementById('ckDayLabel').textContent = days[new Date(`${y}-${m}-${d}`).getDay()];
    _ckRenderBuild();
  } catch(e) {
    document.getElementById('ckBuildBody').innerHTML = `<div style="color:var(--red);padding:20px">Error: ${e.message}</div>`;
  }
}

function _ckPrePopulate() {

function _ckRenderBuild() {
  const { ck_pool, shifts, entries } = _ckState;

  const shiftOptsFor = (selectedId) =>
    shifts.map(s => `<option value="${s.shift_id}" ${selectedId===s.shift_id?'selected':''}>${s.shift_name} &nbsp; ${s.start_time}–${s.end_time}</option>`).join('');

  const usedIds = new Set(entries.map(r => r.employee_id));
  const available = ck_pool.filter(e => !usedIds.has(e.employee_id));

  const scheduledRows = entries.map((row, idx) => {
    const emp  = empById[row.employee_id];
    const name = emp ? emp.name : row.employee_id;
    const isWO = row.outlet === 'WO';
    const shiftCell = isWO
      ? `<span style="font-size:12px;font-weight:700;background:#dbeafe;color:#1d4ed8;padding:3px 10px;border-radius:20px">Weekly Off</span>`
      : `<select onchange="_ckSetShift(${idx},this.value)"
           style="border:1.5px solid var(--border-2);border-radius:6px;padding:5px 10px;font-size:13px;font-family:var(--sans);background:var(--surface);min-width:240px">
           <option value="">— Select shift —</option>
           ${shiftOptsFor(row.shift)}
         </select>
         ${row.start_time && row.end_time ? `<span style="font-size:11px;color:var(--ink-3);margin-left:6px">${row.start_time}–${row.end_time}</span>` : ''}`;
    return `
      <tr style="border-top:1px solid var(--border-2)${isWO ? ';background:#f8fbff' : ''}">
        <td style="padding:9px 14px;font-size:14px;font-weight:600;color:${isWO ? '#1d4ed8' : 'var(--ink)'}">${name}</td>
        <td style="padding:9px 14px">${shiftCell}</td>
        <td style="padding:9px 14px;text-align:right">
          <button onclick="_ckRemove(${idx})"
            style="padding:4px 12px;border:1.5px solid var(--red);border-radius:6px;color:var(--red);background:none;cursor:pointer;font-size:12px;font-weight:600">✕</button>
        </td>
      </tr>`;
  }).join('');

  const poolRows = available.map(emp => {
    const isRecent = _ckState.recent_ids.has(emp.employee_id);
    const recentBadge = isRecent
      ? `<span style="font-size:10px;font-weight:700;background:#dcfce7;color:${CK_GREEN};padding:2px 7px;border-radius:20px;margin-left:6px">Recent</span>` : '';
    const shiftBadge = emp.default_shift_name
      ? `<span style="font-size:11px;color:var(--ink-3);margin-left:6px">${emp.default_shift_name} ${emp.default_start}–${emp.default_end}</span>` : '';
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--border-2)">
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:2px">
          <span style="font-size:13px;color:var(--ink);font-weight:600">${emp.name}</span>
          ${recentBadge}${shiftBadge}
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button onclick="_ckAddWO('${emp.employee_id}')"
            style="padding:4px 12px;border:1.5px solid #2196f3;border-radius:6px;color:#2196f3;background:none;cursor:pointer;font-size:12px;font-weight:600">WO</button>
          <button onclick="_ckAddEmp('${emp.employee_id}')"
            style="padding:4px 14px;border:1.5px solid ${CK_GREEN};border-radius:6px;color:${CK_GREEN};background:none;cursor:pointer;font-size:12px;font-weight:600">+ Add</button>
        </div>
      </div>`;
  }).join('');

  document.getElementById('ckBuildBody').innerHTML = `
    <!-- CK Section -->
    <div style="margin-bottom:28px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3);margin-bottom:8px">
        🍳 CK Kitchen — ${entries.length} Scheduled
      </div>
      ${entries.length ? `
        <div style="border:1.5px solid var(--border-2);border-radius:12px;overflow:hidden;background:var(--surface)">
          <div style="background:#f8f9fb;padding:7px 14px;display:grid;grid-template-columns:160px 1fr 60px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3)">
            <span>Employee</span><span>Shift</span><span></span>

        </div>` :
        `<div style="font-size:13px;color:var(--ink-3);padding:4px">No staff added yet. Use "Auto-fill All" or add from the pool below.</div>`

function _renderOutletSections() {

  if (!outlet_pools || !Object.keys(outlet_pools).length) return '';

    const entries  = outlet_entries[code] || [];
    const usedIds  = new Set(entries.map(r => r.employee_id));
    const available = pool.filter(e => !usedIds.has(e.employee_id));
    const label    = outlet_labels[code] || code;
    const shiftOpts = (sel) => outlet_shifts.map(s =>
      `<option value="${s.shift_id}" ${sel===s.shift_id?'selected':''}>${s.shift_name} · ${s.start_time}–${s.end_time}</option>`).join('');

    const schedRows = entries.map((row, idx) => {
      const emp  = pool.find(e => e.employee_id === row.employee_id);
      const name = emp ? emp.name : row.employee_id;
      const isWO = row.outlet === 'WO';
      const shiftCell = isWO
        ? `<span style="font-size:12px;font-weight:700;background:#dbeafe;color:#1d4ed8;padding:3px 10px;border-radius:20px">Weekly Off</span>`
        : `<select onchange="_outletSetShift('${code}',${idx},this.value)"
             style="border:1.5px solid var(--border-2);border-radius:6px;padding:5px 10px;font-size:13px;font-family:var(--sans);background:var(--surface);min-width:210px">
             <option value="">— Select shift —</option>
             ${shiftOpts(row.shift)}
           </select>`;
      return `<tr style="border-top:1px solid var(--border-2)${isWO?';background:#f8fbff':''}">
        <td style="padding:9px 14px;font-size:14px;font-weight:600">${name}</td>
        <td style="padding:9px 14px">${shiftCell}</td>
        <td style="padding:9px 14px;text-align:right">
          <button onclick="_outletRemove('${code}',${idx})"
            style="padding:4px 12px;border:1.5px solid var(--red);border-radius:6px;color:var(--red);background:none;cursor:pointer;font-size:12px;font-weight:600">✕</button>
        </td>
      </tr>`;
    }).join('');

    const poolRows2 = available.map(emp => `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--border-2)">
        <span style="font-size:13px;color:var(--ink);font-weight:600">${emp.name}</span>
        <div style="display:flex;gap:6px">
          <button onclick="_outletAddWO('${code}','${emp.employee_id}')"
            style="padding:4px 12px;border:1.5px solid #2196f3;border-radius:6px;color:#2196f3;background:none;cursor:pointer;font-size:12px;font-weight:600">WO</button>
          <button onclick="_outletAdd('${code}','${emp.employee_id}')"
            style="padding:4px 14px;border:1.5px solid var(--green);border-radius:6px;color:var(--green);background:none;cursor:pointer;font-size:12px;font-weight:600">+ Add</button>
        </div>
      </div>`).join('');

    return `
    <div style="margin-bottom:28px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3);margin-bottom:8px">
        🏪 ${label} (${code}) — ${entries.filter(e=>e.outlet!=='WO').length} on shift
      </div>
      ${entries.length ? `
        <div style="border:1.5px solid var(--border-2);border-radius:12px;overflow:hidden;background:var(--surface)">
          <table style="width:100%;border-collapse:collapse">${schedRows}</table>
        </div>` : `<div style="font-size:13px;color:var(--ink-3);padding:4px">No staff scheduled. Add from pool below.</div>`}
      ${available.length ? `
        <div style="margin-top:10px">
          <div style="font-size:11px;color:var(--ink-3);margin-bottom:6px">Available (${available.length})</div>
          <div style="border:1.5px solid var(--border-2);border-radius:12px;overflow:hidden;background:var(--surface)">${poolRows2}</div>
        </div>` : ''}
    </div>`;
  }).join('');
}

function _outletSetShift(code, idx, shiftId) {
  const sh = (_ckState.outlet_shifts || []).find(s => s.shift_id === shiftId) || {};
  _ckState.outlet_entries[code][idx].shift      = shiftId;
  _ckState.outlet_entries[code][idx].start_time = sh.start_time || '';
  _ckState.outlet_entries[code][idx].end_time   = sh.end_time   || '';
  _ckRenderBuild();
}

function _outletAdd(code, eid) {
  if (!_ckState.outlet_entries[code]) _ckState.outlet_entries[code] = [];
  _ckState.outlet_entries[code].push({ employee_id: eid, outlet: code, shift: 'morning', start_time: '09:00', end_time: '17:00' });
  _ckRenderBuild();
}

function _outletAddWO(code, eid) {
  if (!_ckState.outlet_entries[code]) _ckState.outlet_entries[code] = [];
  _ckState.outlet_entries[code].push({ employee_id: eid, outlet: 'WO', shift: '', start_time: '', end_time: '' });
  _ckRenderBuild();
}

function _outletRemove(code, idx) {
  _ckState.outlet_entries[code].splice(idx, 1);
  _ckRenderBuild();
}

function _ckSetShift(idx, shiftId) {
  const shift = _ckState.shifts.find(s => s.shift_id === shiftId) || {};
  _ckState.entries[idx].shift      = shiftId;
  _ckState.entries[idx].start_time = shift.start_time || '';
  _ckState.entries[idx].end_time   = shift.end_time   || '';
  _ckRenderBuild();
}

function _ckAddEmp(eid) {
  _ckState.entries.push({
    employee_id: eid,
    outlet:      'CK',
    shift:       'ck-morning',
    start_time:  '09:00',
    end_time:    '17:00',
  });
  _ckRenderBuild();
}

function _ckAddWO(eid) {
  _ckState.entries.push({ employee_id: eid, outlet: 'WO', shift: '', start_time: '', end_time: '' });
  _ckRenderBuild();
}

function _ckRemove(idx) {
  _ckState.entries.splice(idx, 1);
  _ckRenderBuild();
}

async function _ckPublish() {
  const { date, entries, outlet_entries } = _ckState;

  // Combine CK + all outlet entries
  const ckEntries = entries.filter(e => e.employee_id).map(e => ({ ...e, outlet: e.outlet || 'CK' }));
  const outletAll = Object.values(outlet_entries || {}).flat().filter(e => e.employee_id);
  const toPublish = [...ckEntries, ...outletAll];

  if (!toPublish.length) { alert('No entries to publish.'); return; }
  const noShift = toPublish.filter(e => !e.shift && e.outlet !== 'WO');
  if (noShift.length && !confirm(`${noShift.length} employee(s) have no shift set. Publish anyway?`)) return;

  try {
    const res = await fetch(`${API}/api/ops/roster/publish`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date, entries: toPublish }),
    }).then(r => r.json());
    if (res.success) {
      _showToast(`CK Roster published — ${res.published} entries ✓`);
      _ckState.loaded = false;
      _ckState.entries = [];
      _ckLoadBuild();
    } else {
      alert('Publish failed: ' + JSON.stringify(res));
    }
  } catch(e) { alert('Error: ' + e.message); }
}

async function _ckLoadHistory_UNUSED() {
  document.getElementById('ckBody').innerHTML =
    '<div style="text-align:center;padding:40px;color:var(--ink-3)">Loading past 2 weeks…</div>';

  if (_ckState.historyLoaded) { _ckRenderHistory(); return; }

  try {
    const [empRes, shiftRes] = await Promise.all([
      fetch(`${API}/api/ops/roster/employees`).then(r=>r.json()),
      fetch(`${API}/api/ops/roster/shifts`).then(r=>r.json()),
    ]);
    const pools = empRes.pools_by_outlet || {};
    const ck_pool = pools['CK'] || [];
    const empById = {};
    ck_pool.forEach(e => empById[e.employee_id] = e);
    const shifts = shiftRes.shifts || [];
    const shiftById = {};
    shifts.forEach(s => shiftById[s.shift_id] = s);

    // Build list of past 14 dates (today inclusive)
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const dates = [];
    for (let i = 0; i < 14; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const dd = String(d.getDate()).padStart(2,'0');
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const yy = d.getFullYear();
      dates.push({ str: `${dd}/${mm}/${yy}`, dayName: days[d.getDay()] });
    }

    // Fetch all 14 days in parallel
    const results = await Promise.all(
      dates.map(({ str }) =>
        fetch(`${API}/api/ops/roster/for-date?date=${encodeURIComponent(str)}`).then(r=>r.json())
      )
    );

    _ckState.history = dates.map(({ str, dayName }, i) => {
      const ckEntries = (results[i].entries || []).filter(e => e.outlet === 'CK' || e.outlet === 'WO');
      return {
        date: str,
        dayName,
        entries: ckEntries.map(e => {
          const sh = shiftById[e.shift] || {};
          const emp = empById[e.employee_id] || {};
          return {
            name: e.employee_name || emp.name || e.employee_id,
            shift_name: e.outlet === 'WO' ? 'Weekly Off' : (sh.shift_name || e.shift || '—'),
            start_time: e.start_time || sh.start_time || '',
            end_time: e.end_time || sh.end_time || '',
            is_wo: e.outlet === 'WO',
          };
        }),
      };
    });
    _ckState.historyLoaded = true;
    _ckRenderHistory();
  } catch(e) {
    document.getElementById('ckBody').innerHTML =
      `<div style="color:var(--red);padding:20px">Error: ${e.message}</div>`;
  }
}

          <div class="home-card-sub">${t.desc}</div>
          <div class="home-card-stat" id="hstat-${t.id}" style="color:var(--ink-3);font-size:10px;font-family:var(--mono)">Loading…</div>
        </div>
      `).join('')}
    </div>

    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);margin-bottom:10px;margin-top:8px">Ops Assistant</div>
    <div class="chat-wrap">
      <div class="chat-header">
        <div class="chat-dot"></div>
        Zaān Ops Bot <span style="font-size:10px;font-weight:500;color:var(--ink-3);margin-left:4px">· Claude Haiku</span>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-msg bot">
          <div class="chat-msg-label">Ops Assistant</div>
          <div class="chat-bubble">Hi! I'm your Zaān ops assistant. I have live data from all sections loaded — ask me anything about power status, late sign-ins, metrics, recon, OOS, ratings, or the roster.</div>
        </div>
      </div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chatInput" placeholder="Ask anything about ops…" rows="1"

          oninput="this.style.height='38px';this.style.height=Math.min(this.scrollHeight,80)+'px'"></textarea>
        <button class="chat-send" id="chatSend" onclick="sendChat()">Send</button>
      </div>

  `;
  loadHomeSummaries();
